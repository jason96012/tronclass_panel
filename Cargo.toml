[package]
name = "tronclass_rollcall"
version = "0.1.13"
edition = "2021"
description = "Tronclass Rollcall - Automated attendance system for Tronclass"
authors = []

[[bin]]
name = "tronclass_rollcall"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
# AI_CHAT_V1：新增 "stream" 讓 reqwest 提供 bytes_stream()，AI 回覆才能邊生成邊顯示。
reqwest = { version = "0.12.28", features = ["cookies", "json", "rustls-tls", "multipart", "stream"], default-features = false }

# Web server (Line Bot webhook)
axum = { version = "0.8.8", features = ["json", "multipart"] }
tower = { version = "0.5.3" }
tower-http = { version = "0.6.8", features = ["trace", "compression-gzip", "compression-br", "compression-deflate", "fs"] }
# STATIC_BROTLI_PRECOMPRESS_V1：靜態資產（/admin/static、/pub/static）第一次被要求後以 quality 11
# 壓一次放記憶體，之後直接吐預壓縮位元組；tower-http 的即時壓縮只剩 HTML／JSON 在用。
# brotli 本來就是 tower-http compression-br 的間接相依（Cargo.lock 已有 8.0.x），不會多下載東西。
brotli = { version = "8", default-features = false, features = ["std"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9.8"

# Error handling
miette = { version = "7", features = ["fancy"] }
thiserror = "2.0.18"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Config
config = { version = "0.15.22", features = ["toml"] }

# Crypto (HMAC-SHA256 for Line Bot signature verification)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
encoding_rs = "0.8"
passkey-auth = "0.1.3"
# Argon2id password hashing for Dashboard credentials (replaces hand-rolled PBKDF2
# for new hashes). Pure-Rust, no C dependency — safe for the minimal Pterodactyl image.
argon2 = { version = "0.5", features = ["std", "password-hash"] }
# CSPRNG for at-rest secret nonces.
getrandom = "0.2"

# URL parsing
url = "2"

# QR code generation for admin mock page
qrcode = "0.14"

# Regex
regex = "1"

# OCR（驗證碼識別）。Pterodactyl 預設映像沒有 libstdc++，請用 --no-default-features 編譯。
ddddocr = { git = "https://github.com/86maid/ddddocr.git", branch = "master", optional = true }

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Standards-based Web Push crypto implemented with pure-Rust primitives. This
# avoids libssl-dev, openssl.pc and make in minimal Pterodactyl containers.
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
aes-gcm = "0.10"
hkdf = "0.12"

# Discord Bot adapter
serenity = { version = "0.12", default-features = false, features = ["builder", "client", "gateway", "http", "model", "rustls_backend", "utils"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Once cell
once_cell = "1"
rand = "0.10.0"

# Database (SQLite)
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }

[features]
# SEC_OCR_OPT_IN_V1（審查 H-01）：ddddocr 是 git master 依賴（不可重現、供應鏈風險），
# 預設不再啟用；需要驗證碼 OCR 時明確加 `--features ocr`。ptero-start.sh 本來就用
# `--no-default-features` 建置，行為不變。
default = []
ocr = ["dep:ddddocr"]
# PEN_TEST_V1：滲透測試模式。只在明確加 `--features pen_test` 時啟用；
# 生產建置（`cargo build --release`）不受影響。
# 注意：ptero-start.sh 用 `--no-default-features` 建置，測試版要自己帶上這個 feature。
pen_test = []

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
