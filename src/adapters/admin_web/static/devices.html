<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>登入裝置管理｜Tronclass</title>
<!-- LOGIN_DEVICES_V1：列出目前帳號所有有效 session，可個別登出或登出其他全部裝置 -->
<style>
:root{
  color-scheme:light;
  --dv-bg:#f5f7fb;--dv-card:#ffffff;--dv-soft:#f1f5f9;--dv-text:#172033;--dv-muted:#64748b;--dv-line:#d8e0eb;--dv-line-soft:#e8edf4;
  --dv-shadow:0 10px 30px rgba(15,23,42,.07);--dv-hero-a:#eff6ff;--dv-hero-b:#e8f0ff;
}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--dv-bg:#0f141d;--dv-card:#161d29;--dv-soft:#111827;--dv-text:#eef2ff;--dv-muted:#9aa4b5;--dv-line:#303948;--dv-line-soft:#252e3c;--dv-shadow:0 14px 36px rgba(0,0,0,.24);--dv-hero-a:#111d2d;--dv-hero-b:#13294b}}
html[data-theme="light"]{color-scheme:light;--dv-bg:#f5f7fb;--dv-card:#fff;--dv-soft:#f1f5f9;--dv-text:#172033;--dv-muted:#64748b;--dv-line:#d8e0eb;--dv-line-soft:#e8edf4;--dv-shadow:0 10px 30px rgba(15,23,42,.07);--dv-hero-a:#eff6ff;--dv-hero-b:#e8f0ff}
html[data-theme="dark"]{color-scheme:dark;--dv-bg:#0f141d;--dv-card:#161d29;--dv-soft:#111827;--dv-text:#eef2ff;--dv-muted:#9aa4b5;--dv-line:#303948;--dv-line-soft:#252e3c;--dv-shadow:0 14px 36px rgba(0,0,0,.24);--dv-hero-a:#111d2d;--dv-hero-b:#13294b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--dv-bg)!important;color:var(--dv-text)!important}
body{font-family:Inter,"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.shell{width:min(1100px,calc(100% - 64px));margin:auto;padding:32px 0 52px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}.brand b{color:var(--dv-text)}.brand .meta{font-size:12px;color:var(--dv-muted)}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#38bdf8,#4f46e5);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 10px 26px rgba(37,99,235,.28)}
.top a,.button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;color:var(--dv-text)!important;text-decoration:none;border:1px solid var(--dv-line)!important;background:var(--dv-card)!important;border-radius:12px;padding:0 16px;font-weight:700;font:inherit;cursor:pointer}
.top a:hover,.button:hover{border-color:#60a5fa!important;color:#2563eb!important}
.button:disabled{opacity:.45;cursor:default}
.button.danger{color:#dc2626!important;border-color:rgba(220,38,38,.35)!important}
.button.danger:hover{background:rgba(220,38,38,.08)!important}
.hero{padding:28px;border:1px solid var(--dv-line-soft);border-radius:24px;background:radial-gradient(circle at 92% 0,rgba(37,99,235,.15),transparent 44%),linear-gradient(135deg,var(--dv-hero-a),var(--dv-hero-b));box-shadow:var(--dv-shadow);margin-bottom:18px;display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center}
.eyebrow{font-size:12px;letter-spacing:.13em;color:#0284c7;font-weight:850}.hero h1{font-size:clamp(26px,4vw,38px);margin:8px 0;color:var(--dv-text)}.hero p{margin:0;color:var(--dv-muted);line-height:1.7}
.stat{padding:18px 20px;border-radius:18px;background:var(--dv-card);border:1px solid var(--dv-line-soft)}
.stat .k{font-size:13px;color:var(--dv-muted)}.stat .v{font-size:30px;font-weight:900;margin-top:4px}.stat .sub{font-size:13px;color:var(--dv-muted);margin-top:4px}
.card{padding:22px;border:1px solid var(--dv-line-soft);border-radius:20px;background:var(--dv-card);box-shadow:var(--dv-shadow)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.toolbar h2{margin:0;font-size:18px}
.list{display:grid;gap:12px}
.dev{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--dv-line);border-radius:16px;background:var(--dv-soft)}
.dev.current{border-color:#2563eb;box-shadow:inset 0 0 0 1px rgba(37,99,235,.35)}
.dev .icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--dv-card);border:1px solid var(--dv-line);font-weight:900;color:#2563eb}
.dev b{font-size:15px}.dev .meta{font-size:13px;color:var(--dv-muted);margin-top:3px;line-height:1.6;word-break:break-all}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;margin-left:6px;vertical-align:middle}
.tag.cur{background:rgba(37,99,235,.14);color:#2563eb}.tag.warn{background:rgba(245,158,11,.16);color:#b45309}.tag.soft{background:var(--dv-card);border:1px solid var(--dv-line);color:var(--dv-muted)}
.empty{padding:22px;text-align:center;color:var(--dv-muted);border:1px dashed var(--dv-line);border-radius:14px;background:var(--dv-soft)}
.message{min-height:22px;margin-top:12px;font-size:14px}.bad{color:#dc2626}.good{color:#16a34a}
.note{margin-top:14px;font-size:13px;color:var(--dv-muted);line-height:1.7}
@media(max-width:820px){
  .shell{width:min(100%,calc(100% - 24px));padding:calc(14px + env(safe-area-inset-top,0px)) 0 calc(96px + env(safe-area-inset-bottom))}
  /* MOBILE_SAFE_TOP_V1: 預留 PWA black-translucent 狀態列高度 */
  .hero{grid-template-columns:1fr;padding:20px 17px;border-radius:19px}.hero h1{font-size:26px}
  .card{padding:16px;border-radius:17px}
  .dev{grid-template-columns:auto 1fr;padding:12px 13px}.dev .act{grid-column:1 / -1;display:flex;justify-content:flex-end}
}

  /* CSP_STYLE_ATTR_STAGED_V1：原 inline style 屬性改為 class（消除 style-src-attr 回報） */
  .row-wrap{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><div class="brand"><div class="logo">D</div><div><b>Tronclass</b><div class="meta">Login Devices</div></div></div><a id="backSettings" href="/admin/settings" aria-label="返回設定">返回設定</a></header>

  <section class="hero">
    <div>
      <div class="eyebrow">SECURITY / SESSIONS</div>
      <h1>登入裝置管理</h1>
      <p>這裡列出你的帳號目前所有仍然有效的 Dashboard 登入（每個瀏覽器／裝置一筆）。看到不認識的裝置或位置時，可以直接把它登出，再到「變更 Dashboard 密碼」換一組密碼。</p>
    </div>
    <div class="stat">
      <div class="k">有效登入</div>
      <div class="v" id="statCount">-</div>
      <div class="sub" id="statSub">讀取中…</div>
    </div>
  </section>

  <section class="card">
    <div class="toolbar">
      <h2>裝置清單</h2>
      <div class="row-wrap">
        <button id="refreshBtn" class="button" type="button">重新整理</button>
        <button id="revokeOthersBtn" class="button danger" type="button" disabled>登出其他所有裝置</button>
      </div>
    </div>
    <div id="list" class="list"><div class="empty">讀取中…</div></div>
    <div id="message" class="message"></div>
    <p class="note">「最近活動」最多每 60 秒更新一次。存取憑證每 12 小時自動更新、7 天未使用即失效；登出其他裝置後，該裝置下次操作會被要求重新登入。這一頁只會顯示並管理你自己的登入，管理員也看不到其他人的裝置。</p>
  </section>
</div>

<script>
(function(){'use strict';
const q=id=>document.getElementById(id);
let data=null;
async function parse(res){let body={};try{body=await res.json()}catch(_){}if(res.status===401||res.status===403){if(res.status===401){location.replace('/admin');throw new Error('登入已失效')}}if(!res.ok)throw new Error(body.error||body.message||('HTTP '+res.status));return body}
function api(path,opts){return fetch(path,Object.assign({credentials:'same-origin',cache:'no-store'},opts||{})).then(parse)}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=String(text);return e}
function fmt(ts){if(!ts)return '-';const d=new Date(ts*1000);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function ago(ts,now){if(!ts)return '-';let s=Math.max(0,(now||Math.floor(Date.now()/1000))-ts);if(s<60)return '剛剛';if(s<3600)return Math.floor(s/60)+' 分鐘前';if(s<86400)return Math.floor(s/3600)+' 小時前';return Math.floor(s/86400)+' 天前'}
function iconFor(os){return /iphone|ipad|android/i.test(os)?'手':/windows|mac|linux|chrome/i.test(os)?'電':'？'}
function setMsg(t,ok){const m=q('message');m.textContent=t||'';m.className='message '+(t?(ok?'good':'bad'):'')}
function render(){
  const root=q('list');root.replaceChildren();
  const list=(data&&data.sessions)||[],now=(data&&data.server_time)||Math.floor(Date.now()/1000);
  q('statCount').textContent=String(list.length);
  const others=list.filter(s=>!s.current).length;
  q('statSub').textContent=others?('其中 '+others+' 個是其他裝置'):'只有目前這台裝置';
  q('revokeOthersBtn').disabled=others===0;
  if(!list.length){root.appendChild(el('div','empty','目前沒有任何有效登入。'));return}
  list.forEach(s=>{
    const row=el('div','dev'+(s.current?' current':''));
    row.appendChild(el('div','icon',iconFor(s.os)));
    const body=el('div');
    const title=el('b',null,(s.os||'未知裝置')+' · '+(s.browser||'未知瀏覽器'));
    if(s.current)title.appendChild(el('span','tag cur','目前裝置'));
    if(s.access_expired)title.appendChild(el('span','tag warn','待重新驗證'));
    if(s.is_viewer)title.appendChild(el('span','tag soft','檢視者'));
    body.appendChild(title);
    const meta=el('div','meta');
    meta.appendChild(document.createTextNode('IP：'+(s.ip||'-')+'　最近活動：'+ago(s.last_seen_at,now)+'（'+fmt(s.last_seen_at)+'）'));
    meta.appendChild(document.createElement('br'));
    meta.appendChild(document.createTextNode('登入時間：'+fmt(s.created_at)+'　7 天未使用將於 '+fmt(s.refresh_expires_at)+' 失效'));
    if(s.user_agent){meta.appendChild(document.createElement('br'));const ua=el('span',null,s.user_agent);ua.style.opacity='.7';ua.style.fontSize='12px';meta.appendChild(ua)}
    else if(!s.ip){meta.appendChild(document.createElement('br'));const note=el('span',null,'此登入建立於裝置管理功能啟用之前，下次在該裝置操作時會自動補上裝置與 IP 資訊。');note.style.opacity='.7';note.style.fontSize='12px';meta.appendChild(note)}
    body.appendChild(meta);
    row.appendChild(body);
    const act=el('div','act');
    if(!s.current){const b=el('button','button danger','登出此裝置');b.type='button';b.addEventListener('click',()=>revoke(s.id,b));act.appendChild(b)}
    else{const b=el('span','tag soft','要登出此裝置請用右上角登出');act.appendChild(b)}
    row.appendChild(act);
    root.appendChild(row);
  });
}
async function load(){
  try{data=await api('/admin/api/devices');render();setMsg('')}
  catch(e){setMsg(e.message||'讀取失敗',false)}
}
async function revoke(id,btn){
  if(!confirm('確定要登出這台裝置？它下次操作時必須重新登入。'))return;
  if(btn)btn.disabled=true;
  try{await api('/admin/api/devices/revoke',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:id})});setMsg('已登出該裝置',true);await load()}
  catch(e){setMsg(e.message||'登出失敗',false);if(btn)btn.disabled=false}
}
q('revokeOthersBtn').addEventListener('click',async()=>{
  if(!confirm('確定要登出「其他所有裝置」？只有目前這台會保留登入。'))return;
  q('revokeOthersBtn').disabled=true;
  try{const r=await api('/admin/api/devices/revoke',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({all_others:true})});setMsg('已登出其他 '+(r.revoked||0)+' 個裝置',true);await load()}
  catch(e){setMsg(e.message||'操作失敗',false);q('revokeOthersBtn').disabled=false}
});
q('refreshBtn').addEventListener('click',load);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
load();
})();
</script>
<style id="MOBILE_HIDE_BACK_V1">@media(max-width:820px){#backSettings{display:none!important}}</style>
<script src="/admin/static/js/mobile-nav.js?v=mnav8"></script>
</body></html>
