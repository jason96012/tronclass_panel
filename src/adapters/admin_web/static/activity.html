<script id="BAN_CRUDE_LOGIN_V1">
(function(){
  if(window.BAN_CRUDE_LOGIN_V1) return;
  window.BAN_CRUDE_LOGIN_V1 = true;
  function isCrude(card){
    if(!card) return false;
    if(card.querySelector('.animated-login-card-inner')) return false;
    var tx=(card.textContent||'').replace(/\s+/g,'');
    return !!(card.querySelector('.login-grid') || tx.indexOf('需要登入')>=0 || tx.indexOf('帳號 / account')>=0);
  }
  function kill(root){
    var scope=root&&root.querySelectorAll?root:document;
    var cards=[];
    if(root&&root.id==='loginCard') cards.push(root);
    try{ cards=cards.concat(Array.prototype.slice.call(scope.querySelectorAll('#loginCard,.login-card,#loginPanel'))); }catch(_){}
    cards.forEach(function(card){
      if(!isCrude(card)) return;
      card.innerHTML='';
      card.hidden=true;
      card.setAttribute('aria-hidden','true');
      card.style.display='none';
    });
  }
  kill(document);
  try{ new MutationObserver(function(ms){ ms.forEach(function(m){ Array.prototype.forEach.call(m.addedNodes||[], function(n){ if(n.nodeType===1) kill(n); }); }); }).observe(document.documentElement,{childList:true,subtree:true}); }catch(_){}
})();
</script>

<meta name="referrer" content="no-referrer">
<script id="hideAdminTokenFromUrlEarlyV1">
(function(){
  'use strict';
  if (window.HIDE_ADMIN_TOKEN_FROM_URL_EARLY_V1) return;
  window.HIDE_ADMIN_TOKEN_FROM_URL_EARLY_V1 = true;
  var LS_SESSION = 'tronclass_admin_session';
  var LS_LOGOUT = 'tronclass_dashboard_manual_logout';
  function sanitizeCurrentUrl(){
    try {
      var u = new URL(location.href);
      var changed = false;
      var token = u.searchParams.get('token') || '';
      if (u.searchParams.get('logout') === '1') {
        /* LOGOUT_SERVER_SIDE_V1：?logout=1 已無意義，只清遺留旗標。 */
        localStorage.removeItem(LS_SESSION);
        localStorage.removeItem(LS_LOGOUT);
      } else if (token) {
        localStorage.setItem(LS_SESSION, token);
        localStorage.removeItem(LS_LOGOUT);
      }
      if (u.searchParams.has('token')) { u.searchParams.delete('token'); changed = true; }
      if (changed) history.replaceState(null, document.title, u.pathname + (u.search ? u.search : '') + u.hash);
    } catch(_) {}
  }
  sanitizeCurrentUrl();
  window.tronAdminToken = function(){ try { return (localStorage.getItem(LS_SESSION) || '').trim(); } catch(_) { return ''; } };
})();
</script>
<!-- HIDE_ADMIN_TOKEN_FROM_URL_V1_END -->

  html.tron-auth-pending body main > :not(#loginCard):not(#authCard),

<script id="consolidatedAdminAuthEarlyV1">
(function(){
  'use strict';
  if (window.COOKIE_SUBPAGE_AUTH_V1) return;
  window.COOKIE_SUBPAGE_AUTH_V1 = true;
  var LO = 'tronclass_dashboard_manual_logout';
  try {
    var p = new URLSearchParams(location.search);
    /* LOGOUT_SERVER_SIDE_V1：登出已改為伺服器端（POST /admin/logout 清 cookie）；
       不再以 ?logout=1 / tronclass_dashboard_manual_logout 判斷，只清掉遺留旗標。 */
    try { localStorage.removeItem(LO); } catch (_) {}
    if (p.has('logout')) { p.delete('logout'); history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p.toString() : '') + location.hash); }
    /* LOGIN_PERF_V1：這頁是伺服器驗證過 session 才送出的（pages::inject_auth_attrs 會在 <html>
       寫入 data-auth="ok" 與 data-account / data-admin / data-viewer）。有這個屬性就直接進入
       已登入版面，不再多打一次 /admin/api/status 當「開機驗證」——省一趟往返，第一幀不閃。
       沒有屬性（理論上不會發生）才退回舊的網路驗證。 */
    var authOk = document.documentElement.getAttribute('data-auth') === 'ok';
    if (authOk) {
      window.__tronAuthStatus = window.__tronAuthStatus || {
        current_account_id: document.documentElement.getAttribute('data-account') || '',
        is_admin: document.documentElement.getAttribute('data-admin') === '1',
        is_viewer: document.documentElement.getAttribute('data-viewer') === '1',
        __partial: true
      };
      window.__tronAuthState = 'ok';
      document.documentElement.classList.remove('tron-auth-pending','tron-auth-logged-out');
      document.documentElement.classList.add('tron-auth-ok','dash-auth-ok','auth-ok');
      if (document.body) document.body.classList.add('logged-in','auth-ok','dash-auth-ok');
      else document.addEventListener('DOMContentLoaded', function(){ document.body.classList.add('logged-in','auth-ok','dash-auth-ok'); }, { once: true });
    } else {
    document.documentElement.classList.add('tron-auth-pending');
    fetch('/admin/api/status', {credentials:'same-origin', cache:'no-store'}).then(function(r){
      if (r.ok) {
        document.documentElement.classList.remove('tron-auth-pending','tron-auth-logged-out');
        document.documentElement.classList.add('tron-auth-ok','dash-auth-ok','auth-ok');
        if (document.body) document.body.classList.add('logged-in','auth-ok','dash-auth-ok');
        return;
      }
      var next = encodeURIComponent(location.pathname + location.search + location.hash);
      location.replace('/admin?next=' + next);
    }).catch(function(){
      var next = encodeURIComponent(location.pathname + location.search + location.hash);
      location.replace('/admin?next=' + next);
    });
    }
  } catch(_) {
    location.replace('/admin');
  }
})();
</script>
<!-- CONSOLIDATED_ADMIN_AUTH_V1_HEAD_END -->

  <script id="optimizeV47Theme">
  (function(){

    var mq=window.matchMedia('(prefers-color-scheme:dark)');
  var THEME_LS='tronclass_app_settings_v1';
  function themeChoice(){try{var s=JSON.parse(localStorage.getItem(THEME_LS)||'{}');var t=String(s.theme||'auto').toLowerCase();return(t==='light'||t==='dark')?t:'auto'}catch(_){return'auto'}}
  function applyTheme(){var c=themeChoice();document.documentElement.setAttribute('data-theme',c==='auto'?(mq.matches?'dark':'light'):c)}
  /* THEME_CHOICE_V1: 使用者設定（外觀設定頁）優先；auto 才跟隨系統，並同步跨分頁變更 */
  applyTheme();
  try{mq.addEventListener('change',applyTheme)}catch(e){mq.addListener(applyTheme)}
  try{window.addEventListener('storage',function(ev){if(!ev||!ev.key||ev.key===THEME_LS)applyTheme()})}catch(_){}
  window.__setTheme=function(t){document.documentElement.setAttribute('data-theme',t||'dark')};
    document.documentElement.classList.add('tron-auth-ok','dash-auth-ok','mobile-nav-final-auth');
    if(document.body) document.body.classList.add('auth-ok','dash-auth-ok','logged-in');

</style>
<style id="SAFE_AREA_TOP_V1">
  /* 手機鏡頭／瀏海安全區：viewport-fit=cover 讓頁面延伸到系統列底下，

  header.topbar, .topbar{

<body>

<main>

<div id="toast" class="toast"></div>

<script>
(function(){
  'use strict';
  const LS_SESSION = 'tronclass_admin_session';
  let loginList = [], fileList = [], systemList = [];
  let view = 'login';

  const q = id => document.getElementById(id);
  
  function token(){
    try {
      return ''; // F-03: token removed
    } catch(_) { return ''; }
  }
  
  function withToken(path){
    try {
      const u = new URL(path, location.origin);
      const t = token();
      // F-03: token removed, auth via HttpOnly cookie
      return u.pathname + u.search + u.hash;
    } catch(_) { return path; }
  }

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function fmtTime(ts){
    if (!ts) return '-';
    try {
      const num = Number(ts);
      const d = new Date(num < 1e11 ? num * 1000 : num);
      if (isNaN(d.getTime())) return String(ts);
      return d.toLocaleString('zh-TW', { hour12: false });
    } catch(_) { return String(ts); }
  }

  function pill(status, text){
    const s = String(status || '').toLowerCase();
    let cls = 'info';
    let label = text || status || '-';
    if (s === 'ok' || s === 'success' || s === 'true' || s === 'login' || s === 'passkey_login') {
      cls = 'ok';
      if (!text) label = '成功';
    } else if (s === 'fail' || s === 'failed' || s === 'error' || s === 'login_failed' || s === 'false') {
      cls = 'bad';
      if (!text) label = '失敗';
    } else if (s === 'warn' || s === 'warning' || s.includes('delete') || s.includes('rmdir')) {
      cls = 'warn';
      if (!text) label = '警告';
    }
    return '<span class="pill ' + cls + '">' + esc(label) + '</span>';
  }

  async function api(path, opts={}, timeout=12000){
    const t = token();
    const c = new AbortController();
    const timer = setTimeout(() => c.abort(), timeout);
    opts.signal = c.signal;
    opts.credentials = opts.credentials || 'same-origin';
    const sep = path.includes('?') ? '&' : '?';
    try {
      const res = await fetch(path, opts);
      if (res.status === 401 || res.status === 403) {
        localStorage.removeItem(LS_SESSION);
        sessionStorage.removeItem(LS_SESSION);
        const next = encodeURIComponent(location.pathname + location.search + location.hash);
        location.replace('/admin?next=' + next);
        throw new Error('登入失效');
      }
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
      return body;
    } finally {
      clearTimeout(timer);
    }
  }

  function actionLabel(a){
    return {
      login: '登入成功',
      login_failed: '登入失敗',
      passkey_login: '通行密鑰',
      upload: '上傳教材',
      material_upload: '上傳教材',
      delete_file: '刪除檔案',
      material_delete: '刪除檔案',
      create_folder: '建立資料夾',
      material_folder_create: '建立資料夾',
      delete_folder: '刪除資料夾',
      mkdir: '建立資料夾',
      rmdir: '刪除資料夾',
      force: '手動檢查',
      reauth: '重新認證',
      start: '啟動監控',
      stop: '暫停監控'
    }[a] || a || '-';
  }

  /* 1. 渲染登入審計 */
  function renderLogin(){
    const kw = (q('loginSearch') ? q('loginSearch').value : '').trim().toLowerCase();
    const sf = (q('loginStatusFilter') ? q('loginStatusFilter').value : '').trim().toLowerCase();
    let arr = Array.isArray(loginList) ? loginList : [];
    
    if (sf) {
      arr = arr.filter(x => {
        const isOk = x.result === 'success' || x.action === 'login' || x.action === 'passkey_login' || x.success === true;
        return sf === 'success' ? isOk : !isOk;
      });
    }
    if (kw) {
      arr = arr.filter(x => ((x.actor||'')+' '+(x.account_id||'')+' '+(x.details||x.detail||x.message||'')+' '+(x.action||'')+' '+(x.ip||'')).toLowerCase().includes(kw));
    }

    // 桌面表格
    if (q('loginBody')) {
      q('loginBody').innerHTML = arr.length ? arr.map(x => {
        const isOk = x.result === 'success' || x.action === 'login' || x.action === 'passkey_login' || x.success === true;
        return '<tr>' +
          '<td class="td-time">' + fmtTime(x.time || x.timestamp) + '</td>' +
          '<td>' + pill(isOk ? 'ok' : 'bad', isOk ? '成功' : '失敗') + '</td>' +
          '<td><b>' + esc(x.actor || x.account_id || '-') + '</b></td>' +
          '<td><span class="small">' + esc(x.account_id || '-') + '</span></td>' +
          '<td class="td-time">' + esc(x.ip || '-') + '</td>' +
          '<td class="td-break-word">' + esc(x.details || x.detail || x.message || actionLabel(x.action)) + '</td>' +
        '</tr>';
      }).join('') : '<tr><td colspan="6" class="empty">沒有符合的登入紀錄</td></tr>';
    }

    // 手機卡片 (時間、人員、結果、動作)
    if (q('loginCards')) {
      q('loginCards').innerHTML = arr.length ? arr.map(x => {
        const isOk = x.result === 'success' || x.action === 'login' || x.action === 'passkey_login' || x.success === true;
        return '<div class="record-card">' +
          '<div class="card-header-row">' +
            '<span class="card-time">' + fmtTime(x.time || x.timestamp) + '</span>' +
            pill(isOk ? 'ok' : 'bad', isOk ? '成功' : '失敗') +
          '</div>' +
          '<div class="card-actor-row">' +
            '<span class="card-actor-name">' + esc(x.actor || x.account_id || '-') + '</span>' +
            '<span class="card-account-id">' + esc(x.account_id || '') + '</span>' +
          '</div>' +
          '<div class="card-details-row">' +
            '動作：<b>' + esc(actionLabel(x.action)) + '</b> ｜ ' + esc(x.details || x.detail || x.message || '-') +
          '</div>' +
        '</div>';
      }).join('') : '<div class="empty">目前沒有登入紀錄</div>';
    }
  }

  /* 2. 渲染教材檔案操作 */
  function renderFiles(){
    const kw = (q('fileSearch') ? q('fileSearch').value : '').trim().toLowerCase();
    let arr = Array.isArray(fileList) ? fileList : [];
    if (kw) {
      arr = arr.filter(x => ((x.actor||'')+' '+(x.account_id||'')+' '+(x.file_path||x.path||x.name||'')+' '+(x.event_type||x.action||'')).toLowerCase().includes(kw));
    }

    if (q('filesBody')) {
      q('filesBody').innerHTML = arr.length ? arr.map(x => {
        return '<tr>' +
          '<td class="td-time">' + fmtTime(x.time || x.timestamp) + '</td>' +
          '<td>' + pill(x.status || 'ok', '成功') + '</td>' +
          '<td><b>' + esc(x.actor || x.account_id || '-') + '</b></td>' +
          '<td>' + esc(actionLabel(x.event_type || x.action)) + '</td>' +
          '<td class="td-break-all">' + esc(x.file_path || x.path || x.name || '-') + '</td>' +
        '</tr>';
      }).join('') : '<tr><td colspan="5" class="empty">沒有符合的教材操作紀錄</td></tr>';
    }

    if (q('filesCards')) {
      q('filesCards').innerHTML = arr.length ? arr.map(x => {
        return '<div class="record-card">' +
          '<div class="card-header-row">' +
            '<span class="card-time">' + fmtTime(x.time || x.timestamp) + '</span>' +
            pill(x.status || 'ok', '成功') +
          '</div>' +
          '<div class="card-actor-row">' +
            '<span class="card-actor-name">' + esc(x.actor || x.account_id || '-') + '</span>' +
            '<span class="card-account-id">' + esc(actionLabel(x.event_type || x.action)) + '</span>' +
          '</div>' +
          '<div class="card-details-row break-all">' +
            '路徑：' + esc(x.file_path || x.path || x.name || '-') +
          '</div>' +
        '</div>';
      }).join('') : '<div class="empty">目前沒有教材操作紀錄</div>';
    }
  }

  /* 3. 渲染系統執行日誌 */
  function renderSystem(){
    const kw = (q('sysSearch') ? q('sysSearch').value : '').trim().toLowerCase();
    const lf = (q('sysLevelFilter') ? q('sysLevelFilter').value : '').trim().toLowerCase();
    let arr = Array.isArray(systemList) ? systemList : [];
    
    if (lf) {
      arr = arr.filter(x => String(x.level || '').toLowerCase() === lf);
    }
    if (kw) {
      arr = arr.filter(x => ((x.target||x.source||x.module||'')+' '+(x.account_id||'')+' '+(x.message||x.msg||x.text||'')).toLowerCase().includes(kw));
    }

    if (q('systemBody')) {
      q('systemBody').innerHTML = arr.length ? arr.map(x => {
        const lvl = String(x.level || 'info').toLowerCase();
        return '<tr>' +
          '<td class="td-time">' + fmtTime(x.time || x.timestamp) + '</td>' +
          '<td>' + pill(lvl === 'error' ? 'bad' : lvl === 'warn' ? 'warn' : 'info', x.level || 'INFO') + '</td>' +
          '<td><b>' + esc(x.target || x.source || x.module || '系統') + '</b></td>' +
          '<td>' + esc(x.account_id || '-') + '</td>' +
          '<td class="td-break-all">' + esc(x.message || x.msg || x.text || '-') + '</td>' +
        '</tr>';
      }).join('') : '<tr><td colspan="5" class="empty">沒有符合的系統 Log</td></tr>';
    }

    if (q('systemCards')) {
      q('systemCards').innerHTML = arr.length ? arr.map(x => {
        const lvl = String(x.level || 'info').toLowerCase();
        return '<div class="record-card">' +
          '<div class="card-header-row">' +
            '<span class="card-time">' + fmtTime(x.time || x.timestamp) + '</span>' +
            pill(lvl === 'error' ? 'bad' : lvl === 'warn' ? 'warn' : 'info', x.level || 'INFO') +
          '</div>' +
          '<div class="card-actor-row">' +
            '<span class="card-actor-name">' + esc(x.target || x.source || x.module || '系統') + '</span>' +
            '<span class="card-account-id">' + esc(x.account_id || '') + '</span>' +
          '</div>' +
          '<div class="card-details-row break-all">' +
            esc(x.message || x.msg || x.text || '-') +
          '</div>' +
        '</div>';
      }).join('') : '<div class="empty">目前沒有系統 Log</div>';
    }
  }

  function updateStats(){
    const okCount = loginList.filter(x => x.result === 'success' || x.action === 'login' || x.action === 'passkey_login' || x.success === true).length;
    const failCount = loginList.filter(x => !(x.result === 'success' || x.action === 'login' || x.action === 'passkey_login' || x.success === true)).length;
    if (q('loginOk')) q('loginOk').textContent = okCount;
    if (q('loginFail')) q('loginFail').textContent = failCount;
    if (q('fileEvents')) q('fileEvents').textContent = fileList.length;
    if (q('systemEvents')) q('systemEvents').textContent = systemList.length;
  }

  async function loadLoginLogs(){
    try {
      const res = await api('/admin/api/activity/login?limit=500');
      loginList = res.items || res.events || res || [];
      renderLogin();
      updateStats();
    } catch(e) { console.warn('login logs failed', e); }
  }

  async function loadFilesLogs(){
    try {
      const res = await api('/admin/api/files/history?limit=300');
      fileList = res.items || res.history || res.events || [];
      renderFiles();
      updateStats();
    } catch(e) { console.warn('files logs failed', e); }
  }

  async function loadSystemLogs(){
    try {
      const res = await api('/admin/api/logs?limit=500');
      systemList = res.items || res.logs || res.entries || [];
      renderSystem();
      updateStats();
    } catch(e) { console.warn('system logs failed', e); }
  }

  function switchTab(viewId){
    view = viewId;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.view === viewId));
    document.querySelectorAll('.view').forEach(x => x.classList.toggle('active', x.id === 'view-' + viewId));
    try { history.replaceState(null, '', '#view-' + viewId); } catch(_) {}
    if (viewId === 'login') renderLogin();
    if (viewId === 'files') renderFiles();
    if (viewId === 'system') renderSystem();
  }

  function syncLinks(){
    if (q('backDashboardBtn')) q('backDashboardBtn').href = withToken('/admin');
    if (q('pageBackDashboardBtn')) q('pageBackDashboardBtn').href = withToken('/admin');
  }

  function init(){
    syncLinks();
    
    if (q('refresh')) q('refresh').onclick = () => { loadLoginLogs(); loadFilesLogs(); loadSystemLogs(); };
    if (q('logoutBtn')) q('logoutBtn').onclick = () => {
      /* LOGOUT_SERVER_SIDE_V1 */
      if (typeof window.tronSecureLogout === 'function') return window.tronSecureLogout();
      fetch('/admin/logout',{method:'POST',credentials:'same-origin',cache:'no-store',redirect:'manual'}).catch(function(){}).then(function(){location.replace('/admin')});
    };

    var _actDebounce = null;
    function debounceRender(fn){
      clearTimeout(_actDebounce);
      _actDebounce = setTimeout(fn, 120);
    }
    if (q('loginSearch')) q('loginSearch').oninput = () => debounceRender(renderLogin);
    if (q('loginStatusFilter')) q('loginStatusFilter').onchange = renderLogin;
    if (q('fileSearch')) q('fileSearch').oninput = () => debounceRender(renderFiles);
    if (q('sysSearch')) q('sysSearch').oninput = () => debounceRender(renderSystem);
    if (q('sysLevelFilter')) q('sysLevelFilter').onchange = renderSystem;

    document.querySelectorAll('.tab').forEach(b => b.onclick = () => switchTab(b.dataset.view));

    const hash = (location.hash || '').replace('#view-', '').replace('#', '');
    if (hash && ['login', 'files', 'system'].includes(hash)) {
      switchTab(hash);
    }

    loadLoginLogs();
    loadFilesLogs();
    loadSystemLogs();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
<script id="RETURN_DASHBOARD_HREF_V1">
(function(){
  function tok(){
    return '';
  }
  function patch(){
    var t=tok();
    document.querySelectorAll('a[href="/admin"],a[href="/admin/"],a[href="/admin#overview"],a[href^="/admin?"]').forEach(function(a){
      try{
        var u=new URL(a.getAttribute('href'), location.origin);
        if(!(u.pathname==='/admin'||u.pathname==='/admin/'||u.pathname==='/admin/dashboard')) return;
        // F-03: token removed, auth via HttpOnly cookie
        if(!u.hash) u.hash='overview';
        a.setAttribute('href', u.pathname+u.search+u.hash);
      }catch(_){}
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', patch);
  else patch();
  setTimeout(patch, 200);
})();
</script>

<script id="ACTIVITY_MOBILE_HEADER_V1">
(function(){
  if(window.ACTIVITY_MOBILE_HEADER_V1) return;
  window.ACTIVITY_MOBILE_HEADER_V1 = true;
  function tidy(){
    var mid=document.getElementById('pageBackDashboardBtn');
    if(mid) mid.remove();
    var actions=document.querySelector('.topbar .actions, header .actions');
    if(!actions) return;
    Array.prototype.slice.call(actions.children).forEach(function(n){
      if(n.id==='backDashboardBtn') return;
      n.style.display='none';
    });
    var a=document.getElementById('backDashboardBtn');
    if(a){
      a.textContent='返回控制台';
      a.style.display='inline-flex';
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', tidy);
  else tidy();
  setTimeout(tidy, 80);
})();
