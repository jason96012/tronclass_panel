<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>作業截止時間｜Tronclass</title>
<style>
:root{
  color-scheme:light;
  --ds-bg:#f5f7fb;--ds-card:#ffffff;--ds-soft:#f1f5f9;--ds-soft-strong:#e8eef7;
  --ds-text:#172033;--ds-muted:#64748b;--ds-line:#d8e0eb;--ds-line-soft:#e8edf4;
  --ds-input:#ffffff;--ds-shadow:0 10px 30px rgba(15,23,42,.07);
  --ds-hero-a:#eff6ff;--ds-hero-b:#e0edff;--ds-hero-text:#172033;
  --color-urgent:#ef4444;--color-warn:#f59e0b;--color-info:#3b82f6;--color-good:#10b981;
}
@media(prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --ds-bg:#0f141d;--ds-card:#161d29;--ds-soft:#111827;--ds-soft-strong:#1e293b;
    --ds-text:#eef2ff;--ds-muted:#9aa4b5;--ds-line:#303948;--ds-line-soft:#252e3c;
    --ds-input:#101722;--ds-shadow:0 14px 36px rgba(0,0,0,.24);
    --ds-hero-a:#111d2d;--ds-hero-b:#13294b;--ds-hero-text:#f1f5f9;
  }
}
html[data-theme="light"]{color-scheme:light;--ds-bg:#f5f7fb;--ds-card:#fff;--ds-soft:#f1f5f9;--ds-soft-strong:#e8eef7;--ds-text:#172033;--ds-muted:#64748b;--ds-line:#d8e0eb;--ds-line-soft:#e8edf4;--ds-input:#fff;--ds-shadow:0 10px 30px rgba(15,23,42,.07);--ds-hero-a:#eff6ff;--ds-hero-b:#e0edff;--ds-hero-text:#172033}
html[data-theme="dark"]{color-scheme:dark;--ds-bg:#0f141d;--ds-card:#161d29;--ds-soft:#111827;--ds-soft-strong:#1e293b;--ds-text:#eef2ff;--ds-muted:#9aa4b5;--ds-line:#303948;--ds-line-soft:#252e3c;--ds-input:#101722;--ds-shadow:0 14px 36px rgba(0,0,0,.24);--ds-hero-a:#111d2d;--ds-hero-b:#13294b;--ds-hero-text:#f1f5f9}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ds-bg)!important;color:var(--ds-text)!important}
body{font-family:Inter,"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.shell{width:min(1400px,calc(100% - 64px));margin:auto;padding:32px 0 52px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}.brand b{color:var(--ds-text);font-size:17px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#38bdf8,#6366f1);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:900;box-shadow:0 10px 26px rgba(37,99,235,.28)}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top a,.button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;color:var(--ds-text)!important;text-decoration:none;border:1px solid var(--ds-line)!important;background:var(--ds-card)!important;padding:0 16px;border-radius:999px;font-weight:760;box-shadow:0 1px 2px rgba(15,23,42,.03);cursor:pointer;font:inherit}
.top a:hover,.button:hover{border-color:#60a5fa!important;color:#2563eb!important}
.hero{padding:28px 32px;border:1px solid var(--ds-line-soft);border-radius:24px;background:radial-gradient(circle at 92% 0,rgba(37,99,235,.15),transparent 44%),linear-gradient(135deg,var(--ds-hero-a),var(--ds-hero-b));box-shadow:var(--ds-shadow);margin-bottom:20px;color:var(--ds-hero-text)}
.eyebrow{font-size:12px;letter-spacing:.13em;color:#0284c7;font-weight:850}.hero h1{font-size:clamp(24px,3.8vw,36px);margin:8px 0;color:var(--ds-hero-text)}.hero p{margin:0;color:var(--ds-muted);line-height:1.75;font-size:15px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.metric{background:var(--ds-card);border:1px solid var(--ds-line-soft);padding:18px;border-radius:18px;box-shadow:var(--ds-shadow);position:relative;overflow:hidden}
.metric .meta{font-size:13px;font-weight:750;color:var(--ds-muted);display:flex;align-items:center;gap:6px}
.metric b{display:block;color:var(--ds-text);font-size:30px;margin-top:6px;font-weight:850;line-height:1.1}
.metric.urgent{border-color:rgba(239,68,68,.35)}.metric.urgent b{color:#ef4444}
.metric.warn{border-color:rgba(245,158,11,.35)}.metric.warn b{color:#f59e0b}
.metric.pending{border-color:rgba(59,130,246,.35)}.metric.pending b{color:#3b82f6}
.metric.good{border-color:rgba(16,185,129,.35)}.metric.good b{color:#10b981}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap;background:var(--ds-card);border:1px solid var(--ds-line-soft);padding:16px 20px;border-radius:18px;box-shadow:var(--ds-shadow)}
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap}
.filter-tab{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--ds-line);background:var(--ds-soft);color:var(--ds-muted);font-size:13px;font-weight:750;cursor:pointer;transition:all .15s ease}
.filter-tab:hover{color:var(--ds-text);border-color:#93c5fd}
.filter-tab.active{background:linear-gradient(135deg,#0284c7,#4f46e5);border-color:transparent;color:#ffffff;box-shadow:0 4px 12px rgba(37,99,235,.25)}
.filter-tab .badge-count{padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.15);font-size:11px}
.filter-tab.active .badge-count{background:rgba(255,255,255,.25);color:#fff}
.filter-dropdowns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filter-dropdowns select,.filter-dropdowns input{min-height:38px;border:1px solid var(--ds-line);background:var(--ds-input);color:var(--ds-text);border-radius:10px;padding:0 12px;font:inherit;font-size:13px;outline:none}
.filter-dropdowns input{min-width:200px}
.filter-dropdowns select:focus,.filter-dropdowns input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.13)}
.account-selector{display:flex;align-items:center;gap:8px}
.account-selector label{font-size:13px;font-weight:750;color:var(--ds-muted)}
.account-selector select{min-height:38px;border:1px solid var(--ds-line);background:var(--ds-input);color:var(--ds-text);border-radius:10px;padding:0 12px;font:inherit;font-size:13px;font-weight:700}
.hw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:18px}
.hw-card{border:1px solid var(--ds-line-soft);border-radius:20px;background:var(--ds-card);padding:22px;box-shadow:var(--ds-shadow);color:var(--ds-text);display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s ease,box-shadow .15s ease;position:relative;overflow:hidden}
.hw-card:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(15,23,42,.1)}
.hw-card.urgent{border-color:rgba(239,68,68,.5);background:linear-gradient(180deg,rgba(239,68,68,.04),var(--ds-card) 25%)}
.hw-card.urgent::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:#ef4444}
.hw-card.warn{border-color:rgba(245,158,11,.5);background:linear-gradient(180deg,rgba(245,158,11,.04),var(--ds-card) 25%)}
.hw-card.warn::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:#f59e0b}
.hw-card.submitted{opacity:.9;border-color:rgba(16,185,129,.3)}
.hw-card.submitted::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:#10b981}
.hw-card.overdue{opacity:.75;border-color:rgba(100,116,139,.3)}
.hw-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.course-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#0284c7;background:rgba(2,132,199,.1);padding:4px 10px;border-radius:8px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.countdown-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:850;padding:5px 12px;border-radius:999px;white-space:nowrap}
.countdown-badge.urgent{background:#fee2e2;color:#b91c1c;animation:pulseUrgent 2s infinite}
.countdown-badge.warn{background:#fef3c7;color:#b45309}
.countdown-badge.pending{background:#dbeafe;color:#1d4ed8}
.countdown-badge.submitted{background:#dcfce7;color:#15803d}
.countdown-badge.overdue{background:var(--ds-soft-strong);color:var(--ds-muted)}
@keyframes pulseUrgent{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{transform:scale(1.02);box-shadow:0 0 0 6px rgba(239,68,68,0)}}
.hw-title{font-size:18px;font-weight:850;margin:0 0 14px;color:var(--ds-text);line-height:1.4;word-break:break-word}
.hw-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--ds-soft);border:1px solid var(--ds-line-soft);padding:12px 14px;border-radius:14px;margin-bottom:16px;font-size:13px}
.hw-meta-item{display:flex;flex-direction:column;gap:3px}
.hw-meta-label{font-size:11px;font-weight:750;color:var(--ds-muted);text-transform:uppercase;letter-spacing:.03em}
.hw-meta-val{font-size:13px;font-weight:750;color:var(--ds-text)}
.hw-meta-val.deadline{color:#ef4444;font-weight:850}
.hw-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--ds-line-soft);font-size:12px}
.status-pill{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:12px}
.status-pill.good{color:#10b981}.status-pill.bad{color:#ef4444}.status-pill.warn{color:#f59e0b}
.empty-box{grid-column:1/-1;padding:48px 24px;text-align:center;border:2px dashed var(--ds-line);border-radius:22px;background:var(--ds-card);color:var(--ds-muted)}
.empty-box h3{font-size:20px;color:var(--ds-text);margin:0 0 8px}
.empty-box p{margin:0 0 18px;font-size:14px}
.loading-box{grid-column:1/-1;padding:64px 24px;text-align:center;color:var(--ds-muted);font-size:16px;font-weight:750}
.spinner{width:32px;height:32px;border:3px solid var(--ds-line);border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.refresh-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ds-muted)}
@media(max-width:900px){
  .shell{width:min(100% - 24px,1400px);padding:16px 0 40px}
  .summary{grid-template-columns:repeat(2,1fr);gap:10px}
  .hw-grid{grid-template-columns:1fr}
  .controls{flex-direction:column;align-items:stretch;gap:14px}
  .filter-dropdowns{justify-content:stretch}.filter-dropdowns select,.filter-dropdowns input{flex:1}
  .top{flex-direction:column;align-items:stretch;gap:12px}
  .top-actions{justify-content:space-between}
}
@media(max-width:500px){
  .summary{grid-template-columns:1fr 1fr}
  .metric{padding:14px}.metric b{font-size:24px}
  .hw-card{padding:16px}
  .hw-title{font-size:16px}
  .hw-meta-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="logo">📝</div>
      <div>
        <b>Tronclass 作業截止追蹤</b>
        <div class="meta" id="brandSub">即時倒數與未繳提醒</div>
      </div>
    </div>
    <div class="top-actions">
      <div class="account-selector" id="accountSelectorWrap" style="display:none">
        <label for="accountSelect">帳號：</label>
        <select id="accountSelect"></select>
      </div>
      <button class="button" id="refreshBtn" type="button">🔄 重新整理</button>
      <a class="button" id="backDashboard" href="/admin#overview">返回 Dashboard</a>
    </div>
  </header>

  <section class="hero">
    <div class="eyebrow">HOMEWORK & QUIZ DEADLINES</div>
    <h1>作業截止時間</h1>
    <p>即時串接 Tronclass 平台待辦清單，依剩餘時間動態進行緊急倒數（24h / 6h / 1h 階梯警示），掌握各科繳交進度。</p>
  </section>

  <div class="summary">
    <div class="metric urgent">
      <span class="meta">🚨 24 小時內即將截止</span>
      <b id="statUrgent">-</b>
    </div>
    <div class="metric warn">
      <span class="meta">⚠️ 7 天內待辦作業</span>
      <b id="statWeek">-</b>
    </div>
    <div class="metric pending">
      <span class="meta">⏳ 全部未繳交作業</span>
      <b id="statPending">-</b>
    </div>
    <div class="metric good">
      <span class="meta">✅ 已繳交 / 已評分</span>
      <b id="statSubmitted">-</b>
    </div>
  </div>

  <div class="controls">
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="pending" type="button">⏳ 未繳交 <span class="badge-count" id="countPending">0</span></button>
      <button class="filter-tab" data-filter="urgent" type="button">🚨 24h 緊急 <span class="badge-count" id="countUrgent">0</span></button>
      <button class="filter-tab" data-filter="all" type="button">📋 全部 <span class="badge-count" id="countAll">0</span></button>
      <button class="filter-tab" data-filter="submitted" type="button">✅ 已繳交 <span class="badge-count" id="countSubmitted">0</span></button>
      <button class="filter-tab" data-filter="overdue" type="button">🚫 已逾期 <span class="badge-count" id="countOverdue">0</span></button>
    </div>

    <div class="filter-dropdowns">
      <select id="courseFilter" aria-label="課程篩選">
        <option value="">全部課程</option>
      </select>
      <select id="sortFilter" aria-label="排序依據">
        <option value="deadline_asc">截止時間（由近到遠）</option>
        <option value="deadline_desc">截止時間（由遠到近）</option>
        <option value="course">課程名稱</option>
      </select>
      <input type="search" id="searchInput" placeholder="搜尋作業名稱 / 課程..." aria-label="搜尋作業">
    </div>
  </div>

  <div class="refresh-pill" id="syncStatusWrap">
    <span>最後更新時間：<b id="lastUpdated">-</b></span>
  </div>

  <main id="homeworkContainer" class="hw-grid" style="margin-top:14px">
    <div class="loading-box">
      <div class="spinner"></div>
      正在向 Tronclass 獲取最新作業待辦清單…
    </div>
  </main>
</div>

<script>
(function(){
  'use strict';
  const q = id => document.getElementById(id);
  let allItems = [];
  let currentFilter = 'pending';
  let currentAccount = '';
  let statusInfo = null;
  let timerId = null;

  async function api(path, opts) {
    const res = await fetch(path, Object.assign({ credentials: 'same-origin', cache: 'no-store' }, opts || {}));
    if (res.status === 401 || res.status === 403) {
      location.replace('/admin');
      throw new Error('請先登入');
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.error || ('HTTP ' + res.status));
    }
    return data;
  }

  function esc(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function formatDateTime(isoStr) {
    if (!isoStr) return '無截止限制';
    const d = new Date(isoStr);
    if (isNaN(d.getTime())) return isoStr;
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function getRemainingMs(isoStr) {
    if (!isoStr) return null;
    const deadline = new Date(isoStr).getTime();
    if (isNaN(deadline)) return null;
    return deadline - Date.now();
  }

  function formatCountdown(ms) {
    if (ms == null) return { text: '無期限', badgeClass: 'pending' };
    if (ms <= 0) return { text: '已截止', badgeClass: 'overdue' };

    const totalSecs = Math.floor(ms / 1000);
    const days = Math.floor(totalSecs / 86400);
    const hours = Math.floor((totalSecs % 86400) / 3600);
    const mins = Math.floor((totalSecs % 3600) / 60);
    const secs = totalSecs % 60;

    if (totalSecs <= 3600) {
      return {
        text: `🚨 剩餘 ${mins} 分 ${secs} 秒`,
        badgeClass: 'urgent'
      };
    }
    if (totalSecs <= 6 * 3600) {
      return {
        text: `⚠️ 剩餘 ${hours} 小時 ${mins} 分`,
        badgeClass: 'warn'
      };
    }
    if (totalSecs <= 24 * 3600) {
      return {
        text: `⏳ 剩餘 ${hours} 小時 ${mins} 分`,
        badgeClass: 'urgent'
      };
    }
    if (days > 0) {
      return {
        text: `📅 剩餘 ${days} 天 ${hours} 小時`,
        badgeClass: 'pending'
      };
    }
    return {
      text: `剩餘 ${hours} 小時 ${mins} 分`,
      badgeClass: 'pending'
    };
  }

  function getItemState(item) {
    const isSubmitted = item.is_submitted || ['submitted', 'graded', 'group_submitted', 'completed', 'pass', 'passed'].includes((item.submission_status || '').toLowerCase());
    const rem = getRemainingMs(item.end_time);

    if (isSubmitted) return 'submitted';
    if (rem == null) return 'pending';
    if (rem <= 0) return 'overdue';
    if (rem <= 24 * 3600 * 1000) return 'urgent';
    return 'pending';
  }

  function updateMetrics() {
    let countUrgent = 0;
    let countWeek = 0;
    let countPending = 0;
    let countSubmitted = 0;
    let countOverdue = 0;
    const now = Date.now();
    const weekMs = 7 * 86400 * 1000;
    const dayMs = 24 * 3600 * 1000;

    const courseSet = new Set();

    allItems.forEach(item => {
      if (item.course_name) courseSet.add(item.course_name);
      const isSubmitted = item.is_submitted || ['submitted', 'graded', 'group_submitted', 'completed', 'pass', 'passed'].includes((item.submission_status || '').toLowerCase());
      const rem = getRemainingMs(item.end_time);

      if (isSubmitted) {
        countSubmitted++;
      } else {
        countPending++;
        if (rem != null) {
          if (rem <= 0) {
            countOverdue++;
          } else {
            if (rem <= dayMs) countUrgent++;
            if (rem <= weekMs) countWeek++;
          }
        }
      }
    });

    q('statUrgent').textContent = countUrgent;
    q('statWeek').textContent = countWeek;
    q('statPending').textContent = countPending;
    q('statSubmitted').textContent = countSubmitted;

    q('countAll').textContent = allItems.length;
    q('countPending').textContent = countPending;
    q('countUrgent').textContent = countUrgent;
    q('countSubmitted').textContent = countSubmitted;
    q('countOverdue').textContent = countOverdue;

    // Update Course Filter options
    const courseSelect = q('courseFilter');
    const selectedCourse = courseSelect.value;
    courseSelect.innerHTML = '<option value="">全部課程</option>';
    Array.from(courseSet).sort().forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      courseSelect.appendChild(opt);
    });
    if (courseSet.has(selectedCourse)) {
      courseSelect.value = selectedCourse;
    }
  }

  function renderList() {
    const container = q('homeworkContainer');
    const searchVal = q('searchInput').value.trim().toLowerCase();
    const courseVal = q('courseFilter').value;
    const sortVal = q('sortFilter').value;

    let filtered = allItems.filter(item => {
      const state = getItemState(item);

      if (currentFilter === 'pending' && (state === 'submitted' || state === 'overdue')) return false;
      if (currentFilter === 'urgent' && state !== 'urgent') return false;
      if (currentFilter === 'submitted' && state !== 'submitted') return false;
      if (currentFilter === 'overdue' && state !== 'overdue') return false;

      if (courseVal && item.course_name !== courseVal) return false;

      if (searchVal) {
        const text = `${item.title || ''} ${item.course_name || ''} ${item.department_name || ''}`.toLowerCase();
        if (!text.includes(searchVal)) return false;
      }
      return true;
    });

    // Sorting
    filtered.sort((a, b) => {
      if (sortVal === 'course') {
        return (a.course_name || '').localeCompare(b.course_name || '');
      }
      const aTime = a.end_time ? new Date(a.end_time).getTime() : (sortVal === 'deadline_asc' ? 9999999999999 : 0);
      const bTime = b.end_time ? new Date(b.end_time).getTime() : (sortVal === 'deadline_asc' ? 9999999999999 : 0);
      if (sortVal === 'deadline_desc') {
        return bTime - aTime;
      }
      return aTime - bTime;
    });

    if (filtered.length === 0) {
      if (currentFilter === 'pending' && allItems.length > 0) {
        container.innerHTML = `
          <div class="empty-box">
            <h3>🎉 太棒了！目前沒有待繳交的作業</h3>
            <p>所有進行中的待辦事項與作業皆已完成。</p>
            <button class="button" onclick="document.querySelector('[data-filter=all]').click()">查看全部作業紀錄</button>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="empty-box">
            <h3>沒有符合條件的作業</h3>
            <p>請嘗試變更上方篩選條件或搜尋關鍵字。</p>
          </div>
        `;
      }
      return;
    }

    container.innerHTML = filtered.map(item => {
      const state = getItemState(item);
      const rem = getRemainingMs(item.end_time);
      const countdown = item.is_submitted || ['submitted', 'graded', 'group_submitted', 'completed', 'pass', 'passed'].includes((item.submission_status || '').toLowerCase())
        ? { text: '✅ 已繳交', badgeClass: 'submitted' }
        : formatCountdown(rem);

      const typeLabel = {
        homework: '📝 作業',
        quiz: '⏱️ 測驗',
        discussion: '💬 討論',
        questionnaire: '📊 問卷'
      }[item.item_type] || '📝 作業';

      const statusText = item.score != null
        ? `💯 已評分：${item.score} 分`
        : (item.is_submitted || item.submission_status === 'submitted'
          ? '✅ 已繳交'
          : (rem != null && rem <= 0 ? '❌ 逾期未繳' : '⏳ 未繳交'));

      const statusClass = item.is_submitted || item.submission_status === 'submitted' || item.score != null
        ? 'good'
        : (rem != null && rem <= 0 ? 'bad' : 'warn');

      const lateNotice = item.allow_late_submission
        ? '<span class="status-pill warn">⚠️ 允許遲交</span>'
        : '<span class="status-pill bad">❌ 不得遲交</span>';

      let cardClass = 'hw-card';
      if (state === 'urgent') cardClass += ' urgent';
      else if (state === 'warn') cardClass += ' warn';
      else if (state === 'submitted') cardClass += ' submitted';
      else if (state === 'overdue') cardClass += ' overdue';

      return `
        <article class="${cardClass}" data-endtime="${esc(item.end_time || '')}" data-submitted="${item.is_submitted ? '1' : '0'}">
          <div>
            <div class="hw-header">
              <span class="course-tag">📚 ${esc(item.course_name || '未指定課程')}</span>
              <span class="countdown-badge ${countdown.badgeClass}" data-role="countdown">${esc(countdown.text)}</span>
            </div>
            <h2 class="hw-title">${esc(item.title || '未命名作業')}</h2>
            <div class="hw-meta-grid">
              <div class="hw-meta-item">
                <span class="hw-meta-label">類型</span>
                <span class="hw-meta-val">${esc(typeLabel)}</span>
              </div>
              <div class="hw-meta-item">
                <span class="hw-meta-label">開放時間</span>
                <span class="hw-meta-val">${esc(formatDateTime(item.start_time))}</span>
              </div>
              <div class="hw-meta-item" style="grid-column:1/-1">
                <span class="hw-meta-label">截止期限</span>
                <span class="hw-meta-val deadline">⏰ ${esc(formatDateTime(item.end_time))}</span>
              </div>
            </div>
          </div>
          <div class="hw-footer">
            <div style="display:flex;align-items:center;gap:8px">
              <span class="status-pill ${statusClass}">${esc(statusText)}</span>
              ${lateNotice}
            </div>
          </div>
        </article>
      `;
    }).join('');
  }

  function updateLiveCountdowns() {
    const badges = document.querySelectorAll('[data-role="countdown"]');
    badges.forEach(badge => {
      const card = badge.closest('.hw-card');
      if (!card) return;
      const endTime = card.getAttribute('data-endtime');
      const isSub = card.getAttribute('data-submitted') === '1';
      if (isSub) return;
      if (!endTime) return;
      const rem = getRemainingMs(endTime);
      const res = formatCountdown(rem);
      badge.textContent = res.text;
      badge.className = `countdown-badge ${res.badgeClass}`;
    });
  }

  async function loadData() {
    const container = q('homeworkContainer');
    container.innerHTML = `
      <div class="loading-box">
        <div class="spinner"></div>
        正在向 Tronclass 獲取最新作業待辦清單…
      </div>
    `;
    try {
      const targetAccount = currentAccount || (statusInfo && statusInfo.current_account_id) || '';
      const queryParam = targetAccount ? `?account_id=${encodeURIComponent(targetAccount)}` : '';
      const data = await api(`/admin/api/homework${queryParam}`);
      allItems = Array.isArray(data.items) ? data.items : [];
      if (data.user_name) {
        q('brandSub').textContent = `${data.user_name} (${targetAccount || '目前帳號'}) 的作業待辦清單`;
      }
      q('lastUpdated').textContent = new Date().toLocaleTimeString();
      updateMetrics();
      renderList();
    } catch (err) {
      container.innerHTML = `
        <div class="empty-box" style="border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.02)">
          <div style="font-size:36px;margin-bottom:8px">⚠️</div>
          <h3 style="color:#ef4444">無法載入作業資料</h3>
          <p style="max-width:600px;margin:0 auto 14px;line-height:1.6;color:var(--ds-text)">${esc(err.message || '連線 Tronclass 失敗')}</p>
          <p style="font-size:13px;color:var(--ds-muted);margin:0 auto 18px">提示：若學校端登入驗證碼或 Session 過期，請點擊下方重新整理或至 Dashboard 確認帳號連線狀態。</p>
          <button class="button" id="retryBtn" type="button" style="border-color:#ef4444!important;color:#ef4444!important">🔄 重新整理</button>
        </div>
      `;
      const retry = q('retryBtn');
      if (retry) retry.onclick = loadData;
    }
  }

  async function init() {
    try {
      statusInfo = await api('/admin/api/status?include_history=false');
      if (statusInfo.accounts && statusInfo.accounts.length > 1) {
        const wrap = q('accountSelectorWrap');
        const select = q('accountSelect');
        wrap.style.display = 'flex';
        select.innerHTML = statusInfo.accounts.map(acc => `
          <option value="${esc(acc.account_id)}">${esc(acc.account_id)} (${esc(acc.user_name || acc.username || '')})</option>
        `).join('');
        select.value = statusInfo.current_account_id || statusInfo.accounts[0].account_id;
        currentAccount = select.value;
        select.onchange = function() {
          currentAccount = this.value;
          loadData();
        };
      } else if (statusInfo.accounts && statusInfo.accounts.length === 1) {
        currentAccount = statusInfo.accounts[0].account_id;
      }
    } catch (_) {}

    // Event listeners
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        renderList();
      });
    });

    q('courseFilter').addEventListener('change', renderList);
    q('sortFilter').addEventListener('change', renderList);
    q('searchInput').addEventListener('input', renderList);
    q('refreshBtn').addEventListener('click', loadData);

    await loadData();

    // Start 1-second live countdown ticker
    if (timerId) clearInterval(timerId);
    timerId = setInterval(updateLiveCountdowns, 1000);

    // Auto-refresh API every 5 minutes
    setInterval(loadData, 5 * 60 * 1000);
  }

  init();
})();
</script>
</body>
</html>
