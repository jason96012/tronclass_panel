      <div class="spinner"></div>
      正在向 Tronclass 獲取最新作業待辦清單…
    </div>
  </main>
</div>

<script>
(function(){
  'use strict';
  const q = id => document.getElementById(id);
  let allItems = [];

  // ── HOMEWORK_PAGE_CURRENT_ONLY_V1（fix45）：作業頁預設只顯示「當學期」 ────────
  // 判定由伺服器端做（`semester_current`，見 src/api/todos.rs 的 label_semester_current）：
  //   true       ＝ 當學期（截止日不早於本學期起點，或所屬課程確定是當學期）
  //   false      ＝ 非當學期（舊課，或截止日早於本學期起點）
  //   null／缺欄 ＝ 無從判定 → **一律保留**（寧可多顯示，也不要誤藏使用者的作業）
  // 使用者可用「學期範圍」切回「全部學期」查看舊作業，切換時會顯示隱藏了幾筆。
  function semesterScopeAll() {
    const el = q('semesterScope');
    return !!el && el.value === 'all';
  }

  function isCurrentSemesterItem(item) {
    return item.semester_current !== false;
  }

  function scopedItems() {
    return semesterScopeAll() ? allItems : allItems.filter(isCurrentSemesterItem);
  }

  function updateSemesterNote() {
    const note = q('semesterNote');
    if (!note) return;
    const hidden = allItems.length - allItems.filter(isCurrentSemesterItem).length;
    if (semesterScopeAll() || hidden <= 0) {
      note.hidden = true;
      note.textContent = '';
      return;
    }
    note.hidden = false;
    note.textContent = `已隱藏 ${hidden} 筆非當學期作業（可切換上方「學期範圍」為「含舊學期作業」查看）。`;
  }

  // 使用者手動標記「已完成」的作業 id 集合（HOMEWORK_USER_COMPLETED_V1）。
  let userCompleted = new Set();
  let currentFilter = 'pending';
  let currentAccount = '';
  let statusInfo = null;
  let timerId = null;
  // 記錄這批資料實際來自哪個帳號，供 init() 判斷是否需要重抓。
  let loadedAccountId = '';
  // HOMEWORK_DETAIL_V1：iClass base URL（由 /admin/api/homework 的 iclass_base 提供）
  //——「在 iClass 開啟」是按鈕直接開 iClass 的深連結，不經過面板代理。
  let iclassBase = '';
  // 收到 stale 快照後，用它排程一次背景更新的回抓。
  let revalidateTimer = null;
  let revalidatePolls = 0;
  const MAX_REVALIDATE_POLLS = 3;

  // Short-lived access token may expire mid-session; try one silent refresh
  // before redirecting to login (REFRESH_TOKEN_V1).
  let _refreshInFlight = null;
  async function _tryRefresh() {
    if (_refreshInFlight) return _refreshInFlight;
    _refreshInFlight = fetch('/admin/api/session/refresh', {
      method: 'POST', credentials: 'same-origin', cache: 'no-store'
    }).then(r => r.ok).catch(() => false).finally(() => { _refreshInFlight = null; });
    return _refreshInFlight;
  }

  async function api(path, opts) {
    let res = await fetch(path, Object.assign({ credentials: 'same-origin', cache: 'no-store' }, opts || {}));
    if ((res.status === 401 || res.status === 403) && !opts && !path.includes('session/refresh')) {
      const refreshed = await _tryRefresh();
      if (refreshed) {
        res = await fetch(path, { credentials: 'same-origin', cache: 'no-store' });
      } else {
        location.replace('/admin');
        throw new Error('請先登入');
      }
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.error || ('HTTP ' + res.status));
    }
    return data;
  }

  // 簡易 toast：顯示測試通知的結果，支援多行訊息。
  function showToast(text, kind) {
    let el = q('hwToast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'hwToast';
      el.className = 'hw-toast';
      document.body.appendChild(el);
    }
    el.textContent = text;
    el.dataset.kind = kind || 'ok';
    el.classList.add('show');
    if (showToast._timer) clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => el.classList.remove('show'), 6000);
  }

  function esc(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function formatDateTime(isoStr) {
    if (!isoStr) return '無截止限制';
    const d = new Date(isoStr);
    if (isNaN(d.getTime())) return isoStr;
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // SCORE_DISPLAY_V1：分數格式化。
  // 後端 score 是 f64（JSON 數字，如 100、77.5），少數來源也可能是字串（"86.0"）。
  // 統一轉數字：整數去掉小數點（100 而非 100.0），小數保留（77.5），
  // 無法解析回傳 null（呼叫端以 null 判斷「未評分」）。
  function formatScore(val) {
    if (val == null) return null;
    const n = Number(val);
    if (!isFinite(n)) return null;
    return Number.isInteger(n) ? String(n) : String(Math.round(n * 10) / 10);
  }

  function getRemainingMs(isoStr) {
    if (!isoStr) return null;
    const deadline = new Date(isoStr).getTime();
    if (isNaN(deadline)) return null;
    return deadline - Date.now();
  }

  function formatCountdown(ms) {
    if (ms == null) return { text: '無期限', badgeClass: 'pending' };
    if (ms <= 0) return { text: '已截止', badgeClass: 'overdue' };

    const totalSecs = Math.floor(ms / 1000);
    const days = Math.floor(totalSecs / 86400);
    const hours = Math.floor((totalSecs % 86400) / 3600);
    const mins = Math.floor((totalSecs % 3600) / 60);
    const secs = totalSecs % 60;

    if (totalSecs <= 3600) {
      return {
        text: `🚨 剩餘 ${mins} 分 ${secs} 秒`,
        badgeClass: 'urgent'
      };
    }
    if (totalSecs <= 6 * 3600) {
      return {
        text: `⚠️ 剩餘 ${hours} 小時 ${mins} 分`,
        badgeClass: 'warn'
      };
    }
    if (totalSecs <= 24 * 3600) {
      return {
        text: `⏳ 剩餘 ${hours} 小時 ${mins} 分`,
        badgeClass: 'urgent'
      };
    }
    if (days > 0) {
      return {
        text: `📅 剩餘 ${days} 天 ${hours} 小時`,
        badgeClass: 'pending'
      };
    }
    return {
      text: `剩餘 ${hours} 小時 ${mins} 分`,
      badgeClass: 'pending'
    };
  }

  function getItemState(item) {
    // 使用者手動標記完成 → 視為已繳交狀態（HOMEWORK_USER_COMPLETED_V1）。
    const userDone = userCompleted.has(String(item.id));
    const isSubmitted = item.is_submitted || userDone || ['submitted', 'graded', 'group_submitted', 'completed', 'pass', 'passed'].includes((item.submission_status || '').toLowerCase());
    const rem = getRemainingMs(item.end_time);

    if (isSubmitted) return 'submitted';
    // HOMEWORK_NOLIMIT_V1: 無截止時間的素材單獨歸類，不混入未繳交。
    if (rem == null) return 'nolimit';
    if (rem <= 0) return 'overdue';
    if (rem <= 24 * 3600 * 1000) return 'urgent';
    return 'pending';
  }

  function updateMetrics() {
    let countUrgent = 0;
    let countWeek = 0;
    let countPending = 0;
    let countSubmitted = 0;
    let countOverdue = 0;
    let countNolimit = 0;
    const now = Date.now();
    const weekMs = 7 * 86400 * 1000;
    const dayMs = 24 * 3600 * 1000;

    const courseSet = new Set();

    // 統計與課程下拉都只反映「目前學期範圍」看得到的項目。
    scopedItems().forEach(item => {
      if (item.course_name) courseSet.add(item.course_name);
      const isSubmitted = item.is_submitted || userCompleted.has(String(item.id)) || ['submitted', 'graded', 'group_submitted', 'completed', 'pass', 'passed'].includes((item.submission_status || '').toLowerCase());
      const rem = getRemainingMs(item.end_time);

      if (isSubmitted) {
        countSubmitted++;
      } else if (rem == null) {
        // HOMEWORK_NOLIMIT_V1
        // 無截止時間的課程素材（material / web_link / page 等）不算「未繳交」，
        // 而是單獨歸類為「無期限素材」，避免塞進 ⏳未繳交 灌高數字。
        countNolimit++;
      } else if (rem <= 0) {
        countOverdue++;
      } else {
        countPending++;
        if (rem <= dayMs) countUrgent++;
        if (rem <= weekMs) countWeek++;
      }
    });

    q('statUrgent').textContent = countUrgent;
    q('statWeek').textContent = countWeek;
    q('statPending').textContent = countPending;
    q('statSubmitted').textContent = countSubmitted;

    q('countAll').textContent = scopedItems().length;
    q('countPending').textContent = countPending;
    q('countUrgent').textContent = countUrgent;
    q('countSubmitted').textContent = countSubmitted;
    q('countOverdue').textContent = countOverdue;
    q('countNolimit').textContent = countNolimit;

    // Update Course Filter options
    const courseSelect = q('courseFilter');
    const selectedCourse = courseSelect.value;
    courseSelect.innerHTML = '<option value="">全部課程</option>';
    Array.from(courseSet).sort().forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      courseSelect.appendChild(opt);
    });
    if (courseSet.has(selectedCourse)) {
      courseSelect.value = selectedCourse;
    }
    updateSemesterNote();
  }

  // HOMEWORK_DETAIL_V1（fix41）：作業詳情彈窗。
  //
  // 資料全部來自 /admin/api/homework/detail（面板伺服器端用已保存的 iClass session
  // 抓取）：面板本身不碰 iClass 的 cookie，也不需要 iClass 的 CSRF token，
  // 因此不會影響面板登入狀態。找不到內容時優雅降級（顯示提示＋保留「在 iClass 開啟」）。
  function formatBytes(bytes) {
    const n = Number(bytes);
    if (!isFinite(n) || n <= 0) return '';
    const units = ['B', 'KB', 'MB', 'GB'];
    let value = n, idx = 0;
    while (value >= 1024 && idx < units.length - 1) { value /= 1024; idx += 1; }
    return (idx === 0 ? String(value) : value.toFixed(value >= 10 ? 0 : 1)) + ' ' + units[idx];
  }

  function iclassDeepLink(courseId, itemId, fromServer) {
    if (fromServer) return fromServer;
    if (!iclassBase || !courseId || !itemId) return '';
    return iclassBase + '/course/' + encodeURIComponent(courseId) + '/learning-activity/full-screen#' + encodeURIComponent(itemId);
  }

  // ── HOMEWORK_MOBILE_SHEET_V1（fix44）：浮層狀態管理 ─────────────────────────
  // ① `body.hw-overlay-open`：手機版用來鎖住背景，並收起共用底部導覽列
  //    （那條導覽列的 z-index 是 2147482500，彈窗壓不過它，只能收起來）。
  // ② 返回鍵／返回手勢：開啟浮層時推入一筆 history，讓 Android 返回鍵與 iOS 邊緣
  //    滑動「先關浮層」而不是直接離開作業頁。`overlayHistory` 是安全鎖——沒有我們
  //    推入的狀態時**絕不**呼叫 history.back()，不會把使用者帶離面板。
  const overlayStack = [];    // [{ name, close }]；索引 0 是最底層（作業詳情）
  let overlayHistory = 0;     // 推入且尚未被消費的歷史筆數
  let ignoreNextPop = false;  // 我們自己呼叫 history.back() 造成的那一次 popstate

  function syncOverlayBodyClass() {
    document.body.classList.toggle('hw-overlay-open', overlayStack.length > 0);
  }

  function openOverlayLayer(name, closeFn) {
    // 同一層重複開（例如連點兩下「內容」）只更新關閉函式，不重複推 history。
    for (let i = 0; i < overlayStack.length; i += 1) {
      if (overlayStack[i].name === name) { overlayStack[i].close = closeFn; return; }
    }
    overlayStack.push({ name: name, close: closeFn });
    syncOverlayBodyClass();
    try {
      history.pushState({ hwOverlay: overlayStack.length }, '', location.href);
      overlayHistory += 1;
    } catch (_) { /* 無法推入（少見）時功能照舊，只是返回鍵不關浮層 */ }
  }

  function closeOverlayLayer(useHistory) {
    const layer = overlayStack.pop();
    if (!layer) return;
    syncOverlayBodyClass();
    if (useHistory && overlayHistory > 0) {
      overlayHistory -= 1;
      ignoreNextPop = true;
      try { history.back(); } catch (_) { ignoreNextPop = false; }
    }
    layer.close();
  }

  // 返回鍵／手勢：只關最上層浮層，且不再呼叫 back（否則會一路退出面板）。
  window.addEventListener('popstate', function() {
    if (ignoreNextPop) { ignoreNextPop = false; return; }
    if (!overlayStack.length) return;
    if (overlayHistory > 0) overlayHistory -= 1;
    const layer = overlayStack.pop();
    syncOverlayBodyClass();
    if (layer) layer.close();
  });

  // Escape（桌機鍵盤）＝關掉最上層浮層，行為與返回鍵一致。
  document.addEventListener('keydown', function(ev) {
    if (ev.key !== 'Escape' || !overlayStack.length) return;
    closeOverlayLayer(true);
  });

  function hideHomeworkDetail() {
    const mask = q('hwDetailMask');
    if (mask) mask.hidden = true;
  }

  function hideHomeworkPreview() {
    const overlay = q('hwPreviewOverlay');
    if (!overlay) return;
    overlay.classList.remove('open');
    const body = q('hwPreviewBody');
    // 清空同時讓 <video>/<audio> 停止播放。
    if (body) body.textContent = '';
  }

  function ensureDetailModal() {
    let mask = q('hwDetailMask');
    if (mask) return mask;
    mask = document.createElement('div');
    mask.id = 'hwDetailMask';
    mask.className = 'hw-detail-mask';
    mask.hidden = true;
    mask.innerHTML = '' +
      '<div class="hw-detail-panel" role="dialog" aria-modal="true" aria-labelledby="hwDetailTitle">' +
        '<div class="hw-detail-head">' +
          '<h2 id="hwDetailTitle">作業內容</h2>' +
          '<button type="button" class="hw-detail-close" id="hwDetailClose" aria-label="關閉">✕</button>' +
        '</div>' +
        '<div class="hw-detail-sub" id="hwDetailSub"></div>' +
        '<div class="hw-detail-body" id="hwDetailBody"></div>' +
        '<div class="hw-detail-foot">' +
          '<a class="button secondary" id="hwDetailOpen" target="_blank" rel="noopener" hidden>在 iClass 開啟 ↗</a>' +
          '<button type="button" class="button" id="hwDetailOk">關閉</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(mask);
    // HOMEWORK_MOBILE_SHEET_V1（fix44）：關閉一律走浮層堆疊（同時處理 body class
    // 與 history），三個入口行為才會一致。
    const close = function() { closeOverlayLayer(true); };
    q('hwDetailClose').onclick = close;
    q('hwDetailOk').onclick = close;
    mask.addEventListener('click', function(ev) { if (ev.target === mask) close(); });
    return mask;
  }

  function showDetailError(message, url) {
    const body = q('hwDetailBody');
    if (!body) return;
    body.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'empty-box';
    const title = document.createElement('h3');
    title.textContent = '無法顯示作業內容';
    const text = document.createElement('p');
    text.className = 'err-msg';
    text.textContent = message || '讀取失敗';
    const hint = document.createElement('p');
    hint.className = 'err-hint';
    hint.textContent = url
      ? '可以改用下方「在 iClass 開啟」直接查看（需要一次學校登入）。'
      : '請稍後再試，或先確認帳號的學校連線狀態。';
    box.appendChild(title);
    box.appendChild(text);
    box.appendChild(hint);
    body.appendChild(box);
  }

  function setDetailOpenLink(url) {
    const link = q('hwDetailOpen');
    if (!link) return;
    if (url) {
      link.href = url;
      link.hidden = false;
    } else {
      link.hidden = true;
      link.removeAttribute('href');
    }
  }

  async function openHomeworkDetail(courseId, itemId) {
    ensureDetailModal();
    const mask = q('hwDetailMask');
    const title = q('hwDetailTitle');
    const sub = q('hwDetailSub');
    const body = q('hwDetailBody');
    const existing = allItems.find(it => String(it.id) === String(itemId)) || null;
    title.textContent = (existing && existing.title) || '作業內容';
    sub.textContent = existing
      ? [(existing.course_name || '未指定課程'), '截止：' + formatDateTime(existing.end_time)].join('　·　')
      : '';
    setDetailOpenLink(iclassDeepLink(courseId, itemId, ''));
    body.innerHTML = '<div class="hw-detail-loading"><div class="spinner"></div>正在從學校系統讀取內容…</div>';
    mask.hidden = false;
    openOverlayLayer('detail', hideHomeworkDetail);

    const params = new URLSearchParams();
    params.set('item_id', String(itemId));
    if (courseId) params.set('course_id', String(courseId));
    const targetAccount = loadedAccountId || currentAccount || (statusInfo && statusInfo.current_account_id) || '';
    // HOMEWORK_FILE_V1（fix43）：預覽／下載附件與繳交檔時帶同一個目標帳號。
    detailAccount = targetAccount || '';
    if (targetAccount) params.set('account_id', targetAccount);

    let data = null;
    try {
      data = await api('/admin/api/homework/detail?' + params.toString());
    } catch (err) {
      // 伺服器若連 panel session 都判定失效，api() 已經導向登入頁。
      showDetailError((err && err.message) || '讀取作業內容失敗', '');
      return;
    }
    // 伺服器也會回深連結（即使抓不到內容），優先採用。
    setDetailOpenLink(iclassDeepLink(courseId, itemId, data && data.iclass_url));
    if (!data || data.ok !== true) {
      showDetailError((data && data.error) || '上游沒有回傳這份作業的內容', (data && data.iclass_url) || '');
      return;
    }

    if (data.item && data.item.title) title.textContent = data.item.title;
    const metaParts = [];
    if (data.item && data.item.course_name) metaParts.push(data.item.course_name);
    if (data.item) metaParts.push('截止：' + formatDateTime(data.item.end_time));
    if (data.item && data.item.allow_late_submission) metaParts.push('允許遲交');
    sub.textContent = metaParts.join('　·　');

    body.innerHTML = '';
    // 1) 作業說明（老師編輯的 HTML）：有 DOMPurify 才當 HTML 渲染，否則純文字。
    const descTitle = document.createElement('h3');
    descTitle.textContent = '作業說明';
    body.appendChild(descTitle);
    const desc = document.createElement('div');
    desc.className = 'hw-detail-desc';
    const rawHtml = typeof data.description_html === 'string' ? data.description_html : '';
    const plain = typeof data.description_text === 'string' ? data.description_text : '';
    if (rawHtml && window.DOMPurify && DOMPurify.sanitize) {
      desc.innerHTML = DOMPurify.sanitize(rawHtml, { USE_PROFILES: { html: true } });
      // 圖片／影音在面板內無法取得（需要 iClass 的 session 與相對路徑），
      // 一律移除並改以提示引導使用者到 iClass 看，避免一片破圖。
      const removed = desc.querySelectorAll('img, iframe, video, audio');
      removed.forEach(function(node) { node.remove(); });
      if (data.has_images || removed.length) {
        const hint = document.createElement('p');
        hint.className = 'hw-detail-hint';
        hint.textContent = '此說明含圖片或影音，請用下方「在 iClass 開啟」查看完整內容。';
        body.appendChild(desc);
        body.appendChild(hint);
      } else {
        body.appendChild(desc);
      }
    } else if (plain || rawHtml) {
      desc.textContent = plain || rawHtml;
      desc.classList.add('plain');
      body.appendChild(desc);
      if (data.has_images) {
        const hint = document.createElement('p');
        hint.className = 'hw-detail-hint';
        hint.textContent = '此說明含圖片，請用下方「在 iClass 開啟」查看完整內容。';
        body.appendChild(hint);
      }
    } else {
      const empty = document.createElement('div');
      empty.className = 'attach-none';
      empty.textContent = '（這份作業沒有文字說明）';
      body.appendChild(empty);
    }

    // 2) 附件（由面板伺服器端代抓，瀏覽器只需下載）。
    const attachTitle = document.createElement('h3');
    attachTitle.textContent = '附件';
    body.appendChild(attachTitle);
    const list = document.createElement('ul');
    list.className = 'hw-detail-attach';
    const attachments = Array.isArray(data.attachments) ? data.attachments : [];
    if (!attachments.length) {
      const none = document.createElement('li');
      none.className = 'attach-none';
      none.textContent = '沒有附件';
      list.appendChild(none);
    } else {
      attachments.forEach(function(attachment) {
        const li = document.createElement('li');
        const nameSpan = document.createElement('span');
        nameSpan.className = 'attach-name';
        nameSpan.textContent = attachment.name || ('附件 ' + (attachment.upload_id || ''));
        li.appendChild(nameSpan);
        const sizeText = formatBytes(attachment.size);
        if (sizeText) {
          const sizeSpan = document.createElement('span');
          sizeSpan.className = 'attach-size';
          sizeSpan.textContent = sizeText;
          li.appendChild(sizeSpan);
        }
        if (attachment.downloadable && attachment.upload_id != null) {
          // HOMEWORK_FILE_V1（fix43）：能預覽的格式多一顆「預覽」（不支援的格式
          // 只給下載，避免按了才知道不行）。
          appendFileActions(li, attachment.upload_id, attachment.name);
        } else {
          const note = document.createElement('span');
          note.className = 'attach-size';
          note.textContent = '（請到 iClass 下載）';
          li.appendChild(note);
        }
        list.appendChild(li);
      });
    }
    body.appendChild(list);

    // 3) 繳交（HOMEWORK_SUBMIT_V1）：目前狀態＋挑檔＋文字＋二次確認。
    //    目標帳號沿用彈窗查詳情時用的那一個（管理員代其他帳號時才會有值）。
    mountSubmitSection(
      body,
      courseId,
      itemId,
      targetAccount,
      (data.item && data.item.title) || (existing && existing.title) || '',
      data.submit_by_group === true
    );
  }

  // ── HOMEWORK_SUBMIT_V1（fix42）：面板內直接繳交作業 ───────────────────────────
  // 檔案以 multipart 送到本面板，再由伺服器端用「已保存的 iClass session」轉送：
  // 建立 upload 佔位 → 上傳位元組 → 建立繳交（`src/api/todos.rs` 的
  // HOMEWORK_SUBMIT_V1 有完整實測紀錄）。前端只負責挑檔、二次確認、進度與結果顯示，
  // 完全不接觸 iClass 的 cookie，也不需要另外登入。
  let submitLimits = {
    max_files: 10,
    max_file_bytes: 50 * 1024 * 1024,
    max_total_bytes: 100 * 1024 * 1024,
    max_comment_chars: 2000
  };
  let pickedFiles = [];
  let submitBusy = false;
  const submitCtx = { itemId: '', courseId: '', account: '', title: '', submitted: false };

  function formatSubmitLimits() {
    const parts = [];
    parts.push('一次最多 ' + (submitLimits.max_files || 10) + ' 個檔案');
    if (submitLimits.max_file_bytes) parts.push('單檔上限 ' + formatBytes(submitLimits.max_file_bytes));
    if (submitLimits.max_total_bytes) parts.push('單次合計上限 ' + formatBytes(submitLimits.max_total_bytes));
    if (submitLimits.max_comment_chars) parts.push('文字說明 ' + submitLimits.max_comment_chars + ' 字以內');
    return '上限：' + parts.join('、') + '。';
  }

  function renderPickedFiles() {
    const list = q('hwSubmitPicked');
    if (!list) return;
    list.textContent = '';
    pickedFiles.forEach(function(file, index) {
      const li = document.createElement('li');
      const name = document.createElement('span');
      name.className = 'pick-name';
      name.textContent = file.name;
      const size = document.createElement('span');
      size.className = 'pick-size';
      size.textContent = formatBytes(file.size);
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'pick-remove';
      remove.textContent = '✕';
      remove.setAttribute('aria-label', '移除 ' + file.name);
      remove.addEventListener('click', function() {
        pickedFiles.splice(index, 1);
        renderPickedFiles();
      });
      li.appendChild(name);
      li.appendChild(size);
      li.appendChild(remove);
      list.appendChild(li);
    });
  }

  function addPickedFiles(fileList) {
    if (!fileList || !fileList.length) return;
    for (let i = 0; i < fileList.length; i += 1) {
      const file = fileList[i];
      const duplicate = pickedFiles.some(function(existing) {
        return existing.name === file.name && existing.size === file.size;
      });
      if (!duplicate) pickedFiles.push(file);
    }
    renderPickedFiles();
  }

  function clearPickedFiles() {
    pickedFiles = [];
    renderPickedFiles();
  }

  function renderSubmitStatus(submission) {
    const box = q('hwSubmitStatus');
    if (!box) return;
    const info = submission || {};
    const submitted = info.submitted === true;
    submitCtx.submitted = submitted;
    box.classList.remove('submitted', 'pending');
    box.classList.add(submitted ? 'submitted' : 'pending');
    box.textContent = '';

    const head = document.createElement('div');
    if (submitted) {
      const parts = ['✅ 已繳交'];
      if (info.submitted_at) parts.push(formatDateTime(info.submitted_at));
      if (info.is_resubmitted) parts.push('重新繳交的版本');
      head.textContent = parts.join('　·　');
    } else if (info.is_draft) {
      head.textContent = '📝 目前只有草稿，尚未正式繳交';
    } else {
      head.textContent = '⏳ 尚未繳交';
    }
    box.appendChild(head);

    const uploads = Array.isArray(info.uploads) ? info.uploads : [];
    if (uploads.length) {
      const list = document.createElement('ul');
      list.className = 'hw-submit-files';
      uploads.forEach(function(item) {
        const li = document.createElement('li');
        const nameSpan = document.createElement('span');
        nameSpan.className = 'file-name';
        nameSpan.textContent = item.name || ('檔案 ' + (item.upload_id || ''));
        li.appendChild(nameSpan);
        const sizeText = formatBytes(item.size);
        if (sizeText) {
          const sizeSpan = document.createElement('span');
          sizeSpan.className = 'file-size';
          sizeSpan.textContent = sizeText;
          li.appendChild(sizeSpan);
        }
        // HOMEWORK_FILE_V1（fix43）：自己交出去的檔案也能直接預覽／下載，
        // 不必回到 iClass 才知道當初交了什麼。
        appendFileActions(li, item.upload_id, item.name);
        list.appendChild(li);
      });
      box.appendChild(list);
    }
    if (info.comment) {
      const note = document.createElement('div');
      note.className = 'hw-submit-comment-preview';
      note.textContent = '說明：' + info.comment + (info.comment_truncated ? '…' : '');
      box.appendChild(note);
    }
  }

  async function loadSubmissionState(courseId, itemId, account) {
    const box = q('hwSubmitStatus');
    if (!box) return;
    const params = new URLSearchParams();
    params.set('item_id', String(itemId));
    if (account) params.set('account_id', account);
    try {
      const data = await api('/admin/api/homework/submission?' + params.toString());
      if (!data || data.ok !== true) {
        box.textContent = (data && data.error) || '讀取繳交狀態失敗；仍可直接按「繳交作業」嘗試。';
        box.classList.add('pending');
        return;
      }
      if (data.limits) submitLimits = Object.assign({}, submitLimits, data.limits);
      renderSubmitStatus(data.submission);
      const limits = q('hwSubmitLimits');
      if (limits) limits.textContent = formatSubmitLimits();
    } catch (err) {
      box.textContent = (err && err.message) || '讀取繳交狀態失敗';
      box.classList.add('pending');
    }
  }

  // 用 XHR 而非 fetch：需要上傳進度。401/403 比照 api() 先換發 session 再重試一次。
  async function postHomeworkSubmit(url, formData, onProgress) {
    const send = function() {
      return new Promise(function(resolve, reject) {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', url, true);
        xhr.withCredentials = true;
        if (xhr.upload && onProgress) {
          xhr.upload.onprogress = function(ev) {
            if (ev.lengthComputable && ev.total > 0) {
              onProgress(Math.round((ev.loaded / ev.total) * 100));
            }
          };
        }
        xhr.onload = function() {
          let data = null;
          try { data = JSON.parse(xhr.responseText || '{}'); } catch (e) { data = null; }
          resolve({ status: xhr.status, data: data });
        };
        xhr.onerror = function() { reject(new Error('網路連線失敗，請再試一次')); };
        xhr.send(formData);
      });
    };

    let result = await send();
    if (result.status === 401 || result.status === 403) {
      const refreshed = await _tryRefresh();
      if (!refreshed) {
        location.replace('/admin');
        throw new Error('請先登入');
      }
      result = await send();
    }
    if (result.status < 200 || result.status >= 300) {
      throw new Error((result.data && result.data.error) || ('HTTP ' + result.status));
    }
    return result.data || {};
  }

  async function doSubmitHomework() {
    if (submitBusy) return;
    const button = q('hwSubmitBtn');
    const commentEl = q('hwSubmitComment');
    const progress = q('hwSubmitProgress');
    const comment = commentEl ? commentEl.value.trim() : '';
    if (!submitCtx.itemId) { showToast('缺少作業資訊，請關閉後重新開啟', 'warn'); return; }
    if (!pickedFiles.length && !comment) {
      showToast('請至少選擇一個檔案，或填寫要繳交的文字／連結', 'warn');
      return;
    }
    const maxFiles = submitLimits.max_files || 10;
    if (pickedFiles.length > maxFiles) { showToast('一次最多 ' + maxFiles + ' 個檔案', 'warn'); return; }
    let total = 0;
    for (let i = 0; i < pickedFiles.length; i += 1) {
      const file = pickedFiles[i];
      if (submitLimits.max_file_bytes && file.size > submitLimits.max_file_bytes) {
        showToast('「' + file.name + '」超過單檔上限 ' + formatBytes(submitLimits.max_file_bytes), 'warn');
        return;
      }
      total += file.size;
    }
    if (submitLimits.max_total_bytes && total > submitLimits.max_total_bytes) {
      showToast('這次共 ' + formatBytes(total) + '，超過單次上限 ' + formatBytes(submitLimits.max_total_bytes), 'warn');
      return;
    }
    if (submitLimits.max_comment_chars && comment.length > submitLimits.max_comment_chars) {
      showToast('文字說明超過 ' + submitLimits.max_comment_chars + ' 字', 'warn');
      return;
    }

    const names = pickedFiles.map(function(file) { return file.name; });
    const preview = [
      '作業：' + (submitCtx.title || submitCtx.itemId),
      '帳號：' + (submitCtx.account || '目前帳號'),
      pickedFiles.length ? ('檔案（' + pickedFiles.length + ' 個）：' + names.join('、')) : '檔案：無（只送文字）',
      comment ? ('文字說明：' + (comment.length > 60 ? comment.slice(0, 60) + '…' : comment)) : '文字說明：無'
    ];
    // 二次確認：第一次確認內容，第二次（已繳交過時）確認要重新繳交。
    if (!window.confirm('確定要繳交這份作業嗎？送出後會立刻寫入 iClass。\n\n' + preview.join('\n'))) return;
    if (submitCtx.submitted
      && !window.confirm('注意：這份作業已經繳交過。\n重新繳交會在 iClass 建立新版本，老師會看到新的繳交紀錄。\n\n確定要重新繳交嗎？')) {
      return;
    }

    const formData = new FormData();
    formData.append('item_id', String(submitCtx.itemId));
    if (submitCtx.courseId) formData.append('course_id', String(submitCtx.courseId));
    if (comment) formData.append('comment', comment);
    pickedFiles.forEach(function(file) { formData.append('file', file, file.name); });

    const params = new URLSearchParams();
    if (submitCtx.account) params.set('account_id', submitCtx.account);

    submitBusy = true;
    if (button) button.disabled = true;
    if (progress) progress.textContent = '上傳中… 0%';
    try {
      const data = await postHomeworkSubmit(
        '/admin/api/homework/submit?' + params.toString(),
        formData,
        function(percent) {
          if (!progress) return;
          progress.textContent = percent < 100 ? ('上傳中… ' + percent + '%') : '學校系統處理中…';
        }
      );
      if (!data || data.ok !== true) throw new Error((data && data.error) || '繳交失敗');
      if (progress) progress.textContent = '✅ 已送出';
      showToast(data.is_draft ? '已儲存草稿' : '繳交完成，iClass 已收到', 'ok');
      clearPickedFiles();
      if (commentEl) commentEl.value = '';
      const item = allItems.find(function(it) { return String(it.id) === String(submitCtx.itemId); });
      if (item) {
        item.is_submitted = true;
        if (!data.is_draft) item.submission_status = 'submitted';
      }
      renderSubmitStatus(data.submission || { submitted: true });
      renderList();
      loadData(true);
    } catch (err) {
      if (progress) progress.textContent = '';
      showToast((err && err.message) || '繳交失敗', 'err');
    } finally {
      submitBusy = false;
      if (button) button.disabled = false;
    }
  }

  function mountSubmitSection(body, courseId, itemId, account, itemTitle, isGroupWork) {
    submitCtx.itemId = itemId || '';
    submitCtx.courseId = courseId || '';
    submitCtx.account = account || '';
    submitCtx.title = itemTitle || '';
    submitCtx.submitted = false;
    pickedFiles = [];

    const wrap = document.createElement('div');
    wrap.className = 'hw-submit';

    const title = document.createElement('h3');
    title.textContent = '繳交作業';
    wrap.appendChild(title);

    if (isGroupWork === true) {
      // 小組作業的繳交走另一條上游端點，面板不代繳；這裡只說明，不給按鈕。
      const notice = document.createElement('div');
      notice.className = 'hw-submit-status pending';
      notice.textContent = '這是小組作業：小組繳交走 iClass 的另一條端點，面板目前只代繳個人作業。'
        + '請在小組頁面或 iClass 上傳。';
      wrap.appendChild(notice);
      body.appendChild(wrap);
      return;
    }

    const status = document.createElement('div');
    status.id = 'hwSubmitStatus';
    status.className = 'hw-submit-status';
    status.textContent = '正在讀取目前的繳交狀態…';
    wrap.appendChild(status);

    const fileField = document.createElement('div');
    fileField.className = 'hw-submit-field';
    const fileLabel = document.createElement('label');
    fileLabel.setAttribute('for', 'hwSubmitFileInput');
    fileLabel.textContent = '選擇檔案（可多選；選擇後可再追加）';
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.id = 'hwSubmitFileInput';
    fileInput.multiple = true;
    fileInput.addEventListener('change', function() {
      addPickedFiles(fileInput.files);
      fileInput.value = '';
    });
    fileField.appendChild(fileLabel);
    fileField.appendChild(fileInput);
    const picked = document.createElement('ul');
    picked.id = 'hwSubmitPicked';
    picked.className = 'hw-submit-picked';
    fileField.appendChild(picked);
    wrap.appendChild(fileField);

    const commentField = document.createElement('div');
    commentField.className = 'hw-submit-field';
    const commentLabel = document.createElement('label');
    commentLabel.setAttribute('for', 'hwSubmitComment');
    commentLabel.textContent = '文字說明／連結（可留空）';
    const comment = document.createElement('textarea');
    comment.id = 'hwSubmitComment';
    comment.placeholder = '要對老師說的話、報告連結或雲端硬碟網址…';
    commentField.appendChild(commentLabel);
    commentField.appendChild(comment);
    wrap.appendChild(commentField);

    const actions = document.createElement('div');
    actions.className = 'hw-submit-actions';
    const submit = document.createElement('button');
    submit.type = 'button';
    submit.className = 'button';
    submit.id = 'hwSubmitBtn';
    submit.textContent = '繳交作業';
    submit.addEventListener('click', doSubmitHomework);
    const progress = document.createElement('span');
    progress.id = 'hwSubmitProgress';
    progress.className = 'hw-submit-progress';
    actions.appendChild(submit);
    actions.appendChild(progress);
    wrap.appendChild(actions);

    const limits = document.createElement('p');
    limits.className = 'hw-submit-note';
    limits.id = 'hwSubmitLimits';
    limits.textContent = formatSubmitLimits();
    wrap.appendChild(limits);

    const note = document.createElement('p');
    note.className = 'hw-submit-note';
    note.textContent = '檔案由面板伺服器端代送到 iClass（用已保存的登入 session），不必再登入一次。'
      + '若作業已截止或老師關閉繳交，學校系統會回報原因，面板會照實顯示。';
    wrap.appendChild(note);

    body.appendChild(wrap);
    renderPickedFiles();
    loadSubmissionState(courseId, itemId, account);
  }

  // ── HOMEWORK_FILE_V1（fix43）：附件／繳交檔的預覽與下載 ───────────────────────
  // 檔案的來源是 iClass 的 upload id，一律由面板伺服器端代抓（瀏覽器不接觸 iClass
  // 的 cookie）。同一條端點 `/admin/api/homework/file`：
  //   disposition=inline    → 面板內預覽（正確的 Content-Type ＋ Range，可分段讀）
  //   disposition 省略      → 下載（attachment）
  // 副檔名清單必須與 `files.rs` 的 PREVIEWABLE_EXTS 一致（tools/check_src.py 會比對）。
  const HW_IMAGE_EXTS = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'avif', 'ico', 'svg'];
  const HW_PDF_EXTS = ['pdf'];
  const HW_VIDEO_EXTS = ['mp4', 'webm', 'mov', 'm4v'];
  const HW_AUDIO_EXTS = ['mp3', 'wav', 'ogg', 'm4a', 'flac'];
  const HW_TEXT_EXTS = ['txt', 'text', 'md', 'markdown', 'log', 'csv', 'tsv', 'json', 'xml', 'yaml', 'yml', 'ini', 'conf', 'cfg', 'srt', 'vtt', 'toml', 'sql', 'sh', 'rs', 'js', 'ts', 'jsx', 'tsx', 'css', 'py', 'java', 'c', 'h', 'cpp', 'hpp', 'go', 'php', 'html', 'htm', 'url'];
  const HW_OFFICE_EXTS = ['docx', 'pptx', 'xlsx', 'odt', 'ods', 'odp', 'rtf'];
  const HW_LEGACY_OFFICE_EXTS = ['doc', 'ppt', 'xls'];

  // 目前彈窗對應的目標帳號（管理員代其他帳號時才有值）。
  let detailAccount = '';

  function hwExtOf(name) {
    const parts = String(name || '').toLowerCase().split('.');
    return parts.length > 1 ? parts.pop() : '';
  }

  function hwInList(list, value) {
    return list.indexOf(value) >= 0;
  }

  function hwIsPreviewable(name) {
    const ext = hwExtOf(name);
    if (!ext) return false;
    return hwInList(HW_IMAGE_EXTS, ext)
      || hwInList(HW_PDF_EXTS, ext)
      || hwInList(HW_VIDEO_EXTS, ext)
      || hwInList(HW_AUDIO_EXTS, ext)
      || hwInList(HW_TEXT_EXTS, ext)
      || hwInList(HW_OFFICE_EXTS, ext)
      || hwInList(HW_LEGACY_OFFICE_EXTS, ext);
  }

  function hwFileUrl(uploadId, name, disposition) {
    const params = new URLSearchParams();
    params.set('upload_id', String(uploadId));
    if (name) params.set('name', name);
    if (detailAccount) params.set('account_id', detailAccount);
    if (disposition) params.set('disposition', disposition);
    return '/admin/api/homework/file?' + params.toString();
  }

  /// 在檔案列尾端加上「預覽」「下載」。
  function appendFileActions(parent, uploadId, name) {
    if (uploadId === null || uploadId === undefined || uploadId === '') return;
    if (hwIsPreviewable(name)) {
      const preview = document.createElement('button');
      preview.type = 'button';
      preview.className = 'button secondary hw-file-preview';
      preview.textContent = '預覽';
      preview.addEventListener('click', function() { openHomeworkPreview(uploadId, name || ''); });
      parent.appendChild(preview);
    }
    const link = document.createElement('a');
    link.className = 'button secondary hw-file-download';
    link.textContent = '下載';
    link.href = hwFileUrl(uploadId, name || '', '');
    parent.appendChild(link);
  }

  function ensureHomeworkPreview() {
    let overlay = q('hwPreviewOverlay');
    if (overlay) return overlay;
    overlay = document.createElement('div');
    overlay.id = 'hwPreviewOverlay';
    overlay.className = 'hw-preview';
    const panel = document.createElement('div');
    panel.className = 'hw-preview-panel';
    const head = document.createElement('div');
    head.className = 'hw-preview-head';
    const title = document.createElement('div');
    title.className = 'hw-preview-title';
    title.id = 'hwPreviewTitle';
    const actions = document.createElement('div');
    actions.className = 'hw-preview-actions';
    const download = document.createElement('a');
    download.className = 'button secondary';
    download.id = 'hwPreviewDownload';
    download.textContent = '下載';
    const close = document.createElement('button');
    close.type = 'button';
    close.className = 'button secondary';
    close.textContent = '關閉';
    close.addEventListener('click', closeHomeworkPreview);
    actions.appendChild(download);
    actions.appendChild(close);
    head.appendChild(title);
    head.appendChild(actions);
    const body = document.createElement('div');
    body.className = 'hw-preview-body';
    body.id = 'hwPreviewBody';
    panel.appendChild(head);
    panel.appendChild(body);
    overlay.appendChild(panel);
    overlay.addEventListener('click', function(ev) {
      if (ev.target === overlay) closeHomeworkPreview();
    });
    // Escape 由上面的全域處理器統一關「最上層浮層」（避免一次 Escape 連關兩層）。
    document.body.appendChild(overlay);
    return overlay;
  }

  // HOMEWORK_MOBILE_SHEET_V1（fix44）：關閉預覽＝關掉浮層堆疊最上層；
  // 實際的收尾（移除 .open、清空內容讓影音停止播放）在 hideHomeworkPreview()。
  function closeHomeworkPreview() {
    closeOverlayLayer(true);
  }

  function hwPreviewNote(body, text) {
    const note = document.createElement('div');
    note.className = 'hw-preview-note';
    note.textContent = text;
    body.textContent = '';
    body.appendChild(note);
    return note;
  }

  async function openHomeworkPreview(uploadId, name) {
    const ext = hwExtOf(name);
    const overlay = ensureHomeworkPreview();
    const body = q('hwPreviewBody');
    const title = q('hwPreviewTitle');
    const download = q('hwPreviewDownload');
    if (!body) return;
    if (title) title.textContent = name || ('檔案 ' + uploadId);
    if (download) download.href = hwFileUrl(uploadId, name, '');
    body.textContent = '';
    overlay.classList.add('open');
    openOverlayLayer('preview', hideHomeworkPreview);

    const url = hwFileUrl(uploadId, name, 'inline');
    if (hwInList(HW_IMAGE_EXTS, ext)) {
      const img = document.createElement('img');
      img.className = 'hw-preview-img';
      img.alt = name || '';
      img.src = url;
      body.appendChild(img);
      return;
    }
    if (hwInList(HW_VIDEO_EXTS, ext)) {
      const video = document.createElement('video');
      video.className = 'hw-preview-media';
      video.controls = true;
      video.src = url;
      body.appendChild(video);
      return;
    }
    if (hwInList(HW_AUDIO_EXTS, ext)) {
      const audio = document.createElement('audio');
      audio.className = 'hw-preview-audio';
      audio.controls = true;
      audio.src = url;
      body.appendChild(audio);
      return;
    }
    if (hwInList(HW_PDF_EXTS, ext)) {
      await hwPreviewPdf(url, body);
      return;
    }
    if (hwInList(HW_TEXT_EXTS, ext)) {
      await hwPreviewText(url, ext, body);
      return;
    }
    if (hwInList(HW_OFFICE_EXTS, ext)) {
      await hwPreviewOffice(url, ext, body);
      return;
    }
    if (hwInList(HW_LEGACY_OFFICE_EXTS, ext)) {
      hwPreviewNote(body, '舊版 Office 格式（.' + ext + '）沒有純前端的解析器，請按右上角「下載」後用本機程式開啟。');
      return;
    }
    hwPreviewNote(body, '這種檔案類型（' + (ext ? '.' + ext : '無副檔名') + '）無法在面板內預覽，請按右上角「下載」取得檔案。');
  }

  async function hwPreviewPdf(url, body) {
    // PDF.js 與檔案頁共用同一支按需載入器（作業頁也注入了）。
    if (window.__tronEnsureFileLib) {
      try { await window.__tronEnsureFileLib('pdf'); } catch (err) { /* 沒引擎就走 iframe */ }
    }
    const fallbackFrame = function() {
      hwPreviewNote(body, '改用瀏覽器內建 PDF 檢視器…');
      const frame = document.createElement('iframe');
      frame.className = 'hw-preview-frame';
      frame.src = url + '#toolbar=1';
      body.textContent = '';
      body.appendChild(frame);
    };
    if (!window.pdfjsLib) { fallbackFrame(); return; }
    hwPreviewNote(body, '正在載入 PDF…');
    let data = null;
    try {
      const res = await fetch(url, { credentials: 'same-origin', cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      data = new Uint8Array(await res.arrayBuffer());
    } catch (err) {
      hwPreviewNote(body, 'PDF 讀取失敗（' + ((err && err.message) || '未知錯誤') + '），請改用「下載」。');
      return;
    }
    try {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = '/admin/static/js/pdf.worker.min.js?v=pdfjs1';
      const doc = await window.pdfjsLib.getDocument({ data: data, isEvalSupported: false }).promise;
      body.textContent = '';
      const wrap = document.createElement('div');
      wrap.className = 'tron-pdf';
      body.appendChild(wrap);
      const targetWidth = Math.max(320, (body.clientWidth || 800) - 28);
      for (let p = 1; p <= doc.numPages; p += 1) {
        const page = await doc.getPage(p);
        const base = page.getViewport({ scale: 1 });
        const viewport = page.getViewport({ scale: targetWidth / base.width });
        const canvas = document.createElement('canvas');
        const ratio = window.devicePixelRatio || 1;
        canvas.width = Math.floor(viewport.width * ratio);
        canvas.height = Math.floor(viewport.height * ratio);
        canvas.style.width = Math.floor(viewport.width) + 'px';
        canvas.style.height = 'auto';
        wrap.appendChild(canvas);
        await page.render({
          canvasContext: canvas.getContext('2d'),
          viewport: viewport,
          transform: ratio !== 1 ? [ratio, 0, 0, ratio, 0, 0] : null
        }).promise;
      }
    } catch (err) {
      fallbackFrame();
    }
  }

  async function hwPreviewText(url, ext, body) {
    hwPreviewNote(body, '正在載入…');
    let text = '';
    try {
      const res = await fetch(url, { credentials: 'same-origin', cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      text = await res.text();
    } catch (err) {
      hwPreviewNote(body, '讀取失敗（' + ((err && err.message) || '未知錯誤') + '），請改用「下載」。');
      return;
    }
    // URL_SHORTCUT_V1：.url 是 Internet Shortcut（文字檔），讀出 URL= 後直接跳轉。
    if (ext === 'url') {
      const match = text.match(/^\s*URL\s*=\s*(\S+)/im);
      if (match) {
        window.open(match[1], '_blank', 'noopener');
        hwPreviewNote(body, '已在新的分頁開啟連結：' + match[1]);
      } else {
        hwPreviewNote(body, '這個 .url 檔裡找不到 URL= 欄位。');
      }
      return;
    }
    body.textContent = '';
    const pre = document.createElement('pre');
    pre.className = 'hw-preview-text';
    // 內容可能很大：只顯示前 200000 個字元，其餘提示下載。
    pre.textContent = text.length > 200000 ? text.slice(0, 200000) + '\n…（內容過長，僅顯示前 20 萬字元，完整內容請下載）' : text;
    body.appendChild(pre);
  }

  // HOMEWORK_FILE_DIAG_V1（fix47）：把「內容與副檔名不符」變成可自行判斷的資訊。
  // 開頭 16 bytes 的 hex ＋ 可列印字元，足以分辨 iClass 登入頁（`<`）、API 錯誤
  // （`{`）、舊版 OLE2（D0 CF 11 E0）或真正的損壞檔。
  function hwHeadHexAscii(bytes) {
    const part = bytes.slice(0, 16);
    const hex = [];
    let ascii = '';
    for (let i = 0; i < part.length; i += 1) {
      hex.push(('0' + part[i].toString(16).toUpperCase()).slice(-2));
      ascii += part[i] >= 0x20 && part[i] < 0x7f ? String.fromCharCode(part[i]) : '.';
    }
    return hex.join(' ') + '  |' + ascii + '|';
  }

  function hwPreviewDiag(body, lines) {
    const box = document.createElement('div');
    box.className = 'hw-preview-diag';
    box.textContent = lines.join('\n');
    body.appendChild(box);
  }

  function hwPreviewSnippet(body, text) {
    const pre = document.createElement('pre');
    pre.className = 'hw-preview-snippet';
    pre.textContent = text;
    body.appendChild(pre);
  }

  // 伺服器回非 2xx 時，把 JSON 錯誤訊息（面板自己的說明）顯示出來，
  // 而不是只顯示「HTTP 502」——fix47 起伺服器會明確說明上游回了什麼。
  async function hwPreviewServerError(body, res) {
    let detail = '';
    try {
      const text = await res.text();
      try {
        const parsed = JSON.parse(text);
        detail = (parsed && (parsed.error || parsed.message)) || text;
      } catch (err) {
        detail = text;
      }
    } catch (err) { /* 讀不到 body 就算了 */ }
    detail = String(detail || '').trim().slice(0, 400);
    if (res.status === 401) {
      hwPreviewNote(body, '面板登入狀態已逾期，請重新登入後再試。');
      return;
    }
    hwPreviewNote(body, '取得檔案失敗（HTTP ' + res.status + '）' +
      (detail ? '：' + detail : '') + '\n\n可先按右上角「下載」試試；若持續失敗，請把這段訊息回報。');
  }

  async function hwPreviewOffice(url, ext, body) {
    hwPreviewNote(body, '正在載入 Office 檢視引擎…');
    if (window.__tronEnsureFileLib) {
      try { await window.__tronEnsureFileLib('office'); } catch (err) { /* 下面會提示 */ }
    }
    if (!window.TronOfficeView || !window.TronOfficeView.preview) {
      hwPreviewNote(body, '這個頁面沒有載入 Office 檢視引擎，請按右上角「下載」後用本機程式開啟。');
      return;
    }
    let bytes = null;
    let res = null;
    try {
      res = await fetch(url, { credentials: 'same-origin', cache: 'no-store' });
      if (!res.ok) {
        await hwPreviewServerError(body, res);
        return;
      }
      bytes = new Uint8Array(await res.arrayBuffer());
    } catch (err) {
      hwPreviewNote(body, '讀取失敗（' + ((err && err.message) || '未知錯誤') + '），請改用「下載」。');
      return;
    }

    // CONTENT_SNIFF_BEFORE_RENDER_V1（fix47）：先看內容再說。
    // 1) 內容其實是 PDF → 直接用面板的 PDF 檢視器顯示（副檔名錯不代表內容不能用）。
    // 2) HTML／JSON → 那是 iClass 的登入頁或 API 錯誤，把內容與診斷資訊顯示出來，
    //    使用者（與回報）才看得出真正原因，而不是只看到「無法辨識」。
    const kind = window.TronOfficeView.sniff ? window.TronOfficeView.sniff(bytes) : '';
    if (kind === 'pdf') {
      hwPreviewNote(body, '這個 .' + ext + ' 檔案的內容其實是 PDF，改用 PDF 檢視器顯示…');
      await hwPreviewPdf(url, body);
      return;
    }
    if (kind === 'html' || kind === 'json') {
      const contentType = (res.headers.get('content-type') || '').trim();
      hwPreviewNote(body, kind === 'html'
        ? '伺服器回傳的是 HTML 頁面（多半是 iClass 的登入頁或錯誤頁），不是這個檔案。'
        : '伺服器回傳的是 JSON 內容（多半是 API 錯誤訊息），不是這個檔案。');
      const text = new TextDecoder('utf-8').decode(bytes);
      hwPreviewSnippet(body, text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 600) || text.slice(0, 600));
      hwPreviewDiag(body, [
        'HTTP ' + res.status + '　Content-Type: ' + (contentType || '(未提供)'),
        '長度：' + bytes.length + ' bytes',
        '開頭位元組：' + hwHeadHexAscii(bytes)
      ]);
      return;
    }
    if (kind === 'ole2') {
      hwPreviewNote(body, '這個檔案是舊版二進位 Office 格式（.doc/.xls/.ppt 時代的結構），' +
        '面板沒有可解析它的引擎。請按右上角「下載」後用 Word／Excel／PowerPoint 開啟。');
      hwPreviewDiag(body, [
        'HTTP ' + res.status + '　Content-Type: ' + ((res.headers.get('content-type') || '').trim() || '(未提供)'),
        '長度：' + bytes.length + ' bytes',
        '開頭位元組：' + hwHeadHexAscii(bytes)
      ]);
      return;
    }

    try {
      const html = await window.TronOfficeView.preview(bytes, ext);
      body.textContent = '';
      const mount = document.createElement('div');
      mount.className = 'tron-office';
      body.appendChild(mount);
      // mount() 內部會走 Trusted Types 的 DOMPurify 政策（與檔案頁同一條路徑）。
      if (window.TronOfficeView.mount) window.TronOfficeView.mount(mount, html);
      else mount.textContent = '此格式無法在面板內預覽。';
    } catch (err) {
      hwPreviewNote(body, '預覽失敗（' + ((err && err.message) || '未知錯誤') + '），請改用「下載」。');
    }
  }

  function renderList() {
    const container = q('homeworkContainer');
    const searchVal = q('searchInput').value.trim().toLowerCase();
    const courseVal = q('courseFilter').value;
    const sortVal = q('sortFilter').value;

    let filtered = scopedItems().filter(item => {
      const state = getItemState(item);

      if (currentFilter === 'pending' && (state === 'submitted' || state === 'overdue' || state === 'nolimit')) return false;
      if (currentFilter === 'urgent' && state !== 'urgent') return false;
      if (currentFilter === 'submitted' && state !== 'submitted') return false;
      if (currentFilter === 'overdue' && state !== 'overdue') return false;
      if (currentFilter === 'nolimit' && state !== 'nolimit') return false;

      if (courseVal && item.course_name !== courseVal) return false;

      if (searchVal) {
        const text = `${item.title || ''} ${item.course_name || ''} ${item.department_name || ''}`.toLowerCase();
        if (!text.includes(searchVal)) return false;
      }
      return true;
    });

    // Sorting
    filtered.sort((a, b) => {
      if (sortVal === 'course') {
        return (a.course_name || '').localeCompare(b.course_name || '');
      }
      const aTime = a.end_time ? new Date(a.end_time).getTime() : (sortVal === 'deadline_asc' ? 9999999999999 : 0);
      const bTime = b.end_time ? new Date(b.end_time).getTime() : (sortVal === 'deadline_asc' ? 9999999999999 : 0);
      if (sortVal === 'deadline_desc') {
        return bTime - aTime;
      }
      return aTime - bTime;
    });

    if (filtered.length === 0) {
      if (currentFilter === 'pending' && scopedItems().length > 0) {
        container.innerHTML = `
          <div class="empty-box">
            <h3>🎉 太棒了！目前沒有待繳交的作業</h3>
            <p>所有進行中的待辦事項與作業皆已完成。</p>
            <button class="button" onclick="document.querySelector('[data-filter=all]').click()">查看全部作業紀錄</button>
          </div>
        `;
      } else if (currentFilter === 'nolimit') {
        container.innerHTML = `
          <div class="empty-box">
            <h3>🔓 目前沒有無期限的作業／測驗</h3>
            <p>這裡顯示無截止時間、長期開放繳交的作業或測驗。</p>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="empty-box">
            <h3>沒有符合條件的作業</h3>
            <p>請嘗試變更上方篩選條件或搜尋關鍵字。</p>
          </div>
        `;
      }
      return;
    }

    container.innerHTML = filtered.map(item => {
      const state = getItemState(item);
      const rem = getRemainingMs(item.end_time);
      const userDone = userCompleted.has(String(item.id));
      const submitted = item.is_submitted || ['submitted', 'graded', 'group_submitted', 'completed', 'pass', 'passed'].includes((item.submission_status || '').toLowerCase());
      const countdown = (submitted || userDone)
        ? { text: userDone ? '✅ 已完成（手動）' : '✅ 已繳交', badgeClass: 'submitted' }
        : formatCountdown(rem);

      const typeLabel = {
        homework: '📝 作業',
        quiz: '⏱️ 測驗',
        exam: '🧪 測驗/考試',
        discussion: '💬 討論',
        questionnaire: '📊 問卷',
        // HOMEWORK_NOLIMIT_V1: 無截止時間的課程素材各自對應正確圖示，
        // 才不會被誤顯示成「📝 作業」。
        material: '📄 教材',
        web_link: '🔗 連結',
        link: '🔗 連結',
        page: '📃 頁面',
        online_video: '🎬 影片',
        video: '🎬 影片',
        forum: '💬 討論',
        file: '📎 檔案'
      }[item.item_type] || '📝 作業';

      // SCORE_DISPLAY_V1：狀態膠囊只顯示繳交狀態（分數移到上方「截止期限」旁邊，
      // 不再與遲交設定並排顯示；有分數的項目必然已繳交，✅ 已繳交即為其狀態）。
      const statusText = userDone
        ? '✅ 已完成（手動標記）'
        : (submitted
          ? '✅ 已繳交'
          : (rem != null && rem <= 0 ? '❌ 逾期未繳' : '⏳ 未繳交'));

      const statusClass = (submitted || userDone)
        ? 'good'
        : (rem != null && rem <= 0 ? 'bad' : 'warn');

      // SCORE_DISPLAY_V1：作業／測驗／問答類的「分數」放在「截止期限」旁邊同一列
      //（截止期限不再跨滿整行）。已評分 → 💯 綠色分數；未評分（score=null，
      // 含老師未公布）→ 灰色「未評分」。其他類型（教材、連結等）不計分，
      // 截止期限維持跨滿整行。
      // 不做及格/不及格變色：API 未提供滿分（score_percentage 是權重非滿分），
      // 無法正確判斷（例如滿分 5 分拿 4 分並非不及格），統一綠色強調「已評分」。
      const gradable = ['homework', 'quiz', 'exam', 'discussion', 'questionnaire'].includes(item.item_type);
      const scoreVal = formatScore(item.score);
      const deadlineMetaHtml = gradable
        ? `<div class="hw-meta-item">
                <span class="hw-meta-label">截止期限</span>
                <span class="hw-meta-val deadline">⏰ ${esc(formatDateTime(item.end_time))}</span>
              </div>
              <div class="hw-meta-item">
                <span class="hw-meta-label">分數</span>
                <span class="hw-meta-val ${scoreVal != null ? 'score-graded' : 'score-ungraded'}">${scoreVal != null ? `💯 ${esc(scoreVal)} 分` : '未評分'}</span>
              </div>`
        : `<div class="hw-meta-item span-full">
                <span class="hw-meta-label">截止期限</span>
                <span class="hw-meta-val deadline">⏰ ${esc(formatDateTime(item.end_time))}</span>
              </div>`;

      const lateNotice = item.allow_late_submission
        ? '<span class="status-pill warn">⚠️ 允許遲交</span>'
        : '<span class="status-pill bad">❌ 不得遲交</span>';

      // 「全部學期」範圍下，非當學期的項目加標籤，避免誤以為是本學期的作業。
      const semesterChip = item.semester_current === false
        ? '<span class="status-pill semester-old">🗂️ 非當學期</span>'
        : '';

      let cardClass = 'hw-card';
      if (state === 'urgent') cardClass += ' urgent';
      else if (state === 'warn') cardClass += ' warn';
      else if (state === 'submitted') cardClass += ' submitted';
      else if (state === 'overdue') cardClass += ' overdue';

      return `
        <article class="${cardClass}" data-endtime="${esc(item.end_time || '')}" data-submitted="${(item.is_submitted || userDone) ? '1' : '0'}">
          <div>
            <div class="hw-header">
              <span class="course-tag">📚 ${esc(item.course_name || '未指定課程')}</span>
              <span class="countdown-badge ${countdown.badgeClass}" data-role="countdown">${esc(countdown.text)}</span>
            </div>
            <h2 class="hw-title">${esc(item.title || '未命名作業')}</h2>
            <div class="hw-meta-grid">
              <div class="hw-meta-item">
                <span class="hw-meta-label">類型</span>
                <span class="hw-meta-val">${esc(typeLabel)}</span>
              </div>
              <div class="hw-meta-item">
                <span class="hw-meta-label">開放時間</span>
                <span class="hw-meta-val">${esc(formatDateTime(item.start_time))}</span>
              </div>
              ${deadlineMetaHtml}
            </div>
          </div>
          <div class="hw-footer">
            <div class="pill-row">
              <span class="status-pill ${statusClass}">${esc(statusText)}</span>
              ${lateNotice}
              ${semesterChip}
            </div>
            <button class="hw-complete-btn ${userDone ? 'done' : ''}" type="button"
              data-hw-id="${esc(item.id)}" data-completed="${userDone ? '1' : '0'}"
              title="${userDone ? '取消標記完成' : '標記為已完成，停止截止提醒'}">
              ${userDone ? '↩️ 取消完成' : '✅ 標記完成'}
            </button>
            <button class="tc-open-btn" type="button" data-hw-detail="1"
              data-course-id="${item.course_id ? esc(item.course_id) : ''}" data-item-id="${esc(item.id)}"
              title="在面板內查看作業內容與附件（不需登入 iClass）">📄 內容</button>
          </div>
        </article>
      `;
    }).join('');
  }

  function updateLiveCountdowns() {
    const badges = document.querySelectorAll('[data-role="countdown"]');
    badges.forEach(badge => {
      const card = badge.closest('.hw-card');
      if (!card) return;
      const endTime = card.getAttribute('data-endtime');
      const isSub = card.getAttribute('data-submitted') === '1';
      if (isSub) return;
      if (!endTime) return;
      const rem = getRemainingMs(endTime);
      const res = formatCountdown(rem);
      badge.textContent = res.text;
      badge.className = `countdown-badge ${res.badgeClass}`;
    });
  }

  // force=true 時帶 refresh=1，要求伺服器略過快取重抓（使用者手動重新整理）。
  async function loadData(force) {
    const container = q('homeworkContainer');
    // INSTANT_FIRST_PAINT_V1
    // 只有在畫面上還沒有任何資料時才顯示轉圈；已有資料時保留舊清單，
    // 背景靜靜更新，避免每次刷新都閃一次空白轉圈。
    if (allItems.length === 0) {
      container.innerHTML = `
        <div class="loading-box">
          <div class="spinner"></div>
          正在向 Tronclass 獲取最新作業待辦清單…
        </div>
      `;
    }
    try {
      const targetAccount = currentAccount || (statusInfo && statusInfo.current_account_id) || '';
      const params = new URLSearchParams();
      if (targetAccount) params.set('account_id', targetAccount);
      // refresh 欄位是 bool，後端用 str::parse::<bool>() 解析，只接受
      // "true"/"false"。送 "1" 會在 axum 解 Query 時直接回 400，故用 "true"。
      if (force === true) params.set('refresh', 'true');
      const queryParam = params.toString() ? `?${params.toString()}` : '';
      const data = await api(`/admin/api/homework${queryParam}`);
      // HOMEWORK_TRACKED_TYPES_V1
      // 這個作業提醒畫面只保留「作業」與「測驗/考試」兩類。
      // 其餘課程項目（教材 material、連結 web_link、頁面 page、影片 online_video、
      // 討論 forum、問卷 questionnaire…）一律不在這裡顯示。
      const trackedTypes = /^(homework|quiz|exam)$/i;
      allItems = Array.isArray(data.items)
        ? data.items.filter(it => trackedTypes.test((it.item_type || '').trim()))
        : [];
      userCompleted = new Set(Array.isArray(data.user_completed) ? data.user_completed : []);
      loadedAccountId = data.account_id || targetAccount || '';
      iclassBase = typeof data.iclass_base === 'string' ? data.iclass_base.replace(/\/+$/, '') : '';
      if (data.user_name) {
        q('brandSub').textContent = `${data.user_name} (${targetAccount || '目前帳號'}) 的作業待辦清單`;
      }

      // 伺服器回傳的是上次快照 → 背景正在更新，稍後自動再取一次最新結果。
      // 最多追蹤 MAX_REVALIDATE_POLLS 次，避免上游持續失敗時無限輪詢。
      if (data.stale === true && revalidatePolls < MAX_REVALIDATE_POLLS) {
        revalidatePolls += 1;
        const when = data.fetched_at
          ? new Date(data.fetched_at * 1000).toLocaleTimeString()
          : '稍早';
        q('lastUpdated').textContent = `${when}（更新中…）`;
        if (revalidateTimer) clearTimeout(revalidateTimer);
        revalidateTimer = setTimeout(() => loadData(), 6000);
      } else {
        revalidatePolls = 0;
        q('lastUpdated').textContent = new Date().toLocaleTimeString();
      }

      updateMetrics();
      renderList();
    } catch (err) {
      container.innerHTML = `
        <div class="empty-box err-box">
          <div class="err-icon">⚠️</div>
          <h3 class="err-title">無法載入作業資料</h3>
          <p class="err-msg">${esc(err.message || '連線 Tronclass 失敗')}</p>
          <p class="err-hint">提示：若學校端登入驗證碼或 Session 過期，請點擊下方重新整理或至 Dashboard 確認帳號連線狀態。</p>
          <button class="button err-btn" id="retryBtn" type="button">🔄 重新整理</button>
        </div>
      `;
      const retry = q('retryBtn');
      // 錯誤後重試視為使用者主動要求，強制略過快取。
      if (retry) retry.onclick = () => loadData(true);
    }
  }

  async function init() {
    // PARALLEL_INITIAL_LOAD_V1
    // 原本先 await /admin/api/status，拿到帳號清單後才開始抓作業，等於兩趟往返
    // 相加。實際上作業 API 不帶 account_id 時，伺服器會自動用登入者的帳號，
    // 所以兩支可以同時發，等待時間變成「較慢的那一支」。
    const statusPromise = api('/admin/api/status?include_history=false').catch(() => null);
    const homeworkPromise = loadData();

    statusInfo = await statusPromise;
    if (statusInfo && statusInfo.accounts && statusInfo.accounts.length > 1) {
      const wrap = q('accountSelectorWrap');
      const select = q('accountSelect');
      wrap.style.display = 'block';
      select.innerHTML = statusInfo.accounts.map(acc => `
        <option value="${esc(acc.account_id)}">${esc(acc.account_id)} (${esc(acc.user_name || acc.username || '')})</option>
      `).join('');
      select.value = statusInfo.current_account_id || statusInfo.accounts[0].account_id;
      currentAccount = select.value;
      select.onchange = function() {
        currentAccount = this.value;
        loadData();
      };
    } else if (statusInfo && statusInfo.accounts && statusInfo.accounts.length === 1) {
      currentAccount = statusInfo.accounts[0].account_id;
    }

    // 等首批資料落地。若伺服器實際採用的帳號與下拉選單選定的不同，才補抓一次。
    await homeworkPromise;
    if (currentAccount && loadedAccountId && loadedAccountId !== currentAccount) {
      loadData();
    }

    // Event listeners
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        renderList();
      });
    });

      q('courseFilter').addEventListener('change', renderList);
    // HOMEWORK_PAGE_CURRENT_ONLY_V1（fix45）：切換學期範圍要同時更新統計、課程下拉與提示。
    q('semesterScope').addEventListener('change', function () {
      updateMetrics();
      renderList();
    });
    q('sortFilter').addEventListener('change', renderList);
    q('searchInput').addEventListener('input', renderList);

    // HOMEWORK_USER_COMPLETED_V1
    // 委派處理「標記完成／取消」按鈕（卡片會重新 render，用容器委派避免重綁）。
    q('homeworkContainer').addEventListener('click', async function(ev) {
      // HOMEWORK_DETAIL_V1（fix41）：面板內看內容（伺服器端抓 iClass 資料）。
      // 不再走 /admin/tc-go 代理——代理路線會動到瀏覽器 cookie，是 fix38 事故的來源。
      const detailBtn = ev.target.closest('[data-hw-detail]');
      if (detailBtn) {
        openHomeworkDetail(detailBtn.getAttribute('data-course-id'), detailBtn.getAttribute('data-item-id'));
        return;
      }
      const btn = ev.target.closest('.hw-complete-btn');
      if (!btn) return;
      const homeworkId = btn.getAttribute('data-hw-id');
      const completed = btn.getAttribute('data-completed') !== '1';
      btn.disabled = true;
      try {
        const res = await api('/admin/api/homework/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ homework_id: Number(homeworkId), completed })
        });
        if (res && res.ok) {
          if (completed) userCompleted.add(String(homeworkId));
          else userCompleted.delete(String(homeworkId));
          updateMetrics();
          renderList();
        }
      } catch (err) {
        showToast('標記作業狀態失敗：' + (err && err.message ? err.message : 'HTTP 錯誤'), 'bad');
      } finally {
        btn.disabled = false;
      }
    });

    q('refreshBtn').addEventListener('click', async function() {
      if (this.disabled) return;
      revalidatePolls = 0;
      this.disabled = true;
      this.classList.add('is-busy');
      try {
        await loadData(true);
      } finally {
        this.disabled = false;
        this.classList.remove('is-busy');
      }
    });

    // HOMEWORK_TEST_NOTIFICATION_V1
    // 發一則測試提醒，走與真實通知完全相同的路徑，確認各管道是否暢通。
    q('testNotifyBtn').addEventListener('click', async function() {
      const btn = this;
      if (btn.disabled) return;
      // 按鈕內容是 SVG，不能用 textContent 覆蓋；改用 class 做旋轉動畫。
      btn.disabled = true;
      btn.classList.add('is-busy');
      try {
        const res = await api('/admin/api/homework/test-notification', { method: 'POST' });
        const sent = Array.isArray(res.channels) ? res.channels : [];
        const skipped = Array.isArray(res.skipped) ? res.skipped : [];
        if (sent.length > 0) {
          let msg = `✅ 已發送至：${sent.join('、')}`;
          if (skipped.length > 0) msg += `\n\n未發送：\n・${skipped.join('\n・')}`;
          showToast(msg, 'ok');
        } else {
          const detail = skipped.length > 0 ? `\n\n・${skipped.join('\n・')}` : '';
          showToast(`⚠️ 沒有任何可用的通知管道${detail}`, 'warn');
        }
      } catch (err) {
        showToast(`❌ 測試失敗：${err.message || '未知錯誤'}`, 'err');
      } finally {
        btn.disabled = false;
        btn.classList.remove('is-busy');
      }
    });

    // 初次載入已於 init() 開頭與 status 並行送出，這裡不再重複抓取。

    // Start 1-second live countdown ticker
    if (timerId) clearInterval(timerId);
    timerId = setInterval(updateLiveCountdowns, 1000);

    // Auto-refresh API every 5 minutes
    // 背景自動刷新走快取（不傳 force），避免每 5 分鐘都真的打上游一輪。
    setInterval(() => loadData(), 5 * 60 * 1000);
  }

  init();
})();
</script>
