<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>作業截止時間｜Tronclass</title>
<style>
:root{
  color-scheme:light;
  --ds-bg:#f5f7fb;--ds-card:#ffffff;--ds-soft:#f1f5f9;--ds-soft-strong:#e8eef7;
  --ds-text:#172033;--ds-muted:#64748b;--ds-line:#d8e0eb;--ds-line-soft:#e8edf4;
  --ds-input:#ffffff;--ds-shadow:0 10px 30px rgba(15,23,42,.07);
  --ds-hero-a:#eff6ff;--ds-hero-b:#e0edff;--ds-hero-text:#172033;
  --color-urgent:#ef4444;--color-warn:#f59e0b;--color-info:#3b82f6;--color-good:#10b981;
}
@media(prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --ds-bg:#0f141d;--ds-card:#161d29;--ds-soft:#111827;--ds-soft-strong:#1e293b;
    --ds-text:#eef2ff;--ds-muted:#9aa4b5;--ds-line:#303948;--ds-line-soft:#252e3c;
    --ds-input:#101722;--ds-shadow:0 14px 36px rgba(0,0,0,.24);
    --ds-hero-a:#111d2d;--ds-hero-b:#13294b;--ds-hero-text:#f1f5f9;
  }
}
html[data-theme="light"]{color-scheme:light;--ds-bg:#f5f7fb;--ds-card:#fff;--ds-soft:#f1f5f9;--ds-soft-strong:#e8eef7;--ds-text:#172033;--ds-muted:#64748b;--ds-line:#d8e0eb;--ds-line-soft:#e8edf4;--ds-input:#fff;--ds-shadow:0 10px 30px rgba(15,23,42,.07);--ds-hero-a:#eff6ff;--ds-hero-b:#e0edff;--ds-hero-text:#172033}
html[data-theme="dark"]{color-scheme:dark;--ds-bg:#0f141d;--ds-card:#161d29;--ds-soft:#111827;--ds-soft-strong:#1e293b;--ds-text:#eef2ff;--ds-muted:#9aa4b5;--ds-line:#303948;--ds-line-soft:#252e3c;--ds-input:#101722;--ds-shadow:0 14px 36px rgba(0,0,0,.24);--ds-hero-a:#111d2d;--ds-hero-b:#13294b;--ds-hero-text:#f1f5f9}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ds-bg)!important;color:var(--ds-text)!important}
body{font-family:Inter,"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.shell{width:min(1400px,calc(100% - 64px));margin:auto;padding:32px 0 52px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.brand-text{min-width:0}
.brand b{color:var(--ds-text);font-size:17px;font-weight:850;letter-spacing:-.01em;display:block;line-height:1.3}
.brand .meta{font-size:12.5px;color:var(--ds-muted);line-height:1.4;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:42px;height:42px;flex:0 0 auto;border-radius:14px;background:linear-gradient(135deg,#38bdf8,#6366f1);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:900;box-shadow:0 10px 26px rgba(37,99,235,.28)}

.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* 藥丸按鈕：淡色底 + 同色系文字，比純灰的幽靈按鈕更清楚。
   用 !important 蓋過 theme.css 對 .top-actions button/a 的強制灰底規則。 */
.pill-btn{
  display:inline-flex!important;align-items:center;justify-content:center;gap:7px;
  min-height:40px;padding:0 15px;border-radius:999px;
  font:inherit;font-size:13.5px;font-weight:780;white-space:nowrap;
  cursor:pointer;text-decoration:none;transition:all .15s ease;
  border:1px solid transparent!important
}
.pill-btn svg{flex:0 0 auto}
.pill-btn:active{transform:scale(.96)}
.pill-btn[disabled]{opacity:.55;cursor:default;transform:none}
.pill-btn.is-busy svg{animation:iconSpin .8s linear infinite}
@keyframes iconSpin{to{transform:rotate(360deg)}}

.pill-btn.refresh{
  color:#2563eb!important;
  background:rgba(37,99,235,.12)!important;
  border-color:rgba(37,99,235,.26)!important
}
.pill-btn.refresh:hover{background:rgba(37,99,235,.2)!important;border-color:rgba(37,99,235,.42)!important}

.pill-btn.notify{
  color:#b45309!important;
  background:rgba(245,158,11,.14)!important;
  border-color:rgba(245,158,11,.3)!important
}
.pill-btn.notify:hover{background:rgba(245,158,11,.22)!important;border-color:rgba(245,158,11,.46)!important}

.pill-btn.ghost{
  color:var(--ds-muted)!important;
  background:var(--ds-card)!important;
  border-color:var(--ds-line)!important
}
.pill-btn.ghost:hover{color:var(--ds-text)!important;border-color:#60a5fa!important}

html[data-theme="dark"] .pill-btn.refresh{color:#7cb2ff!important;background:rgba(59,130,246,.18)!important;border-color:rgba(59,130,246,.34)!important}
html[data-theme="dark"] .pill-btn.notify{color:#fbbf24!important;background:rgba(245,158,11,.16)!important;border-color:rgba(245,158,11,.32)!important}
@media(prefers-color-scheme:dark){
  html:not([data-theme="light"]) .pill-btn.refresh{color:#7cb2ff!important;background:rgba(59,130,246,.18)!important;border-color:rgba(59,130,246,.34)!important}
  html:not([data-theme="light"]) .pill-btn.notify{color:#fbbf24!important;background:rgba(245,158,11,.16)!important;border-color:rgba(245,158,11,.32)!important}
}
.top a,.button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;color:var(--ds-text)!important;text-decoration:none;border:1px solid var(--ds-line)!important;background:var(--ds-card)!important;padding:0 16px;border-radius:999px;font-weight:760;box-shadow:0 1px 2px rgba(15,23,42,.03);cursor:pointer;font:inherit}
.top a:hover,.button:hover{border-color:#60a5fa!important;color:#2563eb!important}
.hero{padding:28px 32px;border:1px solid var(--ds-line-soft);border-radius:24px;background:radial-gradient(circle at 92% 0,rgba(37,99,235,.15),transparent 44%),linear-gradient(135deg,var(--ds-hero-a),var(--ds-hero-b));box-shadow:var(--ds-shadow);margin-bottom:20px;color:var(--ds-hero-text)}
.eyebrow{font-size:12px;letter-spacing:.13em;color:#0284c7;font-weight:850}.hero h1{font-size:clamp(24px,3.8vw,36px);margin:8px 0;color:var(--ds-hero-text)}.hero p{margin:0;color:var(--ds-muted);line-height:1.75;font-size:15px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.metric{background:var(--ds-card);border:1px solid var(--ds-line-soft);padding:18px;border-radius:18px;box-shadow:var(--ds-shadow);position:relative;overflow:hidden}
.metric .meta{font-size:13px;font-weight:750;color:var(--ds-muted);display:flex;align-items:center;gap:6px}
.metric b{display:block;color:var(--ds-text);font-size:30px;margin-top:6px;font-weight:850;line-height:1.1}
.metric.urgent{border-color:rgba(239,68,68,.35)}.metric.urgent b{color:#ef4444}
.metric.warn{border-color:rgba(245,158,11,.35)}.metric.warn b{color:#f59e0b}
.metric.pending{border-color:rgba(59,130,246,.35)}.metric.pending b{color:#3b82f6}
.metric.good{border-color:rgba(16,185,129,.35)}.metric.good b{color:#10b981}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap;background:var(--ds-card);border:1px solid var(--ds-line-soft);padding:16px 20px;border-radius:18px;box-shadow:var(--ds-shadow)}
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.filter-tab{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--ds-line);background:var(--ds-soft);color:var(--ds-muted);font-size:13px;font-weight:750;cursor:pointer;transition:all .15s ease}
.filter-tab:hover{color:var(--ds-text);border-color:#93c5fd}
.filter-tab.active{background:linear-gradient(135deg,#0284c7,#4f46e5);border-color:transparent;color:#ffffff;box-shadow:0 4px 12px rgba(37,99,235,.25)}
.filter-tab .badge-count{padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.15);font-size:11px}
.filter-tab.active .badge-count{background:rgba(255,255,255,.25);color:#fff}
.filter-dropdowns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filter-dropdowns select,.filter-dropdowns input{min-height:38px;border:1px solid var(--ds-line);background:var(--ds-input);color:var(--ds-text);border-radius:10px;padding:0 12px;font:inherit;font-size:13px;outline:none}
.filter-dropdowns input{min-width:200px}
.filter-dropdowns select:focus,.filter-dropdowns input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.13)}
/* HOMEWORK_PAGE_CURRENT_ONLY_V1（fix45） */
.hw-semester-note{margin-top:10px;font-size:12.5px;line-height:1.6;color:var(--ds-muted,#64748b)}
.status-pill.semester-old{background:rgba(148,163,184,.18);color:var(--ds-muted,#64748b)}
.account-selector{display:flex;align-items:center;gap:8px;min-width:0}
.account-selector label{font-size:12px;font-weight:750;color:var(--ds-muted);flex:0 0 auto}
.account-selector select{
  min-height:40px;max-width:200px;border:1px solid var(--ds-line)!important;
  background:var(--ds-card)!important;color:var(--ds-text)!important;border-radius:12px;
  padding:0 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;
  text-overflow:ellipsis
}
.account-selector select:focus{border-color:#3b82f6!important;outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.13)}
.hw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:18px}
.hw-card{border:1px solid var(--ds-line-soft);border-radius:20px;background:var(--ds-card);padding:22px;box-shadow:var(--ds-shadow);color:var(--ds-text);display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s ease,box-shadow .15s ease;position:relative;overflow:hidden}
.hw-card:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(15,23,42,.1)}
.hw-card.urgent{border-color:rgba(239,68,68,.5);background:linear-gradient(180deg,rgba(239,68,68,.04),var(--ds-card) 25%)}
.hw-card.urgent::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:#ef4444}
.hw-card.warn{border-color:rgba(245,158,11,.5);background:linear-gradient(180deg,rgba(245,158,11,.04),var(--ds-card) 25%)}
.hw-card.warn::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:#f59e0b}
.hw-card.submitted{opacity:.9;border-color:rgba(16,185,129,.3)}
.hw-card.submitted::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:#10b981}
.hw-card.overdue{opacity:.75;border-color:rgba(100,116,139,.3)}
.hw-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.course-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#0284c7;background:rgba(2,132,199,.1);padding:4px 10px;border-radius:8px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.countdown-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:850;padding:5px 12px;border-radius:999px;white-space:nowrap}
.countdown-badge.urgent{background:#fee2e2;color:#b91c1c;animation:pulseUrgent 2s infinite}
.countdown-badge.warn{background:#fef3c7;color:#b45309}
.countdown-badge.pending{background:#dbeafe;color:#1d4ed8}
.countdown-badge.submitted{background:#dcfce7;color:#15803d}
.countdown-badge.overdue{background:var(--ds-soft-strong);color:var(--ds-muted)}
/* ─── iOS 設定頁風格：分組卡片 ─────────────────────────────
   標題在卡片外、卡片內為列表，每列左側標籤、右側數值。 */
.hw-page-header{
  display:flex!important;align-items:center!important;justify-content:space-between!important;
  gap:14px!important;margin:0 0 14px!important;padding:13px 16px!important;
  border:1px solid var(--ds-line-soft)!important;border-radius:18px!important;
  background:var(--ds-card)!important;box-shadow:var(--ds-shadow)!important
}
.hw-page-brand{display:flex!important;align-items:center!important;gap:12px!important;min-width:0!important}
.hw-page-logo{flex:0 0 auto!important}
.hw-back{
  flex:0 0 auto;white-space:nowrap;text-decoration:none;
  min-height:36px;padding:0 14px;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;
  font:inherit;font-size:13.5px;font-weight:760;
  color:var(--ds-muted)!important;background:var(--ds-soft)!important;
  border:1px solid var(--ds-line)!important;transition:all .15s ease
}
.hw-back:hover{color:var(--ds-text)!important;border-color:#60a5fa!important}
.hw-back:active{transform:scale(.96)}

/* 狀態列：綠點 + 標題 + 動作按鈕 */
.hw-statusbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:15px 17px;margin-bottom:18px;border-radius:18px;
  border:1px solid var(--ds-line-soft);background:var(--ds-card);box-shadow:var(--ds-shadow)
}
.hw-statusbar-info{display:flex;align-items:center;gap:12px;min-width:0}
.hw-statusbar-text{min-width:0}
.hw-statusbar-title{font-size:16px;font-weight:850;color:var(--ds-text);line-height:1.3}
.hw-statusbar-sub{font-size:12.5px;color:var(--ds-muted);margin-top:2px}
.dot{
  width:11px;height:11px;flex:0 0 auto;border-radius:50%;background:var(--ds-muted);
  box-shadow:0 0 0 5px color-mix(in srgb,var(--ds-muted) 16%,transparent)
}
.dot.good{background:#16a34a;box-shadow:0 0 0 5px rgba(22,163,74,.16)}
.hw-statusbar-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}

/* 分組：標題在外、卡片在內 */
.hw-group{margin-bottom:18px}
.hw-group-title{
  font-size:16px;font-weight:850;color:var(--ds-text);
  margin:0 0 9px;padding-left:3px;letter-spacing:-.01em
}
.hw-group-body{
  border:1px solid var(--ds-line-soft);border-radius:18px;
  background:var(--ds-card);box-shadow:var(--ds-shadow);
  padding:2px 16px;min-width:0
}
.hw-row{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:13px 0;border-bottom:1px solid var(--ds-line-soft)
}
.hw-row:last-child{border-bottom:0}
.hw-row-key{font-size:14px;color:var(--ds-muted);font-weight:650;min-width:0}
.hw-row-val{font-size:15px;font-weight:850;text-align:right;color:var(--ds-text);flex:0 0 auto}
.hw-row-val.urgent{color:#ef4444}
.hw-row-val.warn{color:#f59e0b}
.hw-row-val.pending{color:#3b82f6}
.hw-row-val.good{color:#10b981}
.hw-row-select{
  flex:0 1 auto;max-width:60%;min-height:36px;border-radius:10px;
  border:1px solid var(--ds-line)!important;background:var(--ds-input)!important;
  color:var(--ds-text)!important;padding:0 11px;font:inherit;font-size:13.5px;font-weight:700;
  cursor:pointer;text-overflow:ellipsis
}
.hw-row-select:focus{border-color:#3b82f6!important;outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.13)}

/* 篩選卡片：去掉自身邊框，改由 .hw-group-body 提供 */
.hw-group .controls{
  background:transparent!important;border:0!important;box-shadow:none!important;
  padding:14px 0!important;margin:0!important;border-radius:0!important
}

.hw-toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);max-width:min(560px,92vw);padding:14px 18px;border-radius:12px;font-size:13.5px;font-weight:650;line-height:1.65;white-space:pre-wrap;color:#fff;background:#1e293b;box-shadow:0 12px 32px rgba(15,23,42,.28);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:9999}
.hw-toast.show{opacity:1;transform:translate(-50%,0)}
.hw-toast[data-kind="ok"]{background:#15803d}
.hw-toast[data-kind="warn"]{background:#b45309}
.hw-toast[data-kind="err"]{background:#b91c1c}
@keyframes pulseUrgent{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{transform:scale(1.02);box-shadow:0 0 0 6px rgba(239,68,68,0)}}
.hw-title{font-size:18px;font-weight:850;margin:0 0 14px;color:var(--ds-text);line-height:1.4;word-break:break-word}
.hw-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--ds-soft);border:1px solid var(--ds-line-soft);padding:12px 14px;border-radius:14px;margin-bottom:16px;font-size:13px}
.hw-meta-item{display:flex;flex-direction:column;gap:3px}
.hw-meta-label{font-size:11px;font-weight:750;color:var(--ds-muted);text-transform:uppercase;letter-spacing:.03em}
.hw-meta-val{font-size:13px;font-weight:750;color:var(--ds-text)}
.hw-meta-val.deadline{color:#ef4444;font-weight:850}
/* SCORE_DISPLAY_V1：分數欄配色（已評分綠色強調；未評分灰色，含老師未公布分數） */
.hw-meta-val.score-graded{color:#15803d;font-weight:850}
.hw-meta-val.score-ungraded{color:var(--ds-muted);font-weight:700}
.hw-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--ds-line-soft);font-size:12px}
.hw-complete-btn{margin-left:auto;padding:6px 12px;border:1px solid var(--ds-line-soft);border-radius:999px;background:transparent;color:var(--ds-muted);font-size:12px;cursor:pointer;transition:all .15s ease;white-space:nowrap}
.hw-complete-btn:hover{border-color:#10b981;color:#10b981}
.hw-complete-btn.done{border-color:#10b981;background:rgba(16,185,129,.12);color:#10b981}
/* TRONCLASS_PROXY_JUMP_V1：在 iClass 開啟（面板反向代理，免學校登入） */
.tc-open-btn{margin-left:8px;padding:6px 12px;border:1px solid var(--ds-line-soft);border-radius:999px;background:transparent;color:var(--ds-muted);font-size:12px;cursor:pointer;transition:all .15s ease;white-space:nowrap}
.tc-open-btn:hover{border-color:#2563eb;color:#2563eb}
.status-pill{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:12px}
.status-pill.good{color:#10b981}.status-pill.bad{color:#ef4444}.status-pill.warn{color:#f59e0b}
.empty-box{grid-column:1/-1;padding:48px 24px;text-align:center;border:2px dashed var(--ds-line);border-radius:22px;background:var(--ds-card);color:var(--ds-muted)}
.empty-box h3{font-size:20px;color:var(--ds-text);margin:0 0 8px}
.empty-box p{margin:0 0 18px;font-size:14px}
.loading-box{grid-column:1/-1;padding:64px 24px;text-align:center;color:var(--ds-muted);font-size:16px;font-weight:750}
.spinner{width:32px;height:32px;border:3px solid var(--ds-line);border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.refresh-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ds-muted)}
@media(max-width:900px){
  .shell{width:min(100% - 24px,1400px);padding:calc(16px + env(safe-area-inset-top,0px)) 0 40px}
  .hw-grid{grid-template-columns:1fr}
  .controls{flex-direction:column;align-items:stretch;gap:14px}
  .filter-dropdowns{justify-content:stretch}.filter-dropdowns select,.filter-dropdowns input{flex:1}
}

/* MOBILE_COMPACT_V2
   手機直式版面。設計原則：
   1. 不使用負 margin 做出血捲動 —— 會被父層圓角切掉，視覺上像斷裂。
   2. 控制項用 grid 排列，而不是各佔一整行。
   3. 所有可捲動容器都給 scroll-padding，末端元素不會貼邊。 */
@media(max-width:640px){
  .shell{width:calc(100% - 22px);padding:calc(12px + env(safe-area-inset-top,0px)) 0 32px}

  /* ── 頁首：品牌 + 返回鍵，維持單列 ─────────────────── */
  .hw-page-header{padding:11px 13px!important;border-radius:16px!important;margin-bottom:12px!important}
  .brand{gap:10px;align-items:center;min-width:0;margin-right:0}
  .brand b{font-size:15.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .meta{font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .logo{width:36px;height:36px;border-radius:12px;font-size:17px;box-shadow:0 6px 16px rgba(37,99,235,.22)}
  .hw-back{min-height:34px;padding:0 12px;font-size:13px}

  /* ── 狀態列：資訊一列、按鈕平分一列 ───────────────── */
  .hw-statusbar{padding:13px 14px;border-radius:16px;margin-bottom:16px;gap:11px}
  .hw-statusbar-title{font-size:15px}
  .hw-statusbar-sub{font-size:11.5px}
  .hw-statusbar-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
  .pill-btn{min-height:40px;padding:0 12px;font-size:12.5px;gap:6px;white-space:nowrap;width:100%}

  /* ── 分組卡片 ───────────────────────────────────── */
  .hw-group{margin-bottom:16px}
  .hw-group-title{font-size:15px;margin-bottom:8px}
  .hw-group-body{border-radius:16px;padding:2px 14px}
  .hw-row{padding:12px 0;gap:12px}
  .hw-row-key{font-size:13.5px}
  .hw-row-val{font-size:15px}
  .hw-row-select{max-width:58%;min-height:36px;font-size:13px}
  .hw-group .controls{padding:13px 0!important}

  /* ── 篩選列 ─────────────────────────────────────── */
  /* min-width:0 讓子元素能收縮，橫捲才會生效而不是把卡片撐寬 */
  .controls{
    display:flex!important;flex-direction:column!important;align-items:stretch!important;
    padding:12px;border-radius:16px;gap:11px;margin-bottom:13px;
    box-shadow:none;overflow:visible;min-width:0;max-width:100%
  }

  /* 頁籤橫捲：限制在卡片寬度內，超出的部分用捲動而非溢出。
     min-width:0 是關鍵 —— flex/grid 子項預設 min-width:auto 會撐開父層。 */
  .filter-tabs{
    flex-wrap:nowrap!important;overflow-x:auto;gap:7px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    scroll-snap-type:x proximity;scroll-padding-inline:2px;
    padding-bottom:3px;
    min-width:0;max-width:100%;
  }
  .filter-tabs::-webkit-scrollbar{display:none}
  .filter-tab{
    flex:0 0 auto!important;min-height:35px;padding:0 13px;
    font-size:12.5px;white-space:nowrap;scroll-snap-align:start;
  }

  /* 控制項：課程與排序並排，搜尋框獨佔一列。
     用 !important 蓋過 900px 斷點的 .filter-dropdowns{flex:1}。 */
  .filter-dropdowns{
    display:grid!important;grid-template-columns:1fr 1fr;gap:8px;width:100%
  }
  .filter-dropdowns select,.filter-dropdowns input{
    width:100%!important;min-width:0!important;flex:none!important;
    min-height:40px;font-size:13.5px;border-radius:11px;padding:0 11px;
  }
  .filter-dropdowns input{grid-column:1 / -1}

  /* ── 作業卡片 ───────────────────────────────────── */
  .hw-grid{gap:16px}
  .hw-card{padding:16px;border-radius:18px;box-shadow:none}
  .hw-title{font-size:16px;line-height:1.45;margin:0 0 12px}
  .hw-meta-grid{gap:10px;padding:11px 13px;border-radius:13px;margin-bottom:13px;font-size:12.5px}
  .hw-meta-label{font-size:10px}
  .hw-meta-val{font-size:12.5px}
  .countdown-badge{font-size:11.5px;padding:5px 11px}

  .hw-toast{
    left:12px;right:12px;max-width:none;
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    transform:translateY(12px);font-size:13px;padding:13px 15px;
  }
  .hw-toast.show{transform:translateY(0)}
}

/* 極窄機型（iPhone SE 等）：頁籤與統計再收一點 */
@media(max-width:380px){
  /* 極窄機型：兩顆動作鍵改直向堆疊 */
  .hw-statusbar-actions{grid-template-columns:1fr}
  .pill-btn{font-size:12.5px;padding:0 10px}
  .hw-row-key{font-size:13px}
  .hw-row-val{font-size:14.5px}
  .hw-row-select{max-width:54%;font-size:12.5px}
}

/* 瀏海／動態島機型：避免內容貼齊螢幕圓角 */
@supports(padding:env(safe-area-inset-left)){
  @media(max-width:640px){
    .shell{
      padding-left:env(safe-area-inset-left,0px);
      padding-right:env(safe-area-inset-right,0px);
    }
  }
}
@media(max-width:500px){
  .summary{grid-template-columns:1fr 1fr}
  .metric{padding:14px}.metric b{font-size:24px}
  .hw-card{padding:16px}
  .hw-title{font-size:16px}
  .hw-meta-grid{grid-template-columns:1fr}
}

  /* CSP_STYLE_ATTR_STAGED_V1：原 inline style 屬性改為 class（消除 style-src-attr 回報） */
  .hidden-init{display:none}

  .span-full{grid-column:1/-1}

  /* HOMEWORK_DETAIL_V1（fix41）：面板內作業詳情彈窗。

     抓取），完全不經過 iClass 頁面代理。 */
  .hw-detail-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10000}

  .hw-detail-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 10px;border-bottom:1px solid var(--ds-line-soft,#e2e8f0)}
  .hw-detail-head h2{margin:0;font-size:17px;line-height:1.45;flex:1}
  .hw-detail-close{border:0;background:transparent;font-size:18px;line-height:1;cursor:pointer;color:var(--ds-muted,#64748b);padding:4px 6px}

  /* 沒有 DOMPurify 時以純文字顯示說明，保留換行（不用 inline style：
     CSP_STYLE_ATTR_STAGED_V1 把 style 屬性收緊成 class）。 */
  .hw-detail-desc.plain{white-space:pre-wrap}
  .hw-detail-desc img,.hw-detail-desc iframe,.hw-detail-desc video{display:none}
  .hw-detail-desc table{max-width:100%;border-collapse:collapse}
  .hw-detail-desc td,.hw-detail-desc th{border:1px solid var(--ds-line-soft,#e2e8f0);padding:4px 8px}
  .hw-detail-hint{margin:10px 0 0;padding:8px 10px;border-radius:8px;background:rgba(37,99,235,.08);color:var(--ds-muted,#64748b);font-size:12.5px;line-height:1.6}
  .hw-detail-attach{list-style:none;margin:0;padding:0}
  .hw-detail-attach li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--ds-line-soft,#e2e8f0)}
  .hw-detail-attach li:last-child{border-bottom:0}
  .hw-detail-attach .attach-name{flex:1;word-break:break-all}
  .hw-detail-attach .attach-size{color:var(--ds-muted,#64748b);font-size:12px;white-space:nowrap}
  .hw-detail-attach .attach-none{color:var(--ds-muted,#64748b);font-size:13px}
  .hw-detail-foot{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--ds-line-soft,#e2e8f0);background:rgba(148,163,184,.06)}
  .hw-detail-foot .button{text-decoration:none}
  /* HOMEWORK_SUBMIT_V1（fix42）：面板內直接繳交作業。
     檔案在面板內就以 multipart 送往伺服器，由伺服器端用已保存的 iClass session
     代打上游；因此不需要跨站表單、不碰 iClass 的 cookie、也不會被登出。 */
  .hw-submit{margin-top:22px;padding-top:16px;border-top:1px solid var(--ds-line-soft,#e2e8f0)}
  .hw-submit-status{padding:10px 12px;border-radius:10px;background:rgba(148,163,184,.10);font-size:13px;line-height:1.7;color:var(--ds-text,#0f172a)}
  .hw-submit-status.submitted{background:rgba(16,185,129,.12)}
  .hw-submit-status.pending{background:rgba(245,158,11,.12)}
  .hw-submit-files{margin:6px 0 0;padding-left:18px}
  .hw-submit-comment-preview{margin-top:6px;color:var(--ds-muted,#64748b);word-break:break-word}
  .hw-submit-field{margin-top:12px}
  .hw-submit-field label{display:block;font-size:13px;color:var(--ds-muted,#64748b);margin-bottom:6px}
  .hw-submit input[type=file]{width:100%;font-size:13px}
  .hw-submit textarea{width:100%;min-height:70px;padding:10px;border:1px solid var(--ds-line,#d8e0eb);border-radius:10px;background:var(--ds-input,#fff);color:var(--ds-text,#0f172a);font-size:13.5px;line-height:1.6;resize:vertical;font-family:inherit}
  .hw-submit-picked{list-style:none;margin:10px 0 0;padding:0}
  .hw-submit-picked li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--ds-line-soft,#e2e8f0);font-size:13px}
  .hw-submit-picked .pick-name{flex:1;word-break:break-all}
  .hw-submit-picked .pick-size{color:var(--ds-muted,#64748b);font-size:12px;white-space:nowrap}
  .hw-submit-picked .pick-remove{border:0;background:transparent;color:var(--ds-muted,#64748b);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px}
  .hw-submit-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
  .hw-submit-progress{font-size:12.5px;color:var(--ds-muted,#64748b)}
  .hw-submit-note{margin:10px 0 0;font-size:12px;color:var(--ds-muted,#64748b);line-height:1.6}
  .hw-submit button[disabled]{opacity:.55;cursor:not-allowed}
  /* HOMEWORK_FILE_V1（fix43）：附件／繳交檔的預覽浮層。
     內容依型別由前端選擇渲染方式（圖片／PDF／影音／文字／Office 本機解析），
     檔案一律由面板伺服器端代抓（/admin/api/homework/file）。 */
  .hw-file-preview,.hw-file-download{white-space:nowrap}
  .hw-detail-attach li .hw-file-preview,.hw-detail-attach li .hw-file-download{margin-left:6px}
  .hw-submit-files li{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hw-submit-files .file-name{flex:1;min-width:120px;word-break:break-all}
  .hw-submit-files .file-size{color:var(--ds-muted,#64748b);font-size:12px;white-space:nowrap}
  .hw-preview{position:fixed;inset:0;z-index:10050;display:none;align-items:center;justify-content:center;background:rgba(2,6,23,.72);padding:18px;box-sizing:border-box}
  .hw-preview.open{display:flex}
  .hw-preview-panel{display:flex;flex-direction:column;width:100%;max-width:1080px;height:100%;max-height:100%;background:var(--surface,var(--card,#fff));color:var(--text,#172033);border:1px solid var(--line2,#e2e8f0);border-radius:14px;overflow:hidden;box-shadow:0 18px 48px rgba(2,6,23,.45)}
  .hw-preview-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2,#e2e8f0);background:var(--card,#fff)}
  .hw-preview-title{flex:1;min-width:0;font-size:13.5px;font-weight:650;word-break:break-all}
  .hw-preview-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .hw-preview-body{flex:1;min-height:0;overflow:auto;display:block;background:var(--surface,var(--card,#fff))}
  .hw-preview-note{padding:24px 18px;color:var(--muted,#64748b);font-size:13px;line-height:1.7;text-align:center}
  .hw-preview-img{display:block;max-width:100%;max-height:100%;margin:auto;object-fit:contain}
  .hw-preview-media{display:block;width:100%;height:100%;max-height:100%;background:#000}
  .hw-preview-audio{display:block;width:min(520px,90%);margin:40px auto}
  .hw-preview-frame{width:100%;height:100%;min-height:70vh;border:0;background:#fff}
  .hw-preview-text{margin:0;padding:16px 18px;white-space:pre-wrap;word-break:break-word;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text,#172033)}
  /* PDF.js 逐頁 canvas（與檔案頁同一套樣式）。 */
  .tron-pdf{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;box-sizing:border-box;background:#40444a;min-height:100%}
  .tron-pdf canvas{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.45);border-radius:2px;max-width:100%}
  /* Office 本機解析（office-view.js）輸出的樣式子集；與檔案頁一致。 */
  .tron-office{width:100%;min-height:100%;box-sizing:border-box;background:var(--surface,var(--card,#fff));color:var(--text,#172033)}
  .tron-docx{overflow:auto;padding:20px 24px;box-sizing:border-box;line-height:1.5;font-size:14px}
  .tron-docx p,.tron-docx h2,.tron-docx h3,.tron-docx h4,.tron-docx h5{margin:0 0 6px 0}
  .tron-docx table{max-width:100%}
  .tron-slides{overflow:auto;padding:16px;box-sizing:border-box}
  .tron-slide{position:relative;width:100%;max-width:960px;margin:0 auto 16px auto;background:#fff;border:1px solid var(--line2,#e2e8f0);border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.10);overflow:hidden}
  .tron-slide-text{position:absolute;color:#111;box-sizing:border-box}
  .tron-slide-img{position:absolute}
  .tron-office-error{padding:36px 18px;text-align:center;color:var(--muted,#64748b);border:1px dashed var(--line2,#e2e8f0);border-radius:14px;font-size:13px}
  /* HOMEWORK_FILE_DIAG_V1（fix47）：內容與副檔名不符時，附上開頭位元組等診斷資訊。 */
  .tron-office-diag{margin-top:10px;padding:8px 10px;font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted,#64748b);background:rgba(148,163,184,.12);border-radius:8px;word-break:break-all;text-align:left}
  .hw-preview-diag{padding:12px 14px;border-radius:10px;background:rgba(148,163,184,.12);font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted,#64748b);white-space:pre-wrap;word-break:break-word;margin-top:10px;text-align:left}
  .hw-preview-snippet{margin:0;padding:12px 14px;border:1px solid var(--line2,#e2e8f0);border-radius:10px;background:var(--card,#fff);font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
  .tron-office-note{padding:10px 12px;font-size:12px;color:var(--muted,#64748b);background:var(--card,#fff);border-top:1px solid var(--line2,#e2e8f0)}
  .tron-xlsx,.tron-odf{overflow:auto;box-sizing:border-box;padding:0}
  .tron-odf{padding:20px 24px;line-height:1.5;font-size:14px}
  .tron-odf-p{margin:0 0 6px 0}
  .tron-odf-sheet{margin:18px 0 8px 0;font-size:13px;color:var(--muted,#64748b);font-weight:700}
  .tron-xlsx-tabs{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;background:var(--card,#fff);border-bottom:1px solid var(--line2,#e2e8f0)}
  .tron-xlsx-tab{padding:5px 12px;font-size:12px;border:1px solid var(--line2,#e2e8f0);border-radius:8px;cursor:pointer;color:var(--muted,#64748b);background:transparent;user-select:none}
  .tron-xlsx-tab.active{background:var(--primary,#2563EB);border-color:var(--primary,#2563EB);color:#fff;font-weight:650}
  .tron-xlsx-sheet{padding:10px}
  .tron-xlsx-table{border-collapse:collapse;font-size:12.5px;min-width:100%;background:var(--surface,var(--card,#fff))}
  .tron-xlsx-table th,.tron-xlsx-table td{border:1px solid var(--line2,#e2e8f0);padding:4px 8px;text-align:left;vertical-align:top;white-space:pre-wrap;word-break:break-word;max-width:340px}
  .tron-xlsx-table thead th{position:sticky;top:0;background:var(--card,#fff);color:var(--muted,#64748b);font-weight:650;text-align:center}
  .tron-xlsx-rowhead{background:var(--card,#fff);color:var(--muted,#64748b);font-weight:600;text-align:center!important;width:44px}
  .tron-rtf{overflow:auto;margin:0;padding:20px 24px;box-sizing:border-box;white-space:pre-wrap;word-break:break-word;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
  /* ── HOMEWORK_MOBILE_SHEET_V1（fix44）：手機版作業詳情＝全螢幕分頁 ──────────
     手機截圖（2026-09-15）看到的兩個問題：
       ① 面板原本用 `max-height:88vh`：iOS Safari 的 `vh` 是「最大視窗」高度，
          比實際看得到的區域高，面板上緣於是跑到畫面外（標題列與說明開頭看不到），
          而且因為遮罩是 position:fixed，使用者怎麼捲都捲不到。
       ② 共用底部導覽列 `#mobileNavFinalV2` 的 z-index 是 2147482500，任何彈窗都
          壓不過它 → 它直接蓋在彈窗內容上（截圖裡「繳交作業」整個被擋住）。
     做法：貼滿動態視窗（100dvh）、標題列與底部按鈕列固定不動、避開瀏海與 Home
     指示器安全區；浮層開著時把 `body` 鎖住並把共用導覽列收起來。
     僅在 ≤820px（共用導覽列的顯示斷點）生效，桌機版面完全不動。 */
  @media (max-width:820px){
    /* 浮層開著時：鎖住背景、收起底部導覽列。
       class 刻意寫兩次（`.hw-overlay-open.hw-overlay-open`）拉高 specificity：
       共用導覽列的顯示規則 `html.dash-auth-ok body #mobileNavFinalV2{…!important}`
       與本檔同等級，而 mobile-navigation.css 是執行時才插進 <head>（排在後面），
       不這樣寫會壓不過它。 */
    body.hw-overlay-open{overflow:hidden!important}
    html body.hw-overlay-open.hw-overlay-open #mobileNavFinalV2,
    html body.hw-overlay-open.hw-overlay-open #ttMobileNavV2{display:none!important}

    /* ── 作業詳情：全螢幕分頁 ─────────────────────────────── */
    .hw-detail-mask{padding:0;align-items:stretch}
    .hw-detail-panel{width:100%;max-width:100%;max-height:none;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
    .hw-detail-head{padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px;align-items:center;flex-shrink:0}
    .hw-detail-head h2{font-size:16px}
    .hw-detail-close{min-width:44px;min-height:44px;font-size:20px;margin:-8px -6px -8px 0}
    .hw-detail-sub{padding:8px 14px 0;font-size:12.5px;gap:4px 12px;flex-shrink:0}
    /* min-height:0：欄向 flex 子項的預設 min-height 是 auto，少了它內容一長就會
       把面板撐出視窗外（正是截圖中「捲不到、上下都被切掉」的另一半原因）。 */
    .hw-detail-body{padding:10px 14px 18px;font-size:15px;line-height:1.75;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
    .hw-detail-body h3{margin:16px 0 6px;font-size:13px;letter-spacing:.02em}
    .hw-detail-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));gap:8px;flex-shrink:0}
    .hw-detail-foot .button{flex:1 1 0;min-height:46px;display:inline-flex;align-items:center;justify-content:center;text-align:center}

    /* 老師的說明多半是從 Word／Google Docs 貼過來的，帶著固定 px 字級與英文字型
       （實測樣本：`font-family: arial, sans-serif; font-size: 14px; line-height: 18pt`），
       在手機上會變成一頁十幾個字。這裡統一成面板的字型與字級；顏色、粗體、底線
       等「強調」全部保留。 */
    .hw-detail-desc{font-size:15px;line-height:1.75;overflow-wrap:anywhere}
    .hw-detail-desc *{max-width:100%;font-family:inherit!important}
    .hw-detail-desc [style*="font-size"],.hw-detail-desc font[size]{font-size:inherit!important}
    .hw-detail-desc [style*="line-height"]{line-height:1.75!important}
    .hw-detail-desc p{margin:0 0 10px}
    .hw-detail-desc h1,.hw-detail-desc h2{font-size:17px}
    .hw-detail-desc h3,.hw-detail-desc h4{font-size:15.5px}
    /* Word 貼上常見的 `<p><br></p>` 空段落，在手機上是一整片空白（截圖中段那塊）。 */
    .hw-detail-desc p:has(> br:only-child){display:none}
    /* 寬表格改橫向捲動，不要把整頁撐爆。 */
    .hw-detail-desc table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse}
    .hw-detail-desc ul,.hw-detail-desc ol{padding-left:20px;margin:0 0 10px}

    /* ── 附件列／繳交檔列：44px 觸控目標、檔名自成一列 ─────── */
    .hw-detail-attach li,.hw-submit-files li{flex-wrap:wrap;gap:6px 10px;padding:10px 0}
    .hw-detail-attach .attach-name,.hw-submit-files .file-name{flex:1 1 100%;min-width:0}
    .hw-detail-attach .attach-size,.hw-submit-files .file-size{flex:1 1 auto}
    .hw-file-preview,.hw-file-download{min-height:40px;padding:8px 14px;display:inline-flex;align-items:center;justify-content:center}
    .hw-submit-files{list-style:none;padding-left:0;margin-top:8px}

    /* ── 繳交表單：iOS 聚焦不自動放大（字級必須 ≥16px）、按鈕加大 ── */
    .hw-submit{margin-top:18px;padding-top:14px}
    .hw-submit input[type=file],.hw-submit textarea,.hw-submit input[type=text],.hw-submit input[type=url]{font-size:16px}
    .hw-submit textarea{min-height:96px}
    .hw-submit-actions{gap:8px;margin-top:16px}
    .hw-submit-actions .button{flex:1 1 auto;min-height:46px;display:inline-flex;align-items:center;justify-content:center}
    .hw-submit-picked li{padding:8px 0}
    .hw-submit-picked .pick-remove{min-width:40px;min-height:40px;font-size:16px}
    .hw-submit-status{padding:12px 13px;font-size:13.5px}

    /* ── 檔案預覽浮層（fix43）：同樣貼滿並避開安全區 ─────────── */
    .hw-preview{padding:0}
    .hw-preview-panel{max-width:none;height:100vh;height:100dvh;border-radius:0}
    .hw-preview-head{padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;flex-wrap:wrap;flex-shrink:0}
    .hw-preview-actions .button{min-height:40px;display:inline-flex;align-items:center}
    .hw-preview-body{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
    .hw-preview-frame{min-height:60vh}
  }
</style>
</head>
<body>
<div class="shell">

  </header>

  <section class="hw-statusbar">
    <div class="hw-statusbar-info">
      <span class="dot good" aria-hidden="true"></span>
      <div class="hw-statusbar-text">
        <div class="hw-statusbar-title">作業追蹤已啟用</div>
        <div class="hw-statusbar-sub">最後更新：<span id="lastUpdated">—</span></div>
      </div>
    </div>
    <div class="hw-statusbar-actions">
      <button class="pill-btn refresh" id="refreshBtn" type="button" title="重新整理">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 11-3.5-7.1"/><path d="M21 3v6h-6"/></svg>
        <span>重新整理</span>
      </button>
      <button class="pill-btn notify" id="testNotifyBtn" type="button" title="發送一則測試通知，確認 Discord / LINE / 手機推播是否正常">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        <span>測試通知</span>
      </button>
    </div>
  </section>

  <section class="hw-group hidden-init" id="accountSelectorWrap">
    <h2 class="hw-group-title">帳號</h2>
    <div class="hw-group-body">
      <div class="hw-row">
        <label class="hw-row-key" for="accountSelect">目前帳號</label>
        <select id="accountSelect" class="hw-row-select"></select>
      </div>
    </div>
  </section>

  <section class="hw-group">
    <h2 class="hw-group-title">繳交概況</h2>
    <div class="hw-group-body">

      <div class="hw-row">
        <span class="hw-row-key">24 小時內即將截止</span>
        <b class="hw-row-val urgent" id="statUrgent">—</b>
      </div>
      <div class="hw-row">
        <span class="hw-row-key">7 天內待辦作業</span>

  </section>

  <section class="hw-group">
    <h2 class="hw-group-title">篩選</h2>
    <div class="hw-group-body">
    <div class="controls">
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="pending" type="button">⏳ 未繳交 <span class="badge-count" id="countPending">0</span></button>
      <button class="filter-tab" data-filter="urgent" type="button">🚨 24h 緊急 <span class="badge-count" id="countUrgent">0</span></button>
      <button class="filter-tab" data-filter="all" type="button">📋 全部 <span class="badge-count" id="countAll">0</span></button>
      <button class="filter-tab" data-filter="submitted" type="button">✅ 已繳交 <span class="badge-count" id="countSubmitted">0</span></button>
      <button class="filter-tab" data-filter="overdue" type="button">🚫 已逾期 <span class="badge-count" id="countOverdue">0</span></button>
      <button class="filter-tab" data-filter="nolimit" type="button">🔓 無期限 <span class="badge-count" id="countNolimit">0</span></button>
    </div>

    <div class="filter-dropdowns">
      <!-- HOMEWORK_PAGE_CURRENT_ONLY_V1（fix45）：預設只顯示當學期作業。
           判定在伺服器端做（semester_current），這裡只是「要看哪個範圍」的開關。 -->
      <select id="semesterScope" aria-label="學期範圍" title="預設只顯示本學期作業">
        <option value="current">🗓️ 只看當學期</option>
        <option value="all">🗂️ 含舊學期作業</option>

        <option value="">全部課程</option>

        <option value="deadline_asc">截止時間（由近到遠）</option>

        <option value="course">課程名稱</option>
      </select>
      <input type="search" id="searchInput" placeholder="搜尋作業名稱 / 課程..." aria-label="搜尋作業">
    </div>

    </div>

  <main id="homeworkContainer" class="hw-grid mt14">
