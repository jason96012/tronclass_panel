<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>點名偵測排程｜Tronclass</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg,#07111f);color:var(--text,#e8eef7);font-family:Inter,"Noto Sans TC",system-ui,sans-serif;min-height:100vh}.shell{width:min(1080px,calc(100% - 28px));margin:auto;padding:28px 0 96px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#38bdf8,#6366f1);display:grid;place-items:center;font-weight:900;box-shadow:0 10px 30px #2563eb55}.top a,.button{color:inherit;text-decoration:none;border:1px solid var(--line,#26364d);background:var(--panel,#101c2d);padding:10px 15px;border-radius:12px;font-weight:750}.hero{padding:26px;border:1px solid var(--line,#26364d);border-radius:24px;background:radial-gradient(circle at 90% 0,#2563eb30,transparent 42%),var(--panel,#101c2d);margin-bottom:18px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#7dd3fc;font-weight:850}.hero h1{font-size:clamp(25px,4vw,38px);margin:8px 0}.hero p{margin:0;color:var(--muted,#94a3b8);line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid var(--line,#26364d);border-radius:20px;background:var(--panel,#101c2d);padding:20px}.card h2{font-size:17px;margin:0 0 16px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.status{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#17243a;font-size:13px;font-weight:800}.dot{width:9px;height:9px;border-radius:50%;background:#64748b}.status.active{color:#86efac;background:#14532d66}.status.active .dot{background:#22c55e;box-shadow:0 0 0 5px #22c55e22}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:17px}.field label{display:block;color:var(--muted,#94a3b8);font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,select{width:100%;border:1px solid var(--line,#26364d);background:#091525;color:inherit;border-radius:12px;padding:12px;font:inherit}.switch{display:flex;align-items:center;justify-content:space-between;gap:15px;border:1px solid var(--line,#26364d);padding:14px;border-radius:14px}.switch input{width:22px;height:22px;accent-color:#38bdf8}.actions{display:flex;align-items:center;gap:12px;margin-top:18px}.primary{border:0;color:white;background:linear-gradient(135deg,#0284c7,#4f46e5);padding:12px 20px;border-radius:12px;font-weight:850;cursor:pointer}.primary:disabled{opacity:.55}.hint,.meta{color:var(--muted,#94a3b8);font-size:13px;line-height:1.6}.message{min-height:22px;margin-top:12px;font-size:14px}.good{color:#86efac}.bad{color:#fca5a5}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.metric{background:#091525;border:1px solid var(--line,#26364d);padding:13px;border-radius:14px}.metric b{display:block;font-size:20px;margin-top:3px}.windows{display:grid;gap:10px}.window{border:1px solid var(--line,#26364d);border-radius:14px;padding:14px;background:#091525}.window strong{display:block;margin-bottom:5px}.empty{padding:24px;text-align:center;color:var(--muted,#94a3b8);border:1px dashed var(--line,#26364d);border-radius:14px}.wide{grid-column:1/-1}.lesson-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.lesson{display:flex;justify-content:space-between;gap:14px;padding:13px;border:1px solid var(--line,#26364d);border-radius:13px;background:#091525}.lesson .time{white-space:nowrap;color:#7dd3fc;font-weight:800}.footer-nav{position:fixed;bottom:0;left:0;right:0;background:#07111feF;backdrop-filter:blur(16px);border-top:1px solid var(--line,#26364d);display:flex;justify-content:center;gap:8px;padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom))}.footer-nav a{color:#94a3b8;text-decoration:none;padding:9px 14px;border-radius:11px;font-size:13px;font-weight:750}.footer-nav a.active{background:#1e3a5f;color:#bae6fd}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.fields,.lesson-list{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.shell{width:min(100% - 20px,1080px);padding-top:16px}.hero,.card{padding:17px}.top{align-items:flex-start}.footer-nav{justify-content:space-around}.footer-nav a{padding:9px 8px}}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><div class="brand"><div class="logo">D</div><div><b>Tronclass</b><div class="meta">Detection Scheduler</div></div></div><a href="/admin/dashboard">返回 Dashboard</a></header>
  <section class="hero"><div class="eyebrow">TIMETABLE-AWARE MONITORING</div><h1>點名偵測排程</h1><p>上課前提早進入高頻偵測，下課後保留緩衝時間；其他時間改用低頻巡檢，降低請求量同時避免漏掉臨時點名。</p></section>
  <div class="grid">
    <section class="card">
      <div class="toolbar"><h2>帳號與即時狀態</h2><span id="statusBadge" class="status"><i class="dot"></i><span>讀取中</span></span></div>
      <div class="field"><label for="account">套用帳號</label><select id="account"></select></div>
      <div class="summary"><div class="metric"><span class="meta">可用課程</span><b id="usable">-</b></div><div class="metric"><span class="meta">課內頻率</span><b id="insideRate">-</b></div><div class="metric"><span class="meta">課外頻率</span><b id="outsideRate">-</b></div></div>
      <div id="activeWindows" class="windows"></div>
      <div id="serverTime" class="meta" style="margin-top:12px"></div>
    </section>
    <section class="card">
      <h2>偵測規則</h2>
      <div class="switch"><div><b>依課表調整偵測</b><div class="hint">關閉時恢復 provider 原始排程</div></div><input id="enabled" type="checkbox"></div>
      <div class="fields">
        <div class="field"><label for="before">上課前（分鐘）</label><input id="before" type="number" min="0" max="180" step="1"></div>
        <div class="field"><label for="after">下課後（分鐘）</label><input id="after" type="number" min="0" max="180" step="1"></div>
        <div class="field" style="grid-column:1/-1"><label for="outside">課外巡檢間隔（分鐘）</label><input id="outside" type="number" min="1" max="60" step="1"></div>
      </div>
      <div class="hint" style="margin-top:14px">課內使用系統目前的正常輪詢頻率。儲存後會立即喚醒該帳號監控器並套用設定。</div>
      <div class="actions"><button id="save" class="primary">儲存設定</button><button id="reload" class="button" type="button">重新整理</button></div><div id="message" class="message"></div>
    </section>
    <section class="card wide"><div class="toolbar"><h2>每週課表偵測依據</h2><a class="button" href="/admin/timetable">編輯課表</a></div><div id="lessons" class="lesson-list"></div></section>
  </div>
</div>
<nav class="footer-nav"><a href="/admin/dashboard">總覽</a><a href="/admin/timetable">課表</a><a class="active" href="/admin/detection-schedule">偵測排程</a><a href="/admin/files">教材</a></nav>
<script>
(function(){'use strict';
const q=id=>document.getElementById(id), days={mon:'週一',tue:'週二',wed:'週三',thu:'週四',fri:'週五',sat:'週六',sun:'週日'};
let status=null,current=null;
async function parse(res){let body={};try{body=await res.json()}catch(_){}if(res.status===401||res.status===403){location.replace('/admin');throw new Error('登入已失效')}if(!res.ok)throw new Error(body.error||('HTTP '+res.status));return body}
function api(path,opts){return fetch(path,Object.assign({credentials:'same-origin',cache:'no-store'},opts||{})).then(parse)}
function escText(el,text){el.textContent=text==null?'':String(text)}
function chosen(){return q('account').value}
function fillAccounts(){const rows=(status&&status.accounts)||[], old=chosen();q('account').replaceChildren();rows.forEach(a=>{const o=document.createElement('option');o.value=a.account_id;o.textContent=a.account_id+(a.user_name?' · '+a.user_name:'');q('account').appendChild(o)});const own=status&&status.current_account_id;if(old&&rows.some(a=>a.account_id===old))q('account').value=old;else if(own&&own!=='<token-admin>')q('account').value=own}
function formatRate(sec){sec=Number(sec||0);return sec<60?sec+' 秒':Math.round(sec/60)+' 分'}
function render(body){current=body;const p=body.preference||{},e=body.evaluation||{},entries=body.entries||[];q('enabled').checked=!!p.enabled;q('before').value=p.minutes_before??10;q('after').value=p.minutes_after??10;q('outside').value=Math.max(1,Math.round(Number(p.outside_interval_secs||300)/60));escText(q('usable'),e.usable_entries??0);escText(q('insideRate'),formatRate(status.default_poll_interval_secs||10));escText(q('outsideRate'),formatRate(p.outside_interval_secs||300));const badge=q('statusBadge');badge.classList.toggle('active',!!(p.enabled&&e.active));badge.querySelector('span').textContent=!p.enabled?'課表排程已關閉':e.active?'課表區間內':'課外低頻巡檢';const box=q('activeWindows');box.replaceChildren();if(e.active_windows&&e.active_windows.length)e.active_windows.forEach(w=>{const d=document.createElement('div');d.className='window';const b=document.createElement('strong');b.textContent=w.course_name;const m=document.createElement('div');m.className='meta';m.textContent='上課 '+w.class_start+'–'+w.class_end+'｜偵測 '+w.detection_start+'–'+w.detection_end;d.append(b,m);box.appendChild(d)});else{const d=document.createElement('div');d.className='empty';d.textContent=e.usable_entries?'目前不在任何課程的高頻偵測區間':'尚無可用課表，將依課外頻率巡檢';box.appendChild(d)}escText(q('serverTime'),'伺服器時間：'+(body.server_time||'-'));renderLessons(entries)}
function renderLessons(rows){const root=q('lessons');root.replaceChildren();if(!rows.length){const d=document.createElement('div');d.className='empty';d.textContent='尚未建立課表。請先前往課表頁新增課程。';root.appendChild(d);return}rows.forEach(x=>{const d=document.createElement('div');d.className='lesson';const left=document.createElement('div');const b=document.createElement('b');b.textContent=x.course_name||'未命名課程';const m=document.createElement('div');m.className='meta';m.textContent=(days[x.weekday]||x.weekday)+' · '+(x.classroom||'未設定教室');left.append(b,m);const tm=document.createElement('div');tm.className='time';tm.textContent=(x.start_time||('第 '+x.period_start+' 節'))+' – '+(x.end_time||('第 '+x.period_end+' 節'));d.append(left,tm);root.appendChild(d)})}
async function load(){q('message').textContent='讀取中…';try{const body=await api('/admin/api/detection-schedule?account_id='+encodeURIComponent(chosen()));render(body);q('message').textContent=''}catch(e){q('message').className='message bad';q('message').textContent=e.message}}
async function boot(){try{status=await api('/admin/api/status?include_history=false');fillAccounts();await load()}catch(e){q('message').className='message bad';q('message').textContent=e.message}}
async function save(){const btn=q('save');btn.disabled=true;q('message').className='message';q('message').textContent='儲存中…';try{await api('/admin/api/detection-schedule',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({account_id:chosen(),enabled:q('enabled').checked,minutes_before:Number(q('before').value),minutes_after:Number(q('after').value),outside_interval_secs:Number(q('outside').value)*60})});q('message').className='message good';q('message').textContent='設定已儲存並立即套用';await load()}catch(e){q('message').className='message bad';q('message').textContent=e.message}finally{btn.disabled=false}}
q('account').addEventListener('change',load);q('reload').addEventListener('click',load);q('save').addEventListener('click',save);boot();
})();
</script>

</body></html>
