<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>點名偵測排程｜Tronclass</title>
<style>
:root{
  color-scheme:light;
  --ds-bg:#f5f7fb;--ds-card:#ffffff;--ds-soft:#f1f5f9;--ds-soft-strong:#e8eef7;
  --ds-text:#172033;--ds-muted:#64748b;--ds-line:#d8e0eb;--ds-line-soft:#e8edf4;
  --ds-input:#ffffff;--ds-shadow:0 10px 30px rgba(15,23,42,.07);
  --ds-hero-a:#eff6ff;--ds-hero-b:#e8f0ff;--ds-hero-text:#172033;
}
@media(prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --ds-bg:#0f141d;--ds-card:#161d29;--ds-soft:#111827;--ds-soft-strong:#1e293b;
    --ds-text:#eef2ff;--ds-muted:#9aa4b5;--ds-line:#303948;--ds-line-soft:#252e3c;
    --ds-input:#101722;--ds-shadow:0 14px 36px rgba(0,0,0,.24);
    --ds-hero-a:#111d2d;--ds-hero-b:#13294b;--ds-hero-text:#f1f5f9;
  }
}
html[data-theme="light"]{color-scheme:light;--ds-bg:#f5f7fb;--ds-card:#fff;--ds-soft:#f1f5f9;--ds-soft-strong:#e8eef7;--ds-text:#172033;--ds-muted:#64748b;--ds-line:#d8e0eb;--ds-line-soft:#e8edf4;--ds-input:#fff;--ds-shadow:0 10px 30px rgba(15,23,42,.07);--ds-hero-a:#eff6ff;--ds-hero-b:#e8f0ff;--ds-hero-text:#172033}
html[data-theme="dark"]{color-scheme:dark;--ds-bg:#0f141d;--ds-card:#161d29;--ds-soft:#111827;--ds-soft-strong:#1e293b;--ds-text:#eef2ff;--ds-muted:#9aa4b5;--ds-line:#303948;--ds-line-soft:#252e3c;--ds-input:#101722;--ds-shadow:0 14px 36px rgba(0,0,0,.24);--ds-hero-a:#111d2d;--ds-hero-b:#13294b;--ds-hero-text:#f1f5f9}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ds-bg)!important;color:var(--ds-text)!important}
body{font-family:Inter,"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.shell{width:min(1400px,calc(100% - 64px));margin:auto;padding:32px 0 52px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}.brand b{color:var(--ds-text)}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#38bdf8,#4f46e5);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 10px 26px rgba(37,99,235,.28)}
.top a,.button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;color:var(--ds-text)!important;text-decoration:none;border:1px solid var(--ds-line)!important;background:var(--ds-card)!important;padding:0 16px;border-radius:999px;font-weight:760;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.top a:hover,.button:hover{border-color:#60a5fa!important;color:#2563eb!important}
.hero{padding:28px;border:1px solid var(--ds-line-soft);border-radius:24px;background:radial-gradient(circle at 92% 0,rgba(37,99,235,.15),transparent 44%),linear-gradient(135deg,var(--ds-hero-a),var(--ds-hero-b));box-shadow:var(--ds-shadow);margin-bottom:18px;color:var(--ds-hero-text)}
.eyebrow{font-size:12px;letter-spacing:.13em;color:#0284c7;font-weight:850}.hero h1{font-size:clamp(26px,4vw,38px);margin:8px 0;color:var(--ds-hero-text)}.hero p{margin:0;color:var(--ds-muted);line-height:1.75}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.wide{grid-column:1/-1}
.card{border:1px solid var(--ds-line-soft);border-radius:20px;background:var(--ds-card);padding:20px;box-shadow:var(--ds-shadow);color:var(--ds-text)}
.card h2{font-size:17px;margin:0 0 16px;color:var(--ds-text)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--ds-soft-strong);color:var(--ds-muted);font-size:13px;font-weight:800}.dot{width:9px;height:9px;border-radius:50%;background:#64748b}.status.active{color:#15803d;background:rgba(34,197,94,.13)}.status.active .dot{background:#22c55e;box-shadow:0 0 0 5px rgba(34,197,94,.12)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:17px}.field label{display:block;color:var(--ds-muted);font-size:13px;font-weight:700;margin-bottom:7px}
.field input,.field select,select{width:100%;min-height:44px;border:1px solid var(--ds-line)!important;background:var(--ds-input)!important;color:var(--ds-text)!important;border-radius:12px;padding:0 12px;font:inherit;outline:none}.field input:focus,.field select:focus,select:focus{border-color:#3b82f6!important;box-shadow:0 0 0 3px rgba(59,130,246,.13)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:15px;border:1px solid var(--ds-line);background:var(--ds-soft);padding:14px;border-radius:14px}.switch input{width:22px;height:22px;accent-color:#2563eb}
.actions{display:flex;align-items:center;gap:12px;margin-top:18px}.primary{display:inline-flex;align-items:center;justify-content:center;min-height:42px;border:0;color:#fff;background:linear-gradient(135deg,#0284c7,#4f46e5);padding:0 20px;border-radius:999px;font-weight:850;cursor:pointer}.primary:disabled{opacity:.55}.hint,.meta{color:var(--ds-muted)!important;font-size:13px;line-height:1.6}.message{min-height:22px;margin-top:12px;font-size:14px}.good{color:#16a34a}.bad{color:#dc2626}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.metric{background:var(--ds-soft);border:1px solid var(--ds-line-soft);padding:13px;border-radius:14px}.metric b{display:block;color:var(--ds-text);font-size:20px;margin-top:3px}
.windows{display:grid;gap:10px}.window{border:1px solid var(--ds-line-soft);border-radius:14px;padding:14px;background:var(--ds-soft)}.window strong{display:block;margin-bottom:5px;color:var(--ds-text)}.empty{padding:24px;text-align:center;color:var(--ds-muted);border:1px dashed var(--ds-line);border-radius:14px;background:var(--ds-soft)}
.lesson-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.lesson{display:flex;justify-content:space-between;gap:14px;padding:13px;border:1px solid var(--ds-line-soft);border-radius:13px;background:var(--ds-soft)}.lesson b{color:var(--ds-text)}.lesson .time{white-space:nowrap;color:#0284c7;font-weight:800}
@media(min-width:1100px){
  .top{margin-bottom:28px}.hero{padding:34px 38px;margin-bottom:24px}.hero p{max-width:980px}
  .grid{grid-template-columns:minmax(460px,.9fr) minmax(620px,1.1fr);gap:24px;align-items:start}.card{padding:28px;border-radius:22px}.card h2{font-size:19px;margin-bottom:20px}
  .summary{gap:14px;margin:20px 0}.metric{padding:17px}.metric b{font-size:23px}.fields{gap:18px;margin-top:20px}.switch{padding:18px}.actions{margin-top:22px}.lesson-list{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.lesson{padding:16px}
}
@media(min-width:761px) and (max-width:1099px){
  .shell{width:min(900px,calc(100% - 40px))}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.lesson-list{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:760px){
  .shell{width:min(100% - 20px,1400px);padding:14px 0 calc(28px + env(safe-area-inset-bottom))}.top{min-height:70px;margin-bottom:16px;padding:8px 4px}.brand{gap:13px}.logo{width:48px;height:48px;border-radius:14px;font-size:20px}.brand b{display:block;font-size:19px;line-height:1.2}.brand .meta{font-size:13px;margin-top:3px}.top a{min-height:46px;padding:0 16px;font-size:14px}
  .hero{padding:20px 17px;border-radius:19px;margin-bottom:12px}.hero h1{font-size:27px}.hero p{font-size:14px;line-height:1.65}
  .grid{grid-template-columns:1fr;gap:12px}.wide{grid-column:auto}.card{padding:16px;border-radius:17px;box-shadow:0 5px 18px rgba(15,23,42,.06)}.fields,.lesson-list{grid-template-columns:1fr}.summary{grid-template-columns:repeat(3,1fr);gap:7px}.metric{padding:10px}.metric b{font-size:17px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .primary,.actions .button{width:100%}.lesson{align-items:flex-start}.lesson .time{font-size:12px}
}
@media(max-width:390px){.top{padding-inline:0}.brand{gap:9px}.logo{width:44px;height:44px}.brand b{font-size:17px}.brand .meta{font-size:11px}.top a{min-height:42px;padding:0 11px;font-size:12px}.summary{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><div class="brand"><div class="logo">D</div><div><b>Tronclass</b><div class="meta">Detection Scheduler</div></div></div><a id="backDashboard" href="/admin#overview" aria-label="返回 Dashboard 總覽">返回 Dashboard</a></header>
  <section class="hero"><div class="eyebrow">TIMETABLE-AWARE MONITORING</div><h1>點名偵測排程</h1><p>每日 19:00 至隔日 07:00 完全停止簽到列表輪詢；07:00 至 19:00 依課表區間使用課內或課外頻率。</p></section>
  <div class="grid">
    <section class="card">
      <div class="toolbar"><h2>帳號與即時狀態</h2><span id="statusBadge" class="status"><i class="dot"></i><span>讀取中</span></span></div>
      <div class="field"><label for="account">套用帳號</label><select id="account"></select></div>
      <div class="summary"><div class="metric"><span class="meta">可用課程</span><b id="usable">-</b></div><div class="metric"><span class="meta">課內頻率</span><b id="insideRate">-</b></div><div class="metric"><span class="meta">課外頻率</span><b id="outsideRate">-</b></div></div>
      <div id="activeWindows" class="windows"></div>
      <div id="serverTime" class="meta" style="margin-top:12px"></div>
    </section>
    <section class="card">
      <h2>偵測規則</h2>
      <div class="switch"><div><b>依課表調整偵測</b><div class="hint">關閉時恢復 provider 原始輪詢排程</div></div><input id="enabled" type="checkbox"></div>
      <div class="fields">
        <div class="field"><label for="before">上課前（分鐘）</label><input id="before" type="number" min="0" max="180" step="1"></div>
        <div class="field"><label for="after">下課後（分鐘）</label><input id="after" type="number" min="0" max="180" step="1"></div>
        <div class="field" style="grid-column:1/-1"><label for="outside">課外巡檢間隔（分鐘）</label><input id="outside" type="number" min="1" max="60" step="1"></div>
      </div>
      <div class="hint" style="margin-top:14px">07:00–19:00：課內使用系統正常頻率，課外使用上方頻率。19:00–07:00：停止自動輪詢。儲存後立即套用。</div>
      <div class="actions"><button id="save" class="primary">儲存設定</button><button id="reload" class="button" type="button">重新整理</button></div><div id="message" class="message"></div>
    </section>
    <section class="card wide"><div class="toolbar"><h2>每週課表偵測依據</h2><a class="button" href="/admin/timetable">編輯課表</a></div><div id="lessons" class="lesson-list"></div></section>
  </div>
</div>
<script>
(function(){'use strict';
const q=id=>document.getElementById(id), days={mon:'週一',tue:'週二',wed:'週三',thu:'週四',fri:'週五',sat:'週六',sun:'週日'};
let status=null,current=null;
async function parse(res){let body={};try{body=await res.json()}catch(_){}if(res.status===401||res.status===403){location.replace('/admin');throw new Error('登入已失效')}if(!res.ok)throw new Error(body.error||('HTTP '+res.status));return body}
function api(path,opts){return fetch(path,Object.assign({credentials:'same-origin',cache:'no-store'},opts||{})).then(parse)}
function escText(el,text){el.textContent=text==null?'':String(text)}
function chosen(){return q('account').value}
function fillAccounts(){const rows=(status&&status.accounts)||[], old=chosen();q('account').replaceChildren();rows.forEach(a=>{const o=document.createElement('option');o.value=a.account_id;o.textContent=a.account_id+(a.user_name?' · '+a.user_name:'');q('account').appendChild(o)});const own=status&&status.current_account_id;if(old&&rows.some(a=>a.account_id===old))q('account').value=old;else if(own&&own!=='<token-admin>')q('account').value=own}
function formatRate(sec){sec=Number(sec||0);return sec<60?sec+' 秒':Math.round(sec/60)+' 分'}
function render(body){current=body;const p=body.preference||{},e=body.evaluation||{},entries=body.entries||[],night=!!body.night_pause_active;q('enabled').checked=!!p.enabled;q('before').value=p.minutes_before??10;q('after').value=p.minutes_after??10;q('outside').value=Math.max(1,Math.round(Number(p.outside_interval_secs||300)/60));escText(q('usable'),e.usable_entries??0);escText(q('insideRate'),formatRate(status.default_poll_interval_secs||10));escText(q('outsideRate'),formatRate(p.outside_interval_secs||300));const badge=q('statusBadge');badge.classList.toggle('active',!!(p.enabled&&!night));badge.querySelector('span').textContent=!p.enabled?'課表排程已關閉':night?'夜間停止輪詢':e.active?'課表區間內':'課外頻率輪詢';const box=q('activeWindows');box.replaceChildren();if(e.active_windows&&e.active_windows.length)e.active_windows.forEach(w=>{const d=document.createElement('div');d.className='window';const b=document.createElement('strong');b.textContent=w.course_name;const m=document.createElement('div');m.className='meta';m.textContent='上課 '+w.class_start+'–'+w.class_end+'｜偵測 '+w.detection_start+'–'+w.detection_end;d.append(b,m);box.appendChild(d)});else{const d=document.createElement('div');d.className='empty';d.textContent=night&&p.enabled?'目前為 19:00–07:00 夜間停止時段':e.usable_entries?'目前不在課內區間，依課外頻率輪詢':'尚無可用課表，日間依課外頻率輪詢';box.appendChild(d)}escText(q('serverTime'),'伺服器時間：'+(body.server_time||'-'));renderLessons(entries)}
function renderLessons(rows){const root=q('lessons');root.replaceChildren();if(!rows.length){const d=document.createElement('div');d.className='empty';d.textContent='尚未建立課表。請先前往課表頁新增課程。';root.appendChild(d);return}rows.forEach(x=>{const d=document.createElement('div');d.className='lesson';const left=document.createElement('div');const b=document.createElement('b');b.textContent=x.course_name||'未命名課程';const m=document.createElement('div');m.className='meta';m.textContent=(days[x.weekday]||x.weekday)+' · '+(x.classroom||'未設定教室');left.append(b,m);const tm=document.createElement('div');tm.className='time';tm.textContent=(x.start_time||('第 '+x.period_start+' 節'))+' – '+(x.end_time||('第 '+x.period_end+' 節'));d.append(left,tm);root.appendChild(d)})}
async function load(){q('message').textContent='讀取中…';try{const body=await api('/admin/api/detection-schedule?account_id='+encodeURIComponent(chosen()));render(body);q('message').textContent=''}catch(e){q('message').className='message bad';q('message').textContent=e.message}}
async function boot(){try{status=await api('/admin/api/status?include_history=false');fillAccounts();await load()}catch(e){q('message').className='message bad';q('message').textContent=e.message}}
async function save(){const btn=q('save');btn.disabled=true;q('message').className='message';q('message').textContent='儲存中…';try{await api('/admin/api/detection-schedule',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({account_id:chosen(),enabled:q('enabled').checked,minutes_before:Number(q('before').value),minutes_after:Number(q('after').value),outside_interval_secs:Number(q('outside').value)*60})});q('message').className='message good';q('message').textContent='設定已儲存並立即套用';await load()}catch(e){q('message').className='message bad';q('message').textContent=e.message}finally{btn.disabled=false}}
q('account').addEventListener('change',load);q('reload').addEventListener('click',load);q('save').addEventListener('click',save);boot();
})();
</script>
<style id="MOBILE_HIDE_BACK_V1">@media(max-width:820px){#backDashboard{display:none!important}}</style>
<script src="/admin/static/js/mobile-nav.js?v=mnav6"></script>
</body></html>
