<script id="SUBPAGE_TOKEN_BOOT_V1">
(function(){
  if(window.SUBPAGE_TOKEN_BOOT_V1) return;
  window.SUBPAGE_TOKEN_BOOT_V1 = true;
  try{
    var u=new URL(location.href);
    var tok=(u.searchParams.get('token')||window.__tronBootToken||'').trim();
    if(tok) window.__tronBootToken=tok;
  }catch(_){}
  var native=window.fetch;
  window.fetch=function(input, init){
    try{
      var tok=window.__tronBootToken||'';
      var url=new URL(typeof input==='string'?input:(input&&input.url)||'', location.origin);
      if(tok && url.origin===location.origin && url.pathname.indexOf('/admin/api/')===0 &&
         url.pathname!=='/admin/api/login' && !url.searchParams.get('token')){
        // F-03: token removed, auth via HttpOnly cookie
        input=url.pathname+url.search+url.hash;
      }
    }catch(_){}
    return native.apply(this, arguments);
  };
  document.addEventListener('click', function(ev){
    var a=ev.target && ev.target.closest && ev.target.closest('a[href]');
    if(!a) return;
    try{
      var href=a.getAttribute('href')||'';
      var dest=new URL(href, location.origin);
      if(dest.origin!==location.origin) return;
      if(!(dest.pathname==='/admin'||dest.pathname==='/admin/'||dest.pathname==='/admin/dashboard'||dest.pathname==='/admin/timetable'||dest.pathname.indexOf('/admin/')===0)) return;
      var tok=window.__tronBootToken||'';
      if(tok && !dest.searchParams.get('token')){
        // F-03: token removed, auth via HttpOnly cookie
        a.setAttribute('href', dest.pathname+dest.search+dest.hash);
      }
    }catch(_){}
  }, true);
})();
</script>

<script id="BAN_CRUDE_LOGIN_V1">
(function(){
  if(window.BAN_CRUDE_LOGIN_V1) return;
  window.BAN_CRUDE_LOGIN_V1 = true;
  function isCrude(card){
    if(!card) return false;
    if(card.querySelector('.animated-login-card-inner')) return false;
    var tx=(card.textContent||'').replace(/\s+/g,'');
    return !!(card.querySelector('.login-grid') || tx.indexOf('需要登入')>=0 || tx.indexOf('帳號 / account')>=0);
  }
  function kill(root){
    var scope=root&&root.querySelectorAll?root:document;
    var cards=[];
    if(root&&root.id==='loginCard') cards.push(root);
    try{ cards=cards.concat(Array.prototype.slice.call(scope.querySelectorAll('#loginCard,.login-card,#loginPanel'))); }catch(_){}
    cards.forEach(function(card){
      if(!isCrude(card)) return;
      card.innerHTML='';
      card.hidden=true;
      card.setAttribute('aria-hidden','true');
      card.style.display='none';
    });
  }
  kill(document);
  try{ new MutationObserver(function(ms){ ms.forEach(function(m){ Array.prototype.forEach.call(m.addedNodes||[], function(n){ if(n.nodeType===1) kill(n); }); }); }).observe(document.documentElement,{childList:true,subtree:true}); }catch(_){}
})();
</script>

<meta name="referrer" content="no-referrer">
<script id="hideAdminTokenFromUrlEarlyV1">
(function(){
  'use strict';
  if (window.HIDE_ADMIN_TOKEN_FROM_URL_EARLY_V1) return;
  window.HIDE_ADMIN_TOKEN_FROM_URL_EARLY_V1 = true;
  var LS_SESSION = 'tronclass_admin_session';
  var LS_LOGOUT = 'tronclass_dashboard_manual_logout';
  function sanitizeCurrentUrl(){
    try {
      var u = new URL(location.href);
      var changed = false;
      var token = u.searchParams.get('token') || '';
      if (u.searchParams.get('logout') === '1') {
        localStorage.removeItem(LS_SESSION);
        localStorage.setItem(LS_LOGOUT, '1');
      } else if (token) {
        localStorage.setItem(LS_SESSION, token);
        localStorage.removeItem(LS_LOGOUT);
      }
      if (u.searchParams.has('token')) { u.searchParams.delete('token'); changed = true; }
      if (changed) history.replaceState(null, document.title, u.pathname + (u.search ? u.search : '') + u.hash);
    } catch(_) {}
  }
  sanitizeCurrentUrl();
  window.tronAdminToken = function(){ try { return (localStorage.getItem(LS_SESSION) || '').trim(); } catch(_) { return ''; } };
})();
</script>
<!-- HIDE_ADMIN_TOKEN_FROM_URL_V1_END -->

<script id="consolidatedAdminAuthEarlyV1">
(function(){
  'use strict';
  if (window.COOKIE_SUBPAGE_AUTH_V1) return;
  window.COOKIE_SUBPAGE_AUTH_V1 = true;
  var LO = 'tronclass_dashboard_manual_logout';
  try {
    var p = new URLSearchParams(location.search);
    if (p.get('logout') === '1' || localStorage.getItem(LO) === '1') {
      location.replace('/admin?logout=1');
      return;
    }
    document.documentElement.classList.add('tron-auth-pending');
    fetch('/admin/api/status', {credentials:'same-origin', cache:'no-store'}).then(function(r){
      if (r.ok) {
        document.documentElement.classList.remove('tron-auth-pending','tron-auth-logged-out');
        document.documentElement.classList.add('tron-auth-ok','dash-auth-ok','auth-ok');
        if (document.body) document.body.classList.add('logged-in','auth-ok','dash-auth-ok');
        return;
      }
      var next = encodeURIComponent(location.pathname + location.search + location.hash);
      location.replace('/admin?next=' + next);
    }).catch(function(){
      var next = encodeURIComponent(location.pathname + location.search + location.hash);
      location.replace('/admin?next=' + next);
    });
  } catch(_) {
    location.replace('/admin');
  }
})();
</script>
<!-- CONSOLIDATED_ADMIN_AUTH_V1_HEAD_END -->

<script id="optimizeV47Theme">
(function(){
  'use strict';
  var mq=window.matchMedia('(prefers-color-scheme:dark)');
  var THEME_LS='tronclass_app_settings_v1';
  function themeChoice(){try{var s=JSON.parse(localStorage.getItem(THEME_LS)||'{}');var t=String(s.theme||'auto').toLowerCase();return(t==='light'||t==='dark')?t:'auto'}catch(_){return'auto'}}
  function applyTheme(){var c=themeChoice();document.documentElement.setAttribute('data-theme',c==='auto'?(mq.matches?'dark':'light'):c)}
  /* THEME_CHOICE_V1: 使用者設定（外觀設定頁）優先；auto 才跟隨系統，並同步跨分頁變更 */
  applyTheme();
  try{mq.addEventListener('change',applyTheme)}catch(e){mq.addListener(applyTheme)}
  try{window.addEventListener('storage',function(ev){if(!ev||!ev.key||ev.key===THEME_LS)applyTheme()})}catch(_){}
  window.__setTheme=function(t){document.documentElement.setAttribute('data-theme',t||'dark')};
/* 閃爍防護 failsafe：最多 3 秒後強制顯示 */
setTimeout(function(){document.documentElement.style.visibility='visible'},3000);
})();
</script>

/* ════════════════════════════════════════════════════════
   ═══  手機版互動體驗全面優化（≤820px） ═══
   ════════════════════════════════════════════════════════ */
@media(max-width:820px){
  /* ── 觸控最小尺寸（Apple HIG: 44px）── */
  button,.button,a.button,.tab,.pill,
  input[type="submit"],input[type="button"],
  .nav button,.top-actions a,.top-actions button{
    min-height:44px!important;min-width:44px!important
  }
  .file-actions button,.file-actions a,
  .actions-cell button{min-height:40px!important;min-width:40px!important;padding:0 12px!important}
  /* 小圖示按鈕可略小 */
  button.icon{min-height:38px!important;min-width:38px!important}

  /* ── 觸控回饋 ── */
  button:active,.button:active,.tab:active,a:active{
    opacity:.7!important;transform:scale(.97)!important;
    transition:opacity .08s,transform .08s!important
  }
  /* 防止手機雙擊縮放 */
  button,.button,.tab,a.button,[role="button"]{touch-action:manipulation!important}

  /* ── 輸入框體驗 ── */
  input,select,textarea{font-size:16px!important} /* 避免 iOS 自動縮放 */
  input[type="search"]::-webkit-search-cancel-button{display:block!important}

  /* ── 載入動畫 ── */
  .loading::after{
    content:"";display:block;width:24px;height:24px;margin:16px auto;
    border:3px solid var(--line);border-top-color:var(--primary);
    border-radius:50%;animation:v47-spin .6s linear infinite
  }
  @keyframes v47-spin{to{transform:rotate(360deg)}}
  .loading{position:relative;min-height:60px}

  /* ── Toast 位置（手機底部）── */
  .toast{
    left:12px!important;right:12px!important;bottom:calc(96px + var(--safe,0px))!important;
    width:auto!important;max-width:none!important;transform:none!important;
    border-radius:14px!important;font-size:14px!important;padding:14px 16px!important;
    box-shadow:0 8px 32px rgba(0,0,0,.25)!important
  }
  .toast.ok{border-left:4px solid var(--ok)!important}
  .toast.bad{border-left:4px solid var(--bad)!important}

  /* ── 平滑捲動 ── */
  html{scroll-behavior:smooth!important;-webkit-overflow-scrolling:touch!important}

  /* ── 下拉刷新提示 ── */
  .pull-hint{
    display:none;text-align:center;padding:8px;color:var(--muted);
    font-size:12px;font-weight:600;letter-spacing:.03em
  }
}

/* ════════════════════════════════════════════════════════
   ═══  v47 載入骨架 / 錯誤處理 / 鍵盤體驗  ═══
   ════════════════════════════════════════════════════════ */
/* ── Skeleton 骨架屏 ── */
@keyframes v47-shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skeleton,.skel{
  background:linear-gradient(90deg,var(--soft2) 25%,var(--soft) 50%,var(--soft2) 75%)!important;
  background-size:800px 100%!important;
  animation:v47-shimmer 1.8s ease-in-out infinite!important;
  border-radius:10px!important;color:transparent!important;pointer-events:none!important;
  border-color:transparent!important;box-shadow:none!important;
  min-height:16px!important
}
.skeleton *,.skel *{visibility:hidden!important}
.skel-card{min-height:120px!important;width:100%!important}
.skel-row{min-height:20px!important;width:100%!important;margin-bottom:8px!important}
.skel-row.short{width:60%!important}
.skel-row.medium{width:80%!important}
.skel-btn{min-height:44px!important;width:100px!important;display:inline-block!important}
.skel-avatar{width:40px!important;height:40px!important;border-radius:50%!important;display:inline-block!important}

/* ── 錯誤狀態 ── */
.err-state{
  text-align:center!important;padding:32px 20px!important;
  background:var(--soft)!important;border:1px dashed var(--line)!important;
  border-radius:16px!important;color:var(--muted)!important
}
.err-state .err-icon{font-size:40px!important;margin-bottom:12px!important;display:block!important}
.err-state .err-title{font-size:16px!important;font-weight:700!important;margin-bottom:6px!important;color:var(--text)!important}
.err-state .err-detail{font-size:13px!important;line-height:1.5!important;margin-bottom:14px!important}
.err-state .err-retry{
  min-height:42px!important;border-radius:999px!important;padding:0 20px!important;
  background:var(--primary)!important;color:var(--primaryText)!important;
  border:none!important;font-weight:700!important;cursor:pointer!important
}
.btn-retry::before{content:'↻ '}

/* ── 鍵盤體驗 ── */
@media(max-width:820px){
  /* 鍵盤彈出時 body 不隨之捲動 */
  body.keyboard-open{position:fixed!important;width:100%!important;overflow:hidden!important}
  /* 輸入框 focus 時不要被鍵盤遮住 */
  input:focus,select:focus,textarea:focus{
    position:relative!important;z-index:10!important
  }
  /* 底部導覽欄在鍵盤出現時隱藏 */
  .keyboard-open #mobileNavFinalV2,
  .keyboard-open #filesMobileNav,
  .keyboard-open #ttMobileNavV2{display:none!important}
}

/* ── 表格載入/錯誤 ── */
.table-loading td{text-align:center!important;padding:32px!important}
.table-loading td::after{
  content:'';display:inline-block;width:24px;height:24px;
  border:3px solid var(--line);border-top-color:var(--primary);
  border-radius:50%;animation:v47-spin .6s linear infinite;vertical-align:middle
}
@keyframes v47-spin{to{transform:rotate(360deg)}}

/* ── 按鈕 disabled 狀態 ── */
button:disabled:not(.skel):not(.skeleton){
  opacity:.55!important;cursor:not-allowed!important;filter:grayscale(.3)!important
}

/* ════════════════════════════════════════════════════════
   ═══  v47 全局細節打磨  ═══
   ════════════════════════════════════════════════════════ */

/* ── Toast 四色系統 ── */
.toast{transition:all .28s cubic-bezier(.4,0,.2,1)!important}
.toast.ok{border-left:4px solid var(--ok)!important}
.toast.bad{border-left:4px solid var(--bad)!important}
.toast.info{border-left:4px solid var(--primary)!important}
.toast.warn{border-left:4px solid var(--warn)!important}

/* ── 頁面進場動畫 ── */
@keyframes v47-fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.view.active,.panel,.stat,.card,.item{
  animation:v47-fadeUp .35s cubic-bezier(.4,0,.2,1) both
}
/* 減動效 */
@media(prefers-reduced-motion:reduce){
  .view.active,.panel,.stat,.card,.item{animation:none!important}
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

/* ── 空狀態 ── */
.empty{
  padding:40px 20px!important;text-align:center!important;
  color:var(--muted)!important;border:2px dashed var(--line)!important;
  border-radius:16px!important;background:var(--soft)!important;
  font-size:14px!important;line-height:1.6!important
}
.empty::before{
  content:'';display:block;width:48px;height:48px;margin:0 auto 16px;
  opacity:.5;background:currentColor;
  mask:url("data:image/svg+xml,<svg viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.5'><rect x='3' y='3' width='18' height='18' rx='2'/><line x1='9' y1='9' x2='15' y2='15'/><line x1='15' y1='9' x2='9' y2='15'/></svg>") center/contain no-repeat;
  -webkit-mask:url("data:image/svg+xml,<svg viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.5'><rect x='3' y='3' width='18' height='18' rx='2'/><line x1='9' y1='9' x2='15' y2='15'/><line x1='15' y1='9' x2='9' y2='15'/></svg>") center/contain no-repeat
}

/* ── Focus 無障礙環 ── */
input:focus-visible,select:focus-visible,textarea:focus-visible,
button:focus-visible,a:focus-visible,.tab:focus-visible{
  outline:3px solid rgba(59,130,246,.45)!important;
  outline-offset:2px!important;border-radius:8px!important
}
:focus:not(:focus-visible){outline:none!important}

/* ── 選取文字色 ── */
::selection{background:rgba(59,130,246,.22)!important;color:var(--text)!important}

/* ── 捲軸美化 ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
/* Firefox */
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}

/* ── 連結 hover ── */
a:not(.button):not(.tab):not([role="button"]){
  color:var(--primary);text-decoration:none;

}

<script id="passkeyFriendlyErrorsV1">
(function(){
  'use strict';
  if(window.PASSKEY_FRIENDLY_ERRORS_V1) return;
  window.PASSKEY_FRIENDLY_ERRORS_V1 = true;

  function rawMessage(err){
    if(!err) return '';
    var parts=[];
    try{ if(err.name) parts.push(String(err.name)); }catch(_){ }
    try{ if(err.message) parts.push(String(err.message)); }catch(_){ }
    try{ if(typeof err === 'string') parts.push(err); }catch(_){ }
    try{ parts.push(String(err)); }catch(_){ }
    return parts.join(' ').trim();
  }

  window.tronPasskeyFriendlyError = function(err, fallback){
    var raw = rawMessage(err);
    var s = raw.toLowerCase();
    var base = fallback || '通行密鑰操作失敗';

    if(!raw) return base + '。請重新操作一次。';

    if(s.indexOf('the operation either timed out or was not allowed') >= 0 ||
       s.indexOf('notallowederror') >= 0 ||
       s.indexOf('not allowed') >= 0 ||
       s.indexOf('timed out') >= 0 ||
       s.indexOf('timeout') >= 0 ||
       s.indexOf('sctn-privacy-considerations-client') >= 0){
      return '操作逾時或你取消了驗證。請重新按一次「使用通行密鑰」，並在手機或電腦跳出驗證時完成 Face ID、指紋或 PIN。';
    }
    if(s.indexOf('aborterror') >= 0 || s.indexOf('abort') >= 0 || s.indexOf('cancel') >= 0){
      return '你取消了通行密鑰驗證。若要登入，請重新按一次並完成驗證。';
    }
    if(s.indexOf('invalidstateerror') >= 0 || s.indexOf('already registered') >= 0 || s.indexOf('excluded') >= 0){
      return '這台裝置可能已經設定過通行密鑰。你可以直接用「使用通行密鑰登入」，或換一個裝置重新設定。';
    }
    if(s.indexOf('notsupportederror') >= 0 || s.indexOf('not supported') >= 0 || s.indexOf('不支援') >= 0){
      return '這個瀏覽器或裝置不支援通行密鑰。請改用帳號密碼登入，或改用支援 Passkey 的瀏覽器。';
    }
    if(s.indexOf('securityerror') >= 0 || s.indexOf('secure context') >= 0 || s.indexOf('https') >= 0 || s.indexOf('rp id') >= 0 || s.indexOf('origin') >= 0){
      return '通行密鑰需要安全的 HTTPS 網址，而且網域必須正確。請用 https://dashboard.jasoncloudserver.me 重新開啟後再試。';
    }
    if(s.indexOf('networkerror') >= 0 || s.indexOf('failed to fetch') >= 0 || s.indexOf('network') >= 0){
      return '連線失敗。請確認網站以 HTTPS 開啟後再試一次。';
    }
    if(s.indexOf('no passkey') >= 0 || s.indexOf('has no passkey') >= 0 || s.indexOf('no credentials') >= 0 || s.indexOf('no credential') >= 0){
      return '這個帳號尚未設定通行密鑰。請先用帳號密碼登入，再按「設定通行密鑰」。';
    }
    if(s.indexOf('unknown passkey credential') >= 0 || s.indexOf('unknown credential') >= 0){
      return '這個通行密鑰不屬於目前帳號。請確認輸入的是正確帳號，或重新設定通行密鑰。';
    }
    if(s.indexOf('expired') >= 0 || s.indexOf('challenge') >= 0){
      return '驗證已過期。請重新按一次通行密鑰按鈕再操作。';
    }
    if(s.indexOf('account not found') >= 0 || s.indexOf('not found or disabled') >= 0){
      return '找不到這個帳號，或帳號尚未啟用。請確認輸入的是帳號 ID 或學號。';
    }
    if(s.indexOf('multiple accounts') >= 0){
      return '有多個帳號符合這個輸入。請改輸入完整帳號 ID 再使用通行密鑰登入。';
    }
    if(s.indexOf('passkey verify failed') >= 0 || s.indexOf('authentication') >= 0 && s.indexOf('failed') >= 0){
      return '通行密鑰驗證失敗。請確認你使用的是這個帳號設定過的通行密鑰。';
    }
    if(s.indexOf('registration verify failed') >= 0 || s.indexOf('registration') >= 0 && s.indexOf('failed') >= 0){
      return '通行密鑰設定失敗。請重新按「設定通行密鑰」，並完成系統跳出的驗證。';
    }

    // 如果是 WebAuthn/Passkey 相關但沒有命中上面規則，不直接把英文長錯誤丟給一般使用者。
    if(s.indexOf('webauthn') >= 0 || s.indexOf('publickeycredential') >= 0 || s.indexOf('credential') >= 0 || s.indexOf('passkey') >= 0){
      return base + '。請重新整理頁面後再試一次；如果仍失敗，請改用帳號密碼登入。';
    }
    return raw || base;
  };

  function translateText(text){
    if(!text) return text;
    var lower = String(text).toLowerCase();
    if(lower.indexOf('the operation either timed out or was not allowed') >= 0 ||
       lower.indexOf('sctn-privacy-considerations-client') >= 0 ||
       lower.indexOf('notallowederror') >= 0){
      return window.tronPasskeyFriendlyError(text, '通行密鑰操作失敗');

    }
    return text;
  }

  function scan(root){
    try{
      var scope = root && root.querySelectorAll ? root : document;
      var selectors = '.toast,#loginMsg,#message,.bad,.api-missing,[role="alert"],.alert,.notice';
      var nodes = [];
      if(root && root.nodeType === 1 && root.matches && root.matches(selectors)) nodes.push(root);
      Array.prototype.push.apply(nodes, Array.prototype.slice.call(scope.querySelectorAll(selectors)));
      nodes.forEach(function(el){
        var old = el.textContent || '';
        var next = translateText(old);
        if(next && next !== old){ el.textContent = next; }
      });
    }catch(_){ }
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ scan(document); });
  else scan(document);
  try{
    new MutationObserver(function(muts){
      muts.forEach(function(m){
        Array.prototype.forEach.call(m.addedNodes || [], function(n){ if(n.nodeType === 1) scan(n); });
        if(m.target) scan(m.target);
      });
    }).observe(document.documentElement, {childList:true, subtree:true, characterData:true});
  }catch(_){ }
})();
</script>
