<script id="BAN_CRUDE_LOGIN_V1">
(function(){
  if(window.BAN_CRUDE_LOGIN_V1) return;
  window.BAN_CRUDE_LOGIN_V1 = true;
  function isCrude(card){
    if(!card) return false;
    if(card.querySelector('.animated-login-card-inner')) return false;
    var tx=(card.textContent||'').replace(/\s+/g,'');
    return !!(card.querySelector('.login-grid') || tx.indexOf('需要登入')>=0 || tx.indexOf('帳號 / account')>=0);
  }
  function kill(root){
    var scope=root&&root.querySelectorAll?root:document;
    var cards=[];
    if(root&&root.id==='loginCard') cards.push(root);
    try{ cards=cards.concat(Array.prototype.slice.call(scope.querySelectorAll('#loginCard,.login-card,#loginPanel'))); }catch(_){}
    cards.forEach(function(card){
      if(!isCrude(card)) return;
      card.innerHTML='';
      card.hidden=true;
      card.setAttribute('aria-hidden','true');
      card.style.display='none';
    });
  }
  kill(document);
  try{ new MutationObserver(function(ms){ ms.forEach(function(m){ Array.prototype.forEach.call(m.addedNodes||[], function(n){ if(n.nodeType===1) kill(n); }); }); }).observe(document.documentElement,{childList:true,subtree:true}); }catch(_){}
})();
</script>

<script id="hideAdminTokenFromUrlEarlyV1">
(function(){
  'use strict';
  if (window.HIDE_ADMIN_TOKEN_FROM_URL_EARLY_V1) return;
  window.HIDE_ADMIN_TOKEN_FROM_URL_EARLY_V1 = true;
  var LS_SESSION = 'tronclass_admin_session';
  var LS_LOGOUT = 'tronclass_dashboard_manual_logout';
  function sanitizeCurrentUrl(){
    try {
      var u = new URL(location.href);
      var changed = false;
      var token = u.searchParams.get('token') || '';
      if (u.searchParams.get('logout') === '1') {
        /* LOGOUT_SERVER_SIDE_V1：?logout=1 已無意義，只清遺留旗標。 */
        localStorage.removeItem(LS_SESSION);
        localStorage.removeItem(LS_LOGOUT);
      } else if (token) {
        localStorage.setItem(LS_SESSION, token);
        localStorage.removeItem(LS_LOGOUT);
      }
      if (u.searchParams.has('token')) { u.searchParams.delete('token'); changed = true; }
      if (changed) history.replaceState(null, document.title, u.pathname + (u.search ? u.search : '') + u.hash);
    } catch(_) {}
  }
  sanitizeCurrentUrl();
  window.tronAdminToken = function(){ try { return (localStorage.getItem(LS_SESSION) || '').trim(); } catch(_) { return ''; } };
})();
</script>

<script id="consolidatedAdminAuthEarlyV1">
(function(){
  'use strict';
  if (window.COOKIE_SUBPAGE_AUTH_V1) return;
  window.COOKIE_SUBPAGE_AUTH_V1 = true;
  var LO = 'tronclass_dashboard_manual_logout';
  try {
    var p = new URLSearchParams(location.search);
    /* LOGOUT_SERVER_SIDE_V1：登出已改為伺服器端（POST /admin/logout 清 cookie）；
       不再以 ?logout=1 / tronclass_dashboard_manual_logout 判斷，只清掉遺留旗標。 */
    try { localStorage.removeItem(LO); } catch (_) {}
    if (p.has('logout')) { p.delete('logout'); history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p.toString() : '') + location.hash); }
    /* LOGIN_PERF_V1：這頁是伺服器驗證過 session 才送出的（pages::inject_auth_attrs 會在 <html>
       寫入 data-auth="ok" 與 data-account / data-admin / data-viewer）。有這個屬性就直接進入
       已登入版面，不再多打一次 /admin/api/status 當「開機驗證」——省一趟往返，第一幀不閃。
       沒有屬性（理論上不會發生）才退回舊的網路驗證。 */
    var authOk = document.documentElement.getAttribute('data-auth') === 'ok';
    if (authOk) {
      window.__tronAuthStatus = window.__tronAuthStatus || {
        current_account_id: document.documentElement.getAttribute('data-account') || '',
        is_admin: document.documentElement.getAttribute('data-admin') === '1',
        is_viewer: document.documentElement.getAttribute('data-viewer') === '1',
        __partial: true
      };
      window.__tronAuthState = 'ok';
      document.documentElement.classList.remove('tron-auth-pending','tron-auth-logged-out');
      document.documentElement.classList.add('tron-auth-ok','dash-auth-ok','auth-ok');
      if (document.body) document.body.classList.add('logged-in','auth-ok','dash-auth-ok');
      else document.addEventListener('DOMContentLoaded', function(){ document.body.classList.add('logged-in','auth-ok','dash-auth-ok'); }, { once: true });
    } else {
    document.documentElement.classList.add('tron-auth-pending');
    fetch('/admin/api/status', {credentials:'same-origin', cache:'no-store'}).then(function(r){
      if (r.ok) {
        document.documentElement.classList.remove('tron-auth-pending','tron-auth-logged-out');
        document.documentElement.classList.add('tron-auth-ok','dash-auth-ok','auth-ok');
        if (document.body) document.body.classList.add('logged-in','auth-ok','dash-auth-ok');
        return;
      }
      var next = encodeURIComponent(location.pathname + location.search + location.hash);
      location.replace('/admin?next=' + next);
    }).catch(function(){
      var next = encodeURIComponent(location.pathname + location.search + location.hash);
      location.replace('/admin?next=' + next);
    });
    }
  } catch(_) {
    location.replace('/admin');
  }
})();
</script>

<script id="consolidatedAdminAuthBodyV1">

  async function parseResponse(res){ var body=await res.json().catch(function(){return{}}); if(!res.ok){var e=new Error(body.error||('HTTP '+res.status));e.status=res.status;e.body=body;throw e;} return body; }
  async function loginApi(username,password){ username=String(username||'').trim(); password=String(password||''); if(!username||!password)throw new Error('請輸入帳號與密碼'); var res=await nativeFetch('/admin/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:username,password:password})}); var body=await parseResponse(res); if(!body.token)throw new Error('登入成功但沒有收到 session token'); return body; }
  async function statusApi(){ var res=await fetch('/admin/api/status',{cache:'no-store',credentials:'same-origin'}); return parseResponse(res); }
  function showLogin(reason){ setClass('out'); setBrand('請先登入'); fillSaved(); setMsg(reason||'請先登入。', false); if(!isLoginPage() && isAdminPath()) location.replace(loginUrl()); }
  function showAuthed(data){ setClass('ok'); setBrand((data&&data.current_account_id)||(data&&data.account_id)||'管理中心'); setMsg('', true); syncLinks(); var nt=nextTarget(); if (nt && isLoginPage()) location.replace(withToken(nt)); }
  function dashboardUrl(tok){ var target=nextTarget()||'/admin#overview'; var u=new URL(target, location.origin); u.searchParams.set('v','login'+Date.now()); if(!u.hash)u.hash='overview'; return u.pathname+u.search+u.hash; }
  function logout(){ /* LOGOUT_SERVER_SIDE_V1 */ if (typeof window.tronSecureLogout === 'function') return window.tronSecureLogout(); fetch('/admin/logout',{method:'POST',credentials:'same-origin',cache:'no-store',redirect:'manual'}).catch(function(){}).then(function(){location.replace('/admin')}); }
  async function doLogin(ev){ if(ev){ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation&&ev.stopImmediatePropagation();} try{ setMsg('登入中...', true); var u=usernameInput(), p=passwordInput(); var body=await loginApi(u&&u.value,p&&p.value); localStorage.setItem(LS_SESSION,body.token); localStorage.removeItem(LS_LOGOUT); var r=rememberInput(); if(!r||r.checked)localStorage.setItem(LS_SAVED_USER,String((u&&u.value)||'').trim());else localStorage.removeItem(LS_SAVED_USER); showAuthed({current_account_id:body.account_id}); location.replace(dashboardUrl(body.token)); }catch(e){ showLogin(e.message||'登入失敗'); toast(e.message||'登入失敗', false); } }
  function isPasskey(el){ return /通行密鑰|passkey/i.test(String((el&&(el.textContent||el.value||el.id))||'')); }
  function isLoginButton(el){ var b=el&&el.closest&&el.closest('button,input[type="submit"],a'); if(!b||isPasskey(b))return false; var id=b.id||'', text=String(b.textContent||b.value||'').trim(); return id==='loginBtn'||id==='login'||id==='loginButton'||text==='登入'||text==='登入我的頁面'; }
  function bind(){ fillSaved(); document.addEventListener('click',function(ev){ if(isLoginButton(ev.target)) doLogin(ev); },true); document.addEventListener('submit',function(ev){ var f=ev.target; if(f&&f.querySelector&&f.querySelector('input[type="password"]'))doLogin(ev); },true); document.addEventListener('keydown',function(ev){ if(ev.key==='Enter'&&ev.target&&ev.target.matches&&ev.target.matches('input[type="password"],#loginPassword,#loginPass'))doLogin(ev); },true); document.addEventListener('click',function(ev){ var b=ev.target&&ev.target.closest&&ev.target.closest('button,a'); if(b&&(b.id==='logoutBtn'||b.id==='dashboardLogout'||(b.textContent||'').trim()==='登出')){ev.preventDefault();ev.stopImmediatePropagation();logout();}},true); verify(); }
  async function verify(){ try{localStorage.removeItem(LS_LOGOUT)}catch(_){} /* cookie session */ try{var data=await statusApi();showAuthed(data);}catch(e){if(e.status===401){localStorage.removeItem(LS_SESSION);showLogin('登入狀態失效，請重新登入。');}else{setClass('ok');toast(e.message||'狀態讀取失敗',false);}} }
  function syncLinks(){ var t=token(); if(!t)return; document.querySelectorAll('a[href^="/admin"]').forEach(function(a){ var href=a.getAttribute('href')||''; if(href.indexOf('/admin/api/')===0)return; try{a.href=withToken(href);}catch(_){}}); }
  window.tronAuth={token:token,verify:verify,login:doLogin,logout:logout,syncLinks:syncLinks};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind); else bind();
})( );
</script>

<script id="hideAdminTokenFromUrlBodyV1">
(function(){
  'use strict';
  if (window.HIDE_ADMIN_TOKEN_FROM_URL_BODY_V1) return;
  window.HIDE_ADMIN_TOKEN_FROM_URL_BODY_V1 = true;

  var LS_SESSION = 'tronclass_admin_session';
  var LS_LOGOUT = 'tronclass_dashboard_manual_logout';
  var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
  var nativePushState = history.pushState.bind(history);
  var nativeReplaceState = history.replaceState.bind(history);

  function latestToken(){
    try { return (localStorage.getItem(LS_SESSION) || '').trim(); } catch(_) { return ''; }
  }
  function sanitizeUrlString(urlLike){
    try {
      var u = new URL(urlLike, location.origin);
      if (u.origin !== location.origin) return urlLike;
      if (!u.pathname.startsWith('/admin')) return urlLike;
      if (u.pathname.startsWith('/admin/api/')) return urlLike;
      if (u.searchParams.has('token')) u.searchParams.delete('token');
      return u.pathname + (u.search ? u.search : '') + u.hash;
    } catch(_) { return urlLike; }
  }
  function sanitizeCurrentUrl(){
    try {
      var u = new URL(location.href);
      var token = u.searchParams.get('token') || '';
      var changed = false;
      if (u.searchParams.get('logout') === '1') {
        /* LOGOUT_SERVER_SIDE_V1：?logout=1 已無意義，只清遺留旗標。 */
        localStorage.removeItem(LS_SESSION);
        localStorage.removeItem(LS_LOGOUT);
      } else if (token) {
        localStorage.setItem(LS_SESSION, token);
        localStorage.removeItem(LS_LOGOUT);
      }
      if (u.searchParams.has('token')) { u.searchParams.delete('token'); changed = true; }
      if (changed) nativeReplaceState(null, document.title, u.pathname + (u.search ? u.search : '') + u.hash);
    } catch(_) {}
  }
  function scrubLinks(){
    try {
      document.querySelectorAll('a[href]').forEach(function(a){
        var href = a.getAttribute('href') || '';
        if (!href) return;
        var clean = sanitizeUrlString(href);
        if (clean !== href) a.setAttribute('href', clean);
      });
    } catch(_) {}
  }

  history.pushState = function(state, title, url){
    if (url != null) url = sanitizeUrlString(url);
    return nativePushState(state, title, url);
  };
  history.replaceState = function(state, title, url){
    if (url != null) url = sanitizeUrlString(url);
    return nativeReplaceState(state, title, url);
  };

  // SUBPAGE_FETCH_SHARED_V1：原本這裡的 window.fetch 包裝（剝 token）已由 subpage-fetch.js 統一處理。

  document.addEventListener('click', function(ev){
    var a = ev.target.closest && ev.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href') || '';
    var clean = sanitizeUrlString(href);
    if (clean !== href) a.setAttribute('href', clean);
  }, true);

  function boot(){
    sanitizeCurrentUrl();
    scrubLinks();
    var n = 0;
    var timer = setInterval(function(){
      sanitizeCurrentUrl();
      scrubLinks();
      n += 1;
      if (n >= 20) clearInterval(timer);
    }, 500);
    var obs = new MutationObserver(function(){ scrubLinks(); });
    if (document.body) obs.observe(document.body, { childList:true, subtree:true, attributes:true, attributeFilter:['href'] });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

<script id="passkeyFriendlyErrorsV1">
(function(){
  'use strict';
  if(window.PASSKEY_FRIENDLY_ERRORS_V1) return;
  window.PASSKEY_FRIENDLY_ERRORS_V1 = true;

  function rawMessage(err){
    if(!err) return '';
    var parts=[];
    try{ if(err.name) parts.push(String(err.name)); }catch(_){ }
    try{ if(err.message) parts.push(String(err.message)); }catch(_){ }
    try{ if(typeof err === 'string') parts.push(err); }catch(_){ }
    try{ parts.push(String(err)); }catch(_){ }
    return parts.join(' ').trim();
  }

  window.tronPasskeyFriendlyError = function(err, fallback){
    var raw = rawMessage(err);
    var s = raw.toLowerCase();
    var base = fallback || '通行密鑰操作失敗';

    if(!raw) return base + '。請重新操作一次。';

    if(s.indexOf('the operation either timed out or was not allowed') >= 0 ||
       s.indexOf('notallowederror') >= 0 ||
       s.indexOf('not allowed') >= 0 ||
       s.indexOf('timed out') >= 0 ||
       s.indexOf('timeout') >= 0 ||
       s.indexOf('sctn-privacy-considerations-client') >= 0){
      return '操作逾時或你取消了驗證。請重新按一次「使用通行密鑰」，並在手機或電腦跳出驗證時完成 Face ID、指紋或 PIN。';
    }
    if(s.indexOf('aborterror') >= 0 || s.indexOf('abort') >= 0 || s.indexOf('cancel') >= 0){
      return '你取消了通行密鑰驗證。若要登入，請重新按一次並完成驗證。';
    }
    if(s.indexOf('invalidstateerror') >= 0 || s.indexOf('already registered') >= 0 || s.indexOf('excluded') >= 0){
      return '這台裝置可能已經設定過通行密鑰。你可以直接用「使用通行密鑰登入」，或換一個裝置重新設定。';
    }
    if(s.indexOf('notsupportederror') >= 0 || s.indexOf('not supported') >= 0 || s.indexOf('不支援') >= 0){
      return '這個瀏覽器或裝置不支援通行密鑰。請改用帳號密碼登入，或改用支援 Passkey 的瀏覽器。';
    }
    if(s.indexOf('securityerror') >= 0 || s.indexOf('secure context') >= 0 || s.indexOf('https') >= 0 || s.indexOf('rp id') >= 0 || s.indexOf('origin') >= 0){
      return '通行密鑰需要安全的 HTTPS 網址，而且網域必須正確。請用 https://dashboard.jasoncloudserver.me 重新開啟後再試。';
    }
    if(s.indexOf('networkerror') >= 0 || s.indexOf('failed to fetch') >= 0 || s.indexOf('network') >= 0){
      return '連線失敗。請確認網站以 HTTPS 開啟後再試一次。';
    }
    if(s.indexOf('no passkey') >= 0 || s.indexOf('has no passkey') >= 0 || s.indexOf('no credentials') >= 0 || s.indexOf('no credential') >= 0){
      return '這個帳號尚未設定通行密鑰。請先用帳號密碼登入，再按「設定通行密鑰」。';
    }
    if(s.indexOf('unknown passkey credential') >= 0 || s.indexOf('unknown credential') >= 0){
      return '這個通行密鑰不屬於目前帳號。請確認輸入的是正確帳號，或重新設定通行密鑰。';
    }
    if(s.indexOf('expired') >= 0 || s.indexOf('challenge') >= 0){
      return '驗證已過期。請重新按一次通行密鑰按鈕再操作。';
    }
    if(s.indexOf('account not found') >= 0 || s.indexOf('not found or disabled') >= 0){
      return '找不到這個帳號，或帳號尚未啟用。請確認輸入的是帳號 ID 或學號。';
    }
    if(s.indexOf('multiple accounts') >= 0){
      return '有多個帳號符合這個輸入。請改輸入完整帳號 ID 再使用通行密鑰登入。';
    }
    if(s.indexOf('passkey verify failed') >= 0 || s.indexOf('authentication') >= 0 && s.indexOf('failed') >= 0){
      return '通行密鑰驗證失敗。請確認你使用的是這個帳號設定過的通行密鑰。';
    }
    if(s.indexOf('registration verify failed') >= 0 || s.indexOf('registration') >= 0 && s.indexOf('failed') >= 0){
      return '通行密鑰設定失敗。請重新按「設定通行密鑰」，並完成系統跳出的驗證。';
    }

    // 如果是 WebAuthn/Passkey 相關但沒有命中上面規則，不直接把英文長錯誤丟給一般使用者。
    if(s.indexOf('webauthn') >= 0 || s.indexOf('publickeycredential') >= 0 || s.indexOf('credential') >= 0 || s.indexOf('passkey') >= 0){
      return base + '。請重新整理頁面後再試一次；如果仍失敗，請改用帳號密碼登入。';
    }
    return raw || base;
  };

  function translateText(text){
    if(!text) return text;
    var lower = String(text).toLowerCase();
    if(lower.indexOf('the operation either timed out or was not allowed') >= 0 ||
       lower.indexOf('sctn-privacy-considerations-client') >= 0 ||
       lower.indexOf('notallowederror') >= 0){
      return window.tronPasskeyFriendlyError(text, '通行密鑰操作失敗');
    }
    if((lower.indexOf('webauthn') >= 0 || lower.indexOf('publickeycredential') >= 0) && lower.length > 20){
      return window.tronPasskeyFriendlyError(text, '通行密鑰操作失敗');
    }
    return text;
  }

  function scan(root){
    try{
      var scope = root && root.querySelectorAll ? root : document;
      var selectors = '.toast,#loginMsg,#message,.bad,.api-missing,[role="alert"],.alert,.notice';
      var nodes = [];
      if(root && root.nodeType === 1 && root.matches && root.matches(selectors)) nodes.push(root);
      Array.prototype.push.apply(nodes, Array.prototype.slice.call(scope.querySelectorAll(selectors)));
      nodes.forEach(function(el){
        var old = el.textContent || '';
        var next = translateText(old);
        if(next && next !== old){ el.textContent = next; }
      });
    }catch(_){ }
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ scan(document); });
  else scan(document);
  try{
    new MutationObserver(function(muts){
      muts.forEach(function(m){
        Array.prototype.forEach.call(m.addedNodes || [], function(n){ if(n.nodeType === 1) scan(n); });
        if(m.target) scan(m.target);
      });
    }).observe(document.documentElement, {childList:true, subtree:true, characterData:true});
  }catch(_){ }
})();
</script>

<script id="RETURN_DASHBOARD_HREF_V1">
(function(){
  function tok(){

  }
  function patch(){

      try{
        var u=new URL(a.getAttribute('href'), location.origin);
