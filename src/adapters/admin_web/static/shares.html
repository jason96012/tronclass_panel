<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分享連結管理</title>
<script src="/admin/static/js/qrcode.min.js?v=qrshare1"></script>
<script src="/admin/static/js/shares-admin.js?v=shares2"></script>
<style>
  /* THEME_AWARE_V1: 全部改用 dashboard 主題變數（theme.css），自動支援深淺色。 */
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; background:var(--bg,#f4f5f7); color:var(--text,#111); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 4px; color:var(--text,#111); }
  .sub { color:var(--muted,#666); font-size: 13px; margin-bottom: 16px; }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .toolbar a { text-decoration:none; }
  button { padding:8px 14px; border-radius:8px; border:1px solid var(--line,#ccc); background:var(--surface,#fff); color:var(--text,#333); font-size:13px; cursor:pointer; }
  button.primary { background:var(--primary,#2563eb); color:var(--primaryText,#fff); border-color:var(--primary,#2563eb); }
  button.danger { background:transparent; color:var(--bad,#b91c1c); border-color:color-mix(in srgb, var(--bad,#b91c1c) 40%, transparent); }
  table { width:100%; border-collapse: collapse; background:var(--surface,#fff); border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  th, td { text-align:left; padding:10px 12px; font-size:13px; border-bottom:1px solid var(--line,#eee); vertical-align: top; color:var(--text,#111); }
  th { background:var(--soft,#fafafa); font-weight:600; }
  .path { word-break: break-all; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; }
  .ok { background:color-mix(in srgb, var(--ok,#1a7f37) 15%, transparent); color:var(--ok,#1a7f37); }
  .rev { background:color-mix(in srgb, var(--bad,#b91c1c) 15%, transparent); color:var(--bad,#b91c1c); }
  .exp { background:var(--soft2,#f1f1f1); color:var(--muted,#666); }
  .empty { padding:40px; text-align:center; color:var(--muted,#888); }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:9999; padding:16px; }
  .modal { background:var(--surface,#fff); color:var(--text,#111); border-radius:14px; max-width:420px; width:100%; padding:20px; text-align:center; }
  .linkbox { word-break:break-all; font-size:12px; color:var(--muted,#555); background:var(--soft,#f5f5f5); border-radius:8px; padding:8px; text-align:left; max-height:84px; overflow:auto; margin:10px 0; }
  @media (max-width:640px){
    table { display:block; overflow-x:auto; max-width:100%; }
    th, td { font-size:12px; padding:8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>分享連結管理</h1>
  <div class="sub">此頁僅管理員可見。列出所有已發出的免登入分享連結，可複製、產生 QR code 或撤銷。</div>
  <div class="toolbar">
    <button id="refresh" class="primary" type="button">重新整理</button>
    <a href="/admin/files"><button type="button">回雲端硬碟</button></a>
  </div>
  <div id="content"><div class="empty">載入中…</div></div>
</div>
</body>
</html>
