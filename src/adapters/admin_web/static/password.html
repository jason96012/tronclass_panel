<!doctype html>
<html lang="zh-Hant" class="tron-auth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>設定密碼｜Tronclass</title>
<style>
  :root{color-scheme:light dark;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;--line:#dbe3ef;--primary:#2563eb;--bad:#b91c1c;--ok:#15803d}
  @media(prefers-color-scheme:dark){:root{--bg:#090d16;--card:#131b2a;--text:#f1f5f9;--muted:#94a3b8;--line:#334155;--primary:#3b82f6}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;position:sticky;top:0;background:rgba(244,247,251,.92);backdrop-filter:blur(12px)}
  @media(prefers-color-scheme:dark){header{background:rgba(9,13,22,.92)}}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900}
  .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;display:grid;place-items:center;font-weight:900}
  a.back,button.back{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border-radius:999px;background:#f8fafc;color:#0f172a;text-decoration:none;font-weight:800;font-size:13px;border:0;cursor:pointer;-webkit-text-fill-color:#0f172a}
  main{max-width:440px;margin:0 auto;padding:18px 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 16px 16px;box-shadow:0 16px 40px rgba(15,23,42,.08)}
  h1{margin:0 0 8px;font-size:22px}
  p.hint{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.55;font-weight:650}
  label{display:block;margin:12px 0 6px;font-size:12px;font-weight:800;color:var(--muted)}
  input{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 12px;font-size:16px}
  .msg{min-height:20px;margin-top:12px;font-size:13px;font-weight:800;color:var(--muted)}
  .msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
  .row{display:flex;gap:8px;margin-top:16px}
  button{flex:1;min-height:48px;border:0;border-radius:14px;font-size:15px;font-weight:850;cursor:pointer}
  #save{background:var(--primary);color:#fff}
  #cancel{background:#e2e8f0;color:#0f172a}
  @media(prefers-color-scheme:dark){#cancel{background:#24324a;color:#f1f5f9}}
  .cur-wrap.hidden{display:none}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mark">D</div><span id="brandTitle">變更密碼</span></div>
  <button id="backDash" class="back" type="button">返回控制台</button>
</header>
<main>
  <div class="card">
    <h1 id="pageTitle">變更 Dashboard 密碼</h1>
    <p class="hint" id="pageHint">這是控制台專用密碼，不是 Tronclass 上課密碼。</p>
    <div id="curWrap" class="cur-wrap">
      <label for="cur">目前密碼</label>
      <input id="cur" type="password" autocomplete="current-password">
    </div>
    <label for="nw">新密碼（至少 10 字）</label>
    <input id="nw" type="password" autocomplete="new-password">
    <label for="cf">再輸入一次新密碼</label>
    <input id="cf" type="password" autocomplete="new-password">
    <div id="msg" class="msg"></div>
    <div class="row">
      <button id="cancel" type="button">返回</button>
      <button id="save" type="button">儲存</button>
    </div>
  </div>
</main>
<script>
(function(){
  function $(id){ return document.getElementById(id); }
  function set(tx, kind){ var el=$('msg'); el.textContent=tx||''; el.className='msg'+(kind?' '+kind:''); }
  var first = false;
  try{ first = new URLSearchParams(location.search).get('first') === '1'; }catch(_){}
  function applyFirst(){
    first = true;
    $('curWrap').classList.add('hidden');
    $('pageTitle').textContent = '設定 Dashboard 密碼';
    $('brandTitle').textContent = '首次設定密碼';
    $('pageHint').textContent = '首次登入必須設定新的 Dashboard 密碼。之後不能再用 Tronclass 密碼登這個網站。';
    $('save').textContent = '設定並進入';
    $('cancel').style.display = 'none';
    $('backDash').style.display = 'none';
  }
  if(first) applyFirst();
  fetch('/admin/api/status',{credentials:'same-origin',cache:'no-store'}).then(function(r){
    if(!r.ok){
      location.replace('/admin?next='+encodeURIComponent('/admin/password'+(first?'?first=1':'')));
      return null;
    }
    return r.json().catch(function(){ return {}; });
  }).then(function(st){
    if(st && st.must_change_password) applyFirst();
  }).catch(function(){
    location.replace('/admin');
  });
  function goDash(){
    if(first){ set('請先完成新密碼設定。','bad'); return; }
    location.href='/admin#overview';
  }
  $('cancel').onclick=goDash;
  $('backDash').onclick=goDash;
  $('save').onclick=async function(){
    var a=$('cur').value||'', b=$('nw').value||'', c=$('cf').value||'';
    if(!first && !a){ set('請輸入目前密碼。','bad'); return; }
    if(!b||!c){ set('請輸入並確認新密碼。','bad'); return; }
    if(b!==c){ set('兩次輸入的新密碼不一致。','bad'); return; }
    if(b.length<10){ set('新密碼至少 10 個字元。','bad'); return; }
    try{
      var payload = {current_password: first ? '' : a, new_password:b, password:b};
      var res=await fetch('/admin/api/password',{
        method:'POST', credentials:'same-origin', cache:'no-store',
        headers:{'content-type':'application/json'},
        body:JSON.stringify(payload)
      });
      var raw=await res.text();
      var body={};
      try{ body=raw?JSON.parse(raw):{}; }catch(_){ body={message:raw}; }
      if(!res.ok){
        var detail=body.error||body.message||raw||('HTTP '+res.status);
        if(res.status===422) detail='伺服器無法讀取密碼欄位，請重新整理後再試。';
        throw new Error(detail);
      }
      set('密碼已設定，正在進入控制台…','ok');
      setTimeout(function(){ location.replace('/admin#overview'); }, 500);
    }catch(e){
      var m=String((e&&e.message)||e||'');
      if(/incorrect|current Dashboard password|unauthorized|401/i.test(m)) m='目前密碼不正確，或登入已過期。';
      set(m||'設定密碼失敗','bad');
    }
  };
})();
</script>
<script src="/admin/static/js/mobile-nav.js?v=mnav5"></script>
</body>
</html>
