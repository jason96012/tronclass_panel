<!doctype html>
<html lang="zh-Hant" class="tron-auth-logged-out">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>登入｜Tronclass Dashboard</title>
<style>
  :root{color-scheme:light dark;--bg:#eef3fb;--card:rgba(255,255,255,.88);--text:#172033;--muted:#64748b;--line:#dbe3ef;--primary:#2563eb}
  @media(prefers-color-scheme:dark){:root{--bg:#071122;--card:rgba(19,27,42,.9);--text:#f1f5f9;--muted:#94a3b8;--line:#334155;--primary:#3b82f6}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px 16px}
  .card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px 22px 22px;box-shadow:0 24px 70px rgba(15,23,42,.16)}
  .logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;margin:0 auto 14px}
  h1{margin:0 0 6px;text-align:center;font-size:24px}
  .sub{margin:0 0 18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}
  label{display:block;margin:10px 0 6px;font-size:12px;font-weight:800;color:var(--muted)}
  input{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--text);padding:0 12px;font-size:16px}
  button{width:100%;min-height:48px;border:0;border-radius:14px;font-size:15px;font-weight:850;cursor:pointer}
  #loginBtn{margin-top:14px;background:var(--primary);color:#fff}
  #passkeyBtn{margin-top:8px;background:transparent;color:var(--text);border:1px solid var(--line)}
  #msg{min-height:18px;margin-top:12px;text-align:center;font-size:13px;font-weight:800;color:var(--muted)}
  #msg.bad{color:#b91c1c} #msg.ok{color:#15803d}
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <div class="logo">D</div>
    <h1>歡迎回來</h1>
    <p class="sub">登入 Tronclass Dashboard</p>
    <label for="loginUsername">帳號 ID / 學號</label>
    <input id="loginUsername" name="username" autocomplete="username" required>
    <label for="loginPassword">密碼</label>
    <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
    <button id="loginBtn" type="submit">登入</button>
    <button id="passkeyBtn" type="button">使用通行密鑰登入</button>
    <div id="msg">請先登入。</div>
  </form>
<script>
(function(){
  function $(id){ return document.getElementById(id); }
  function set(tx, kind){ var el=$('msg'); el.textContent=tx||''; el.className=kind||''; }
  function nextUrl(){
    try{
      var n=new URLSearchParams(location.search).get('next')||'';
      if(n.indexOf('/admin')===0) return n;
    }catch(_){}
    return '/admin#overview';
  }
  function b64e(buf){ var u=new Uint8Array(buf),s=''; for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function b64d(str){ str=String(str||'').replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='='; var bin=atob(str),o=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) o[i]=bin.charCodeAt(i); return o.buffer; }
  async function doLogin(ev){
    if(ev) ev.preventDefault();
    var u=($('loginUsername').value||'').trim();
    var p=($('loginPassword').value||'').trim();
    if(!u||!p){ set('請輸入帳號與密碼。','bad'); return; }
    set('登入中…','');
    try{
      var res=await fetch('/admin/api/login',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'content-type':'application/json'},body:JSON.stringify({username:u,password:p})});
      var body=await res.json().catch(function(){return {};});
      if(!res.ok) throw new Error(body.error||'帳號或密碼不正確');
      if(body.must_change_password){ set('首次登入，請設定 Dashboard 密碼…','ok'); location.replace('/admin/password?first=1'); return; }
      set('登入成功，正在進入…','ok');
      location.replace(nextUrl());
    }catch(e){ set((e&&e.message)||'登入失敗','bad'); }
  }
  async function passkeyLogin(){
    var u=($('loginUsername').value||'').trim();
    if(!u){ set('請先輸入帳號，再使用通行密鑰。','bad'); return; }
    if(!window.PublicKeyCredential){ set('此瀏覽器不支援通行密鑰。','bad'); return; }
    set('啟動通行密鑰…','');
    try{
      var start=await fetch('/admin/api/passkey/login/start',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({username:u})});
      var sj=await start.json().catch(function(){return {};});
      if(!start.ok) throw new Error(sj.error||'無法啟動通行密鑰');
      var opts=JSON.parse(JSON.stringify(sj.publicKey||{}));
      opts.challenge=b64d(opts.challenge);
      if(opts.allowCredentials) opts.allowCredentials=opts.allowCredentials.map(function(c){return Object.assign({},c,{id:b64d(c.id)});});
      var assertion=await navigator.credentials.get({publicKey:opts});
      if(!assertion) throw new Error('未取得通行密鑰');
      var fin=await fetch('/admin/api/passkey/login/finish',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({ceremony_id:sj.ceremony_id,response:{id:assertion.id,authenticatorData:b64e(assertion.response.authenticatorData),signature:b64e(assertion.response.signature),clientDataJSON:b64e(assertion.response.clientDataJSON),userHandle:assertion.response.userHandle?b64e(assertion.response.userHandle):null}})});
      var dj=await fin.json().catch(function(){return {};});
      if(!fin.ok) throw new Error(dj.error||'通行密鑰登入失敗');
      if(dj.must_change_password){ set('首次登入，請設定 Dashboard 密碼…','ok'); location.replace('/admin/password?first=1'); return; }
      set('登入成功，正在進入…','ok');
      location.replace(nextUrl());
    }catch(e){ set((e&&e.message)||'通行密鑰登入失敗','bad'); }
  }
  $('loginForm').addEventListener('submit', doLogin);
  $('passkeyBtn').onclick=passkeyLogin;
})();
</script>
</body>
</html>
