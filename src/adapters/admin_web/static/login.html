<script id="passkeyFriendlyErrorsV1">
(function(){
  'use strict';
  if(window.PASSKEY_FRIENDLY_ERRORS_V1) return;
  window.PASSKEY_FRIENDLY_ERRORS_V1 = true;

  function rawMessage(err){
    if(!err) return '';
    var parts=[];
    try{ if(err.name) parts.push(String(err.name)); }catch(_){ }
    try{ if(err.message) parts.push(String(err.message)); }catch(_){ }
    try{ if(typeof err === 'string') parts.push(err); }catch(_){ }
    try{ parts.push(String(err)); }catch(_){ }
    return parts.join(' ').trim();
  }

  window.tronPasskeyFriendlyError = function(err, fallback){
    var raw = rawMessage(err);
    var s = raw.toLowerCase();
    var base = fallback || '通行密鑰操作失敗';

    if(!raw) return base + '。請重新操作一次。';

    if(s.indexOf('the operation either timed out or was not allowed') >= 0 ||
       s.indexOf('notallowederror') >= 0 ||
       s.indexOf('not allowed') >= 0 ||
       s.indexOf('timed out') >= 0 ||
       s.indexOf('timeout') >= 0 ||
       s.indexOf('sctn-privacy-considerations-client') >= 0){
      return '操作逾時或你取消了驗證。請重新按一次「使用通行密鑰」，並在手機或電腦跳出驗證時完成 Face ID、指紋或 PIN。';
    }
    if(s.indexOf('aborterror') >= 0 || s.indexOf('abort') >= 0 || s.indexOf('cancel') >= 0){
      return '你取消了通行密鑰驗證。若要登入，請重新按一次並完成驗證。';
    }
    if(s.indexOf('invalidstateerror') >= 0 || s.indexOf('already registered') >= 0 || s.indexOf('excluded') >= 0){
      return '這台裝置可能已經設定過通行密鑰。你可以直接用「使用通行密鑰登入」，或換一個裝置重新設定。';
    }
    if(s.indexOf('notsupportederror') >= 0 || s.indexOf('not supported') >= 0 || s.indexOf('不支援') >= 0){
      return '這個瀏覽器或裝置不支援通行密鑰。請改用帳號密碼登入，或改用支援 Passkey 的瀏覽器。';
    }
    if(s.indexOf('securityerror') >= 0 || s.indexOf('secure context') >= 0 || s.indexOf('https') >= 0 || s.indexOf('rp id') >= 0 || s.indexOf('origin') >= 0){
      return '通行密鑰需要安全的 HTTPS 網址，而且網域必須正確。請用 https://dashboard.jasoncloudserver.me 重新開啟後再試。';
    }
    if(s.indexOf('networkerror') >= 0 || s.indexOf('failed to fetch') >= 0 || s.indexOf('network') >= 0){
      return '連線失敗。請確認網站以 HTTPS 開啟後再試一次。';
    }
    if(s.indexOf('no passkey') >= 0 || s.indexOf('has no passkey') >= 0 || s.indexOf('no credentials') >= 0 || s.indexOf('no credential') >= 0){
      return '這個帳號尚未設定通行密鑰。請先用帳號密碼登入，再按「設定通行密鑰」。';
    }
    if(s.indexOf('unknown passkey credential') >= 0 || s.indexOf('unknown credential') >= 0){
      return '這個通行密鑰不屬於目前帳號。請確認輸入的是正確帳號，或重新設定通行密鑰。';
    }
    if(s.indexOf('expired') >= 0 || s.indexOf('challenge') >= 0){
      return '驗證已過期。請重新按一次通行密鑰按鈕再操作。';
    }
    if(s.indexOf('account not found') >= 0 || s.indexOf('not found or disabled') >= 0){
      return '找不到這個帳號，或帳號尚未啟用。請確認輸入的是帳號 ID 或學號。';
    }
    if(s.indexOf('multiple accounts') >= 0){
      return '有多個帳號符合這個輸入。請改輸入完整帳號 ID 再使用通行密鑰登入。';
    }
    if(s.indexOf('passkey verify failed') >= 0 || s.indexOf('authentication') >= 0 && s.indexOf('failed') >= 0){
      return '通行密鑰驗證失敗。請確認你使用的是這個帳號設定過的通行密鑰。';
    }
    if(s.indexOf('registration verify failed') >= 0 || s.indexOf('registration') >= 0 && s.indexOf('failed') >= 0){
      return '通行密鑰設定失敗。請重新按「設定通行密鑰」，並完成系統跳出的驗證。';
    }

    // 如果是 WebAuthn/Passkey 相關但沒有命中上面規則，不直接把英文長錯誤丟給一般使用者。
    if(s.indexOf('webauthn') >= 0 || s.indexOf('publickeycredential') >= 0 || s.indexOf('credential') >= 0 || s.indexOf('passkey') >= 0){
      return base + '。請重新整理頁面後再試一次；如果仍失敗，請改用帳號密碼登入。';
    }
    return raw || base;
  };

  function translateText(text){
    if(!text) return text;
    var lower = String(text).toLowerCase();
    if(lower.indexOf('the operation either timed out or was not allowed') >= 0 ||
       lower.indexOf('sctn-privacy-considerations-client') >= 0 ||
       lower.indexOf('notallowederror') >= 0){
      return window.tronPasskeyFriendlyError(text, '通行密鑰操作失敗');
    }
    if((lower.indexOf('webauthn') >= 0 || lower.indexOf('publickeycredential') >= 0) && lower.length > 20){
      return window.tronPasskeyFriendlyError(text, '通行密鑰操作失敗');
    }
    return text;
  }

  function scan(root){
    try{
      var scope = root && root.querySelectorAll ? root : document;
      var selectors = '.toast,#loginMsg,#message,.bad,.api-missing,[role="alert"],.alert,.notice';
      var nodes = [];
      if(root && root.nodeType === 1 && root.matches && root.matches(selectors)) nodes.push(root);
      Array.prototype.push.apply(nodes, Array.prototype.slice.call(scope.querySelectorAll(selectors)));
      nodes.forEach(function(el){
        var old = el.textContent || '';
        var next = translateText(old);
        if(next && next !== old){ el.textContent = next; }
      });
    }catch(_){ }
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ scan(document); });
  else scan(document);
  try{
    new MutationObserver(function(muts){
      muts.forEach(function(m){
        Array.prototype.forEach.call(m.addedNodes || [], function(n){ if(n.nodeType === 1) scan(n); });
        if(m.target) scan(m.target);
      });
    }).observe(document.documentElement, {childList:true, subtree:true, characterData:true});
  }catch(_){ }
})();
</script>
<script id="loginPageAuthV1">
(function(){
  'use strict';
  // LOGIN_PAGE_AUTH_V1：登入頁唯一的登入流程（密碼／通行密鑰共用 finishLogin，只導向一次）。
  var LS_SAVED_USER = 'tronclass_admin_saved_username_v1';
  var LS_LAST_METHOD = 'tronclass_login_last_method_v1'; // LOGIN_REMEMBER_METHOD_V1：password | passkey
  var busy = false;

  function q(id){ return document.getElementById(id); }
  function setMsg(text, ok){
    var el = q('loginMsg'); if(!el) return;
    el.textContent = text || '';
    el.className = 'animated-login-message ' + (ok === false ? 'bad' : ok === true ? 'ok' : '');
  }
  function toast(text, ok){
    var el = q('toast'); if(!el) return;
    el.textContent = text; el.className = 'toast visible ' + (ok === false ? 'bad' : 'ok');
    clearTimeout(el._timer); el._timer = setTimeout(function(){ el.classList.remove('visible'); }, 3200);
  }
  // LOGIN_SUBMIT_LOCK_V1：送出期間鎖住兩顆按鈕與輸入框，避免重複送出（重複送出會吃掉速率限制額度）。
  function setBusy(v, which){
    busy = !!v;
    var lb = q('loginBtn'), pb = q('passkeyLoginBtn');
    ['loginUsername','loginPassword'].forEach(function(id){ var el = q(id); if(el) el.disabled = busy; });
    if(lb){ lb.disabled = busy; lb.textContent = (busy && which === 'password') ? '登入中...' : '登入'; }
    if(pb){ pb.disabled = busy; pb.textContent = (busy && which === 'passkey') ? '驗證中...' : '使用通行密鑰登入'; }
  }

  // ── 導向目標：只在成功後決定一次 ────────────────────────────────────────
  function sameOriginAdminPath(raw){
    try{
      var u = new URL(raw, location.origin);
      if(u.origin !== location.origin) return '';
      if(!(u.pathname === '/admin' || u.pathname.indexOf('/admin/') === 0)) return '';
      if(u.pathname === '/admin/logout' || u.pathname.indexOf('/admin/api/') === 0) return '';
      return u.pathname + u.search + u.hash;
    }catch(_){ return ''; }
  }
  function nextTarget(){
    var n = '';
    try{ n = new URLSearchParams(location.search).get('next') || ''; }catch(_){}
    return n ? sameOriginAdminPath(n) : '';
  }
  // LOGIN_SINGLE_REDIRECT_V1：密碼／通行密鑰／首次登入三條路都只走這裡，只 replace 一次。
  function finishLogin(body, method){
    try{ localStorage.setItem(LS_LAST_METHOD, method); }catch(_){}
    if(typeof window.tronDashboardSessionMarker === 'function') window.tronDashboardSessionMarker();
    if(body && body.must_change_password){
      setMsg('首次登入成功，請先設定新的 Dashboard 密碼…', true);
      location.replace('/admin/password?first=1');
      return;
    }
    var dest = nextTarget() || '/admin#overview';
    setMsg('登入成功，正在進入…', true);
    var lb = q('loginBtn'); if(lb) lb.classList.add('success-pulse');
    location.replace(forceNavigate(dest));
  }
  // LOGIN_HASH_ONLY_NAV_FIX_V1：登入頁就在 /admin，目的地若只差 #hash（例如 /admin#overview），
  // location.replace 只會改 hash、不會向伺服器重新要頁面，人就卡在「登入成功，正在進入…」。
  // 遇到同 path+search 的目的地時加一個一次性的 ?v=login<ts>（dashboard 啟動時會自行用 replaceState 清掉），
  // 強迫瀏覽器真的重新載入，讓伺服器依新 cookie 送出 Dashboard。
  function forceNavigate(dest){
    try{
      var u = new URL(dest, location.origin);
      if(u.pathname === location.pathname && u.search === location.search){
        u.searchParams.set('v', 'login' + Date.now());
      }
      return u.pathname + u.search + u.hash;
    }catch(_){
      return dest + (dest.indexOf('?') === -1 ? '?' : '&') + 'v=login' + Date.now();
    }
  }

  // ── 錯誤訊息一律中文 ─────────────────────────────────────────────────────
  function friendlyLoginError(err){
    var code = String((err && (err.code || err.message)) || '').toLowerCase();
    var status = err && err.status;
    if(status === 423 || code === 'account_locked'){
      var mins = err && err.retryAfter ? Math.max(1, Math.ceil(err.retryAfter / 60)) : 10;
      return '此帳號因連續密碼錯誤已暫時鎖定密碼登入（約 ' + mins + ' 分鐘）。若是你本人，可改用通行密鑰登入，或到 Discord 通知按「取消這次鎖定」。';
    }
    if(status === 429 || code.indexOf('too many') >= 0) return '嘗試次數過多，請稍後一分鐘再試。';
    if(status === 403 && code.indexOf('access_denied') >= 0) return '你的來源 IP 已被封鎖，無法登入。';
    if(status === 401 || code === 'unauthorized') return '帳號或密碼錯誤，或此帳號未啟用。';
    if(status === 400 && code.indexOf('too long') >= 0) return '帳號或密碼長度超過上限。';
    if(status === 400) return '請輸入帳號與密碼。';
    if(status === 413) return '送出的內容過大。';
    if(status >= 500) return '伺服器暫時無法處理登入，請稍後再試。';
    if(code.indexOf('failed to fetch') >= 0 || code.indexOf('networkerror') >= 0 || code.indexOf('load failed') >= 0) return '連線失敗，請確認網路後再試。';
    return '登入失敗，請稍後再試。';
  }
  async function parseResponse(res){
    var body = await res.json().catch(function(){ return {}; });
    if(!res.ok){
      var e = new Error(body.error || ('HTTP ' + res.status));
      e.status = res.status; e.code = body.error || ''; e.retryAfter = body.retry_after_secs || 0;
      throw e;
    }
    return body;
  }

  // ── 密碼登入 ────────────────────────────────────────────────────────────
  async function doLogin(ev){
    if(ev){ ev.preventDefault(); ev.stopPropagation(); }
    if(busy) return false;
    var u = q('loginUsername'), p = q('loginPassword');
    var username = String((u && u.value) || '').trim();
    // LOGIN_PASSWORD_NO_TRIM_V1：密碼是不透明字串，前端不得 trim（後端也刻意不 trim）。
    var password = String((p && p.value) || '');
    if(!username || !password){ setMsg('請輸入帳號與密碼。', false); return false; }
    setBusy(true, 'password');
    setMsg('登入中...', true);
    try{
      var res = await fetch('/admin/api/login', {
        method: 'POST', credentials: 'same-origin', cache: 'no-store',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      });
      var body = await parseResponse(res);
      var r = q('rememberPassword');
      try{
        if(!r || r.checked) localStorage.setItem(LS_SAVED_USER, username);
        else localStorage.removeItem(LS_SAVED_USER);
      }catch(_){}
      finishLogin(body, 'password');
    }catch(e){
      setBusy(false);
      var msg = friendlyLoginError(e);
      setMsg(msg, false);
      toast(msg, false);
      if(p){ p.value = ''; try{ p.focus(); }catch(_){} }
    }
    return false;
  }

  // ── 通行密鑰登入 ─────────────────────────────────────────────────────────
  function b64urlEncode(buf){ var bytes = new Uint8Array(buf), s = ''; for(var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function b64urlDecode(str){ str = String(str || '').replace(/-/g,'+').replace(/_/g,'/'); while(str.length % 4) str += '='; var bin = atob(str), out = new Uint8Array(bin.length); for(var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out.buffer; }
  async function postJson(url, body){
    var res = await fetch(url, { method: 'POST', credentials: 'same-origin', cache: 'no-store', headers: { 'content-type': 'application/json' }, body: body == null ? undefined : JSON.stringify(body) });
    return parseResponse(res);
  }
  function hasSecureContext(){ return window.isSecureContext || location.hostname === 'localhost' || location.hostname === '127.0.0.1'; }
  async function passkeyLogin(){
    if(busy) return;
    if(!hasSecureContext()){ setMsg('通行密鑰需要 HTTPS，請用 https:// 網址開啟。', false); return; }
    if(!window.PublicKeyCredential || !navigator.credentials){ setMsg('此瀏覽器不支援通行密鑰，請改用帳號密碼登入。', false); return; }
    // PASSKEY_USERNAMELESS_V1：帳號可留空——直接以可發現通行密鑰識別身分。
    var username = String((q('loginUsername') && q('loginUsername').value) || '').trim();
    setBusy(true, 'passkey');
    setMsg('請在裝置上完成通行密鑰驗證…', true);
    try{
      var start = await postJson('/admin/api/passkey/login/start', { username: username });
      var opts = start.publicKey || {};
      opts.challenge = b64urlDecode(opts.challenge);
      if(opts.allowCredentials) opts.allowCredentials = opts.allowCredentials.map(function(c){ return Object.assign({}, c, { id: b64urlDecode(c.id) }); });
      var assertion = await navigator.credentials.get({ publicKey: opts });
      if(!assertion) throw new Error('未取得通行密鑰');
      var body = { ceremony_id: start.ceremony_id, response: { id: assertion.id, authenticatorData: b64urlEncode(assertion.response.authenticatorData), signature: b64urlEncode(assertion.response.signature), clientDataJSON: b64urlEncode(assertion.response.clientDataJSON), userHandle: assertion.response.userHandle ? b64urlEncode(assertion.response.userHandle) : null } };
      var done = await postJson('/admin/api/passkey/login/finish', body);
      finishLogin(done, 'passkey');
    }catch(e){
      setBusy(false);
      var msg = (e && e.status === 403 && String(e.code || '').indexOf('access_denied') >= 0)
        ? '你的來源 IP 已被封鎖，無法登入。'
        : (e && e.status === 429) ? '嘗試次數過多，請稍後一分鐘再試。'
        : (typeof window.tronPasskeyFriendlyError === 'function' ? window.tronPasskeyFriendlyError(e, '通行密鑰登入失敗') : '通行密鑰登入失敗');
      setMsg(msg, false);
      toast(msg, false);
    }
  }

  // ── 綁定 ───────────────────────────────────────────────────────────────
  function fillSaved(){
    var saved = '';
    try{ saved = localStorage.getItem(LS_SAVED_USER) || ''; }catch(_){}
    var u = q('loginUsername');
    if(u && saved && !u.value) u.value = saved;
    var r = q('rememberPassword'); if(r && saved) r.checked = true;
  }
  function applyLastMethod(){
    // LOGIN_REMEMBER_METHOD_V1：上次用通行密鑰 → 這次把焦點與提示放在通行密鑰按鈕；
    // 上次用密碼（或第一次）→ 焦點放在第一個空欄位。
    var last = '';
    try{ last = localStorage.getItem(LS_LAST_METHOD) || ''; }catch(_){}
    var pb = q('passkeyLoginBtn');
    if(last === 'passkey' && pb && window.PublicKeyCredential){
      pb.classList.add('animated-login-preferred');
      setMsg('上次使用通行密鑰登入，可直接按「使用通行密鑰登入」。');
      try{ pb.focus(); }catch(_){}
      return;
    }
    var u = q('loginUsername'), p = q('loginPassword');
    var target = (u && !u.value) ? u : p;
    try{ if(target) target.focus(); }catch(_){}
  }
  function bind(){
    fillSaved();
    var f = q('animatedLoginForm'); if(f) f.onsubmit = doLogin;
    var lb = q('loginBtn'); if(lb) lb.onclick = doLogin;
    var pb = q('passkeyLoginBtn'); if(pb) pb.onclick = passkeyLogin;
    var t = q('toggleLoginPassword');
    if(t) t.onclick = function(){ var p = q('loginPassword'); if(!p) return; var show = p.type === 'password'; p.type = show ? 'text' : 'password'; t.textContent = show ? '🙈' : '👁'; t.setAttribute('aria-label', show ? '隱藏密碼' : '顯示密碼'); };
    var p = q('loginPassword');
    if(p) p.addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(e); });
    // 由子頁被導回時的提示。
    var reason = '';
    try{ var v = new URLSearchParams(location.search).get('v') || ''; if(v.indexOf('sessionexpired') === 0) reason = '登入狀態已過期，請重新登入。'; }catch(_){}
    if(reason) setMsg(reason, false);
    applyLastMethod();
    // 由 bfcache 返回（例如按上一頁）時解除鎖定狀態。
    window.addEventListener('pageshow', function(ev){ if(ev && ev.persisted) setBusy(false); });
  }
  // 讓 dashboard-login-card.js 的 doLogin 代理（window.tronAuth.login）也走同一條流程。
  window.tronAuth = { login: doLogin, passkey: passkeyLogin };
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind); else bind();
})();
</script>
<style id="loginPagePreferredStyleV1">
  .animated-passkey-btn.animated-login-preferred{border-color:#2563eb!important;box-shadow:0 0 0 3px rgba(37,99,235,.16)!important}
</style>
</body>
