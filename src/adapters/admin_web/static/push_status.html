<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>推播狀態管理｜Tronclass</title>
  <style>
    :root{color-scheme:light dark;--bg:#f4f7fb;--card:#fff;--text:#132238;--muted:#68758a;--line:#dce4ef;--primary:#2563eb;--good:#16a34a;--warn:#d97706;--bad:#dc2626;--shadow:0 16px 45px rgba(15,23,42,.09)}
    @media(prefers-color-scheme:dark){:root{--bg:#07111f;--card:#101b2d;--text:#edf4ff;--muted:#98a9c0;--line:#263650;--primary:#60a5fa;--good:#4ade80;--warn:#fbbf24;--bad:#fb7185;--shadow:0 18px 50px rgba(0,0,0,.3)}}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,rgba(37,99,235,.16),transparent 36%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;min-height:100vh}.wrap{width:min(1120px,calc(100% - 40px));margin:auto;padding:34px 0 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:14px}.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:900;font-size:25px;box-shadow:var(--shadow)}h1{font-size:28px;margin:0}.sub{color:var(--muted);margin-top:4px}.back,.button{border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);padding:11px 16px;text-decoration:none;font:inherit;font-weight:750;cursor:pointer}.button.primary{background:var(--primary);border-color:var(--primary);color:#fff}.button.danger{color:var(--bad)}button:disabled{opacity:.55;cursor:wait}.hero,.card{background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.hero{padding:24px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:20px}.status{display:flex;align-items:center;gap:13px}.dot{width:15px;height:15px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 7px color-mix(in srgb,var(--muted) 15%,transparent)}.dot.good{background:var(--good);box-shadow:0 0 0 7px color-mix(in srgb,var(--good) 16%,transparent)}.dot.bad{background:var(--bad)}.status-title{font-size:22px;font-weight:850}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{padding:22px}.card h2{font-size:18px;margin:0 0 17px}.rows{display:grid;gap:0}.row{display:flex;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.key{color:var(--muted)}.value{font-weight:750;text-align:right;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:10px}.note{margin:18px 0 0;padding:15px 17px;border-radius:15px;background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--muted);line-height:1.7}.message{display:none;margin-top:16px;padding:13px 15px;border-radius:13px;font-weight:700}.message.show{display:block}.message.good{background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--good)}.message.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
    @media(max-width:720px){.wrap{width:min(100% - 24px,680px);padding:18px 0 100px}.top{align-items:flex-start}.logo{width:48px;height:48px}.brand{gap:11px}h1{font-size:22px}.sub{font-size:13px}.back{padding:10px 12px}.hero{padding:19px;align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.card{padding:19px}.actions{display:grid;grid-template-columns:1fr}.button{width:100%;text-align:center}.row{font-size:14px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="brand"><div class="logo">T</div><div><h1>推播狀態管理</h1><div class="sub">iPhone 背景點名通知</div></div></div>
      <a class="back" href="/admin/dashboard#notifications">返回通知</a>
    </header>

    <section class="hero">
      <div class="status"><span id="statusDot" class="dot"></span><div><div id="statusTitle" class="status-title">正在檢查…</div><div id="statusDescription" class="sub">讀取伺服器與此 iPhone 的推播狀態</div></div></div>
      <button id="refreshStatus" class="button" type="button">重新整理</button>
    </section>

    <div class="grid">
      <section class="card">
        <h2>帳號與伺服器</h2>
        <div class="rows">
          <div class="row"><span class="key">綁定帳號</span><span id="accountId" class="value">—</span></div>
          <div class="row"><span class="key">伺服器訂閱數</span><span id="serverCount" class="value">—</span></div>
          <div class="row"><span class="key">VAPID 服務</span><span id="vapidStatus" class="value">—</span></div>
        </div>
      </section>
      <section class="card">
        <h2>目前這台 iPhone</h2>
        <div class="rows">
          <div class="row"><span class="key">主畫面 App</span><span id="standaloneStatus" class="value">—</span></div>
          <div class="row"><span class="key">通知權限</span><span id="permissionStatus" class="value">—</span></div>
          <div class="row"><span class="key">本機 Push 訂閱</span><span id="localStatus" class="value">—</span></div>
        </div>
      </section>
      <section class="card" style="grid-column:1/-1">
        <h2>管理操作</h2>
        <div class="actions">
          <button id="enablePush" class="button primary" type="button">啟用／修復此手機</button>
          <button id="testPush" class="button" type="button">10 秒背景測試</button>
          <button id="disablePush" class="button danger" type="button">停用此手機</button>
        </div>
        <div id="message" class="message" role="status"></div>
        <div class="note">背景測試安排後，請立刻把 Tronclass 從多工畫面往上滑掉。通知聲由 iPhone「設定 → 通知 → Tronclass → 聲音」控制；PWA 無法強制繞過靜音或專注模式。</div>
      </section>
    </div>
  </main>
  <script>
  (function(){'use strict';
    function q(id){return document.getElementById(id)}
    function standalone(){return navigator.standalone===true||(matchMedia&&matchMedia('(display-mode: standalone)').matches)}
    async function readJson(res){var body=await res.json().catch(function(){return{}});if(!res.ok)throw new Error(body.error||('HTTP '+res.status));return body}
    async function api(path,options){return fetch(path,Object.assign({credentials:'same-origin',cache:'no-store'},options||{})).then(readJson)}
    function message(text,ok){var el=q('message');el.textContent=text;el.className='message show '+(ok?'good':'bad')}
    async function localSubscription(){if(!('serviceWorker'in navigator))return null;var reg=await navigator.serviceWorker.getRegistration('/');return reg?reg.pushManager.getSubscription():null}
    async function refresh(){
      try{
        var config=await api('/admin/api/push/config');
        var local=await localSubscription();
        var permission=('Notification'in window)?Notification.permission:'unsupported';
        var active=!!(config.subscribed&&local&&permission==='granted');
        q('accountId').textContent=config.account_id||'—';q('serverCount').textContent=String(config.subscription_count||0)+' 台';q('vapidStatus').textContent=config.public_key?'正常':'未初始化';
        q('standaloneStatus').textContent=standalone()?'是':'否';q('permissionStatus').textContent=permission==='granted'?'已允許':permission==='denied'?'已拒絕':'尚未允許';q('localStatus').textContent=local?'已建立':'不存在';
        q('statusDot').className='dot '+(active?'good':'bad');q('statusTitle').textContent=active?'背景推播已啟用':'背景推播需要處理';q('statusDescription').textContent=active?'此帳號與目前 iPhone 的訂閱均正常':'請使用下方按鈕啟用或修復此手機';
      }catch(error){q('statusDot').className='dot bad';q('statusTitle').textContent='狀態讀取失敗';q('statusDescription').textContent=error.message||'請重新登入';message(error.message||'讀取失敗',false)}
    }
    async function busy(button,fn){var old=button.textContent;button.disabled=true;button.textContent='處理中…';try{await fn()}catch(error){message(error.message||'操作失敗',false)}finally{button.disabled=false;button.textContent=old;await refresh()}}
    document.addEventListener('DOMContentLoaded',function(){
      q('refreshStatus').onclick=refresh;
      q('enablePush').onclick=function(){busy(this,async function(){if(!window.TronclassWebPush)throw new Error('推播元件尚未載入，請重新整理');var result=await window.TronclassWebPush.subscribe();message('已儲存此手機訂閱；約 '+(result.delaySecs||10)+' 秒後會送出背景測試。',true)})};
      q('testPush').onclick=function(){busy(this,async function(){var result=await api('/admin/api/push/test',{method:'POST'});if(result.ok===false)throw new Error(result.error||'無法安排測試');message('已安排 '+(result.delay_secs||10)+' 秒後發送，請立刻把 App 往上滑掉。',true)})};
      q('disablePush').onclick=function(){var button=this;if(!confirm('確定要停用目前這台 iPhone 的背景推播？'))return;busy(button,async function(){if(!window.TronclassWebPush)throw new Error('推播元件尚未載入');var removed=await window.TronclassWebPush.unsubscribe();message(removed?'已停用目前這台手機。':'此手機沒有可停用的訂閱。',true)})};
      refresh();
    });
  }());
  </script>

</html>
