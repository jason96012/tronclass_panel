<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IP 黑名單｜Tronclass Dashboard</title>
  <style>
    :root{
      color-scheme:light dark;
      --bg:#f6f8fc;--card:#fff;--soft:#f1f5f9;--text:#172033;
      --muted:#64748b;--line:#d8dee8;--line2:#e7ebf1;
      --primary:#2563eb;--primary-text:#fff;--bad:#b42318;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",system-ui,sans-serif;
    }
    @media(prefers-color-scheme:dark){
      :root{--bg:#0f141d;--card:#161d29;--soft:#111827;--text:#eef2ff;--muted:#9aa4b5;--line:#303948;--line2:#252e3c;--primary:#60a5fa;--primary-text:#07111f;--bad:#f87171}
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{-webkit-tap-highlight-color:transparent}
    .top{
      position:sticky;top:0;z-index:30;
      display:flex;align-items:center;justify-content:space-between;gap:24px;
      min-height:76px;padding:14px 36px;
      background:rgba(246,248,252,.94);backdrop-filter:blur(16px);
      border-bottom:1px solid var(--line2);
    }
    @media(prefers-color-scheme:dark){.top{background:rgba(15,20,29,.94)}}
    .brand{display:flex;align-items:center;gap:14px;min-width:0}
    .logo{width:42px;height:42px;flex:0 0 auto;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;font-size:19px;font-weight:950;box-shadow:0 0 20px rgba(59,130,246,.25)}
    .brand-title{font-size:18px;font-weight:850;letter-spacing:-.025em;line-height:1.1;white-space:nowrap}
    .brand-sub{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.2}
    .actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-left:auto}
    a,button{font:inherit;min-height:40px;display:inline-flex;align-items:center;justify-content:center;line-height:1;border:1px solid var(--line);border-radius:999px;padding:0 15px;background:var(--card);color:var(--muted);text-decoration:none;cursor:pointer;white-space:nowrap;font-weight:700;transition:filter .15s ease,transform .15s ease}
    .actions a,.actions a:hover,.actions button,.actions button:hover{text-decoration:none!important}
    .actions a:not(.primary),.actions button:not(.primary){color:var(--muted)!important}
    a:hover,button:hover{filter:brightness(.97);transform:translateY(-1px);color:var(--text)}
    a.primary,button.primary{background:var(--primary);color:var(--primary-text)!important;border-color:var(--primary)}
    a.danger,button.danger{background:rgba(248,113,113,.14);color:var(--bad)!important;border-color:rgba(248,113,113,.28)}
    main{max-width:1200px;margin:24px auto;padding:0 18px 40px}
    .card{background:var(--card);border:1px solid var(--line2);border-radius:18px;box-shadow:0 12px 34px rgba(15,23,42,.07);overflow:hidden}
    .card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line2)}
    .card-head strong{font-size:16px;font-weight:850}.summary{color:var(--muted);font-size:13px}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line2);font-size:14px;vertical-align:middle}th{background:var(--soft);color:var(--muted);font-size:12px}tr:last-child td{border-bottom:0}.ip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;color:var(--text)}.empty,.error{padding:34px 18px;text-align:center;color:var(--muted)}.error{color:var(--bad)}
    .recent-card{margin-top:18px}.card-head-copy{display:grid;gap:3px}.card-note{color:var(--muted);font-size:12px;line-height:1.4}.recent-table-wrap{overflow:auto}.recent-table{min-width:900px}.recent-table .account{font-weight:750}.recent-table .muted{color:var(--muted)}.recent-table .failure{color:var(--bad);font-weight:800}.recent-table .location{color:var(--muted);font-size:13px}.recent-table .action-cell{white-space:nowrap}.recent-table .action-cell button{min-height:34px;padding:0 11px;font-size:12px}
    @media(max-width:700px){
      .top{align-items:center;flex-direction:row;gap:10px;padding:14px 16px}
      .brand{width:auto;flex:1 1 auto}.brand-title{font-size:17px}.brand-sub{font-size:11px}
      .actions{display:flex!important;flex:0 0 auto;margin-left:0}
      .actions > *:not(#blacklistBackDashboard){display:none!important}
      #blacklistBackDashboard{display:inline-flex!important;min-height:40px;padding:0 13px;font-size:12px;font-weight:850;color:var(--primary-text)!important;background:var(--primary)!important;border-color:var(--primary)!important}
      main{margin:15px auto;padding:0 10px 32px}.card{overflow:hidden}.card-head{align-items:flex-start;flex-direction:column;gap:5px;padding:14px}
      #content,#recentContent{overflow:visible}
      #content table,.recent-table{display:block;width:100%;min-width:0!important;border:0}
      #content table thead,.recent-table thead{display:none}
      #content table tbody,.recent-table tbody{display:grid;gap:10px;width:100%}
      #content table tr,.recent-table tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:13px 12px;border:1px solid var(--line2);border-radius:15px;background:var(--card);box-shadow:0 4px 14px rgba(15,23,42,.05)}
      #content table td,.recent-table td{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:3px 0;border:0;min-width:0;line-height:1.35;overflow-wrap:anywhere}
      #content table td::before,.recent-table td::before{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.04em}
      #content table td:nth-child(1)::before{content:'IP 位址'}
      #content table td:nth-child(2)::before{content:'封鎖時間'}
      #content table td:nth-child(3)::before{content:'操作者'}
      #content table td:nth-child(4)::before{content:'原因'}
      #content table td:nth-child(5)::before{content:'操作'}
      .recent-table td:nth-child(1)::before{content:'時間'}
      .recent-table td:nth-child(2)::before{content:'帳號'}
      .recent-table td:nth-child(3)::before{content:'IP 位址'}
      .recent-table td:nth-child(4)::before{content:'MAC 位址'}
      .recent-table td:nth-child(5)::before{content:'位置'}
      .recent-table td:nth-child(6)::before{content:'結果'}
      .recent-table td:nth-child(7)::before{content:'操作'}
      #content table td:last-child,.recent-table td:last-child{grid-column:1/-1;padding-top:8px;border-top:1px solid var(--line2)}
      #content table td:last-child button,.recent-table .action-cell button{width:100%;min-height:44px;padding:0 12px;font-size:13px}
      .recent-table .account,.recent-table .ip{font-size:14px}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">D</div>
      <div><div class="brand-title">Tronclass Dashboard</div><div class="brand-sub">IP 黑名單管理</div></div>
    </div>
    <div class="actions">
      <a id="dashboardPasswordButtonV1" href="/admin/password">變更密碼</a>
      <a href="/admin/passkey">設定通行密鑰</a>
      <a id="blacklistBackDashboard" href="/admin#overview" aria-label="返回 Dashboard 總覽">返回 Dashboard</a>
      <button id="logoutBtn" class="danger" type="button">登出</button>
      <button class="primary" id="reload" type="button">重新整理</button>
    </div>
  </header>
  <main>
    <section class="card">
      <div class="card-head"><strong>已封鎖的 IP</strong><span class="summary" id="summary">載入中...</span></div>
      <div id="content"><div class="empty">載入中...</div></div>
    </section>
    <section class="card recent-card">
      <div class="card-head">
        <div class="card-head-copy"><strong>最近登入失敗</strong><span class="card-note">顯示最近的失敗帳號、來源 IP 與可辨識的裝置資訊。</span></div>
        <span class="summary" id="recentSummary">載入中...</span>
      </div>
      <div id="recentContent"><div class="empty">載入中...</div></div>
    </section>
  </main>
  <script>
  (function(){
    'use strict';
    function q(id){return document.getElementById(id)}
    function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch]})}
    function token(){return''}
    function api(path,options){
      var u=new URL(path,location.origin); // F-03: token removed
      return fetch(u.pathname+u.search,Object.assign({credentials:'same-origin',cache:'no-store'},options||{})).then(function(res){return res.json().catch(function(){return {}}).then(function(body){if(res.status===401||res.status===403){location.replace('/admin');throw new Error('未授權')}if(!res.ok)throw new Error(body.error||('HTTP '+res.status));return body})})
    }
    function render(rows){
      q('summary').textContent=rows.length+' 筆';
      if(!rows.length){q('content').innerHTML='<div class="empty">目前沒有黑名單 IP。</div>';return}
      q('content').innerHTML='<table><thead><tr><th>IP</th><th>封鎖時間</th><th>操作者</th><th>封鎖原因</th><th>失敗次數</th><th>操作</th></tr></thead><tbody>'+rows.map(function(row){var failures=Number(row.failure_count||0);var failureLabel=failures>0?failures+' 次':'-';return '<tr><td class="ip">'+esc(row.ip)+'</td><td>'+esc(row.blocked_time)+'</td><td>'+esc(row.blocked_by)+'</td><td>'+esc(row.reason||'未提供')+'</td><td>'+esc(failureLabel)+'</td><td><button class="danger" type="button" data-unblock="'+esc(row.ip)+'">解除封鎖</button></td></tr>'}).join('')+'</tbody></table>';
    }
    function load(){q('content').innerHTML='<div class="empty">載入中...</div>';api('/admin/api/blacklist').then(function(body){render(body.items||[])}).catch(function(error){q('summary').textContent='';q('content').innerHTML='<div class="error">'+esc(error.message||error)+'</div>'})}
    function isFailure(row){var result=String(row.result||'').toLowerCase(),action=String(row.action||'').toLowerCase();return action==='login_failed'||result==='fail'||result==='failed'||result==='error'||result==='false'||(action==='login'&&result!=='success')}
    function fmtTime(value){if(!value)return'-';if(typeof value==='string'&&!/^\\d+(?:\\.\\d+)?$/.test(value))return value;var n=Number(value),d=new Date(n<1e11?n*1000:n);return isNaN(d.getTime())?String(value):d.toLocaleString('zh-TW',{hour12:false})}
    function renderRecent(events){var rows=(events||[]).filter(isFailure).slice(0,100);q('recentSummary').textContent=rows.length+' 筆';if(!rows.length){q('recentContent').innerHTML='<div class="empty">目前沒有登入失敗紀錄。</div>';return}q('recentContent').innerHTML='<div class="recent-table-wrap"><table class="recent-table"><thead><tr><th>時間</th><th>帳號</th><th>IP 位址</th><th>MAC 位址</th><th>位置</th><th>結果</th><th>操作</th></tr></thead><tbody>'+rows.map(function(row){var account=row.account_id||row.actor||'未知帳號',ip=row.ip||'-',mac=row.mac||row.mac_address||'無法取得',location=row.location||'未提供';var action=ip==='-'?'<span class="muted">無 IP</span>':'<button class="danger" type="button" data-block-ip="'+esc(ip)+'">加入黑名單</button>';return '<tr><td>'+esc(row.time||fmtTime(row.timestamp))+'</td><td class="account">'+esc(account)+'</td><td class="ip">'+esc(ip)+'</td><td class="muted">'+esc(mac)+'</td><td class="location">'+esc(location)+'</td><td class="failure">登入失敗</td><td class="action-cell">'+action+'</td></tr>'}).join('')+'</tbody></table></div>'}
    function loadRecent(){q('recentContent').innerHTML='<div class="empty">載入中...</div>';api('/admin/api/activity/login?limit=200').then(function(body){renderRecent(body.events||[])}).catch(function(error){q('recentSummary').textContent='';q('recentContent').innerHTML='<div class="error">'+esc(error.message||error)+'</div>'})}
    function loadAll(){load();loadRecent()}
    q('reload').addEventListener('click',loadAll);
    q('content').addEventListener('click',function(event){var button=event.target.closest('[data-unblock]');if(!button)return;var ip=button.getAttribute('data-unblock');if(!confirm('確定解除 '+ip+' 的封鎖？'))return;button.disabled=true;api('/admin/api/blacklist/unblock',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ip:ip})}).then(loadAll).catch(function(error){button.disabled=false;alert(error.message||error)})});
    q('recentContent').addEventListener('click',function(event){var button=event.target.closest('[data-block-ip]');if(!button)return;var ip=button.getAttribute('data-block-ip');if(!confirm('確定將 IP '+ip+' 加入黑名單？'))return;button.disabled=true;api('/admin/api/blacklist/block',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ip:ip})}).then(function(){alert('已將 '+ip+' 加入黑名單');loadAll()}).catch(function(error){button.disabled=false;alert(error.message||error)})});
    loadAll();
  })();
  </script>
<style id="MOBILE_HIDE_BACK_V1">@media(max-width:820px){#blacklistBackDashboard{display:none!important}}</style>
<script src="/admin/static/js/mobile-nav.js?v=mnav8"></script>
</body>
</html>
