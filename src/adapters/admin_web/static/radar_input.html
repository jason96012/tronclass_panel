<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>雷達點名輸入頁｜Tronclass</title>
<!-- RADAR_INPUT_PAGE_V1（fix71）：管理員版輸入頁（token 版是 /radar?token=…）。 -->
<style>
:root{
  color-scheme:light;
  --rd-bg:#f5f7fb;--rd-card:#ffffff;--rd-soft:#f1f5f9;--rd-soft-2:#eef2f8;
  --rd-text:#172033;--rd-muted:#64748b;--rd-line:#d8e0eb;--rd-input:#fff;
  --rd-shadow:0 10px 30px rgba(15,23,42,.07);--rd-hero-a:#eef4ff;--rd-hero-b:#e6eeff;
  --rd-ok:#0f9d58;--rd-ok-soft:#e6f5ec;--rd-bad:#d93025;--rd-bad-soft:#fdeceb;
  --rd-warn:#b45309;--rd-warn-soft:#fef3c7;--rd-accent:#2563eb;
}
@media(prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --rd-bg:#0f141d;--rd-card:#161d29;--rd-soft:#111827;--rd-soft-2:#1b2432;
    --rd-text:#eef2ff;--rd-muted:#9aa4b5;--rd-line:#303948;--rd-input:#101722;
    --rd-shadow:0 14px 36px rgba(0,0,0,.24);--rd-hero-a:#111d2d;--rd-hero-b:#13294b;
    --rd-ok:#34d399;--rd-ok-soft:#0f2a20;--rd-bad:#f87171;--rd-bad-soft:#2c1618;
    --rd-warn:#fbbf24;--rd-warn-soft:#2a2113;--rd-accent:#60a5fa;
  }
}
html[data-theme="light"]{
  color-scheme:light;--rd-bg:#f5f7fb;--rd-card:#fff;--rd-soft:#f1f5f9;--rd-soft-2:#eef2f8;
  --rd-text:#172033;--rd-muted:#64748b;--rd-line:#d8e0eb;--rd-input:#fff;
  --rd-shadow:0 10px 30px rgba(15,23,42,.07);--rd-hero-a:#eef4ff;--rd-hero-b:#e6eeff;
  --rd-ok:#0f9d58;--rd-ok-soft:#e6f5ec;--rd-bad:#d93025;--rd-bad-soft:#fdeceb;
  --rd-warn:#b45309;--rd-warn-soft:#fef3c7;--rd-accent:#2563eb;
}
html[data-theme="dark"]{
  color-scheme:dark;--rd-bg:#0f141d;--rd-card:#161d29;--rd-soft:#111827;--rd-soft-2:#1b2432;
  --rd-text:#eef2ff;--rd-muted:#9aa4b5;--rd-line:#303948;--rd-input:#101722;
  --rd-shadow:0 14px 36px rgba(0,0,0,.24);--rd-hero-a:#111d2d;--rd-hero-b:#13294b;
  --rd-ok:#34d399;--rd-ok-soft:#0f2a20;--rd-bad:#f87171;--rd-bad-soft:#2c1618;
  --rd-warn:#fbbf24;--rd-warn-soft:#2a2113;--rd-accent:#60a5fa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--rd-bg);color:var(--rd-text);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
a{color:var(--rd-accent)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
.head{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(180deg,var(--rd-hero-a),var(--rd-hero-b));
  border:1px solid var(--rd-line);border-radius:16px;padding:16px 18px;box-shadow:var(--rd-shadow);
}
.head h1{margin:0;font-size:20px}
.head .sub{color:var(--rd-muted);font-size:13px;margin-top:2px}
.head .spacer{flex:1 1 auto}
.card{
  background:var(--rd-card);border:1px solid var(--rd-line);border-radius:16px;
  padding:16px;box-shadow:var(--rd-shadow);margin-top:14px;
}
.card h2{margin:0 0 4px;font-size:16px}
.card .hint{color:var(--rd-muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:14px;margin-top:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--rd-line);background:var(--rd-soft)}
.badge.panel{background:var(--rd-ok-soft);color:var(--rd-ok);border-color:transparent}
.badge.config{background:var(--rd-soft-2);color:var(--rd-muted);border-color:transparent}
.badge.warn{background:var(--rd-warn-soft);color:var(--rd-warn);border-color:transparent}
button,.btn{
  font:inherit;border-radius:10px;border:1px solid transparent;background:var(--rd-accent);color:#fff;
  padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;
}
button.secondary,.btn.secondary{background:transparent;color:var(--rd-text);border-color:var(--rd-line)}
button:disabled{opacity:.55;cursor:not-allowed}
input,select{
  font:inherit;color:var(--rd-text);background:var(--rd-input);border:1px solid var(--rd-line);
  border-radius:10px;padding:9px 11px;min-width:0;
}
input[type="checkbox"]{min-width:auto;width:18px;height:18px;padding:0}
.coord-inputs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.field label{display:block;font-size:12.5px;color:var(--rd-muted);margin-bottom:4px}
.field input{width:100%;font-size:18px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{font-size:12.5px;padding:6px 11px;border-color:var(--rd-line);background:var(--rd-soft);color:var(--rd-text)}
.target-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}
.check{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:13px;color:var(--rd-muted)}
.msgs{min-height:22px;margin-top:10px;font-size:13px;font-weight:600}
.msgs.good{color:var(--rd-ok)}
.msgs.bad{color:var(--rd-bad)}
.msgs.info{color:var(--rd-muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--rd-line);border-radius:12px;padding:10px 12px;background:var(--rd-card)}
.item .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .top b{font-size:14px}
.item .meta{color:var(--rd-muted);font-size:12.5px;margin-top:3px;word-break:break-word}
.item .ops{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.item .ops button{font-size:12.5px;padding:6px 10px}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.stat{border:1px solid var(--rd-line);border-radius:12px;background:var(--rd-soft);padding:10px 12px}
.stat .k{color:var(--rd-muted);font-size:12px}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--rd-line)}
th{color:var(--rd-muted);font-size:12px;font-weight:600}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ok{color:var(--rd-ok);font-weight:600}
.bad{color:var(--rd-bad);font-weight:600}
.warn{color:var(--rd-warn);font-weight:600}
.empty{color:var(--rd-muted);font-size:13px;padding:8px 0}
/* ── 手機版（≤820px）：單欄、卡片化、底部固定送出列 ─────────────────────── */
.mobile-only{display:none}
#saveBarMobile{display:none}
@media(max-width:820px){
  .wrap{padding:12px 12px calc(150px + env(safe-area-inset-bottom,0px))}
  .desktop-only{display:none!important}
  .mobile-only{display:block}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .coord-inputs,.target-row{grid-template-columns:minmax(0,1fr)}
  .head{border-radius:14px;padding:14px}
  .head h1{font-size:18px}
  .head .back{display:none}
  .card{padding:14px;border-radius:14px}
  button,.btn{padding:11px 14px}
  .stat .v{font-size:18px}
  table{font-size:13px}
  th,td{padding:7px 6px}
  #saveBarMobile{
    display:block;position:fixed;left:0;right:0;bottom:0;z-index:40;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--rd-card);
    background:color-mix(in srgb,var(--rd-card) 92%,transparent);
    backdrop-filter:blur(10px);border-top:1px solid var(--rd-line);
  }
  #saveBarMobile .inner{display:flex;gap:8px;align-items:center;max-width:1180px;margin:0 auto}
  #saveBarMobile .state{flex:1 1 auto;font-size:12.5px;color:var(--rd-muted)}
  #saveBarMobile button{flex:0 0 auto;min-width:120px}
}
@media(max-width:390px){
  .head h1{font-size:17px}
  .stat .v{font-size:17px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <h1>雷達點名輸入頁</h1>
      <div class="sub">輸入一組座標，送給正在等座標的雷達點名（行為與數字點名的輸入頁相同：送出後套用到同一場點名的所有帳號）。</div>
    </div>
    <div class="spacer"></div>
    <span id="sourceBadge" class="badge config">讀取中…</span>
    <a class="btn secondary" id="backRadar" href="/admin/radar">回雷達設定</a>
    <button class="secondary" id="reloadBtn" type="button">重新整理</button>
  </header>

  <div id="pageMsg" class="msgs"></div>

  <div class="grid2">
    <!-- ── 輸入座標 ── -->
    <div class="stack">
      <section class="card">
        <div class="row">
          <div class="grow">
            <h2>輸入座標</h2>
            <div class="hint">緯度在前、經度在後。可以貼上「25.037300, 121.431500」整串。</div>
          </div>
          <div class="field" style="min-width:190px">
            <label for="providerSelect">學校（provider）</label>
            <select id="providerSelect"></select>
          </div>
        </div>
        <div class="coord-inputs">
          <div class="field">
            <label for="latInput">緯度 latitude（-90 ～ 90）</label>
            <input id="latInput" type="text" inputmode="decimal" autocomplete="off" placeholder="25.037300">
          </div>
          <div class="field">
            <label for="lonInput">經度 longitude（-180 ～ 180）</label>
            <input id="lonInput" type="text" inputmode="decimal" autocomplete="off" placeholder="121.431500">
          </div>
        </div>
        <div class="chips" id="coordChips"></div>
        <div class="row" style="margin-top:12px">
          <button class="secondary" id="locateBtn" type="button">📍 用我目前位置</button>
          <span class="hint" id="geoNote"></span>
        </div>

        <div class="target-row">
          <div class="field">
            <label for="targetSelect">送給誰</label>
            <select id="targetSelect">
              <option value="waiting">目前所有等待中的雷達點名</option>
              <option value="rollcall">指定一場點名</option>
              <option value="panel">只存進面板設定（不送）</option>
            </select>
          </div>
          <div class="field" id="rollcallField" style="display:none">
            <label for="rollcallSelect">指定點名（rollcall）</label>
            <select id="rollcallSelect"></select>
          </div>
        </div>
        <label class="check" for="addToPanel">
          <input id="addToPanel" type="checkbox">
          <span>同時把這組座標存進面板設定（下次同一間教室直接嘗試，不必再輸入）</span>
        </label>
        <div class="row" style="margin-top:12px">
          <button id="submitBtn" type="button">送出座標</button>
          <span class="hint" id="submitHint"></span>
        </div>
      </section>

      <section class="card">
        <h2>送出紀錄</h2>
        <div class="hint">只留在面板記憶體（最近 40 筆），重啟即清空。</div>
        <div class="stat-grid">
          <div class="stat"><div class="k">等待中的點名</div><div class="v" id="statLive">0</div></div>
          <div class="stat"><div class="k">等待中的帳號</div><div class="v" id="statAccounts">0</div></div>
        </div>
        <div class="mobile-only list" id="historyMobile" style="margin-top:10px"></div>
        <div class="desktop-only" style="margin-top:12px">
          <table>
            <thead><tr><th>時間</th><th>課程／點名 ID</th><th>座標</th><th>來源</th><th>送出帳號</th><th>面板</th></tr></thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <!-- ── 等待中的點名（即時狀態）── -->
    <div class="stack">
      <section class="card">
        <div class="row">
          <div class="grow">
            <h2>等待中的雷達點名</h2>
            <div class="hint">偵測到雷達點名並註冊輸入頁後會出現在這裡（逾時或已結束會自動消失）。</div>
          </div>
          <span class="badge config" id="liveBadge">0 場</span>
        </div>
        <div class="list" id="liveList" style="margin-top:10px"></div>
      </section>
    </div>
  </div>
</div>

<div id="saveBarMobile">
  <div class="inner">
    <span class="state" id="saveBarState">尚未送出座標</span>
    <button id="saveBarSubmit" type="button">送出座標</button>
  </div>
</div>

<script>
(function(){
  'use strict';
  var state={provider:'',providers:[],live:[],history:[],coords:[],effective:[],busy:false,geo:null};

  function q(id){return document.getElementById(id)}
  function txt(el,text,cls){if(!el)return;el.textContent=text==null?'':text;if(cls!==undefined)el.className=cls}
  function api(path,opts){
    return fetch(path,Object.assign({credentials:'same-origin',cache:'no-store'},opts||{})).then(function(res){
      return res.json().catch(function(){return {}}).then(function(body){
        if(!res.ok){var e=new Error((body&&body.error)||('HTTP '+res.status));e.status=res.status;throw e}
        return body;
      });
    });
  }
  function say(el,text,kind){txt(el,text,kind?('msgs '+kind):'msgs')}
  function fmtTime(ts){
    if(!ts)return '—';
    var d=new Date(ts*1000),p=function(n){return (n<10?'0':'')+n};
    return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());
  }
  function fmtCoord(lat,lon){return Number(lat).toFixed(6)+', '+Number(lon).toFixed(6)}
  function fmtSecs(total){
    total=Math.max(0,Math.floor(total||0));
    var m=Math.floor(total/60),s=total%60;
    return m>0?(m+':'+(s<10?'0':'')+s):(s+' 秒');
  }
  function parseCoordText(text){
    var parts=String(text||'').replace(/[，、]/g,',').replace(/[()（）]/g,' ').split(/[\s,]+/).filter(Boolean);
    return parts.map(Number);
  }
  function readFields(){
    var latRaw=q('latInput').value.trim(),lonRaw=q('lonInput').value.trim();
    var both=[latRaw,lonRaw].filter(function(v){return v!==''});
    var lat=NaN,lon=NaN;
    if(both.length===2){lat=Number(latRaw);lon=Number(lonRaw)}
    else if(both.length===1){var p=parseCoordText(both[0]);if(p.length===2){lat=p[0];lon=p[1]}}
    return {latitude:lat,longitude:lon};
  }
  function validate(lat,lon){
    if(!isFinite(lat)||!isFinite(lon))return '請輸入緯度與經度（例如 25.037300 與 121.431500）';
    if(lat<-90||lat>90)return '緯度必須在 -90 ～ 90 之間';
    if(lon<-180||lon>180)return '經度必須在 -180 ～ 180 之間';
    if(lat===0&&lon===0)return '座標 (0, 0) 幾乎一定是沒拿到位置，請重新確認';
    return '';
  }
  function fillCoords(lat,lon){
    q('latInput').value=Number(lat).toFixed(6);
    q('lonInput').value=Number(lon).toFixed(6);
  }

  // ── 渲染 ────────────────────────────────────────────────────────────────
  function fillProviders(){
    var sel=q('providerSelect'),old=state.provider;
    sel.replaceChildren();
    state.providers.forEach(function(name){
      var o=document.createElement('option');o.value=name;o.textContent=name;sel.appendChild(o);
    });
    if(old&&state.providers.indexOf(old)>=0)sel.value=old;
    else if(state.providers.length)sel.value=state.providers[0];
  }
  function renderChips(){
    var box=q('coordChips');box.replaceChildren();
    var list=state.coords.length?state.coords:state.effective;
    if(!list.length){var s=document.createElement('span');s.className='hint';s.textContent='（這個 provider 目前沒有設定座標）';box.appendChild(s);return}
    var label=document.createElement('span');label.className='hint';label.style.alignSelf='center';
    label.textContent=state.coords.length?'面板設定：':'生效座標：';
    box.appendChild(label);
    list.slice(0,12).forEach(function(pair,i){
      var b=document.createElement('button');b.type='button';
      b.textContent=(i+1)+'. '+fmtCoord(pair[0],pair[1]);
      b.addEventListener('click',function(){fillCoords(pair[0],pair[1])});
      box.appendChild(b);
    });
  }
  function renderLive(){
    var list=q('liveList');list.replaceChildren();
    txt(q('liveBadge'),state.live.length+' 場');
    if(!state.live.length){
      var e=document.createElement('div');e.className='empty';
      e.textContent='目前沒有等待中的雷達點名。點名一發生、面板註冊輸入頁之後就會出現在這裡。';
      list.appendChild(e);return;
    }
    state.live.forEach(function(entry){
      var item=document.createElement('div');item.className='item';

      var top=document.createElement('div');top.className='top';
      var b=document.createElement('b');b.textContent=entry.course_name||('點名 '+entry.rollcall_id);
      top.appendChild(b);
      var badge=document.createElement('span');
      var pending=Number(entry.pending_count||0);
      badge.className='badge '+(pending===0?'panel':'warn');
      badge.textContent=pending===0?'已點到':'等待中';
      top.appendChild(badge);
      var left=document.createElement('span');left.className='badge config';
      left.textContent='剩 '+fmtSecs(entry.expires_in_secs);
      top.appendChild(left);
      item.appendChild(top);

      var meta=document.createElement('div');meta.className='meta';
      meta.textContent='點名 ID '+entry.rollcall_id+'｜已點到 '+Number(entry.completed_count||0)+'／'+Number(entry.total_count||0)+' 個帳號';
      item.appendChild(meta);
      if(entry.submitted_point){
        var sent=document.createElement('div');sent.className='meta';
        sent.textContent='已送出座標：'+fmtCoord(entry.submitted_point.latitude,entry.submitted_point.longitude)
          +(entry.submitted_point.from_device?'（裝置定位）':'');
        item.appendChild(sent);
      }
      if(entry.last_error){
        var err=document.createElement('div');err.className='meta bad';
        err.textContent='上次結果：'+entry.last_error;
        item.appendChild(err);
      }

      var ops=document.createElement('div');ops.className='ops';
      var use=document.createElement('button');use.type='button';use.className='secondary';
      use.textContent='帶入已送出座標';
      use.disabled=!entry.submitted_point;
      use.addEventListener('click',function(){
        if(!entry.submitted_point)return;
        fillCoords(entry.submitted_point.latitude,entry.submitted_point.longitude);
        say(q('pageMsg'),'已帶入「'+(entry.course_name||entry.rollcall_id)+'」的座標，按送出即可重送。','info');
      });
      ops.appendChild(use);

      var send=document.createElement('button');send.type='button';
      send.textContent='只送這一場';
      send.addEventListener('click',function(){submit({target:'rollcall',rollcall_id:entry.rollcall_id})});
      ops.appendChild(send);
      item.appendChild(ops);

      list.appendChild(item);
    });
  }
  function renderRollcallOptions(){
    var sel=q('rollcallSelect'),old=sel.value;
    sel.replaceChildren();
    state.live.forEach(function(entry){
      var o=document.createElement('option');
      o.value=String(entry.rollcall_id);
      o.textContent=(entry.course_name||'點名')+'（#'+entry.rollcall_id+'・'+Number(entry.pending_count||0)+' 個等待中）';
      sel.appendChild(o);
    });
    if(old&&state.live.some(function(entry){return String(entry.rollcall_id)===old}))sel.value=old;
  }
  function renderHistory(){
    var body=q('historyBody'),mobile=q('historyMobile');
    body.replaceChildren();mobile.replaceChildren();
    if(!state.history.length){
      body.appendChild((function(){var tr=document.createElement('tr');var td=document.createElement('td');
        td.colSpan=6;td.className='empty';td.textContent='還沒有從這一頁送出過座標。';tr.appendChild(td);return tr})());
      var e=document.createElement('div');e.className='empty';e.textContent='還沒有從這一頁送出過座標。';mobile.appendChild(e);
      return;
    }
    state.history.slice(0,20).forEach(function(row){
      var tr=document.createElement('tr');
      function cell(text,cls){var td=document.createElement('td');td.textContent=text==null?'':text;if(cls)td.className=cls;tr.appendChild(td);return td}
      cell(fmtTime(row.timestamp),'num');
      cell((row.course_name?row.course_name+'　':'')+(row.rollcall_id?'#'+row.rollcall_id:'—'));
      cell(fmtCoord(row.latitude,row.longitude),'num');
      cell(row.from_device?'裝置定位':'手動');
      cell(String(Number(row.delivered_count||0)));
      cell(row.added_to_panel?'已加入':'—');
      body.appendChild(tr);
    });
    state.history.slice(0,5).forEach(function(row){
      var item=document.createElement('div');item.className='item';
      var top=document.createElement('div');top.className='top';
      var b=document.createElement('b');b.textContent=fmtCoord(row.latitude,row.longitude);top.appendChild(b);
      var badge=document.createElement('span');badge.className='badge config';badge.textContent=fmtTime(row.timestamp);top.appendChild(badge);
      item.appendChild(top);
      var meta=document.createElement('div');meta.className='meta';
      meta.textContent=(row.course_name||'—')+(row.rollcall_id?'（#'+row.rollcall_id+'）':'')
        +'｜送出 '+Number(row.delivered_count||0)+' 個帳號'+(row.added_to_panel?'｜已加入面板':'');
      item.appendChild(meta);
      if(row.note){var note=document.createElement('div');note.className='meta';note.textContent=row.note;item.appendChild(note)}
      mobile.appendChild(item);
    });
  }
  function renderAll(){
    fillProviders();renderChips();renderLive();renderRollcallOptions();renderHistory();
    txt(q('statLive'),String(state.live.length));
    txt(q('statAccounts'),String(state.live.reduce(function(sum,entry){return sum+Number(entry.pending_count||0)},0)));
    txt(q('sourceBadge'),state.coords.length?'面板已設定 '+state.coords.length+' 組座標':'沿用設定檔的座標','badge '+(state.coords.length?'panel':'config'));
    txt(q('submitHint'),state.live.length?('目前有 '+state.live.length+' 場點名在等座標'):'目前沒有等待中的點名（也可以勾選存進面板）');
  }

  // ── 讀取 ────────────────────────────────────────────────────────────────
  async function load(provider){
    say(q('pageMsg'),'讀取中…','info');
    try{
      var path='/admin/api/radar/input';
      if(provider)path+='?provider='+encodeURIComponent(provider);
      var body=await api(path);
      state.providers=body.providers||[];
      state.provider=body.provider||'';
      state.coords=Array.isArray(body.known_coords)?body.known_coords:[];
      state.effective=Array.isArray(body.effective_coords)?body.effective_coords:[];
      state.live=Array.isArray(body.live)?body.live:[];
      state.history=Array.isArray(body.history)?body.history:[];
      renderAll();
      if(body.hint){say(q('pageMsg'),body.hint,'bad');return}
      say(q('pageMsg'),'', 'info');
      if(!state.live.length&&!state.history.length){
        say(q('pageMsg'),'目前沒有等待中的雷達點名；座標仍可先存進面板設定。','info');
      }
    }catch(e){
      say(q('pageMsg'),'讀取失敗：'+e.message,'bad');
    }
  }

  // ── 送出 ────────────────────────────────────────────────────────────────
  async function submit(overrides){
    if(state.busy)return;
    var opts=overrides||{};
    var target=opts.target||q('targetSelect').value;
    var point=readFields();
    var invalid=validate(point.latitude,point.longitude);
    if(invalid){say(q('pageMsg'),invalid,'bad');return}
    if(!state.provider){say(q('pageMsg'),'請先選擇 provider','bad');return}
    var rollcallId=opts.rollcall_id;
    if(target==='rollcall'){
      rollcallId=rollcallId||Number(q('rollcallSelect').value||0);
      if(!rollcallId){say(q('pageMsg'),'沒有可以指定的點名（目前沒有等待中的點名）','bad');return}
    }
    state.busy=true;
    q('submitBtn').disabled=true;q('saveBarSubmit').disabled=true;
    txt(q('saveBarState'),'送出中…');
    say(q('pageMsg'),'正在送出座標 '+fmtCoord(point.latitude,point.longitude)+'…','info');
    try{
      var body=await api('/admin/api/radar/input',{
        method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({
          provider:state.provider,
          latitude:point.latitude,longitude:point.longitude,
          from_device:!!state.geo,
          accuracy:state.geo&&state.geo.accuracy!=null?state.geo.accuracy:null,
          target:target,rollcall_id:rollcallId||null,
          add_to_panel:q('addToPanel').checked
        })
      });
      var good=(body.note||('已送出，共 '+Number(body.delivered_count||0)+' 個帳號'));
      say(q('pageMsg'),good,'good');
      txt(q('saveBarState'),good);
      state.geo=null;
      await load(state.provider);
    }catch(e){
      say(q('pageMsg'),'送出失敗：'+e.message,'bad');
      txt(q('saveBarState'),'送出失敗');
    }finally{
      state.busy=false;
      q('submitBtn').disabled=false;q('saveBarSubmit').disabled=false;
    }
  }

  // ── 事件 ────────────────────────────────────────────────────────────────
  q('providerSelect').addEventListener('change',function(){load(q('providerSelect').value)});
  q('reloadBtn').addEventListener('click',function(){load(state.provider)});
  q('targetSelect').addEventListener('change',function(){
    q('rollcallField').style.display=q('targetSelect').value==='rollcall'?'':'none';
  });
  q('submitBtn').addEventListener('click',function(){submit(null)});
  q('saveBarSubmit').addEventListener('click',function(){submit(null)});
  [q('latInput'),q('lonInput')].forEach(function(el){
    el.addEventListener('keydown',function(ev){if(ev.key==='Enter')submit(null)});
    el.addEventListener('paste',function(ev){
      var text=(ev.clipboardData||window.clipboardData).getData('text')||'';
      var parts=parseCoordText(text);
      if(parts.length===2&&parts.every(function(v){return isFinite(v)})){
        ev.preventDefault();fillCoords(parts[0],parts[1]);
      }
    });
  });
  q('locateBtn').addEventListener('click',function(){
    if(typeof navigator.geolocation==='undefined'){
      say(q('pageMsg'),'這個瀏覽器不支援定位，請直接輸入座標','bad');return;
    }
    say(q('pageMsg'),'正在取得位置…（瀏覽器可能會詢問權限）','info');
    navigator.geolocation.getCurrentPosition(function(position){
      state.geo={accuracy:position.coords.accuracy};
      fillCoords(position.coords.latitude,position.coords.longitude);
      var acc=position.coords.accuracy==null?'':('（±'+Math.round(position.coords.accuracy)+' 公尺）');
      say(q('pageMsg'),'已取得目前位置'+acc+'，按「送出座標」送出。','good');
    },function(error){
      var message='取得位置失敗';
      if(error&&error.code===1)message='你拒絕了定位權限（可在瀏覽器設定重新允許）';
      else if(error&&error.code===2)message='目前拿不到位置（訊號或系統定位服務）';
      else if(error&&error.code===3)message='取得位置逾時';
      say(q('pageMsg'),message+'，請直接輸入座標','bad');
    },{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
  });

  if(typeof navigator.geolocation==='undefined'){
    txt(q('geoNote'),'此瀏覽器不支援定位，請直接輸入座標');
  }else{
    txt(q('geoNote'),'定位需要 HTTPS；面板已啟用。');
  }
  q('rollcallField').style.display='none';
  load('');
  // 手機版每 30 秒自動更新等待中的點名（電腦版手動重整）。
  setInterval(function(){
    if(window.matchMedia&&window.matchMedia('(max-width:820px)').matches&&!state.busy)load(state.provider);
  },30000);
})();
</script>
<script src="/admin/static/js/mobile-nav.js?v=mnav8"></script>
