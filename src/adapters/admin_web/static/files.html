<!doctype html>
<html lang="zh-Hant">
<head>
<!-- SUBPAGE_FETCH_SHARED_V1：子頁唯一的 window.fetch 包裝（cookie 認證、剝 token、401→refresh 重試）；取代原 SUBPAGE_TOKEN_BOOT_V1 內聯區塊 -->
<script src="/admin/static/subpage-fetch.js?v=20260909subfetch"></script>

<link rel="stylesheet" href="/admin/static/files-page.css?v=split1">
<script src="/admin/static/js/files-head.js?v=split1"></script>


<!-- HIDE_ADMIN_TOKEN_FROM_URL_V1_START -->
<meta name="referrer" content="no-referrer">

<!-- HIDE_ADMIN_TOKEN_FROM_URL_V1_END -->

<!-- CONSOLIDATED_ADMIN_AUTH_V1_HEAD_START -->


<!-- CONSOLIDATED_ADMIN_AUTH_V1_HEAD_END -->

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>教材雲端硬碟｜Tronclass</title>
  

  









</head>
<body>
<!-- NATIVE_MATERIALS_PAGE_ONLY_V1: the obsolete Nextcloud redirect overlay was
     removed. /admin/files now always opens this authenticated same-origin UI. -->
<header class="topbar">
  <div class="brand-wrap">
    <div class="brand-mark">D</div>
    <div>
      <div class="brand-title">教材雲端硬碟</div>
      <div class="brand-sub">線上課堂講義與資源</div>
    </div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="search" type="search" placeholder="搜尋教材或資料夾名稱...">
  </div>
  <div class="top-actions">
    <a id="dashboardLink" class="button primary" href="/admin">回控制台</a>
    <button id="refresh" class="button secondary" type="button">重新整理</button>
  </div>
  <!-- MOBILE_IMPORT_TOP_V1: 手機版頂欄「匯入 iClass」按鈕 (僅手機顯示) -->
  <button id="mImportTop" class="button secondary" type="button" title="從 iClass 自動下載當學期教材">
    <svg class="btn-ico" viewBox="0 0 24 24"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
    匯入<span class="m-import-full"> iClass</span>
  </button>
  <!-- MOBILE_UP_TOP_V2: 「回上一頁」移到匯入右側 -->
  <button id="filesBackDashboardBtn" class="button primary" type="button" title="回上一層資料夾">
    <svg class="btn-ico" viewBox="0 0 24 24"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg>
    回上一頁
  </button>
</header>

<div class="main">
  <!-- 桌面側邊欄 -->
  <aside class="sidebar">
    <div class="new-wrap">
      <button id="newBtn" class="new-btn" type="button">＋ 新增教材</button>
      <div id="newMenu" class="new-menu">
        <button id="newUpload" class="menu-item" type="button">上傳檔案</button>
        <button id="newFolder" class="menu-item" type="button">建立資料夾</button>
      </div>
    </div>
    <nav class="nav">
      <button id="navAll" class="active" type="button" data-folder="">全部教材</button>
      <div id="folderNav"></div>
    </nav>
    <section class="storage">
      <div style="font-weight:750;font-size:12px">硬碟儲存空間</div>
      <div class="storage-bar"><span id="storageBar"></span></div>
      <div id="storageText" class="small">計算中...</div>
    </section>
  </aside>

  <!-- 主內容區 -->
  <main class="content" id="main" tabindex="-1">
    <div class="content-head">
      <div>
        <h1 id="pageTitle">我的教材</h1>
        <div id="breadcrumb" class="breadcrumb"></div>
      </div>
      <div class="toolbar-right">
        <button id="importHere" class="button secondary" type="button" title="從 iClass 自動下載當學期教材">⬇️ 匯入 iClass 教材</button>
        <button id="uploadHere" class="button primary" type="button">上傳檔案</button>
        <button id="mkdirHere" class="button secondary" type="button">新增資料夾</button>
        <button id="manageShares" class="button secondary manage-shares-btn" type="button" title="管理所有分享連結" style="display:none">🔗 管理分享連結</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <div id="summary" class="small">載入中...</div>
      </div>
      <div class="toolbar-right">
        <select id="sortBy">
          <option value="modified_desc" selected>最新修改</option>
          <option value="name_asc">名稱 A-Z</option>
          <option value="size_desc">檔案大小</option>
        </select>
        <div class="view-toggle">
          <button id="gridView" class="button secondary active" type="button">格狀</button>
          <button id="listView" class="button secondary" type="button">清單</button>
        </div>
      </div>
    </div>

    <!-- 拖曳上傳與進度列 -->
    <div id="dropzone" class="dropzone">將檔案拖曳至此處，即可上傳至當前資料夾</div>
    <div id="uploadProgress" class="upload-progress">
      <div id="uploadProgressText" class="small">準備上傳...</div>
      <div class="progress-line"><span id="uploadProgressBar"></span></div>
    </div>
    <input id="fileInput" class="hidden-input" type="file" multiple accept=".pdf,.docx,.pptx,.xlsx,.txt,.md,.jpg,.jpeg,.png,.zip,.mp4,.heic,.gif,.mov">

    <!-- 資料夾區域 -->
    <div id="folderSection" class="section-title">
      <h2>資料夾</h2>
    </div>
    <div id="folderGrid" class="folder-grid"></div>

    <!-- 檔案區域 -->
    <div class="section-title">
      <h2 id="filesHeading">檔案</h2>
    </div>
    <div id="fileGrid" class="file-grid"></div>

    <!-- 清單表格 -->
    <table id="listTable" class="list-table">
      <thead>
        <tr>
          <th>檔案名稱</th>
          <th>所在位置</th>
          <th>修改時間</th>
          <th>大小</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="listBody"></tbody>
    </table>
    <!-- MOBILE_NAV_SPACER_V1: 真實空白元素，高度由 JS 設為導覽列高度+餘裕，
         保證捲到底時操作區不被 fixed 導覽列遮擋（不依賴 media query／cascade）。 -->
    <div id="mobileBottomSpacer"></div>
  </main>
</div>

<!-- 預覽彈出視窗 -->
<div id="previewModal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <div id="previewTitle" style="font-weight:760;overflow:hidden;text-overflow:ellipsis">預覽</div>
      <div style="display:flex;gap:8px">
        <a id="previewDownload" class="button primary" href="#">下載</a>
        <button id="previewClose" class="icon" type="button">×</button>
      </div>
    </div>
    <div id="previewBody" class="modal-body"></div>
  </div>
</div>

<!-- 手機底部功能列 -->
<nav id="mobilebar" class="mobilebar">
  <button id="mDriveHome" type="button" aria-label="返回控制台">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
    <span>返回控制台</span>
  </button>
  <button id="mUpload" type="button">
    <svg viewBox="0 0 24 24"><path d="M12 16V4"></path><path d="m7 9 5-5 5 5"></path><path d="M5 20h14"></path></svg>
    <span>上傳</span>
  </button>
  <button id="mFolder" type="button">
    <svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"></path></svg>
    <span>資料夾</span>
  </button>
  <button id="mRefresh" type="button" aria-label="連結管理">
    <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
    <span>連結管理</span>
  </button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- 完整雲端硬碟 JS 控制邏輯 -->
<script src="/admin/static/js/files-main.js?v=split1"></script>








<!-- SHARE_ADMIN_V1: 電腦版「管理分享連結」按鈕（僅管理員可見，手機隱藏） -->


<!-- MOBILE_NAV_AUTOHIDE_V1: 往下捲自動收起底部導覽列、往上捲出現，
     避免 floating 導覽列永遠蓋住卡片操作按鈕。 -->

<!-- MOBILE_NAV_SPACER_V1: 以 JS 把空白元素高度設為「導覽列高度+24」，
     導覽列隱藏時設 0。inline style 優先，不受 cascade/media 影響。 -->

<!-- MOBILE_BOTTOM_CLEAR_V2: 放在最後、最高優先，底部留白大於導覽列+操作列高度，
     捲到底時「下載/預覽/分享/刪除」剛好落在導覽列上方、不被擋。 -->

</body>
</html>
