<script id="BAN_CRUDE_LOGIN_V1">
(function(){
  if(window.BAN_CRUDE_LOGIN_V1) return;
  window.BAN_CRUDE_LOGIN_V1 = true;
  function isCrude(card){
    if(!card) return false;
    if(card.querySelector('.animated-login-card-inner')) return false;
    var tx=(card.textContent||'').replace(/\s+/g,'');
    return !!(card.querySelector('.login-grid') || tx.indexOf('需要登入')>=0 || tx.indexOf('帳號 / account')>=0);
  }
  function kill(root){
    var scope=root&&root.querySelectorAll?root:document;
    var cards=[];
    if(root&&root.id==='loginCard') cards.push(root);
    try{ cards=cards.concat(Array.prototype.slice.call(scope.querySelectorAll('#loginCard,.login-card,#loginPanel'))); }catch(_){}
    cards.forEach(function(card){
      if(!isCrude(card)) return;
      card.innerHTML='';
      card.hidden=true;
      card.setAttribute('aria-hidden','true');
      card.style.display='none';
    });
  }
  kill(document);
  try{ new MutationObserver(function(ms){ ms.forEach(function(m){ Array.prototype.forEach.call(m.addedNodes||[], function(n){ if(n.nodeType===1) kill(n); }); }); }).observe(document.documentElement,{childList:true,subtree:true}); }catch(_){}
})();
</script>

<meta name="referrer" content="no-referrer">
<script id="hideAdminTokenFromUrlEarlyV1">
(function(){
  'use strict';
  if (window.HIDE_ADMIN_TOKEN_FROM_URL_EARLY_V1) return;
  window.HIDE_ADMIN_TOKEN_FROM_URL_EARLY_V1 = true;
  var LS_SESSION = 'tronclass_admin_session';
  var LS_LOGOUT = 'tronclass_dashboard_manual_logout';
  function sanitizeCurrentUrl(){
    try {
      var u = new URL(location.href);
      var changed = false;
      var token = u.searchParams.get('token') || '';
      if (u.searchParams.get('logout') === '1') {
        localStorage.removeItem(LS_SESSION);
        sessionStorage.removeItem(LS_SESSION);
        localStorage.removeItem(LS_LOGOUT); /* LOGOUT_SERVER_SIDE_V1 */
      } else if (token) {
        localStorage.setItem(LS_SESSION, token);
        sessionStorage.setItem(LS_SESSION, token);
        localStorage.removeItem(LS_LOGOUT);
      }
      if (u.searchParams.has('token')) { u.searchParams.delete('token'); changed = true; }
      if (changed) history.replaceState(null, document.title, u.pathname + (u.search ? u.search : '') + u.hash);
    } catch(_) {}
  }
  sanitizeCurrentUrl();
  window.tronAdminToken = function(){
    try {
      var u = '';
      if (u) return String(u).trim();
      return (localStorage.getItem(LS_SESSION) || sessionStorage.getItem(LS_SESSION) || '').trim();
    } catch(_) { return ''; }
  };
})();
</script>
<!-- HIDE_ADMIN_TOKEN_FROM_URL_V1_END -->

<script id="consolidatedAdminAuthEarlyV1">
(function(){
  'use strict';
  if (window.COOKIE_SUBPAGE_AUTH_V1) return;
  window.COOKIE_SUBPAGE_AUTH_V1 = true;
  var LO = 'tronclass_dashboard_manual_logout';
  try {
    var p = new URLSearchParams(location.search);
    /* LOGOUT_SERVER_SIDE_V1：登出已改為伺服器端（POST /admin/logout 清 cookie）；
       不再以 ?logout=1 / tronclass_dashboard_manual_logout 判斷，只清掉遺留旗標。 */
    try { localStorage.removeItem(LO); } catch (_) {}
    if (p.has('logout')) { p.delete('logout'); history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p.toString() : '') + location.hash); }
    /* LOGIN_PERF_V1：這頁是伺服器驗證過 session 才送出的（pages::inject_auth_attrs 會在 <html>
       寫入 data-auth="ok" 與 data-account / data-admin / data-viewer）。有這個屬性就直接進入
       已登入版面，不再多打一次 /admin/api/status 當「開機驗證」——省一趟往返，第一幀不閃。
       沒有屬性（理論上不會發生）才退回舊的網路驗證。 */
    var authOk = document.documentElement.getAttribute('data-auth') === 'ok';
    if (authOk) {
      window.__tronAuthStatus = window.__tronAuthStatus || {
        current_account_id: document.documentElement.getAttribute('data-account') || '',
        is_admin: document.documentElement.getAttribute('data-admin') === '1',
        is_viewer: document.documentElement.getAttribute('data-viewer') === '1',
        __partial: true
      };
      window.__tronAuthState = 'ok';
      document.documentElement.classList.remove('tron-auth-pending','tron-auth-logged-out');
      document.documentElement.classList.add('tron-auth-ok','dash-auth-ok','auth-ok');
      if (document.body) document.body.classList.add('logged-in','auth-ok','dash-auth-ok');
      else document.addEventListener('DOMContentLoaded', function(){ document.body.classList.add('logged-in','auth-ok','dash-auth-ok'); }, { once: true });
    } else {
    document.documentElement.classList.add('tron-auth-pending');
    fetch('/admin/api/status', {credentials:'same-origin', cache:'no-store'}).then(function(r){
      if (r.ok) {
        document.documentElement.classList.remove('tron-auth-pending','tron-auth-logged-out');
        document.documentElement.classList.add('tron-auth-ok','dash-auth-ok','auth-ok');
        if (document.body) document.body.classList.add('logged-in','auth-ok','dash-auth-ok');
        return;
      }
      var next = encodeURIComponent(location.pathname + location.search + location.hash);
      location.replace('/admin?next=' + next);
    }).catch(function(){
      var next = encodeURIComponent(location.pathname + location.search + location.hash);
      location.replace('/admin?next=' + next);
    });
    }
  } catch(_) {
    location.replace('/admin');
  }
})();
</script>
<!-- CONSOLIDATED_ADMIN_AUTH_V1_HEAD_END -->

  <script id="optimizeV47Theme">
  (function(){

  function themeChoice(){try{var s=JSON.parse(localStorage.getItem(THEME_LS)||'{}');var t=String(s.theme||'auto').toLowerCase();return(t==='light'||t==='dark')?t:'auto'}catch(_){return'auto'}}
  function applyTheme(){var c=themeChoice();document.documentElement.setAttribute('data-theme',c==='auto'?(mq.matches?'dark':'light'):c)}
  /* THEME_CHOICE_V1: 使用者設定（外觀設定頁）優先；auto 才跟隨系統，並同步跨分頁變更 */
  applyTheme();
  try{mq.addEventListener('change',applyTheme)}catch(e){mq.addListener(applyTheme)}
  try{window.addEventListener('storage',function(ev){if(!ev||!ev.key||ev.key===THEME_LS)applyTheme()})}catch(_){}
  window.__setTheme=function(t){document.documentElement.setAttribute('data-theme',t||'dark')};

<!-- 完整雲端硬碟 JS 控制邏輯 -->
<script>
(function(){
  'use strict';
  const LS_SESSION = 'tronclass_admin_session';
  let files = [], folders = [], currentFolder = '', isAdmin = false;
  let view = localStorage.getItem('drive_view') || 'grid';
  let sort = 'modified_desc';

  const q = id => document.getElementById(id);
  
  function token(){
    try {
      const u = '';
      if (u) return String(u).trim();
      const keys = ['tronclass_admin_session','tronclass_admin_token','tronclass_dashboard_token','tronclass_session_token','adminToken','admin_token','token'];
      for (let i = 0; i < keys.length; i++) {
        const v = localStorage.getItem(keys[i]) || sessionStorage.getItem(keys[i]);
        if (v && String(v).trim()) return String(v).trim();
      }
    } catch(_) {}
    return '';
  }

  function withToken(path){
    try {
      const u = new URL(path, location.origin);
      const t = token();
      // F-03: token removed, auth via HttpOnly cookie
      return u.pathname + u.search + u.hash;
    } catch(_) { return path; }
  }

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function norm(p){
    return String(p || '').replace(/^\/+|\/+$/g, '').replace(/\/+/g, '/').trim();
  }

  function base(p){
    p = norm(p);
    return p ? p.split('/').pop() : '我的教材';
  }

  function parent(p){
    p = norm(p);
    if (!p || !p.includes('/')) return '';
    const a = p.split('/');
    a.pop();
    return a.join('/');
  }

  function toast(t, ok=true){
    const el = q('toast');
    if (!el) return;
    el.textContent = t;
    el.className = 'toast visible ' + (ok ? 'ok' : 'bad');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove('visible'), 3200);
  }

  function sizeLabel(n){
    n = Number(n || 0);
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
    return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
  }

  function ext(f){
    return String(f.extension || (f.name || '').split('.').pop() || '').toLowerCase();
  }

  function dl(path){
    return '/admin/api/files/download?path=' + encodeURIComponent(path);
  }

  function pv(path){
    return '/admin/api/files/preview?path=' + encodeURIComponent(path);
  }

  // NO_LIBREOFFICE_PREVIEW_V1: 雲端硬碟可預覽的格式。
  // ⚠️ 這幾份清單必須與後端 files.rs 的 `PREVIEWABLE_EXTS` 完全一致。
  //    兩邊不同步時會出現「按了預覽卻收到 400」——舊版的 gif/bmp/webp 就是這樣壞的。
  // 全部走瀏覽器原生或前端本機解析，伺服器不呼叫 LibreOffice 等任何轉檔程式。
  const IMAGE_PREVIEW_EXTS  = ['jpg','jpeg','png','gif','bmp','webp','avif','ico','svg'];
  const VIDEO_PREVIEW_EXTS  = ['mp4','webm','mov','m4v'];
  const AUDIO_PREVIEW_EXTS  = ['mp3','wav','ogg','m4a','flac'];
  // 純文字類：抓回來後一律經 esc() 跳脫再顯示，絕不當成 HTML 執行。
  const TEXT_PREVIEW_EXTS   = ['txt','text','md','markdown','log','json','xml','yaml','yml',
                               'ini','conf','cfg','toml','sql','sh','rs','js','ts','jsx','tsx',
                               'css','py','java','c','h','cpp','hpp','go','php','html','htm',
                               'srt','vtt'];
  // 前端本機解析的 Office 格式（OOXML / ODF / RTF）
  const OFFICE_PREVIEW_EXTS = ['docx','pptx','xlsx','odt','ods','odp','rtf'];
  // 舊二進位：伺服器會回原始位元組，前端顯示「請下載查看」
  const LEGACY_OFFICE_EXTS  = ['doc','ppt','xls'];
  // OFFICE_ONLINE_V1: 這些格式可交給 Microsoft Office Online 檢視器（OneDrive 同款）。
  // 舊版 .doc/.ppt/.xls 本機無法解析，一律走線上；新版則本機優先、可切線上。
  const OFFICE_ONLINE_EXTS  = ['doc','ppt','xls','docx','pptx','xlsx'];

  function canPreview(e){
    return IMAGE_PREVIEW_EXTS.includes(e) || e === 'pdf' || e === 'url' ||
           VIDEO_PREVIEW_EXTS.includes(e) || AUDIO_PREVIEW_EXTS.includes(e) ||
           TEXT_PREVIEW_EXTS.includes(e) || e === 'csv' || e === 'tsv' ||
           OFFICE_PREVIEW_EXTS.includes(e) || LEGACY_OFFICE_EXTS.includes(e);
  }
  // URL_SHORTCUT_V1: 解析 Internet Shortcut（.url）內容，取出目標網址。
  // 支援 [InternetShortcut] 區的 URL= 行，或整份內容就是一個 http(s) 連結。
  function parseShortcutUrl(txt){
    txt = txt || '';
    let m = /(?:^|[\r\n])\s*URL\s*=\s*([^\s\r\n]+)/i.exec(txt);
    let u = m ? m[1].trim() : '';
    if (!u) {
      const t = txt.trim();
      if (/^https?:\/\//i.test(t)) u = t.split(/\s+/)[0];
    }
    if (!u) return null;
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }
  // URL_SHORTCUT_V1: .url 的「預覽」＝跳轉到該網站。先同步開新分頁（about:blank）
  // 以避免被浏览器的彈窗阻擋器擋下，fetch 完再把位址指過去；若新分頁開不成，
  // 退為同分頁跳轉。解析失敗才退回彈窗顯示原始內容。
  async function previewUrlFile(path, f){
    const win = window.open('about:blank', '_blank');
    let txt = '';
    try {
      const res = await fetch(pv(path), { cache: 'no-store' });
      txt = await res.text();
      const target = parseShortcutUrl(txt);
      if (!target) throw new Error('找不到 URL=');
      if (win) win.location.replace(target);
      else window.location.href = target;
      return;
    } catch (err) {
      if (win) win.close();
      reportPreview(path, 'url', 'url', 'shortcut jump failed: ' + (err && err.message));
      if (q('previewTitle')) q('previewTitle').textContent = f.name || path;
      if (q('previewDownload')) q('previewDownload').href = dl(path);
      setPreviewOpen(true);
      q('previewBody').innerHTML = '<div class="empty">此 .url 檔沒有可跳轉的網址，原始內容如下：</div><pre>' + esc(txt) + '</pre>';
    }
  }
  function isOfficePreview(e){ return OFFICE_PREVIEW_EXTS.includes(e) || LEGACY_OFFICE_EXTS.includes(e); }

  async function api(path, opts={}, timeout=12000){
    const t = token();
    const c = new AbortController();
    const timer = setTimeout(() => c.abort(), timeout);
    opts.signal = c.signal;
    opts.credentials = opts.credentials || 'same-origin';
    const sep = path.includes('?') ? '&' : '?';
    try {
      const res = await fetch(path, opts);
      if (res.status === 401 || res.status === 403) {
        localStorage.removeItem(LS_SESSION);
        sessionStorage.removeItem(LS_SESSION);
        const next = encodeURIComponent(location.pathname + location.search + location.hash);
        location.replace('/admin?next=' + next);
        throw new Error('登入失效，跳轉至核心登入頁');
      }
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
      return body;
    } finally {
      clearTimeout(timer);
    }
  }

  // MATERIALS_IMPORT_V1 + SHARED: 從 iClass 自動匯入當學期教材(共用雲端硬碟)。
  // 後端改為背景 job：這端立即發起，再輪詢 /import/status 顯示進度，避免 502。
  //
  // IMPORT_CONST_MSG_FIX_V1（fix64）：舊版在「完成訊息」用 `const msg` 卻又 `msg += …`
  // 去附加錯誤清單——只要這次匯入有任何錯誤（例如有檔案的副檔名不被允許），
  // 這行就丟出 TypeError: Assignment to constant variable，使用者看到的
  // 就是「匯入失敗：Assignment to constant variable.」，摘要與清單全部不見、
  // 也不會重新載入檔案列表。改成 let。
  //
  // IMPORT_ALL_TYPES_V1（fix64）：匯入時若遇到「不是許可的檔名（副檔名不在白名單）」，
  // 以前是默默跳過；現在完成後會列出檔名並詢問使用者是否仍要匯入，確定就帶
  // all_types=1 再跑一次（後端這次不套用白名單）。這個選擇會記在 localStorage，
  // 之後的匯入直接沿用，不再每次問。
  var LS_IMPORT_ALL_TYPES = 'tronclass_materials_import_all_types';

  function importAllTypesRemembered(){
    try { return localStorage.getItem(LS_IMPORT_ALL_TYPES) === '1'; } catch (_) { return false; }
  }
  function rememberImportAllTypes(){
    try { localStorage.setItem(LS_IMPORT_ALL_TYPES, '1'); } catch (_) {}
  }

  // 跑一次匯入並輪詢到結束。回傳最後一次 status；逾時（仍在背景跑）回傳 null；失敗丟例外。
  async function runImportOnce(allTypes, btn){
    // 注意：這個端點在路由表是 GET（舊版就靠 GET 觸發），帶 method:'POST' 會 405。
    const start = await api('/admin/api/files/import' + (allTypes ? '?all_types=1' : ''), {}, 60000);
    if (!start.ok){ throw new Error(start.error || start.message || '匯入無法開始'); }
    if (start.accepted === false){ throw new Error(start.error || start.message || '匯入無法開始'); }
    // 輪詢進度(最多約 10 分鐘)。
    const maxWait = 600000;
    const began = Date.now();
    let lastMsg = '';
    while (Date.now() - began < maxWait) {
      await new Promise(r => setTimeout(r, 2500));
      const st = await api('/admin/api/files/import/status', {}, 60000);
      if (st && st.message && st.message !== lastMsg) { lastMsg = st.message; if (btn) btn.textContent = st.message.slice(0, 24); }
      if (st && st.done) return st;
    }
    return null;
  }

  function importSummary(st, allTypes){
    let msg = '匯入完成' + (allTypes ? '（含所有檔案類型）' : '') + '：\n' +
      '課程 ' + (st.courses_scanned||0) + ' 門\n' +
      '教材 ' + (st.materials_found||0) + ' 項\n' +
      '已儲存 ' + (st.files_saved||0) + '、已跳過 ' + (st.files_skipped||0) +
      '、連結 ' + (st.links_created||0) + '、未開放 ' + (st.pending||0) +
      '、失敗 ' + (st.failed||0);
    if (st.disallowed){
      msg += '\n\n非允許的檔案類型（本次未匯入）：' + st.disallowed + ' 個';
      const sample = (Array.isArray(st.disallowed_files) ? st.disallowed_files : []).slice(0, 10);
      if (sample.length){
        msg += '\n' + sample.join('\n') +
          (st.disallowed > sample.length ? ('\n…以及另外 ' + (st.disallowed - sample.length) + ' 個') : '');
      }
    }
    if (Array.isArray(st.errors) && st.errors.length){
      msg += '\n\n錯誤（最多顯示 10 筆）：\n' + st.errors.slice(0,10).join('\n');
    }
    return msg;
  }

  // 有被白名單擋下的檔案時詢問使用者；確定 → 記住選擇並立刻再匯入一次（含全部類型）。
  async function askImportAllTypes(st, btn){
    const blocked = Number(st && st.disallowed || 0);
    if (blocked <= 0) return null;
    const sample = (Array.isArray(st.disallowed_files) ? st.disallowed_files : []).slice(0, 10);
    const rest = blocked > sample.length ? ('\n…以及另外 ' + (blocked - sample.length) + ' 個') : '';
    const question =
      '有 ' + blocked + ' 個教材的檔案不在預設允許清單（PDF／Word／PowerPoint／圖片以外的類型，例如影片、音檔、壓縮檔、Excel）：\n\n' +
      (sample.length ? sample.join('\n') + rest + '\n\n' : '') +
      '要把它們也一起匯入嗎？\n\n' +
      '按「確定」= 立刻再匯入一次（含這些檔案），之後的匯入也會自動包含所有類型。\n' +
      '按「取消」= 維持現狀（只匯入 PDF／Word／PowerPoint／圖片）。\n\n' +
      '提醒：影片等大檔會花比較久，也會佔用雲端硬碟容量。';
    if (!confirm(question)) return null;
    rememberImportAllTypes();
    if (btn) btn.textContent = '匯入全部類型…';
    return await runImportOnce(true, btn);
  }

  async function importMaterials(){
    const btn = q('importHere');
    const old = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = '匯入中…'; }
    try {
      const allTypes = importAllTypesRemembered();
      let st = await runImportOnce(allTypes, btn);
      if (!st){ alert('匯入仍在背景執行中，請稍後回到此頁查看「全部教材」'); return; }
      alert(importSummary(st, allTypes));

      // 只在使用者還沒選過「全部類型」時詢問一次。
      if (!allTypes){
        const again = await askImportAllTypes(st, btn);
        if (again){ alert(importSummary(again, true)); }
        else if (again === null && Number(st.disallowed || 0) > 0){ /* 使用者選擇維持現狀 */ }
      }
      loadFiles();
    } catch (e) {
      alert('匯入失敗：' + (e && e.message ? e.message : e));
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = old; }
    }
  }
  function folderSet(){
    const set = new Set();
    folders.forEach(f => {
      const n = norm(f);
      if (n) set.add(n);
    });
    files.forEach(f => {
      const p = norm(f.folder || parent(f.path || ''));
      if (p) set.add(p);
    });
    return Array.from(set).sort((a,b) => a.localeCompare(b, 'zh-Hant'));
  }

  function childFolders(){
    const all = folderSet();
    const prefix = currentFolder ? currentFolder + '/' : '';
    const out = new Set();
    all.forEach(f => {
      if (!currentFolder) {
        const first = f.split('/')[0];
        if (first) out.add(first);
      } else if (f.startsWith(prefix)) {
        const rest = f.slice(prefix.length);
        const first = rest.split('/')[0];
        if (first) out.add(prefix + first);
      }
    });
    const needle = (q('search') ? q('search').value : '').trim().toLowerCase();
    return Array.from(out).filter(f => f !== currentFolder && (!needle || f.toLowerCase().includes(needle))).sort((a,b) => base(a).localeCompare(base(b), 'zh-Hant'));
  }

  function directFiles(){
    const needle = (q('search') ? q('search').value : '').trim().toLowerCase();
    let list = files.filter(f => norm(f.folder || parent(f.path || '')) === currentFolder);
    if (needle) {
      list = files.filter(f => ((f.path||'') + ' ' + (f.name||'') + ' ' + (f.folder||'')).toLowerCase().includes(needle));
    }
    list.sort((a,b) => {
      if (sort === 'name_asc') return String(a.name || a.path || '').localeCompare(String(b.name || b.path || ''), 'zh-Hant');
      if (sort === 'size_desc') return Number(b.size || 0) - Number(a.size || 0);
      return String(b.modified || '').localeCompare(String(a.modified || ''));
    });
    return list;
  }

  // UPLOAD_DESKTOP_FIX_V1（fix50）：電腦版「選了檔案卻完全沒動靜」強化。
  //
  // 症狀：/admin/files 桌面版點「上傳檔案」→ 選檔視窗有開、選完之後沒有任何反應
  //       （進度列沒出現、console 沒有紅字），同一支手機版卻正常。
  // 由於桌面與手機共用同一個 <input id="fileInput">、同一個 onchange，
  // 唯一能造成「完全安靜」的位置就是「change 事件沒有回到我們的處理函式」。
  // 因此這裡不再假設事件一定會到，改成：
  //   1) 所有入口（工具列／側欄選單／手機底部列／拖放區點擊）統一走 pickFiles()。
  //   2) pickFiles() 開檔前先 armUploadWatch()：開檔後 60 秒內每 700ms 檢查一次
  //      fileInput.files；只要「有檔案但 change 沒來」，就自動接手直接上傳。
  //   3) 以「檔名|大小|修改時間」簽章去重，change 與 watchdog 不會重複上傳同一批。
  //   4) 選到檔案立刻顯示進度列＋toast，之後不會再出現「選完看起來像沒反應」的狀態。
  //   5) 失敗訊息一律經過 uploadStatusMessage()，把 401/403/413/429/5xx 講成人話，
  //      並把伺服器回的 error 原文一起顯示，方便回報。
  let _pickWatchTimer = 0;
  let _pickArmedAt = 0;
  let _pickSig = '';
  let _uploading = false;

  function filesSig(fileList){
    try {
      return Array.prototype.map.call(fileList || [], f => [f.name, f.size, f.lastModified].join('|')).join('§');
    } catch(_) { return ''; }
  }

  function armUploadWatch(){
    _pickArmedAt = Date.now();
    _pickSig = '';
    if (_pickWatchTimer) return;
    _pickWatchTimer = setInterval(() => {
      if (Date.now() - _pickArmedAt > 60000) {
        clearInterval(_pickWatchTimer);
        _pickWatchTimer = 0;
        return;
      }
      const inp = q('fileInput');
      if (!inp || !inp.files || !inp.files.length) return;
      const sig = filesSig(inp.files);
      if (!sig || sig === _pickSig) return; // change 已經處理過這一批
      _pickSig = sig;
      console.info('[upload] change 事件未觸發，watchdog 接手：' + inp.files.length + ' 個檔案');
      uploadFiles(inp.files);
    }, 700);
  }

  // 唯一的上傳入口：開選檔視窗。桌面／手機／拖放區點擊都走這裡。
  function pickFiles(){
    const inp = q('fileInput');
    if (!inp) {
      progressError('找不到上傳欄位，請重新整理頁面後再試');
      hideProgress(8000);
      return;
    }
    armUploadWatch();
    try { inp.value = ''; } catch(_) {}
    try {
      inp.click();
    } catch(e) {
      const msg = (e && e.message) ? e.message : String(e);
      progressError('無法開啟選檔視窗：' + msg);
      hideProgress(8000);
      toast('無法開啟選檔視窗：' + msg, false);
    }
  }

  // UPLOAD_STATUS_MESSAGE_V1（fix50）：把 HTTP 狀態碼翻成看得懂的說明。
  function uploadStatusMessage(status, body){
    const server = body && body.error ? String(body.error) : '';
    const map = {
      400: '伺服器不接受這次上傳（請求內容不合法）',
      401: '登入狀態已過期，請重新整理頁面後再試',
      403: '瀏覽器阻擋了這次上傳（來源驗證失敗），請用同一個網域重新整理後再試',
      404: '找不到上傳端點（伺服器版本可能過舊，請重新部署）',
      408: '伺服器等不到上傳資料（連線太慢或中途斷線）',
      413: '超過硬碟總容量（或外層反向代理的大小上限）',
      429: '已有其他檔案正在上傳，請稍後再試',
      500: '伺服器內部錯誤',
      502: '伺服器暫時無法處理（可能正在重新啟動）',
      503: '伺服器忙碌中或儲存空間不足',
      504: '伺服器回應逾時'
    };
    const friendly = map[status] || '';
    if (server && friendly) return 'HTTP ' + status + '（' + friendly + '）：' + server;
    if (server) return 'HTTP ' + status + '：' + server;
    return 'HTTP ' + status + (friendly ? '（' + friendly + '）' : '');
  }

  // 回報問題時可在 console 打 __TRON_UPLOAD_DIAG() 看目前狀態。
  window.__TRON_UPLOAD_DIAG = function(){
    const inp = q('fileInput');
    return {
      build: 'UPLOAD_DESKTOP_FIX_V1',
      endpoint: '/admin/api/files/upload',
      hasInput: !!inp,
      multiple: !!inp && inp.multiple === true,
      pickedFiles: (inp && inp.files) ? inp.files.length : 0,
      watchActive: !!_pickWatchTimer,
      lastSig: _pickSig,
      uploading: _uploading,
      // UPLOAD_PARALLEL_V1（fix61）：目前一次送幾個檔案（與後端
      // MATERIAL_UPLOAD_CONCURRENCY 對齊）；回報「上傳卡住」時先看這個數字。
      parallel: UPLOAD_PARALLEL,
      online: navigator.onLine !== false,
      // UPLOAD_NO_FILE_CAP_V1（fix54）：單檔不限大小，只受硬碟總容量限制。
      maxBytes: null,
      maxTotalBytes: 10 * 1024 * 1024 * 1024
    };
  };

  // UPLOAD_QUEUE_SPEED_V1（fix51）：上傳佇列、即時速度與預估剩餘時間。
  //
  // 這一版把「一次一個檔案、任一檔失敗就整批停住」換成真正的佇列：
  //   1. 每個檔案一列，各自顯示進度、已傳／總量、速度（EMA 平滑）與預估剩餘時間；
  //      最上面另有整批的百分比、總速度與總預估。
  //   2. 429（伺服器同時只收 3 條上傳，配額以保留量守住）與 5xx、網路中斷
  //      會自動重試（0.9s／1.8s／3.6s 退避，最多 3 次），不再立刻判死。
  //   3. 單一檔案失敗不再中斷整批——舊版會 throw，後面還沒送的檔案就那樣消失。
  //   4. 失敗的檔案在列表下方集中成「重試失敗的檔案」一鍵重送。
  const UPLOAD_RETRY_LIMIT = 3;
  const UPLOAD_RETRY_BASE_MS = 900;
  // UPLOAD_PARALLEL_V1（fix61）：伺服器端同時可收 3 條上傳（10 GiB 配額改以「保留量」
  // 守住，不再靠序列化），前端就用 3 個 worker 把佇列送出去——選三個大檔的總時間
  // 從「相加」變成「取最慢的那個」。上限與後端 MATERIAL_UPLOAD_CONCURRENCY 對齊。
  const UPLOAD_PARALLEL = 3;

  let _uploadRows = [];
  // 進度事件的節流時間戳：事件可能每秒數十次，逐次重建 DOM 會拖慢上傳本身。
  let _uqLastPaint = 0;

  function fmtEta(seconds){
    if (!isFinite(seconds) || seconds <= 0) return '';
    if (seconds < 60) return Math.ceil(seconds) + ' 秒';
    const m = Math.floor(seconds / 60);
    const s = Math.round(seconds % 60);
    return s ? (m + ' 分 ' + s + ' 秒') : (m + ' 分');
  }

  function renderUploadQueue(){
    const box = q('uploadQueue');
    if (!box) return;
    if (!_uploadRows.length) { setHTMLSafe(box, ''); return; }
    const rows = _uploadRows.map(r => {
      const total = r.total || (r.file && r.file.size) || 0;
      const sent = Math.min(r.sent || 0, total);
      const pct = total ? Math.min(100, Math.round(sent * 100 / total)) : (r.status === 'done' ? 100 : 0);
      let meta;
      if (r.status === 'done') {
        meta = sizeLabel(total) + ' · 完成 ✓';
      } else if (r.status === 'failed') {
        meta = '✕ ' + esc(r.error || '上傳失敗');
      } else if (r.status === 'waiting') {
        meta = (r.attempts > 1) ? ('等待重試（第 ' + r.attempts + ' 次）') : '等待中…';
      } else {
        const speed = r.speed > 0 ? ' · ' + sizeLabel(r.speed) + '/s' : '';
        const eta = r.eta > 0 ? ' · 剩 ' + fmtEta(r.eta) : '';
        meta = pct + '% · ' + sizeLabel(sent) + '/' + sizeLabel(total) + speed + eta;
      }
      const cls = r.status === 'done' ? ' done' : (r.status === 'failed' ? ' failed' : '');
      return '<div class="uq-row' + cls + '">'
        + '<div class="uq-name">' + esc(r.file.name) + '</div>'
        + '<div class="uq-meta">' + meta + '</div>'
        + '<div class="uq-track"><span class="uq-fill" style="width:' + pct + '%"></span></div>'
        + '</div>';
    }).join('');
    const failed = _uploadRows.filter(r => r.status === 'failed').length;
    const retry = (!_uploading && failed > 0)
      ? '<div class="uq-actions"><button type="button" class="button secondary" data-uq-retry="1">重試失敗的檔案（' + failed + '）</button></div>'
      : '';
    setHTMLSafe(box, rows + retry);
  }

  // 整批的進度：總百分比、總速度、預估剩餘時間。
  function uploadAggregate(){
    const totalBytes = _uploadRows.reduce((s, r) => s + (r.total || (r.file && r.file.size) || 0), 0);
    const sentBytes = _uploadRows.reduce((s, r) => s + Math.min(r.sent || 0, r.total || (r.file && r.file.size) || 0), 0);
    const done = _uploadRows.filter(r => r.status === 'done').length;
    const failed = _uploadRows.filter(r => r.status === 'failed').length;
    const actives = _uploadRows.filter(r => r.status === 'uploading');
    const active = actives[0];
    const speed = _uploadRows.reduce((s, r) => s + (r.status === 'uploading' ? (r.speed || 0) : 0), 0);
    const pct = totalBytes ? Math.min(100, Math.round(sentBytes * 100 / totalBytes)) : 0;
    const idx = Math.min(_uploadRows.length, done + failed + actives.length);
    let text = '上傳中 ' + idx + '/' + _uploadRows.length;
    // UPLOAD_PARALLEL_V1（fix61）：一次可能有三個檔在同一時間跑，講「並行 N 個」比
    // 只報第一個檔名誠實；只有一個在跑時仍然顯示檔名（原本的行為）。
    if (actives.length > 1) text = '並行上傳 ' + actives.length + ' 個檔案（' + idx + '/' + _uploadRows.length + '）';
    else if (active) text = '上傳 ' + active.file.name + '（' + idx + '/' + _uploadRows.length + '）';
    if (speed > 0) {
      text += ' · ' + sizeLabel(speed) + '/s';
      const eta = (totalBytes - sentBytes) / speed;
      if (eta > 0) text += ' · 預估剩 ' + fmtEta(eta);
    }
    if (q('uploadProgressText')) q('uploadProgressText').textContent = text;
    if (q('uploadProgressBar')) q('uploadProgressBar').style.width = pct + '%';
    return { pct, done, failed };
  }

  function uploadFileOnce(row, index, total){
    return new Promise((resolve, reject) => {
      const startedAt = Date.now();
      uploadOne(row.file, index, total, row.file.name, (loaded, tot) => {
        row.status = 'uploading';
        row.sent = loaded;
        if (tot) row.total = tot;
        const secs = (Date.now() - startedAt) / 1000;
        if (secs > 0.2) {
          const instant = loaded / secs;
          row.speed = row.speed > 0 ? (row.speed * 0.6 + instant * 0.4) : instant;
          const left = (row.total || row.file.size) - loaded;
          row.eta = row.speed > 0 ? Math.max(0, left / row.speed) : 0;
        }
        if (Date.now() - _uqLastPaint >= 120) {
          _uqLastPaint = Date.now();
          renderUploadQueue();
          uploadAggregate();
        }
      }).then(resolve, reject);
    });
  }

  // 一個檔案（含自動重試）。回傳 true＝成功。
  async function uploadRowWithRetry(row, index, total){
    for (let attempt = 1; attempt <= UPLOAD_RETRY_LIMIT; attempt++) {
      row.attempts = attempt;
      row.status = 'uploading';
      row.error = '';
      row.sent = 0;
      row.speed = 0;
      row.eta = 0;
      renderUploadQueue();
      try {
        await uploadFileOnce(row, index, total);
        row.status = 'done';
        row.sent = row.total || row.file.size;
        renderUploadQueue();
        uploadAggregate();
        return true;
      } catch(e) {
        const msg = (e && e.message) ? e.message : String(e);
        // 429＝伺服器正在處理另一個檔案（一次只收一個，才守得住 10 GB 配額）；
        // 5xx 與連線中斷也可能只是一時，都值得再試。
        const retryable = /HTTP (429|5\d\d)/.test(msg) || /網路連線中斷/.test(msg);
        if (retryable && attempt < UPLOAD_RETRY_LIMIT) {
          row.status = 'waiting';
          row.error = '';
          renderUploadQueue();
          await new Promise(r => setTimeout(r, UPLOAD_RETRY_BASE_MS * Math.pow(2, attempt - 1)));
          continue;
        }
        row.status = 'failed';
        row.error = msg;
        renderUploadQueue();
        uploadAggregate();
        return false;
      }
    }
    return false;
  }

  // 送完 pending：UPLOAD_PARALLEL 條並行（伺服器端同時收 3 條，超過會回 429 並自動退避）。
  // 每個 worker 從共用索引取下一件，所以「有人失敗」不會拖住其他還在排隊的檔案。
  async function runUploadQueue(pending, label){
    if (_uploading) return pending.length;
    _uploading = true;
    if (_pickWatchTimer) { clearInterval(_pickWatchTimer); _pickWatchTimer = 0; }
    showProgress(0, label);
    renderUploadQueue();
    uploadAggregate();
    let failedNow = 0;
    let next = 0;
    const worker = async () => {
      while (true) {
        const index = next;
        next += 1;
        if (index >= pending.length) return;
        const ok = await uploadRowWithRetry(pending[index], index + 1, pending.length);
        if (!ok) failedNow++;
        uploadAggregate();
      }
    };
    try {
      const workers = [];
      const slots = Math.min(UPLOAD_PARALLEL, pending.length);
      for (let i = 0; i < slots; i++) workers.push(worker());
      await Promise.all(workers);
    } finally {
      _uploading = false;
      // UPLOAD_DESKTOP_FIX_V1（fix50）：不論成功失敗都要解鎖，否則之後選檔會被擋。
      renderUploadQueue();
      uploadAggregate();
    }
    return failedNow;
  }

  function uploadOne(file, i, total, displayName, onProgress){
    return new Promise((resolve, reject) => {
      const fd = new FormData();
      fd.append('folder', currentFolder);
      // UPLOAD_ANY_TYPE_V1（fix39）：原檔名原樣送出（後端不再判斷格式、也不改名）
      fd.append('file', file, displayName || file.name);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/admin/api/files/upload', true);
      xhr.withCredentials = true;
      xhr.upload.onprogress = ev => {
        if (onProgress) {
          onProgress(ev.loaded, ev.lengthComputable ? ev.total : (file.size || 0));
          return;
        }
        if (ev.lengthComputable) {
          showProgress(ev.loaded / ev.total * 100, '上傳 ' + i + '/' + total + '：' + file.name + ' (' + Math.round(ev.loaded / ev.total * 100) + '%)');
        } else {
          showProgress(30, '上傳 ' + i + '/' + total + '：' + file.name);
        }
      };
      xhr.onerror = () => {
        console.warn('[upload] 網路錯誤', { name: file.name, size: file.size });
        reject(new Error('網路連線中斷（訊號不穩或連線被中斷；大檔案請確認連線穩定後再試）'));
      };
      xhr.onabort = () => reject(new Error('上傳已取消'));
      xhr.onload = () => {
        let body = {};
        try { body = JSON.parse(xhr.responseText || '{}'); } catch(_) {}
        if (xhr.status >= 200 && xhr.status < 300) {
          console.info('[upload] 成功', { name: file.name, status: xhr.status });
          resolve(body);
          return;
        }
        // UPLOAD_STATUS_MESSAGE_V1（fix50）：不再只顯示「HTTP 500」這種看不懂的字。
        const msg = uploadStatusMessage(xhr.status, body);
        console.warn('[upload] 失敗', { name: file.name, status: xhr.status, body: String(xhr.responseText || '').slice(0, 300) });
        reject(new Error(msg));
      };
      showProgress(0, '準備上傳 ' + i + '/' + total + '：' + file.name);
      xhr.send(fd);
    });
  }

  // UPLOAD_ROBUST_V1: 上傳流程強化（手機白畫面/沒上傳修復）
  // 1) 立即清空 fileInput——失敗後重選同一個檔案仍會觸發 change
  // 2) 錯誤訊息停留在進度條 8 秒並標紅，不再一閃即逝
  //（舊版還有一條「用戶端預先檢查 50 MB 上限」與 `UPLOAD_MAX_BYTES` 常數，
  //  UPLOAD_NO_FILE_CAP_V1（fix54）之後已移除：教材單檔不限大小，容量由伺服器
  //  在收檔迴圈裡逐片段檢查硬碟總量。）
  // UPLOAD_ANY_TYPE_V1（fix39）：不再有格式白名單，也不再做「無副檔名就依 MIME
  // 補副檔名」的改名行為——送出的檔名與使用者選的完全一致。伺服器同樣不檢查
  // 副檔名，只檢查檔名安全性（長度／路徑字元）與硬碟總容量。
  async function uploadFiles(fileList){
    // UPLOAD_DESKTOP_FIX_V1（fix50）：讀不到檔案也要講話，不再安靜結束。
    let arr = [];
    try { arr = Array.from(fileList || []); } catch(e) {
      progressError('無法讀取選取的檔案：' + ((e && e.message) ? e.message : e));
      hideProgress(8000);
      return;
    }
    if (!arr.length) return;
    if (_uploading) { toast('已有檔案正在上傳，請等它跑完再選', false); return; }
    if (q('fileInput')) q('fileInput').value = '';
    // UPLOAD_NO_FILE_CAP_V1（fix54）：不做格式預檢，也不做大小預檢——多大的檔案都
    // 直接送。能不能收下由伺服器依「硬碟總容量」逐片段決定（超過會回 413 並附原因）。
    const will = arr;
    _uploadRows = will.map(f => ({ file: f, sent: 0, total: f.size, speed: 0, eta: 0, attempts: 0, status: 'waiting', error: '' }));
    // UPLOAD_DESKTOP_FIX_V1（fix50）：選到檔案就立刻顯示進度列與提示——
    // 之後不可能再出現「選完檔案卻看起來完全沒反應」的狀態。
    if (_pickWatchTimer) { clearInterval(_pickWatchTimer); _pickWatchTimer = 0; }
    showProgress(0, '已選擇 ' + _uploadRows.length + ' 個檔案，開始上傳…');
    toast('開始上傳 ' + _uploadRows.length + ' 個檔案…');
    try {
      const failed = await runUploadQueue(_uploadRows.slice(), '已選擇 ' + _uploadRows.length + ' 個檔案，開始上傳…');
      if (!failed) {
        if (q('uploadProgressText')) q('uploadProgressText').style.color = '';
        showProgress(100, '所有檔案上傳完成！');
        toast('教材上傳完成');
        hideProgress();
      } else {
        progressError('上傳失敗 ' + failed + ' 個檔案（可點下方「重試失敗的檔案」）');
        toast('上傳失敗：' + _uploadRows.filter(r => r.status === 'failed').map(r => r.file.name).join('、'), false);
      }
      await loadFiles();
    } catch(e) {
      progressError('上傳失敗：' + (e.message || e));
      toast('上傳失敗：' + (e.message || e), false);
      hideProgress(8000);
    }
  }

  function retryFailedUploads(){
    if (_uploading) { toast('還有檔案正在上傳，請稍等', false); return; }
    const failed = _uploadRows.filter(r => r.status === 'failed');
    if (!failed.length) return;
    toast('重試 ' + failed.length + ' 個檔案…');
    if (q('uploadProgressText')) q('uploadProgressText').style.color = '';
    (async () => {
      try {
        const still = await runUploadQueue(failed, '重試 ' + failed.length + ' 個檔案…');
        if (!still) {
          showProgress(100, '所有檔案上傳完成！');
          toast('教材上傳完成');
          hideProgress();
        } else {
          progressError('仍有 ' + still + ' 個檔案上傳失敗');
        }
        await loadFiles();
      } catch(e) {
        progressError('重試失敗：' + (e.message || e));
      }
    })();
  }

  async function delFile(path){
    if (!confirm('確定刪除檔案？\n' + path)) return;
    try {
      await api('/admin/api/files/delete', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ path })
      });
      toast('檔案已刪除');
      await loadFiles();
    } catch(e) {
      toast(e.message || '刪除檔案失敗', false);
    }
  }

  async function delFolder(path){
    if (!confirm('確定刪除資料夾及其所有內容？\n' + path)) return;
    try {
      await api('/admin/api/files/rmdir', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ path })
      });
      if (currentFolder === path || currentFolder.startsWith(path + '/')) currentFolder = '';
      toast('資料夾已刪除');
      await loadFiles();
    } catch(e) {
      toast(e.message || '刪除資料夾失敗', false);
    }
  }


  // PREVIEW_LOG_V1: 把前端預覽/解析錯誤回報到後台日誌（fire-and-forget），
  // 讓管理者在 Pterodactyl console 看到「哪個檔、哪一步、什麼錯」。
  function reportPreview(path, ext, stage, msg){
    try {
      fetch('/admin/api/files/preview-log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: path, ext: ext, stage: stage, message: String(msg || '').slice(0, 2000) }),
        cache: 'no-store'
      }).catch(function(){});
    } catch(_) {}
  }

  // ===== PREVIEW_FAST_V1（fix52）：預覽載入加速 =====
  // 目標：從點「預覽」到看到內容之間，不再做重複的事。
  //   ① previewBytes()：同一份教材的位元組只抓一次（前端快取＋後端 ETag 304）
  //   ② 下載時顯示百分比（有 Content-Length 時），大檔不再看起來像卡住
  //   ③ PDF 先畫第一頁（立刻有內容），其餘頁在背景以有限並行補齊
  //   ④ 關閉彈窗時取消未完成的渲染／下載，並釋放 PDF 文件與畫布
  //   ⑤ 滑過「預覽」按鈕就先暖引擎、預抓位元組（真的點下去幾乎立即出現）
  //   ⑥ 判斷「這是不是 PDF」改用 Range 抓前 8 bytes，不為了嗅探下載整檔
  const PREVIEW_BYTES_MAX = 24 * 1024 * 1024; // 超過此大小不快取（不佔記憶體）
  const PREVIEW_CACHE_MAX = 6;                // 最多保留 6 份位元組
  const PDF_RENDER_CONCURRENCY = 2;           // 首頁之外的並行渲染頁數
  // MATERIALS_MOBILE_V1（fix57）：手機版預覽（與公告附件預覽 fix56 同一套做法）。
  //   · 手機的裝置像素比常是 3 → 一頁 A4 畫布 ~8 MB，十幾頁就讓 iOS 重新載入整頁
  //   · 長講義先畫前幾頁就好，其餘捲到附近才畫（桌機完全不受影響）
  const PDF_RATIO_MAX_MOBILE = 2;             // 窄螢幕畫布倍率上限
  const PDF_EAGER_PAGES_MOBILE = 3;           // 窄螢幕先畫幾頁
  const PDF_LAZY_MARGIN = '700px 0px';        // 捲到距頁面多近就開始畫
  function previewNarrow(){
    return !!(window.matchMedia && window.matchMedia('(max-width:820px)').matches);
  }
  const PREVIEW_PREWARM_MS = 120;             // 滑過按鈕後多久才真的暖機
  const PREVIEW_RANGE_SNIFF_MIN = 3 * 1024 * 1024; // 大於此大小才用 Range 嗅探
  var _previewCache = [];        // [{ path, bytes }]，最近用過的排最後
  var _previewInflight = {};     // path -> { promise, listeners }：同檔只抓一次
  var _previewXhrs = [];         // 進行中的位元組下載（關閉時 abort）
  var _previewPdfTasks = [];     // 進行中的 PDF 頁面渲染（關閉時 cancel）
  var _previewPdf = null;        // 目前開啟中的 PDF 文件（關閉時 destroy）
  // MATERIALS_MOBILE_V1（fix57）：PDF 版面狀態（頁碼／翻頁／延遲渲染／轉向重畫）
  var _previewPdfWrap = null;    // 目前的 .tron-pdf 容器
  var _previewPdfSlots = [];     // 每頁一個插槽（頁碼／翻頁／延遲渲染都看這個）
  var _previewPdfWidth = 0;      // 目前畫的目標寬度（轉向後寬度差太多就重畫）
  var _previewPdfCur = 1;        // 目前看到第幾頁
  var _previewPdfObserver = null;// 延遲渲染用（捲到附近才畫那一頁）
  var _previewPdfBytes = null;   // 這一份的位元組（轉向重畫用，不重新下載）
  var _previewPdfTick = false;   // 捲動事件節流
  var _previewReflowTimer = null;// 轉向／改大小的去抖動
  var _previewToken = 0;         // 換檔／關閉就 +1，舊的非同步工作看到不同值即停手
  var _pdfWorkerReady = false;   // workerSrc 只需設定一次
  var _previewWarmTimer = null;
  var _previewWarmed = {};

  function previewCancelled(mine){ return mine !== _previewToken; }

  function previewCacheGet(path){
    for (let i = 0; i < _previewCache.length; i++){
      if (_previewCache[i].path === path){
        const hit = _previewCache.splice(i, 1)[0]; // 移到最後＝最近使用
        _previewCache.push(hit);
        return hit.bytes;
      }
    }
    return null;
  }
  function previewCacheDrop(path){
    _previewCache = _previewCache.filter(x => x.path !== path);
  }
  function previewCachePut(path, bytes){
    previewCacheDrop(path);
    if (!bytes || !bytes.length || bytes.length > PREVIEW_BYTES_MAX) return;
    _previewCache.push({ path: path, bytes: bytes });
    while (_previewCache.length > PREVIEW_CACHE_MAX) _previewCache.shift();
  }
  // FILE_LIST_REFRESH 時清快取：清單重讀代表伺服器端可能已被上傳／刪除改動，
  // 不能讓舊位元組留在前端（同檔名覆蓋就會看到舊內容）。
  function previewCacheClear(){ _previewCache = []; }

  // PREVIEW_FETCH_ONCE_V1（fix52）：取得預覽位元組的唯一入口。
  //   - 快取命中：同步回傳，完全不碰網路（重開同一份教材幾乎立即出現）。
  //   - 同檔同時被兩個地方要求（例如暖機＋真的點下去）：共用同一個下載。
  //   - 用 XHR 而非 fetch，是為了在長檔下載時拿到 lengthComputable 的進度。
  //   - 不快取超過 PREVIEW_BYTES_MAX 的檔案，避免手機記憶體被撐爆。
  function fetchPreviewBytes(path, onProgress){
    const cached = previewCacheGet(path);
    if (cached){
      if (onProgress) onProgress(cached.length, cached.length);
      return Promise.resolve(cached);
    }
    const job = _previewInflight[path];
    if (job){
      if (onProgress) job.listeners.push(onProgress);
      return job.promise;
    }
    const next = { listeners: onProgress ? [onProgress] : [], promise: null };
    next.promise = new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      _previewXhrs.push(xhr);
      const done = () => { _previewXhrs = _previewXhrs.filter(x => x !== xhr); };
      xhr.open('GET', pv(path), true);
      xhr.responseType = 'arraybuffer';
      xhr.onprogress = ev => {
        if (!ev || !ev.lengthComputable) return;
        next.listeners.forEach(fn => { try { fn(ev.loaded, ev.total); } catch(_) {} });
      };
      xhr.onload = () => {
        done();
        if (xhr.status >= 200 && xhr.status < 300 && xhr.response){
          const bytes = new Uint8Array(xhr.response);
          previewCachePut(path, bytes);
          resolve(bytes);
        } else {
          reject(new Error('http ' + xhr.status));
        }
      };
      xhr.onerror = () => { done(); reject(new Error('network error')); };
      xhr.onabort = () => { done(); reject(new Error('aborted')); };
      xhr.send();
    }).then(bytes => { delete _previewInflight[path]; return bytes; },
            err => { delete _previewInflight[path]; throw err; });
    _previewInflight[path] = next;
    return next.promise;
  }

  // PREVIEW_CANCEL_V1（fix52）：換檔案時讓前一個還在跑的工作停手（不 abort 下載，
  // 讓暖機／進行中的位元組繼續完成並進快取——下一個畫面多半就是它）。
  function invalidatePreviewWork(){
    _previewToken++;
    _previewPdfTasks.forEach(task => { try { task.cancel(); } catch(_) {} });
    _previewPdfTasks = [];
    if (_previewPdf){ try { _previewPdf.destroy(); } catch(_){} _previewPdf = null; }
    // MATERIALS_MOBILE_V1（fix57）：版面狀態一起收乾淨（延遲渲染的觀察者、捲動監聽、
    // 轉向重畫用的位元組），否則關掉彈窗後還留著工作與記憶體。
    if (_previewPdfObserver){ try { _previewPdfObserver.disconnect(); } catch(_) {} _previewPdfObserver = null; }
    if (_previewPdfWrap){ try { _previewPdfWrap.removeEventListener('scroll', pdfOnScroll); } catch(_) {} }
    _previewPdfWrap = null;
    _previewPdfSlots = [];
    _previewPdfWidth = 0;
    _previewPdfCur = 1;
    _previewPdfBytes = null;
  }
  // 關閉彈窗：連下載一起停，並釋放畫布（大檔的 canvas 可能佔數百 MB）。
  function closePreviewTasks(){
    invalidatePreviewWork();
    _previewXhrs.forEach(xhr => { try { xhr.abort(); } catch(_) {} });
    _previewXhrs = [];
    _previewInflight = {};
    const body = q('previewBody');
    if (body) body.innerHTML = '';
  }

  function isPdfBytes(bytes){
    return !!bytes && bytes.length > 4 &&
      bytes[0] === 0x25 && bytes[1] === 0x50 && bytes[2] === 0x44 && bytes[3] === 0x46; // %PDF
  }

  // PREVIEW_SNIFF_RANGE_V1（fix52）：只用 Range 抓前 8 bytes 判斷「實際內容是不是
  // PDF」（後端支援 206／Accept-Ranges，見 fix51）。舊版 .doc/.ppt/.xls 因此不必先
  // 下載整份才發現「其實是 PDF」或「該交給 Office Online」。
  // 若伺服器／代理忽略 Range 而回整份，剛好可以放進快取，不算白抓。
  async function previewLooksLikePdf(path, size, forceRange){
    // 小檔（≤ 3 MB）且後續一定會用到整份內容時：直接抓整份並放進快取，少一次往返；
    // 舊版 Office（forceRange）之後不會用到內容，一律只用 Range 抓前 8 bytes。
    if (!forceRange && size && size <= PREVIEW_RANGE_SNIFF_MIN){
      try { return isPdfBytes(await fetchPreviewBytes(path)); } catch(_) { return false; }
    }
    try {
      const res = await fetch(pv(path), { headers: { 'Range': 'bytes=0-7' } });
      if (res.ok){
        const bytes = new Uint8Array(await res.arrayBuffer());
        if (res.status === 200) previewCachePut(path, bytes);
        return isPdfBytes(bytes);
      }
    } catch(_) {}
    try { return isPdfBytes(await fetchPreviewBytes(path)); } catch(_) { return false; }
  }

  // PREVIEW_WARM_LIBS_V1（fix52）：先按需載入引擎（載入失敗不影響流程，真的要用時
  // 會再抓一次並依原邏輯顯示錯誤）。
  function ensurePreviewLib(name){
    try {
      if (!window.__tronEnsureFileLib) return Promise.resolve();
      const p = window.__tronEnsureFileLib(name);
      return p && p.catch ? p.catch(() => {}) : Promise.resolve(p);
    } catch(_) { return Promise.resolve(); }
  }

  // PREVIEW_PREWARM_V1（fix52）：滑鼠停在同一顆「預覽」按鈕上才暖機，避免滑過清單
  // 就一直抓檔。PDF → 暖引擎＋預抓位元組；Office → 暖本機解析引擎。
  function prewarmPreview(path){
    if (!path || _previewWarmed[path]) return;
    clearTimeout(_previewWarmTimer);
    _previewWarmTimer = setTimeout(() => {
      if (_previewWarmed[path]) return;
      _previewWarmed[path] = true;
      const f = files.find(x => x.path === path) || { path: path };
      const e = ext(f);
      if (e === 'pdf') { ensurePreviewLib('pdf'); fetchPreviewBytes(path).catch(() => {}); }
      else if (OFFICE_PREVIEW_EXTS.includes(e) || LEGACY_OFFICE_EXTS.includes(e)) ensurePreviewLib('office');
    }, PREVIEW_PREWARM_MS);
  }

  // PREVIEW_WARM_IDLE_V1（fix52）：進頁面後在閒置時把兩種引擎準備好，第一次點預覽
  // 不必等引擎下載。省流量模式或 2G 連線時不暖機。
  function schedulePreviewWarmup(){
    try {
      const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (conn && (conn.saveData || /(^|-)2g$/.test(conn.effectiveType || ''))) return;
    } catch(_) {}
    const run = () => { ensurePreviewLib('pdf'); ensurePreviewLib('office'); };
    setTimeout(() => {
      if (window.requestIdleCallback) window.requestIdleCallback(run, { timeout: 3000 });
      else run();
    }, 1200);
  }

  // OFFICE_ONLINE_V1: OneDrive 同款。向後端索取「限時簽章公開連結」包成的
  // Office Online 嵌入 URL，用 <iframe> 顯示。微軟伺服器會自行抓取該連結。
  // 用於本機無法解析的舊版 .doc/.ppt/.xls。失敗時給明確訊息＋下載。
  async function renderOfficeOnline(path, ext){
    const body = q('previewBody');
    body.innerHTML = '<div class="empty">正在準備線上檢視…</div>';
    try {
      const res = await fetch('/admin/api/files/office-embed?path=' + encodeURIComponent(path), { cache: 'no-store' });
      if (!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      if (!data.public_path) throw new Error('no public path');
      // OFFICE_ONLINE_HOST_V1: 絕對 URL 用瀏覽器實際 origin 組（後端猜的 host
      // 在 Pterodactyl/Tunnel 後是內部位址，微軟抓不到）。簽章不含 host，安全不變。
      const absolute = location.origin + data.public_path;
      const embed = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(absolute);
      body.innerHTML =
        '<div class="tron-online-wrap">' +
          '<div class="tron-online-note">線上檢視由 Microsoft Office Online 提供（連結 15 分鐘內有效）。若持續空白，代表外網抓不到此連結，請改用上方「下載」。</div>' +
          '<iframe class="tron-online" src="' + esc(embed) + '" allowfullscreen></iframe>' +
        '</div>';
    } catch(err) {
      reportPreview(path, ext, 'office-online', err && err.message);
      body.innerHTML = '<div class="empty">無法啟動線上檢視（' + esc((err && err.message) || String(err)) + '），請按上方「下載」查看。</div>';
    }
  }

  // PDFJS_PREVIEW_V1: 用 PDF.js 把「已取得的 PDF 位元組」逐頁渲染成 canvas（fit-width 堆疊）。
  // PDF_FIRST_PAGE_FIRST_V1（fix52）：先把第一頁畫出來（使用者立刻看到內容），其餘頁在
  // 背景以有限並行補齊；換檔或關閉彈窗時（PREVIEW_CANCEL_V1）停止並取消渲染。
  async function renderPdfData(data, options){
    const opts = options || {};
    const mine = (opts.token === undefined) ? _previewToken : opts.token;
    const body = q('previewBody');
    // FILES_LAZY_LIB_V1: PDF.js 改為按需載入（只在真的開 PDF 時才抓 ~320KB）。
    if (window.__tronEnsureFileLib) await window.__tronEnsureFileLib('pdf');
    if (previewCancelled(mine)) return;
    if (!window.pdfjsLib) throw new Error('pdfjsLib missing');
    // WORKER_SRC_ONCE_V1（fix52）：workerSrc 只需設定一次（每次預覽都重設等於讓
    // PDF.js 重新比對 worker 位址）。
    if (!_pdfWorkerReady){
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = '/admin/static/js/pdf.worker.min.js?v=pdfjs1';
      _pdfWorkerReady = true;
    }
    // DETACHED_BUFFER_GUARD_V1（fix52）：PDF.js 會把傳入的 ArrayBuffer 轉移（detach）給
    // worker，直接傳快取裡的位元組會讓第二次預覽拿到「已失效的緩衝區」而整份壞掉。
    // 這裡傳副本（一次 memcpy，遠比重新下載整檔便宜）。
    const doc = await window.pdfjsLib.getDocument({ data: data.slice(), isEvalSupported: false }).promise;
    if (previewCancelled(mine)){ try { doc.destroy(); } catch(_){} return; }
    if (_previewPdf && _previewPdf !== doc){ try { _previewPdf.destroy(); } catch(_){} }
    _previewPdf = doc;

    const wrap = document.createElement('div');
    wrap.className = 'tron-pdf';
    body.innerHTML = '';
    body.appendChild(wrap);
    // MATERIALS_MOBILE_V1（fix57）：留一份位元組 —— 轉向／改視窗大小時要用同一份
    // 以新寬度重畫（不重新下載）。關閉或換檔時在 invalidatePreviewWork() 清掉。
    _previewPdfBytes = data;
    const narrow = previewNarrow();
    // 手機把頁面用滿整個螢幕寬（桌機沿用原本的 28px 內縮）。
    const targetWidth = Math.max(narrow ? 240 : 320, (body.clientWidth || 800) - (narrow ? 0 : 28));
    let ratio = window.devicePixelRatio || 1;
    if (narrow) ratio = Math.min(ratio, PDF_RATIO_MAX_MOBILE);
    // 工具列（CSS 只在手機尺寸顯示）：頁碼＋上一頁／下一頁。
    // 長講義在手機上捲到一半最需要知道「還有多長、怎麼跳」。
    const bar = document.createElement('div');
    bar.className = 'tron-pdf-bar';
    const prevBtn = document.createElement('button');
    prevBtn.type = 'button'; prevBtn.className = 'tron-pdf-btn'; prevBtn.textContent = '↑ 上一頁';
    prevBtn.addEventListener('click', () => pdfStep(-1));
    const info = document.createElement('span');
    info.className = 'tron-pdf-info'; info.id = 'tronPdfPage'; info.textContent = '第 1 頁';
    const nextBtn = document.createElement('button');
    nextBtn.type = 'button'; nextBtn.className = 'tron-pdf-btn'; nextBtn.textContent = '↓ 下一頁';
    nextBtn.addEventListener('click', () => pdfStep(1));
    bar.appendChild(prevBtn); bar.appendChild(info); bar.appendChild(nextBtn);
    wrap.appendChild(bar);
    // 每頁一個插槽（真元素）：canvas 置中，且「捲到某一頁」有可靠的定位點——
    // 之前的 display:contents 沒有自己的盒，翻頁與頁碼都無法定到特定頁。
    const slots = [];
    for (let i = 0; i < doc.numPages; i++){
      const slot = document.createElement('div');
      slot.className = 'tron-pdf-page';
      wrap.appendChild(slot);
      slots.push(slot);
    }
    _previewPdfWrap = wrap; _previewPdfSlots = slots; _previewPdfWidth = targetWidth;
    const painted = [];
    const paint = async (pageNo) => {
      const slot = slots[pageNo - 1];
      if (previewCancelled(mine) || painted[pageNo - 1] || !slot) return;
      painted[pageNo - 1] = true;   // 同步先占位：同一頁不會被並行的兩路各畫一次
      const page = await doc.getPage(pageNo);
      if (previewCancelled(mine)) return;
      const base = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: targetWidth / base.width });
      const canvas = document.createElement('canvas');
      canvas.width = Math.floor(vp.width * ratio);
      canvas.height = Math.floor(vp.height * ratio);
      canvas.style.width = Math.floor(vp.width) + 'px';
      canvas.style.height = 'auto';
      // 還沒畫的頁面先佔好高度：捲軸長度與頁碼不會在背景補頁時跳動。
      slot.style.minHeight = Math.floor(vp.height) + 'px';
      slot.appendChild(canvas);
      const task = page.render({
        canvasContext: canvas.getContext('2d'),
        viewport: vp,
        transform: ratio !== 1 ? [ratio, 0, 0, ratio, 0, 0] : null
      });
      _previewPdfTasks.push(task);
      try { await task.promise; } finally { _previewPdfTasks = _previewPdfTasks.filter(t => t !== task); }
    };
    // 第一頁優先：使用者視線就在最上面，先給它內容，後面的頁面慢慢補。
    await paint(1);
    // MATERIALS_MOBILE_V1（fix57）：**還沒畫的頁面也要佔位**。
    // 先用第一頁量到的比例給其他插槽一個估計高度；真的畫到那一頁時會被實際值覆蓋。
    // 少了這一步，背景補頁時整份文件的長度會一直變長 —— 捲軸位置與頁碼都會跳。
    const estSlotHeight = parseFloat(slots[0] && slots[0].style.minHeight) || 0;
    if (estSlotHeight > 0){
      for (let i = 1; i < slots.length; i++){
        if (!slots[i].style.minHeight) slots[i].style.minHeight = Math.floor(estSlotHeight) + 'px';
      }
    }
    if (doc.numPages > 1 && !previewCancelled(mine)){
      // 手機：先畫到 PDF_EAGER_PAGES_MOBILE，其餘捲到附近才畫（長講義不必一次畫完）。
      let eagerEnd = doc.numPages;
      if (narrow && PDF_EAGER_PAGES_MOBILE > 0) eagerEnd = Math.min(doc.numPages, PDF_EAGER_PAGES_MOBILE);
      let cursor = 2;
      const fill = async () => {
        while (!previewCancelled(mine) && cursor <= eagerEnd){
          const pageNo = cursor++;
          try { await paint(pageNo); } catch(_) { if (previewCancelled(mine)) return; }
        }
      };
      const workers = [];
      const workerCount = Math.min(PDF_RENDER_CONCURRENCY, doc.numPages - 1);
      const eagerWorkers = (eagerEnd < doc.numPages)
        ? Math.min(PDF_RENDER_CONCURRENCY, Math.max(0, eagerEnd - 1))
        : workerCount;
      for (let i = 0; i < eagerWorkers; i++) workers.push(fill());
      // 背景補頁不阻塞呼叫端（第一頁已經在畫面上），失敗也不影響已顯示的內容。
      Promise.all(workers).catch(() => {});
      if (eagerEnd < doc.numPages) paintLazyPages(mine, slots, paint, eagerEnd);
    }
    // 頁碼跟著捲動更新（.tron-pdf 自己就是捲動容器）。
    _previewPdfCur = 1;
    wrap.addEventListener('scroll', pdfOnScroll, { passive: true });
    pdfSyncPage();
  }

  // MATERIALS_MOBILE_V1（fix57）：手機上只先畫前幾頁，剩下的捲到附近才畫。
  // 沒有 IntersectionObserver 就照舊全部補齊（不因新功能而少畫）。
  function paintLazyPages(mine, slots, paint, from){
    if (previewCancelled(mine)) return;
    if (window.IntersectionObserver){
      if (_previewPdfObserver){ try { _previewPdfObserver.disconnect(); } catch(_) {} }
      _previewPdfObserver = new window.IntersectionObserver((entries) => {
        entries.forEach((en) => {
          if (!en.isIntersecting || previewCancelled(mine)) return;
          const idx = slots.indexOf(en.target);
          if (idx < 0) return;
          _previewPdfObserver.unobserve(en.target);
          paint(idx + 1).catch(() => {});
        });
      }, { root: _previewPdfWrap || null, rootMargin: PDF_LAZY_MARGIN });
      for (let i = from; i < slots.length; i++) _previewPdfObserver.observe(slots[i]);
      return;
    }
    let rest = from + 1;
    const fill = async () => {
      while (!previewCancelled(mine) && rest <= slots.length){
        const pageNo = rest++;
        try { await paint(pageNo); } catch(_) { if (previewCancelled(mine)) return; }
      }
    };
    const ws = [];
    const count = Math.min(PDF_RENDER_CONCURRENCY, slots.length - from);
    for (let i = 0; i < count; i++) ws.push(fill());
    Promise.all(ws).catch(() => {});
  }

  // 捲動時更新「第 n / N 頁」：手機工具列顯示的就是這一行。
  function pdfSyncPage(){
    if (!_previewPdfSlots.length || !_previewPdfWrap) return;
    const info = q('tronPdfPage');
    if (!info) return;
    // 黏著工具列會蓋住頂端約 54px，判定線往下挪才不會慢一頁。
    const line = _previewPdfWrap.getBoundingClientRect().top + 56;
    let cur = 1;
    for (let i = 0; i < _previewPdfSlots.length; i++){
      const el = _previewPdfSlots[i];
      if (el && el.getBoundingClientRect().top <= line) cur = i + 1;
    }
    _previewPdfCur = cur;
    info.textContent = '第 ' + cur + ' / ' + _previewPdfSlots.length + ' 頁';
  }
  function pdfOnScroll(){
    if (_previewPdfTick) return;   // 捲動事件非常密集，一格動畫最多更新一次
    _previewPdfTick = true;
    const run = () => { _previewPdfTick = false; pdfSyncPage(); };
    if (window.requestAnimationFrame) window.requestAnimationFrame(run); else setTimeout(run, 60);
  }
  // 上一頁／下一頁：直接捲到目標頁開頭（首／末頁不越界、也不白捲一次）。
  function pdfStep(delta){
    if (!_previewPdfSlots.length) return;
    pdfSyncPage();
    let target = _previewPdfCur + delta;
    if (target < 1) target = 1;
    if (target > _previewPdfSlots.length) target = _previewPdfSlots.length;
    if (target === _previewPdfCur) return;
    const el = _previewPdfSlots[target - 1];
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' });
    _previewPdfCur = target;
    pdfSyncPage();
  }
  // 轉向／改視窗大小：用同一份位元組以新寬度重畫（不重新下載）。
  // 只有「寬度差超過 48px」才動 —— iOS 網址列伸縮造成的小幅變動不重畫。
  function pdfReflowPreview(){
    if (!_previewPdfBytes || !_previewPdfWrap) return;
    if (_previewReflowTimer) clearTimeout(_previewReflowTimer);
    _previewReflowTimer = setTimeout(() => {
      _previewReflowTimer = null;
      const body = q('previewBody');
      if (!_previewPdfBytes || !_previewPdfWrap || !body) return;
      const narrow = previewNarrow();
      const want = Math.max(narrow ? 240 : 320, (body.clientWidth || 800) - (narrow ? 0 : 28));
      if (Math.abs(want - _previewPdfWidth) < 48) return;
      renderPdfData(_previewPdfBytes, { token: _previewToken }).catch(() => {});
    }, 260);
  }
  window.addEventListener('resize', pdfReflowPreview);
  window.addEventListener('orientationchange', pdfReflowPreview);

  async function renderPdfPreview(url, path, ext){
    const body = q('previewBody');
    const mine = _previewToken;
    const fallbackIframe = () => {
      if (previewCancelled(mine)) return;
      body.innerHTML = '<iframe src="' + url + '#toolbar=1" type="application/pdf"></iframe>';
    };
    body.innerHTML = '<div class="empty">正在載入 PDF 檢視器…</div>';
    // FILES_LAZY_LIB_V1: 先按需載入 PDF.js，否則下方的 `!window.pdfjsLib` 會誤判為
    // 「引擎缺失」而退回原生 iframe（首次開 PDF 就降級）。
    // PREVIEW_PARALLEL_START_V1（fix52）：引擎與檔案位元組同時開抓，不互相等待。
    const libPromise = (window.__tronEnsureFileLib
      ? window.__tronEnsureFileLib('pdf')
      : Promise.resolve()
    ).catch(() => {}); // 引擎載入失敗不讓整段流程中斷（下方會走明確的降級訊息）
    // PDF_DOWNLOAD_PROGRESS_V1（fix52）：邊下載邊顯示百分比（幾十 MB 的講義一眼看出
    // 有在動，而不是空白等半天）。
    const bytesPromise = fetchPreviewBytes(path, (loaded, total) => {
      if (previewCancelled(mine)) return;
      const pct = total ? Math.floor(loaded * 100 / total) : 0;
      body.innerHTML = '<div class="empty">正在載入 PDF… ' + pct + '%（' +
        sizeLabel(loaded) + ' / ' + sizeLabel(total) + '）</div>';
    });
    await libPromise;
    if (previewCancelled(mine)){ bytesPromise.catch(() => {}); return; }
    if (!window.pdfjsLib){
      bytesPromise.catch(() => {});
      reportPreview(path, ext, 'pdf-noengine', 'pdfjsLib missing');
      fallbackIframe();
      return;
    }
    try {
      const bytes = await bytesPromise;
      if (previewCancelled(mine)) return;
      await renderPdfData(bytes, { token: mine });
    } catch(err) {
      if (previewCancelled(mine)) return;
      reportPreview(path, ext, 'pdf', err && err.message);
      fallbackIframe();
    }
  }

  // SINGLE_CONTAINER_V1: Office 預覽智能分流。
  //  回應是 PDF（未來若接轉換服務）→ PDF.js；舊版二進位→Office Online；
  //  現代格式→office-view.js 本機解析（單一 container、無 LibreOffice 下最穩）。
  // SINGLE_CONTAINER_V1: 本機解析（office-view.js）。單一 container、無 LibreOffice
  // 時，現代格式（docx/pptx/xlsx/odf/rtf）唯一可靠的預覽方式。
  async function renderOfficeLocal(buf, ext, path){
    const body = q('previewBody');
    const html = await window.TronOfficeView.preview(buf, ext);
    if (!html) throw new Error('empty');
    // 解析器回傳「錯誤卡片」時，把卡片文字＋zip 零件清單送進後台日誌，
    // 讓後台能直接看到這個 Office 檔的內部結構，一次定位問題。
    if (html.indexOf('tron-office-error') !== -1) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      let diag = '';
      try {
        const z = await JSZip.loadAsync(buf);
        const names = Object.keys(z.files).filter(n => !z.files[n].dir);
        diag = ' | parts(' + names.length + '): ' + names.slice(0, 15).join(', ');
        // 深入診斷：XML 是否被 DOMParser 接受、關鍵節點是否存在。
        const PNS = 'http://schemas.openxmlformats.org/presentationml/2006/main';
        // XML_ENCODING_V1 驗證：直接讀 bytes，回報十六進位開頭與 NUL 數量，
        // 確認 XML part 是否為 UTF-16（夾 0x00）導致 DOMParser "Document is empty"。
        const hex = (u) => Array.from(u.slice(0, 16)).map(b => b.toString(16).padStart(2, '0')).join(' ');
        const nulCount = (u) => { let c = 0; const n = Math.min(u.length, 256); for (let i = 1; i < n; i += 2) if (u[i] === 0) c++; return c; };
        const pbytes = z.file('ppt/presentation.xml') ? await z.file('ppt/presentation.xml').async('uint8array') : new Uint8Array(0);
        diag += ' | presHex[' + hex(pbytes) + '] presNul:' + nulCount(pbytes) + ' len:' + pbytes.length;
        const sfile = z.file('ppt/slides/slide1.xml');
        if (sfile) {
          const sbytes = await sfile.async('uint8array');
          diag += ' | slideHex[' + hex(sbytes) + '] slideNul:' + nulCount(sbytes) + ' len:' + sbytes.length;
        }
      } catch(e) { diag = ' | zip reload failed: ' + (e && e.message); }
      reportPreview(path, ext, 'office-parse', (tmp.textContent || '').trim() + diag);
    }
    if (window.TronOfficeView.mount) window.TronOfficeView.mount(body, html);
    else body.innerHTML = html;
  }

  // 預覽分流：PDF→PDF.js；舊版二進位→Office Online；現代→本機解析。
  async function renderOfficeSmart(url, path, ext, size){
    const body = q('previewBody');
    const mine = _previewToken;
    body.innerHTML = '<div class="empty">正在載入…</div>';
    const progress = (loaded, total) => {
      if (previewCancelled(mine)) return;
      const pct = total ? Math.floor(loaded * 100 / total) : 0;
      body.innerHTML = '<div class="empty">正在載入檔案… ' + pct + '%（' +
        sizeLabel(loaded) + ' / ' + sizeLabel(total) + '）</div>';
    };
    try {
      // PREVIEW_SNIFF_RANGE_V1（fix52）：先確認實際內容是不是 PDF。舊版程式碼是
      // 「先下載整份 → 再判斷」，20 MB 的 .ppt 等於白抓 20 MB；現在只抓前 8 bytes。
      if (await previewLooksLikePdf(path, size, LEGACY_OFFICE_EXTS.includes(ext))){
        if (previewCancelled(mine)) return;
        await renderPdfData(await fetchPreviewBytes(path, progress), { token: mine });
        return;
      }
      if (previewCancelled(mine)) return;
      // 舊版二進位（.doc/.ppt/.xls）本機與 PDF.js 都無法解析 → 直接交給 Office
      // Online 檢視器，瀏覽器不必先把整份檔案抓下來。
      if (LEGACY_OFFICE_EXTS.includes(ext)) { await renderOfficeOnline(path, ext); return; }
      const buf = await fetchPreviewBytes(path, progress);
      if (previewCancelled(mine)) return;
      // FILES_LAZY_LIB_V1: 現代 Office 格式才按需載入 jszip + office-view（~145KB），
      // 其餘情況退回 Office Online，避免進頁就抓。
      if (window.__tronEnsureFileLib) await window.__tronEnsureFileLib('office');
      if (previewCancelled(mine)) return;
      if (window.TronOfficeView && window.JSZip){
        body.innerHTML = '<div class="empty">正在解析 Office 文件…</div>';
        // 先讓瀏覽器把提示畫出來，再開始在主執行緒上解析（大檔解析會佔用幾百 ms）。
        await new Promise(r => setTimeout(r, 0));
        if (previewCancelled(mine)) return;
        await renderOfficeLocal(buf, ext, path);
        return;
      }
      if (OFFICE_ONLINE_EXTS.includes(ext)) { await renderOfficeOnline(path, ext); return; }
      reportPreview(path, ext, 'unsupported', 'no engine for ext');
      body.innerHTML = '<div class="empty">此格式（.' + esc(ext) + '）不支援線上預覽，請按上方「下載」查看。</div>';
    } catch(err) {
      if (previewCancelled(mine)) return;
      reportPreview(path, ext, 'office', err && err.message);
      body.innerHTML = '<div class="empty">無法預覽（' + esc((err && err.message) || String(err)) + '），請按上方「下載」。</div>';
    }
  }

  // CSV/TSV 轉成表格顯示。純前端 split，所有字串都經 esc() 跳脫。
  function csvToTable(text, sep){
    const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
    if (lines.length && lines[lines.length - 1] === '') lines.pop();
    if (!lines.length) return '';
    const rows = lines.map(line => {
      const cells = []; let cur = '', quoted = false;
      for (let i = 0; i < line.length; i++){
        const ch = line[i];
        if (quoted){
          if (ch === '"' && line[i + 1] === '"'){ cur += '"'; i++; }
          else if (ch === '"'){ quoted = false; }
          else cur += ch;
        } else if (ch === '"') quoted = true;
        else if (ch === sep) { cells.push(cur); cur = ''; }
        else cur += ch;
      }
      cells.push(cur);
      return cells;
    });
    const MAX = 300;
    const head = rows[0];
    let html = '<table class="tron-csv-table"><thead><tr>';
    for (let c = 0; c < head.length; c++) html += '<th>' + esc(head[c]) + '</th>';
    html += '</tr></thead><tbody>';
    for (let r = 1; r < Math.min(rows.length, MAX); r++){
      html += '<tr>';
      for (let c = 0; c < head.length; c++) html += '<td>' + esc(rows[r][c] || '') + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table>';
    if (rows.length > MAX) html += '<div class="tron-office-note">檔案過大，僅顯示前 ' + MAX + ' 列。完整內容請下載。</div>';
    return html;
  }

  // PREVIEW_HIDE_NAV_V1: 預覽彈窗開/關時同步切換 body class，隱藏手機導覽列。
  function setPreviewOpen(open){
    // PREVIEW_CANCEL_V1（fix52）：關閉預覽時停掉還在跑的下載／渲染並釋放畫布，

  // SHARE_V1: 分享按鈕＝向後端核發「免登入、可預覽」的公開連結（7 天時效），
  // 優先用 Web Share API 分享該連結（手機可傳 LINE/訊息），否則複製到剪貼簿。
  // 連結指向 /pub/share 預覽頁，不是下載頁；對方不用登入即可預覽。
  // QR_SHARE_V1: 按「分享」→ 彈窗顯示「分享連結 + QR code」，可複製或掃描。
  async function shareFile(path){
    let link = null;
    try {
      const res = await fetch('/admin/api/files/share-link?path=' + encodeURIComponent(path), { cache: 'no-store' });
      if (res.ok) { const j = await res.json(); if (j && j.public_path) link = location.origin + j.public_path; }
    } catch (_) {}
    if (!link) { toast('無法產生分享連結'); return; }
    await openShareModal(link);
  }

  // TRUSTED_TYPES_V1: 後台 CSP require-trusted-types-for 'script'，innerHTML 需經
  // 允許清單內的 'default' policy，否則拋錯。
  var __TT = null;
  try { if (window.trustedTypes) __TT = trustedTypes.createPolicy('default', { createHTML: function(s){return s;} }); } catch (e) { __TT = null; }
  function setHTMLSafe(el, html) { if (__TT) el.innerHTML = __TT.createHTML(html); else el.innerHTML = html; }

  async function openShareModal(link){
    const old = document.getElementById('share-modal'); if (old) old.remove();
    const ov = document.createElement('div'); ov.id = 'share-modal';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:99999;padding:16px;';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;color:#111;border-radius:14px;max-width:420px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.35);text-align:center;';
    setHTMLSafe(box,
      '<div class="share-modal-title">分享連結</div>'
      + '<div id="share-qr" class="share-qr-box"></div>'
      + '<div class="share-modal-hint">免登入可預覽 · 7 天有效</div>'
      + '<div id="share-link" class="share-link-box"></div>'
      + '<div class="share-modal-actions">'
      + '<button id="share-copy" type="button" class="share-btn-primary">複製連結</button>'
      + '<button id="share-close" type="button" class="share-btn-ghost">關閉</button>'
      + '</div>');
    ov.appendChild(box);
    document.body.appendChild(ov);
    document.getElementById('share-link').textContent = link;
    const qrBox = document.getElementById('share-qr');
    try {
      // FILES_LAZY_LIB_V1: QR 產生器改為按需載入（~20KB），只有按「分享」才抓。
      if (window.__tronEnsureFileLib) await window.__tronEnsureFileLib('qrcode');
      if (typeof qrcode === 'function') {
        const qr = qrcode(0, 'M'); qr.addData(link); qr.make();
        setHTMLSafe(qrBox, qr.createSvgTag({ cellSize: 5, margin: 2, scalable: true }));
        const svg = qrBox.querySelector('svg'); if (svg) { svg.style.width = '220px'; svg.style.height = '220px'; }
      } else { qrBox.textContent = '（QR 需 qrcode.min.js）'; }
    } catch (_) { qrBox.textContent = 'QR 產生失敗'; }
    document.getElementById('share-copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(link); toast('已複製分享連結'); }
      catch (_) { window.prompt('複製分享連結：', link); }
    });
    document.getElementById('share-close').addEventListener('click', () => ov.remove());
    ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); });
  }

  async function preview(path){
    const f = files.find(x => x.path === path) || { path, name: path };
    const e = ext(f);
    const url = pv(path);
    // PREVIEW_CANCEL_V1（fix52）：讓上一個還在跑的預覽工作（PDF 背景補頁、下載）停手。
    invalidatePreviewWork();
    // URL_SHORTCUT_V1: .url 不開彈窗，直接跳轉到檔案內的網址。
    if (e === 'url') { await previewUrlFile(path, f); return; }
    if (q('previewTitle')) q('previewTitle').textContent = f.name || path;
    if (q('previewDownload')) q('previewDownload').href = dl(path);
    setPreviewOpen(true);

    if (IMAGE_PREVIEW_EXTS.includes(e)) {
      // SVG 只透過 <img> 載入：img 上下文不會執行 script，即使檔案內含腳本也無效。
      q('previewBody').innerHTML = '<img src="' + url + '">';
    } else if (e === 'pdf') {
      // PDFJS_PREVIEW_V1: 用 PDF.js（Firefox 同款）本機渲染，canvas 逐頁畫出，
      // 不靠瀏覽器原生 PDF 外掛 → 所有瀏覽器/手機一致，解決 iframe 空白。
      // 若 PDF.js 未載入或解析失敗，退回原生 <iframe>。
      await renderPdfPreview(url, path, e);
    } else if (isOfficePreview(e)) {
      // SINGLE_CONTAINER_V1: PDF→PDF.js；舊版→Office Online；現代→本機解析。
      await renderOfficeSmart(url, path, e, f.size);
    } else if (VIDEO_PREVIEW_EXTS.includes(e)) {
      q('previewBody').innerHTML = '<video src="' + url + '" controls autoplay></video>';
    } else if (AUDIO_PREVIEW_EXTS.includes(e)) {
      q('previewBody').innerHTML = '<audio src="' + url + '" controls autoplay></audio>';
    } else if (e === 'csv' || e === 'tsv') {
      try {
        const res = await fetch(url, { credentials: 'same-origin' });
        const table = csvToTable(await res.text(), e === 'tsv' ? '\t' : ',');
        q('previewBody').innerHTML = table || '<div class="empty">此檔案沒有內容</div>';
      } catch(_) {
        q('previewBody').innerHTML = '<div class="empty">無法預覽此檔案</div>';
      }
    } else if (TEXT_PREVIEW_EXTS.includes(e)) {
      try {
        const res = await fetch(url, { credentials: 'same-origin' });
        // 一律以純文字顯示：html/xml 等格式也只看原始碼，不會被執行。
        q('previewBody').innerHTML = '<pre>' + esc(await res.text()) + '</pre>';
      } catch(_) {
        q('previewBody').innerHTML = '<div class="empty">無法預覽此檔案</div>';
      }
    } else {
      // 理論上不會走到（canPreview 已擋掉），但留個明確訊息而不是空白彈窗。
      q('previewBody').innerHTML = '<div class="empty">此檔案格式不支援預覽，請按上方「下載」查看。</div>';
    }
  }

      const open = e.target.closest('[data-open-folder]');
      if (open && !e.target.closest('button,a')) return setFolder(open.dataset.openFolder);
      const btn = e.target.closest('[data-folder],[data-delete-file],[data-delete-folder],[data-preview],[data-share]');
      if (!btn) return;
      if (btn.dataset.folder !== undefined) return setFolder(btn.dataset.folder);
      if (btn.dataset.deleteFile) return delFile(btn.dataset.deleteFile);
      if (btn.dataset.deleteFolder) return delFolder(btn.dataset.deleteFolder);
      if (btn.dataset.preview) return preview(btn.dataset.preview);
      if (btn.dataset.share) return shareFile(btn.dataset.share);
    });

    const drop = q('dropzone');
    if (drop) {
      // UPLOAD_DESKTOP_FIX_V1（fix50）：桌機常駐的拖放區也可以直接點擊（＝選檔）。
      drop.onclick = pickFiles;
      drop.onkeydown = e => {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); pickFiles(); }
      };
      ['dragenter','dragover'].forEach(n => document.addEventListener(n, e => { e.preventDefault(); drop.classList.add('dragover'); }));
      document.addEventListener('dragleave', e => { if (e.clientX === 0 && e.clientY === 0) drop.classList.remove('dragover'); });
      document.addEventListener('drop', e => {
        e.preventDefault();
        drop.classList.remove('dragover');
        if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
      });
    }

    const folderParam = new URLSearchParams(location.search).get('folder');
    if (folderParam) currentFolder = norm(folderParam);

    loadFiles();
    // PREVIEW_WARM_IDLE_V1（fix52）：閒置時先把 PDF.js／office-view 準備好。
    schedulePreviewWarmup();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

<script id="filesParticlesScriptV1">
/* MATERIALS_PARTICLES_V1: 複製 dashboard 的粒子光點動畫 */
(function(){
  'use strict';
  if(window.FILES_PARTICLES_V1) return;
  window.FILES_PARTICLES_V1 = true;
  var raf = 0, particles = [];
  function q(id){ return document.getElementById(id); }
  function darkMode(){
    return document.documentElement.getAttribute('data-theme')==='dark' ||
      document.documentElement.classList.contains('dark-mode') ||
      (window.matchMedia && matchMedia('(prefers-color-scheme:dark)').matches);
  }
  function resize(c){
    var dpr = Math.min(window.devicePixelRatio||1, 2);
    c.width = Math.floor(window.innerWidth*dpr);
    c.height = Math.floor(window.innerHeight*dpr);
    c.style.width = window.innerWidth+'px';
    c.style.height = window.innerHeight+'px';
    var ctx = c.getContext('2d'); if(ctx) ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function init(c){
    particles = [];
    var count = Math.min(90, Math.floor((window.innerWidth*window.innerHeight)/16000));
    for(var i=0;i<count;i++){
      particles.push({
        x: Math.random()*window.innerWidth,
        y: Math.random()*window.innerHeight,
        s: Math.random()*2.2+.8,
        vx: (Math.random()-.5)*.36,
        vy: (Math.random()-.5)*.36,
        a: Math.random()*.18+.05
      });
    }
  }
  function loop(){
    var c = q('filesBgParticlesV1');
    if(!c){ raf = 0; return; }
    var ctx = c.getContext('2d');
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    var fill = darkMode() ? 'rgba(226,239,255,' : 'rgba(37,99,235,';
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      p.x += p.vx; p.y += p.vy;
      if(p.x<0) p.x=window.innerWidth; if(p.x>window.innerWidth) p.x=0;
      if(p.y<0) p.y=window.innerHeight; if(p.y>window.innerHeight) p.y=0;
      ctx.fillStyle = fill + p.a + ')';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,Math.PI*2); ctx.fill();
    }
    raf = requestAnimationFrame(loop);
  }
  function start(){
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var c = q('filesBgParticlesV1');
    if(!c){
      c = document.createElement('canvas');
      c.id = 'filesBgParticlesV1';
      c.setAttribute('aria-hidden','true');
      document.body.prepend(c);
    }
    var ctx = c.getContext('2d'); if(!ctx || raf) return;
    resize(c); init(c);
    raf = requestAnimationFrame(loop);
    window.addEventListener('resize', function(){ if(c){ resize(c); init(c); } }, {passive:true});
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>

<!-- MOBILE_NAV_AUTOHIDE_V1: 往下捲自動收起底部導覽列、往上捲出現，
     避免 floating 導覽列永遠蓋住卡片操作按鈕。 -->
<script id="mobileNavAutoHideV1">
(function(){
  function setup(){
    var bar = document.getElementById('mobilebar'); if(!bar) return;
    bar.style.transition = 'transform .25s ease';
    var last = 0;
    function apply(y){
      var down = y > last + 4;
      var up = y < last - 4;
      if(down && y > 80){ bar.style.transform = 'translateY(calc(100% + 24px))'; }
      else if(up){ bar.style.transform = ''; }
      if(down || up) last = y;
    }
    window.addEventListener('scroll', function(){ apply(window.scrollY || document.documentElement.scrollTop); }, {passive:true});
    var c = document.querySelector('.content');
    if(c) c.addEventListener('scroll', function(){ apply(c.scrollTop); }, {passive:true});
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setup);
  else setup();
})();
</script>
