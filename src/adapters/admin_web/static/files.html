<script id="SUBPAGE_TOKEN_BOOT_V1">
(function(){
  if(window.SUBPAGE_TOKEN_BOOT_V1) return;
  window.SUBPAGE_TOKEN_BOOT_V1 = true;
  try{
    var u=new URL(location.href);
    var tok=(u.searchParams.get('token')||window.__tronBootToken||'').trim();
    if(tok) window.__tronBootToken=tok;
  }catch(_){}
  var native=window.fetch;
  window.fetch=function(input, init){
    try{
      var tok=window.__tronBootToken||'';
      var url=new URL(typeof input==='string'?input:(input&&input.url)||'', location.origin);
      if(tok && url.origin===location.origin && url.pathname.indexOf('/admin/api/')===0 &&
         url.pathname!=='/admin/api/login' && !url.searchParams.get('token')){
        url.searchParams.set('token', tok);
        input=url.pathname+url.search+url.hash;
      }
    }catch(_){}
    return native.apply(this, arguments);
  };
  document.addEventListener('click', function(ev){
    var a=ev.target && ev.target.closest && ev.target.closest('a[href]');
    if(!a) return;
    try{
      var href=a.getAttribute('href')||'';
      var dest=new URL(href, location.origin);
      if(dest.origin!==location.origin) return;
      if(!(dest.pathname==='/admin'||dest.pathname==='/admin/'||dest.pathname==='/admin/dashboard'||dest.pathname==='/admin/timetable'||dest.pathname.indexOf('/admin/')===0)) return;
      var tok=window.__tronBootToken||'';
      if(tok && !dest.searchParams.get('token')){
        dest.searchParams.set('token', tok);
        a.setAttribute('href', dest.pathname+dest.search+dest.hash);
      }
    }catch(_){}
  }, true);
})();
</script>

<script id="BAN_CRUDE_LOGIN_V1">
(function(){
  if(window.BAN_CRUDE_LOGIN_V1) return;
  window.BAN_CRUDE_LOGIN_V1 = true;
  function isCrude(card){
    if(!card) return false;
    if(card.querySelector('.animated-login-card-inner')) return false;
    var tx=(card.textContent||'').replace(/\s+/g,'');
    return !!(card.querySelector('.login-grid') || tx.indexOf('需要登入')>=0 || tx.indexOf('帳號 / account')>=0);
  }
  function kill(root){
    var scope=root&&root.querySelectorAll?root:document;
    var cards=[];
    if(root&&root.id==='loginCard') cards.push(root);
    try{ cards=cards.concat(Array.prototype.slice.call(scope.querySelectorAll('#loginCard,.login-card,#loginPanel'))); }catch(_){}
    cards.forEach(function(card){
      if(!isCrude(card)) return;
      card.innerHTML='';
      card.hidden=true;
      card.setAttribute('aria-hidden','true');
      card.style.display='none';
    });
  }
  kill(document);
  try{ new MutationObserver(function(ms){ ms.forEach(function(m){ Array.prototype.forEach.call(m.addedNodes||[], function(n){ if(n.nodeType===1) kill(n); }); }); }).observe(document.documentElement,{childList:true,subtree:true}); }catch(_){}
})();
</script>

<meta name="referrer" content="no-referrer">
<script id="hideAdminTokenFromUrlEarlyV1">
(function(){
  'use strict';
  if (window.HIDE_ADMIN_TOKEN_FROM_URL_EARLY_V1) return;
  window.HIDE_ADMIN_TOKEN_FROM_URL_EARLY_V1 = true;
  var LS_SESSION = 'tronclass_admin_session';
  var LS_LOGOUT = 'tronclass_dashboard_manual_logout';
  function sanitizeCurrentUrl(){
    try {
      var u = new URL(location.href);
      var changed = false;
      var token = u.searchParams.get('token') || '';
      if (u.searchParams.get('logout') === '1') {
        localStorage.removeItem(LS_SESSION);
        sessionStorage.removeItem(LS_SESSION);
        localStorage.setItem(LS_LOGOUT, '1');
      } else if (token) {
        localStorage.setItem(LS_SESSION, token);
        sessionStorage.setItem(LS_SESSION, token);
        localStorage.removeItem(LS_LOGOUT);
      }
      if (u.searchParams.has('token')) { u.searchParams.delete('token'); changed = true; }
      if (changed) history.replaceState(null, document.title, u.pathname + (u.search ? u.search : '') + u.hash);
    } catch(_) {}
  }
  sanitizeCurrentUrl();
  window.tronAdminToken = function(){
    try {
      var u = new URLSearchParams(location.search).get('token');
      if (u) return String(u).trim();
      return (localStorage.getItem(LS_SESSION) || sessionStorage.getItem(LS_SESSION) || '').trim();
    } catch(_) { return ''; }
  };
})();
</script>
<!-- HIDE_ADMIN_TOKEN_FROM_URL_V1_END -->

<script id="consolidatedAdminAuthEarlyV1">
(function(){
  'use strict';
  if (window.COOKIE_SUBPAGE_AUTH_V1) return;
  window.COOKIE_SUBPAGE_AUTH_V1 = true;
  var LO = 'tronclass_dashboard_manual_logout';
  try {
    var p = new URLSearchParams(location.search);
    if (p.get('logout') === '1' || localStorage.getItem(LO) === '1') {
      location.replace('/admin?logout=1');
      return;
    }
    document.documentElement.classList.add('tron-auth-pending');
    fetch('/admin/api/status'+(window.__tronBootToken?('?token='+encodeURIComponent(window.__tronBootToken)):''), {credentials:'same-origin', cache:'no-store'}).then(function(r){
      if (r.ok) {
        document.documentElement.classList.remove('tron-auth-pending','tron-auth-logged-out');
        document.documentElement.classList.add('tron-auth-ok','dash-auth-ok','auth-ok');
        if (document.body) document.body.classList.add('logged-in','auth-ok','dash-auth-ok');
        return;
      }
      var next = encodeURIComponent(location.pathname + location.search + location.hash);
      location.replace('/admin?next=' + next);
    }).catch(function(){
      var next = encodeURIComponent(location.pathname + location.search + location.hash);
      location.replace('/admin?next=' + next);
    });
  } catch(_) {
    location.replace('/admin');
  }
})();
</script>
<!-- CONSOLIDATED_ADMIN_AUTH_V1_HEAD_END -->

<script>
(function(){
  'use strict';
  const LS_SESSION = 'tronclass_admin_session';
  let files = [], folders = [], currentFolder = '', isAdmin = false;
  let view = localStorage.getItem('drive_view') || 'grid';
  let sort = 'modified_desc';

  const q = id => document.getElementById(id);
  
  function token(){
    try {
      const u = new URLSearchParams(location.search).get('token');
      if (u) return String(u).trim();
      const keys = ['tronclass_admin_session','tronclass_admin_token','tronclass_dashboard_token','tronclass_session_token','adminToken','admin_token','token'];
      for (let i = 0; i < keys.length; i++) {
        const v = localStorage.getItem(keys[i]) || sessionStorage.getItem(keys[i]);
        if (v && String(v).trim()) return String(v).trim();
      }
    } catch(_) {}
    return '';
  }

  function withToken(path){
    try {
      const u = new URL(path, location.origin);
      const t = token();
      if (t) u.searchParams.set('token', t);
      return u.pathname + u.search + u.hash;
    } catch(_) { return path; }
  }

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function norm(p){
    return String(p || '').replace(/^\/+|\/+$/g, '').replace(/\/+/g, '/').trim();
  }

  function base(p){
    p = norm(p);
    return p ? p.split('/').pop() : '我的教材';
  }

  function parent(p){
    p = norm(p);
    if (!p || !p.includes('/')) return '';
    const a = p.split('/');
    a.pop();
    return a.join('/');
  }

  function toast(t, ok=true){
    const el = q('toast');
    if (!el) return;
    el.textContent = t;
    el.className = 'toast visible ' + (ok ? 'ok' : 'bad');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove('visible'), 3200);
  }

  function sizeLabel(n){
    n = Number(n || 0);
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
    return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
  }

  function ext(f){
    return String(f.extension || (f.name || '').split('.').pop() || '').toLowerCase();
  }

  function dl(path){
    return '/admin/api/files/download?token=' + encodeURIComponent(token()) + '&path=' + encodeURIComponent(path);
  }

  function pv(path){
    return '/admin/api/files/preview?token=' + encodeURIComponent(token()) + '&path=' + encodeURIComponent(path);
  }

  async function api(path, opts={}, timeout=12000){
    const t = token();
    const c = new AbortController();
    const timer = setTimeout(() => c.abort(), timeout);
    opts.signal = c.signal;
    opts.credentials = opts.credentials || 'same-origin';
    const sep = path.includes('?') ? '&' : '?';
    try {
      const res = await fetch(path + sep + 'token=' + encodeURIComponent(t), opts);
      if (res.status === 401 || res.status === 403) {
        localStorage.removeItem(LS_SESSION);
        sessionStorage.removeItem(LS_SESSION);
        const next = encodeURIComponent(location.pathname + location.search + location.hash);
        location.replace('/admin?next=' + next);
        throw new Error('登入失效，跳轉至核心登入頁');
      }
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
      return body;
    } finally {
      clearTimeout(timer);
    }
  }

  function folderSet(){
    const set = new Set();
    folders.forEach(f => {
      const n = norm(f);
      if (n) set.add(n);
    });
    files.forEach(f => {
      const p = norm(f.folder || parent(f.path || ''));
      if (p) set.add(p);
    });
    return Array.from(set).sort((a,b) => a.localeCompare(b, 'zh-Hant'));
  }

  function childFolders(){
    const all = folderSet();
    const prefix = currentFolder ? currentFolder + '/' : '';
    const out = new Set();
    all.forEach(f => {
      if (!currentFolder) {
        const first = f.split('/')[0];
        if (first) out.add(first);
      } else if (f.startsWith(prefix)) {
        const rest = f.slice(prefix.length);
        const first = rest.split('/')[0];
        if (first) out.add(prefix + first);
      }
    });
    const needle = (q('search') ? q('search').value : '').trim().toLowerCase();
    return Array.from(out).filter(f => f !== currentFolder && (!needle || f.toLowerCase().includes(needle))).sort((a,b) => base(a).localeCompare(base(b), 'zh-Hant'));
  }

  function directFiles(){
    const needle = (q('search') ? q('search').value : '').trim().toLowerCase();
    let list = files.filter(f => norm(f.folder || parent(f.path || '')) === currentFolder);
    if (needle) {
      list = files.filter(f => ((f.path||'') + ' ' + (f.name||'') + ' ' + (f.folder||'')).toLowerCase().includes(needle));
    }
    list.sort((a,b) => {
      if (sort === 'name_asc') return String(a.name || a.path || '').localeCompare(String(b.name || b.path || ''), 'zh-Hant');
      if (sort === 'size_desc') return Number(b.size || 0) - Number(a.size || 0);
      return String(b.modified || '').localeCompare(String(a.modified || ''));
    });
    return list;
  }

  function renderNav(){
    const all = folderSet();
    if (q('navAll')) q('navAll').classList.toggle('active', currentFolder === '');
    if (q('folderNav')) {
      q('folderNav').innerHTML = all.slice(0, 60).map(f => 
        '<button type="button" class="' + (f === currentFolder ? 'active' : '') + '" data-folder="' + esc(f) + '">📁 ' + esc(base(f)) + '</button>'
      ).join('') || '<div class="small" style="padding:6px 10px;color:var(--muted)">無子資料夾</div>';
    }
  }

  function renderBreadcrumb(){
    const parts = currentFolder ? currentFolder.split('/') : [];
    let acc = '', html = '<button type="button" data-folder="">我的教材</button>';
    parts.forEach(part => {
      acc = acc ? acc + '/' + part : part;
      html += '<span>/</span><button type="button" data-folder="' + esc(acc) + '">' + esc(part) + '</button>';
    });
    if (q('breadcrumb')) q('breadcrumb').innerHTML = html;
    if (q('pageTitle')) q('pageTitle').textContent = currentFolder ? base(currentFolder) : '我的教材';
  }

  function renderStorage(){
    const used = files.reduce((s, f) => s + Number(f.size || 0), 0);
    const quota = 10 * 1024 * 1024 * 1024;
    const p = Math.min(100, Math.round(used * 100 / quota));
    if (q('storageBar')) q('storageBar').style.width = p + '%';
    if (q('storageText')) q('storageText').textContent = sizeLabel(used) + ' / 10 GB 已使用';
  }

  function folderCard(f){
    return '<div class="folder-card" data-open-folder="' + esc(f) + '">' +
      '<div class="folder-icon"></div>' +
      '<div class="folder-name">' + esc(base(f)) + '</div>' +
      (isAdmin ? '<button class="button danger" data-delete-folder="' + esc(f) + '" title="刪除資料夾">刪除</button>' : '') +
    '</div>';
  }

  function fileCard(f){
    const e = ext(f);
    return '<div class="file-card">' +
      '<div class="file-thumb"><div class="file-badge">' + esc(e || 'FILE') + '</div></div>' +
      '<div class="file-info">' +
        '<div class="file-name">' + esc(f.name || f.path) + '</div>' +
        '<div class="file-meta">' + esc(f.modified || '-') + ' ｜ ' + esc(f.size_label || sizeLabel(f.size)) + '</div>' +
      '</div>' +
      '<div class="file-actions">' +
        '<a class="button secondary" href="' + dl(f.path) + '">下載</a>' +
        (['pdf','jpg','jpeg','png','txt','md','mp4'].includes(e) ? '<button class="button secondary" data-preview="' + esc(f.path) + '">預覽</button>' : '') +
        (isAdmin ? '<button class="button danger" data-delete-file="' + esc(f.path) + '" title="刪除檔案">刪除</button>' : '') +
      '</div>' +
    '</div>';
  }

  function renderListTable(folds, fList){
    const tbody = q('listBody');
    if (!tbody) return;
    tbody.innerHTML = folds.map(f => 
      '<tr><td><button class="button secondary" style="min-height:30px;padding:0 8px" data-folder="' + esc(f) + '">📁 ' + esc(base(f)) + '</button></td><td>' + esc(parent(f) || '我的教材') + '</td><td>-</td><td>資料夾</td><td>' + (isAdmin ? '<button class="button danger" data-delete-folder="' + esc(f) + '" title="刪除資料夾">刪除</button>' : '') + '</td></tr>'
    ).concat(fList.map(f => 
      '<tr><td><b>' + esc(f.name || f.path) + '</b></td><td>' + esc(f.folder || '我的教材') + '</td><td>' + esc(f.modified || '-') + '</td><td>' + esc(f.size_label || sizeLabel(f.size)) + '</td><td><a class="button secondary" href="' + dl(f.path) + '">下載</a>' + (isAdmin ? '<button class="button danger" data-delete-file="' + esc(f.path) + '" title="刪除檔案">刪除</button>' : '') + '</td></tr>'
    )).join('') || '<tr><td colspan="5" class="empty">目前資料夾為空</td></tr>';
  }

  function render(){
    renderNav();
    renderBreadcrumb();
    renderStorage();

    const folds = childFolders();
    const fList = directFiles();

    if (q('summary')) q('summary').textContent = '資料夾 ' + folds.length + ' 個 ｜ 檔案 ' + fList.length + ' 個';

    if (q('folderSection')) q('folderSection').style.display = folds.length ? 'flex' : 'none';
    if (q('folderGrid')) q('folderGrid').innerHTML = folds.map(folderCard).join('');

    if (q('fileGrid')) {
      q('fileGrid').innerHTML = fList.length ? fList.map(fileCard).join('') : (!folds.length ? '<div class="empty">目前資料夾沒有教材檔案。請點擊「上傳檔案」或拖曳檔案至此。</div>' : '');
    }

    renderListTable(folds, fList);

    const isGrid = view === 'grid';
    if (q('fileGrid')) q('fileGrid').style.display = isGrid ? 'grid' : 'none';
    if (q('listTable')) q('listTable').classList.toggle('visible', !isGrid);
    if (q('gridView')) q('gridView').classList.toggle('active', isGrid);
    if (q('listView')) q('listView').classList.toggle('active', !isGrid);
  }

  async function loadFiles(){
    try {
      const body = await api('/admin/api/files/list', { cache: 'no-store' });
      isAdmin = !!body.is_admin;
      var stay = false;
      try { stay = new URLSearchParams(location.search).get('stay') === '1'; } catch(_){}
      var mode = String(body.frontend_mode || 'off').toLowerCase();
      var cloudUrl = body.frontend_url ? String(body.frontend_url) : '';
      if (cloudUrl && (mode === 'redirect' || mode === 'sso') && !stay) {
        location.replace(cloudUrl);
        return;
      }
      if (cloudUrl && mode === 'button') {
        var bar = document.getElementById('ncOpenBar');
        if (!bar) {
          bar = document.createElement('a');
          bar.id = 'ncOpenBar';
          bar.target = '_blank';
          bar.rel = 'noopener';
          bar.style.cssText = 'display:inline-flex;align-items:center;margin:0 0 12px;padding:10px 16px;border-radius:14px;background:#0082c9;color:#fff;font-weight:800;text-decoration:none';
          var head = document.querySelector('.content-head .toolbar-right') || document.querySelector('.content-head');
          if (head) head.prepend(bar);
        }
        bar.href = cloudUrl;
        bar.textContent = /owncloud/i.test(cloudUrl) ? '在 ownCloud 開啟' : '在 Nextcloud 開啟';
      }
      files = (body.files || []).map(f => typeof f === 'string' ? { path: f, name: f } : f);
      folders = body.folders || [];
      render();
    } catch(e) {
      toast(e.message || '讀取教材失敗', false);
      if (q('fileGrid')) q('fileGrid').innerHTML = '<div class="empty">讀取教材失敗：' + esc(e.message || e) + '</div>';
    }
  }

  function setFolder(f){
    currentFolder = norm(f);
    const u = new URL(location.href);
    if (currentFolder) u.searchParams.set('folder', currentFolder);
    else u.searchParams.delete('folder');
    history.replaceState(null, '', u.pathname + u.search + u.hash);
    render();
  }

  async function mkdir(){
    const name = prompt('請輸入新資料夾名稱：');
    if (!name) return;
    let path = norm(name);
    if (!path) return;
    if (currentFolder && !path.includes('/')) path = currentFolder + '/' + path;
    try {
      const b = await api('/admin/api/files/mkdir', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ path })
      });
      currentFolder = norm(b.path || path);
      toast('資料夾建立成功');
      await loadFiles();
    } catch(e) {
      toast(e.message || '建立資料夾失敗', false);
    }
  }

  function showProgress(p, t){
    if (q('uploadProgress')) q('uploadProgress').classList.add('visible');
    if (q('uploadProgressBar')) q('uploadProgressBar').style.width = Math.max(0, Math.min(100, p || 0)) + '%';
    if (q('uploadProgressText')) q('uploadProgressText').textContent = t || '';
  }

  function hideProgress(){
    setTimeout(() => {
      if (q('uploadProgress')) q('uploadProgress').classList.remove('visible');
    }, 1600);
  }

  function uploadOne(file, i, total){
    return new Promise((resolve, reject) => {
      const fd = new FormData();
      fd.append('folder', currentFolder);
      fd.append('file', file);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/admin/api/files/upload');
      xhr.withCredentials = true;
      xhr.upload.onprogress = ev => {
        if (ev.lengthComputable) {
          showProgress(ev.loaded / ev.total * 100, '上傳 ' + i + '/' + total + '：' + file.name + ' (' + Math.round(ev.loaded / ev.total * 100) + '%)');
        } else {
          showProgress(30, '上傳 ' + i + '/' + total + '：' + file.name);
        }
      };
      xhr.onerror = () => reject(new Error('網路連線失敗'));
      xhr.onload = () => {
        let body = {};
        try { body = JSON.parse(xhr.responseText || '{}'); } catch(_) {}
        if (xhr.status >= 200 && xhr.status < 300) resolve(body);
        else reject(new Error(body.error || ('HTTP ' + xhr.status)));
      };
      showProgress(0, '準備上傳 ' + i + '/' + total + '：' + file.name);
      xhr.send(fd);
    });
  }

  async function uploadFiles(fileList){
    const arr = Array.from(fileList || []);
    if (!arr.length) return;
    try {
      for (let i = 0; i < arr.length; i++) {
        await uploadOne(arr[i], i + 1, arr.length);
      }
      showProgress(100, '所有檔案上傳完成！');
      toast('教材上傳成功');
      if (q('fileInput')) q('fileInput').value = '';
      hideProgress();
      await loadFiles();
    } catch(e) {
      hideProgress();
      toast(e.message || '上傳失敗', false);
    }
  }

  async function delFile(path){
    if (!confirm('確定刪除檔案？\n' + path)) return;
    try {
      await api('/admin/api/files/delete', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ path })
      });
      toast('檔案已刪除');
      await loadFiles();
    } catch(e) {
      toast(e.message || '刪除檔案失敗', false);
    }
  }

  async function delFolder(path){
    if (!isAdmin) return toast('刪除資料夾需要管理員權限', false);
    if (!confirm('確定刪除資料夾及其所有內容？\n' + path)) return;
    try {
      await api('/admin/api/files/rmdir', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ path })
      });
      if (currentFolder === path || currentFolder.startsWith(path + '/')) currentFolder = '';
      toast('資料夾已刪除');
      await loadFiles();
    } catch(e) {
      toast(e.message || '刪除資料夾失敗', false);
    }
  }


  async function preview(path){
    const f = files.find(x => x.path === path) || { path, name: path };
    const e = ext(f);
    const url = pv(path);
    if (q('previewTitle')) q('previewTitle').textContent = f.name || path;
    if (q('previewDownload')) q('previewDownload').href = dl(path);
    if (q('previewModal')) q('previewModal').classList.add('visible');

    if (['jpg','jpeg','png'].includes(e)) {
      q('previewBody').innerHTML = '<img src="' + url + '">';
    } else if (e === 'pdf') {
      q('previewBody').innerHTML = '<object data="' + url + '#toolbar=1" type="application/pdf"><iframe src="' + url + '#toolbar=1"></iframe></object>';
    } else if (e === 'mp4') {
      q('previewBody').innerHTML = '<video src="' + url + '" controls autoplay></video>';
    } else if (['txt','md'].includes(e)) {
      try {
        const res = await fetch(url, { cache: 'no-store' });
        q('previewBody').innerHTML = '<pre>' + esc(await res.text()) + '</pre>';
      } catch(_) {
        q('previewBody').innerHTML = '<div class="empty">無法預覽此檔案</div>';
      }
    }
  }

  function syncLinks(){
    if (q('dashboardLink')) q('dashboardLink').href = withToken('/admin');
    if (q('contentHeadBackDashboard')) q('contentHeadBackDashboard').href = withToken('/admin');
    if (q('sidebarBackDashboard')) q('sidebarBackDashboard').href = withToken('/admin');
    if (q('mDashboard')) q('mDashboard').href = withToken('/admin');
  }

  function driveHome(){
    // MOBILE_FILES_DRIVE_HOME_BUTTON_V1: 手機版雲端硬碟回到根目錄 / 全部教材。
    setFolder('');
  }

  function init(){
    syncLinks();
    
    if (q('newBtn')) q('newBtn').onclick = () => q('newMenu').classList.toggle('open');
    if (q('newUpload')) q('newUpload').onclick = () => { q('newMenu').classList.remove('open'); q('fileInput').click(); };
    if (q('newFolder')) q('newFolder').onclick = () => { q('newMenu').classList.remove('open'); mkdir(); };
    if (q('uploadHere')) q('uploadHere').onclick = () => q('fileInput').click();
    if (q('mkdirHere')) q('mkdirHere').onclick = mkdir;
    if (q('refresh')) q('refresh').onclick = loadFiles;
    if (q('mRefresh')) q('mRefresh').onclick = loadFiles;
    if (q('mDriveHome')) q('mDriveHome').onclick = driveHome;
    if (q('mUpload')) q('mUpload').onclick = () => q('fileInput').click();
    if (q('mFolder')) q('mFolder').onclick = mkdir;

    if (q('navAll')) q('navAll').onclick = () => setFolder('');
    if (q('gridView')) q('gridView').onclick = () => { view = 'grid'; localStorage.setItem('drive_view', view); render(); };
    if (q('listView')) q('listView').onclick = () => { view = 'list'; localStorage.setItem('drive_view', view); render(); };
    if (q('sortBy')) q('sortBy').onchange = e => { sort = e.target.value; render(); };
    var _filesDebounce = null;
    if (q('search')) q('search').oninput = () => {
      clearTimeout(_filesDebounce);
      _filesDebounce = setTimeout(render, 120);
    };
    if (q('fileInput')) q('fileInput').onchange = e => uploadFiles(e.target.files);

    if (q('previewClose')) q('previewClose').onclick = () => q('previewModal').classList.remove('visible');
    if (q('previewModal')) q('previewModal').onclick = e => { if (e.target === q('previewModal')) q('previewModal').classList.remove('visible'); };

    document.body.addEventListener('click', e => {
      const open = e.target.closest('[data-open-folder]');
      if (open && !e.target.closest('button,a')) return setFolder(open.dataset.openFolder);
      const btn = e.target.closest('[data-folder],[data-delete-file],[data-delete-folder],[data-preview]');
      if (!btn) return;
      if (btn.dataset.folder !== undefined) return setFolder(btn.dataset.folder);
      if (btn.dataset.deleteFile) return delFile(btn.dataset.deleteFile);
      if (btn.dataset.deleteFolder) return delFolder(btn.dataset.deleteFolder);
      if (btn.dataset.preview) return preview(btn.dataset.preview);
    });

    const drop = q('dropzone');
    if (drop) {
      ['dragenter','dragover'].forEach(n => document.addEventListener(n, e => { e.preventDefault(); drop.classList.add('dragover'); }));
      document.addEventListener('dragleave', e => { if (e.clientX === 0 && e.clientY === 0) drop.classList.remove('dragover'); });
      document.addEventListener('drop', e => {
        e.preventDefault();
        drop.classList.remove('dragover');
        if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
      });
    }

    const folderParam = new URLSearchParams(location.search).get('folder');
    if (folderParam) currentFolder = norm(folderParam);

    loadFiles();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

<script id="FILES_TOP_BACK_V2">
