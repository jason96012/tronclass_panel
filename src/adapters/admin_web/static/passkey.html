<!doctype html>
<html lang="zh-Hant" class="tron-auth">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>設定通行密鑰｜Tronclass</title>
<style>
  :root{color-scheme:light dark;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;--line:#dbe3ef;--primary:#2563eb;--bad:#b91c1c;--ok:#15803d}
  @media(prefers-color-scheme:dark){:root{--bg:#090d16;--card:#131b2a;--text:#f1f5f9;--muted:#94a3b8;--line:#334155;--primary:#3b82f6}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;position:sticky;top:0;background:rgba(244,247,251,.92);backdrop-filter:blur(12px)}
  @media(prefers-color-scheme:dark){header{background:rgba(9,13,22,.92)}}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900}
  .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;display:grid;place-items:center;font-weight:900}
  a.back{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border-radius:999px;background:#2563eb;color:#fff;text-decoration:none;font-weight:800;font-size:13px}
  main{max-width:440px;margin:0 auto;padding:18px 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 16px 16px;box-shadow:0 16px 40px rgba(15,23,42,.08)}
  h1{margin:0 0 8px;font-size:22px}
  p.hint{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.55;font-weight:650}
  .msg{min-height:20px;margin:12px 0;font-size:14px;font-weight:800;color:var(--muted);line-height:1.5}
  .msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
  #go{width:100%;min-height:52px;border:0;border-radius:16px;background:var(--primary);color:#fff;font-size:16px;font-weight:900}
  #go:disabled{opacity:.6}
</style>
</head>
<body>
<style id="BACK_BTN_CONTRAST_V2">
  header a.back,a.back{
    display:inline-flex!important;align-items:center!important;justify-content:center!important;
    min-height:36px!important;padding:0 14px!important;border-radius:999px!important;
    background:#1d4ed8!important;color:#ffffff!important;-webkit-text-fill-color:#ffffff!important;
    text-decoration:none!important;font-weight:800!important;font-size:13px!important;opacity:1!important;border:0!important;
  }
  @media (prefers-color-scheme:dark){
    header a.back,a.back{
      background:#f8fafc!important;color:#0f172a!important;-webkit-text-fill-color:#0f172a!important;
    }
  }
</style>

<header>
  <div class="brand"><div class="mark">D</div>通行密鑰</div>
  <a class="back" href="/admin#overview" style="background:#f8fafc;color:#0f172a;-webkit-text-fill-color:#0f172a">返回控制台</a>
</header>
<main>
  <div class="card">
    <h1>設定通行密鑰</h1>
    <p class="hint">用 iPhone Face ID／密碼綁定這個帳號。請用 Safari 開啟，並直接點下面這顆按鈕。</p>
    <button id="go" type="button">開始設定通行密鑰</button>
    <div id="msg" class="msg">點按鈕後，手機會跳出系統驗證。</div>
  </div>
</main>
<script>
(function(){
  function $(id){ return document.getElementById(id); }
  function set(tx, kind){ var el=$('msg'); el.textContent=tx||''; el.className='msg'+(kind?' '+kind:''); }
  function b64e(buf){ var u=new Uint8Array(buf),s=''; for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function b64d(str){ str=String(str||'').replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='='; var bin=atob(str),o=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) o[i]=bin.charCodeAt(i); return o.buffer; }
  fetch('/admin/api/status',{credentials:'same-origin',cache:'no-store'}).then(function(r){
    if(!r.ok) location.replace('/admin?next='+encodeURIComponent('/admin/passkey'));
  }).catch(function(){ location.replace('/admin'); });
  $('go').onclick=async function(){
    if(!window.PublicKeyCredential||!navigator.credentials||!navigator.credentials.create){
      set('此瀏覽器不支援通行密鑰。請用 Safari 開啟。','bad'); return;
    }
    $('go').disabled=true;
    set('準備建立通行密鑰…','');
    try{
      var res=await fetch('/admin/api/passkey/register/start',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'content-type':'application/json'}});
      var json=await res.json().catch(function(){return {};});
      if(!res.ok) throw new Error(json.error||json.message||('HTTP '+res.status));
      var opts=JSON.parse(JSON.stringify(json.publicKey||{}));
      opts.challenge=b64d(opts.challenge);
      if(opts.user&&opts.user.id) opts.user.id=b64d(opts.user.id);
      if(opts.excludeCredentials) opts.excludeCredentials=opts.excludeCredentials.map(function(c){ return Object.assign({},c,{id:b64d(c.id)}); });
      var cred=await navigator.credentials.create({publicKey:opts});
      if(!cred) throw new Error('未建立通行密鑰');
      var fin=await fetch('/admin/api/passkey/register/finish',{
        method:'POST', credentials:'same-origin', cache:'no-store',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({
          ceremony_id:json.ceremony_id,
          response:{
            id:cred.id,
            attestationObject:b64e(cred.response.attestationObject),
            clientDataJSON:b64e(cred.response.clientDataJSON),
            transports:cred.response.getTransports?cred.response.getTransports():[]
          }
        })
      });
      var done=await fin.json().catch(function(){return {};});
      if(!fin.ok) throw new Error(done.error||done.message||('HTTP '+fin.status));
      set('通行密鑰已設定完成，下次可用 Passkey 登入。','ok');
    }catch(e){
      var m=String((e&&(e.name+' '+e.message))||e||'');
      if(/NotAllowed|gesture/i.test(m)) m='系統沒有跳出驗證。請再按一次「開始設定通行密鑰」。';
      else if(/401|unauthorized/i.test(m)) m='登入已過期，請回控制台重新登入。';
      else m=(e&&e.message)||'設定失敗';
      set(m,'bad');
    }finally{
      $('go').disabled=false;
    }
  };
})();
</script>
<script src="/admin/static/js/mobile-nav.js?v=mnav6"></script>
</body>
</html>
