<script id="BAN_CRUDE_LOGIN_V1">
(function(){
  if(window.BAN_CRUDE_LOGIN_V1) return;
  window.BAN_CRUDE_LOGIN_V1 = true;
  function isCrude(card){
    if(!card) return false;
    if(card.querySelector('.animated-login-card-inner')) return false;
    var tx=(card.textContent||'').replace(/\s+/g,'');
    return !!(card.querySelector('.login-grid') || tx.indexOf('需要登入')>=0 || tx.indexOf('帳號 / account')>=0);
  }
  function kill(root){
    var scope=root&&root.querySelectorAll?root:document;
    var cards=[];
    if(root&&root.id==='loginCard') cards.push(root);
    try{ cards=cards.concat(Array.prototype.slice.call(scope.querySelectorAll('#loginCard,.login-card,#loginPanel'))); }catch(_){}
    cards.forEach(function(card){
      if(!isCrude(card)) return;
      card.innerHTML='';
      card.hidden=true;
      card.setAttribute('aria-hidden','true');
      card.style.display='none';
    });
  }
  kill(document);
  try{ new MutationObserver(function(ms){ ms.forEach(function(m){ Array.prototype.forEach.call(m.addedNodes||[], function(n){ if(n.nodeType===1) kill(n); }); }); }).observe(document.documentElement,{childList:true,subtree:true}); }catch(_){}
})();
</script>

<meta name="referrer" content="no-referrer">
<script id="hideAdminTokenFromUrlEarlyV1">
(function(){
  'use strict';
  if (window.HIDE_ADMIN_TOKEN_FROM_URL_EARLY_V1) return;
  window.HIDE_ADMIN_TOKEN_FROM_URL_EARLY_V1 = true;
  var LS_SESSION = 'tronclass_admin_session';
  var LS_LOGOUT = 'tronclass_dashboard_manual_logout';
  function sanitizeCurrentUrl(){
    try {
      var u = new URL(location.href);
      var changed = false;
      var token = u.searchParams.get('token') || '';
      if (u.searchParams.get('logout') === '1') {
        /* LOGOUT_SERVER_SIDE_V1：?logout=1 已無意義，只清遺留旗標。 */
        localStorage.removeItem(LS_SESSION);
        localStorage.removeItem(LS_LOGOUT);
      } else if (token) {
        localStorage.setItem(LS_SESSION, token);
        localStorage.removeItem(LS_LOGOUT);
      }
      if (u.searchParams.has('token')) { u.searchParams.delete('token'); changed = true; }
      if (changed) history.replaceState(null, document.title, u.pathname + (u.search ? u.search : '') + u.hash);
    } catch(_) {}
  }
  sanitizeCurrentUrl();
  window.tronAdminToken = function(){ try { return (localStorage.getItem(LS_SESSION) || '').trim(); } catch(_) { return ''; } };
})();
</script>
<!-- HIDE_ADMIN_TOKEN_FROM_URL_V1_END -->

<style id="consolidatedAdminAuthCriticalV1">
  html.tron-auth-pending body main > :not(#loginCard):not(#authCard),
  html.tron-auth-logged-out body main > :not(#loginCard):not(#authCard),
  html.tron-auth-pending body .protected,

<script id="consolidatedAdminAuthEarlyV1">
(function(){
  'use strict';
  if (window.COOKIE_SUBPAGE_AUTH_V1) return;
  window.COOKIE_SUBPAGE_AUTH_V1 = true;
  var LO = 'tronclass_dashboard_manual_logout';
  try {
    var p = new URLSearchParams(location.search);
    /* LOGOUT_SERVER_SIDE_V1：登出已改為伺服器端（POST /admin/logout 清 cookie）；
       不再以 ?logout=1 / tronclass_dashboard_manual_logout 判斷，只清掉遺留旗標。 */
    try { localStorage.removeItem(LO); } catch (_) {}
    if (p.has('logout')) { p.delete('logout'); history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p.toString() : '') + location.hash); }
    /* LOGIN_PERF_V1：這頁是伺服器驗證過 session 才送出的（pages::inject_auth_attrs 會在 <html>
       寫入 data-auth="ok" 與 data-account / data-admin / data-viewer）。有這個屬性就直接進入
       已登入版面，不再多打一次 /admin/api/status 當「開機驗證」——省一趟往返，第一幀不閃。
       沒有屬性（理論上不會發生）才退回舊的網路驗證。 */
    var authOk = document.documentElement.getAttribute('data-auth') === 'ok';
    if (authOk) {
      window.__tronAuthStatus = window.__tronAuthStatus || {
        current_account_id: document.documentElement.getAttribute('data-account') || '',
        is_admin: document.documentElement.getAttribute('data-admin') === '1',
        is_viewer: document.documentElement.getAttribute('data-viewer') === '1',
        __partial: true
      };
      window.__tronAuthState = 'ok';
      document.documentElement.classList.remove('tron-auth-pending','tron-auth-logged-out');
      document.documentElement.classList.add('tron-auth-ok','dash-auth-ok','auth-ok');
      if (document.body) document.body.classList.add('logged-in','auth-ok','dash-auth-ok');
      else document.addEventListener('DOMContentLoaded', function(){ document.body.classList.add('logged-in','auth-ok','dash-auth-ok'); }, { once: true });
    } else {
    document.documentElement.classList.add('tron-auth-pending');
    fetch('/admin/api/status', {credentials:'same-origin', cache:'no-store'}).then(function(r){
      if (r.ok) {
        document.documentElement.classList.remove('tron-auth-pending','tron-auth-logged-out');
        document.documentElement.classList.add('tron-auth-ok','dash-auth-ok','auth-ok');
        if (document.body) document.body.classList.add('logged-in','auth-ok','dash-auth-ok');
        return;
      }
      var next = encodeURIComponent(location.pathname + location.search + location.hash);
      location.replace('/admin?next=' + next);
    }).catch(function(){
      var next = encodeURIComponent(location.pathname + location.search + location.hash);
      location.replace('/admin?next=' + next);
    });
    }
  } catch(_) {
    location.replace('/admin');
  }
})();
</script>
<!-- CONSOLIDATED_ADMIN_AUTH_V1_HEAD_END -->

  <script id="optimizeV47Theme">
  (function(){
    'use strict';
    var mq=window.matchMedia('(prefers-color-scheme:dark)');

  function themeChoice(){try{var s=JSON.parse(localStorage.getItem(THEME_LS)||'{}');var t=String(s.theme||'auto').toLowerCase();return(t==='light'||t==='dark')?t:'auto'}catch(_){return'auto'}}
  function applyTheme(){var c=themeChoice();document.documentElement.setAttribute('data-theme',c==='auto'?(mq.matches?'dark':'light'):c)}
  /* THEME_CHOICE_V1: 使用者設定（外觀設定頁）優先；auto 才跟隨系統，並同步跨分頁變更 */
  applyTheme();
  try{mq.addEventListener('change',applyTheme)}catch(e){mq.addListener(applyTheme)}
  try{window.addEventListener('storage',function(ev){if(!ev||!ev.key||ev.key===THEME_LS)applyTheme()})}catch(_){}
  window.__setTheme=function(t){document.documentElement.setAttribute('data-theme',t||'dark')};

<script>
(function(){
  'use strict';
  const LS_SESSION = 'tronclass_admin_session';
  let systemList = [];

  const q = id => document.getElementById(id);
  
  function token(){
    try {
      return ''; // F-03: token removed
    } catch(_) { return ''; }
  }
  
  function withToken(path){
    try {
      const u = new URL(path, location.origin);
      const t = token();
      // F-03: token removed, auth via HttpOnly cookie
      return u.pathname + u.search + u.hash;
    } catch(_) { return path; }
  }

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function fmtTime(ts){
    if (!ts) return '-';
    try {
      const num = Number(ts);
      const d = new Date(num < 1e11 ? num * 1000 : num);
      if (isNaN(d.getTime())) return String(ts);
      return d.toLocaleString('zh-TW', { hour12: false });
    } catch(_) { return String(ts); }
  }

  function pill(status, text){
    const s = String(status || '').toLowerCase();
    let cls = 'info';
    let label = text || status || 'INFO';
    if (s === 'ok' || s === 'success' || s === 'true' || s === 'info') {
      cls = 'info';
      if (!text) label = 'INFO';
    } else if (s === 'warn' || s === 'warning') {
      cls = 'warn';
      if (!text) label = 'WARN';
    } else if (s === 'fail' || s === 'failed' || s === 'error' || s === 'bad') {
      cls = 'bad';
      if (!text) label = 'ERROR';
    }
    return '<span class="pill ' + cls + '">' + esc(label) + '</span>';
  }

  async function api(path, opts={}, timeout=12000){
    const t = token();
    const c = new AbortController();
    const timer = setTimeout(() => c.abort(), timeout);
    opts.signal = c.signal;
    opts.credentials = opts.credentials || 'same-origin';
    const sep = path.includes('?') ? '&' : '?';
    try {
      const res = await fetch(path, opts);
      if (res.status === 401 || res.status === 403) {
        localStorage.removeItem(LS_SESSION);
        sessionStorage.removeItem(LS_SESSION);
        const next = encodeURIComponent(location.pathname + location.search + location.hash);
        location.replace('/admin?next=' + next);
        throw new Error('登入失效');
      }
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
      return body;
    } finally {
      clearTimeout(timer);
    }
  }

  function renderSystem(){
    const kw = (q('sysSearch') ? q('sysSearch').value : '').trim().toLowerCase();
    const lf = (q('sysLevelFilter') ? q('sysLevelFilter').value : '').trim().toLowerCase();
    const sf = (q('sysSourceFilter') ? q('sysSourceFilter').value : '').trim().toLowerCase();
    let arr = Array.isArray(systemList) ? systemList : [];
    
    if (lf) {
      arr = arr.filter(x => String(x.level || 'info').toLowerCase().includes(lf));
    }
    if (sf) {
      arr = arr.filter(x => String(x.target || x.source || x.module || '').toLowerCase().indexOf(sf) === 0);
    }
    if (kw) {
      arr = arr.filter(x => ((x.target||x.source||x.module||'')+' '+(x.account_id||'')+' '+(x.message||x.msg||x.text||'')).toLowerCase().includes(kw));
    }

    if (q('logSummary')) q('logSummary').textContent = '顯示 ' + arr.length + ' / ' + systemList.length + ' 筆紀錄';

    // 桌面表格
    if (q('systemBody')) {
      q('systemBody').innerHTML = arr.length ? arr.map(x => {
        const lvl = String(x.level || 'info').toLowerCase();
        return '<tr>' +
          '<td style="white-space:nowrap;font-variant-numeric:tabular-nums">' + fmtTime(x.time || x.timestamp) + '</td>' +
          '<td>' + pill(lvl, (x.level || 'INFO').toUpperCase()) + '</td>' +
          '<td><b>' + esc(x.target || x.source || x.module || '系統') + '</b></td>' +
          '<td><span class="small">' + esc(x.account_id || '-') + '</span></td>' +
          '<td><div class="code-msg">' + esc(x.message || x.msg || x.text || '-') + (x.details ? '<details class="log-details"><summary>詳細</summary><pre>' + esc(x.details) + '</pre></details>' : '') + '</div></td>' +
        '</tr>';
      }).join('') : '<tr><td colspan="5" class="empty">沒有符合的系統 Log</td></tr>';
    }

    // 手機卡片 (時間、等級、模組、帳號、訊息)
    if (q('systemCards')) {
      q('systemCards').innerHTML = arr.length ? arr.map(x => {
        const lvl = String(x.level || 'info').toLowerCase();
        return '<div class="log-card">' +
          '<div class="log-card-header">' +
            '<span class="log-card-time">' + fmtTime(x.time || x.timestamp) + '</span>' +
            pill(lvl, (x.level || 'INFO').toUpperCase()) +
          '</div>' +
          '<div class="log-card-meta">' +
            '<span class="log-card-module">' + esc(x.target || x.source || x.module || '系統') + '</span>' +
            '<span class="log-card-target">' + esc(x.account_id || '-') + '</span>' +
          '</div>' +
          '<div class="log-card-body">' +
            esc(x.message || x.msg || x.text || '-') + (x.details ? '<details class="log-details"><summary>詳細</summary><pre>' + esc(x.details) + '</pre></details>' : '') +
          '</div>' +
        '</div>';
      }).join('') : '<div class="empty">目前沒有系統 Log</div>';
    }
  }

  function updateStats(){
    const infoCount = systemList.filter(x => String(x.level || 'info').toLowerCase() === 'info').length;
    const warnCount = systemList.filter(x => String(x.level || '').toLowerCase() === 'warn').length;
    const errorCount = systemList.filter(x => String(x.level || '').toLowerCase() === 'error').length;
    if (q('statTotalLogs')) q('statTotalLogs').textContent = systemList.length;
    if (q('statInfoLogs')) q('statInfoLogs').textContent = infoCount;
    if (q('statWarnLogs')) q('statWarnLogs').textContent = warnCount;
    if (q('statErrorLogs')) q('statErrorLogs').textContent = errorCount;
  }

  async function loadSystemLogs(){
    try {
      const res = await api('/admin/api/logs?limit=500');
      systemList = res.items || res.logs || res.entries || [];
      renderSystem();
      updateStats();
    } catch(e) {
      console.warn('system logs failed', e);
      if (q('systemBody')) q('systemBody').innerHTML = '<tr><td colspan="5" class="empty">讀取日誌失敗</td></tr>';
    }
  }

  function syncLinks(){
    if (q('backDashboardBtn')) q('backDashboardBtn').href = withToken('/admin');
    if (q('pageBackDashboardBtn')) q('pageBackDashboardBtn').href = withToken('/admin');
  }

  function init(){
    syncLinks();
    
    if (q('refresh')) q('refresh').onclick = () => { loadSystemLogs(); };
    if (q('logoutBtn')) q('logoutBtn').onclick = () => {
      /* LOGOUT_SERVER_SIDE_V1 */
      if (typeof window.tronSecureLogout === 'function') return window.tronSecureLogout();
      fetch('/admin/logout',{method:'POST',credentials:'same-origin',cache:'no-store',redirect:'manual'}).catch(function(){}).then(function(){location.replace('/admin')});
    };

    var _logsDebounce = null;
    if (q('sysSearch')) q('sysSearch').oninput = () => {
      clearTimeout(_logsDebounce);
      _logsDebounce = setTimeout(renderSystem, 120);
    };
    if (q('sysLevelFilter')) q('sysLevelFilter').onchange = renderSystem;
    if (q('sysSourceFilter')) q('sysSourceFilter').onchange = renderSystem;

    loadSystemLogs();
    setInterval(() => { if (!document.hidden && token()) loadSystemLogs(); }, 15000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
<script id="RETURN_DASHBOARD_HREF_V1">
(function(){
  function tok(){
    return '';
  }
  function patch(){
    var t=tok();
    document.querySelectorAll('a[href="/admin"],a[href="/admin/"],a[href="/admin#overview"],a[href^="/admin?"]').forEach(function(a){
      try{
        var u=new URL(a.getAttribute('href'), location.origin);
        if(!(u.pathname==='/admin'||u.pathname==='/admin/'||u.pathname==='/admin/dashboard')) return;
        // F-03: token removed, auth via HttpOnly cookie
        if(!u.hash) u.hash='overview';
        a.setAttribute('href', u.pathname+u.search+u.hash);
      }catch(_){}
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', patch);
  else patch();
  setTimeout(patch, 200);
})();
