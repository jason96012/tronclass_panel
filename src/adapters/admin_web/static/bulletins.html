<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>課程公告</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:16px 14px 60px}
  header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line2)}
  header.top h1{font-size:18px;font-weight:800;flex:1}
  header.top .count{font-size:12px;color:var(--muted)}
  a.back,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;min-height:38px}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primaryText)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer}
  .chip.active{background:var(--primary);border-color:var(--primary);color:var(--primaryText)}
  .list{display:flex;flex-direction:column;gap:12px;margin-top:12px}
  .card{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
  .card .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{font-size:11px;color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent);border:1px solid color-mix(in srgb,var(--primary) 35%,transparent);border-radius:999px;padding:3px 9px;font-weight:600}
  .pin{font-size:11px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:999px;padding:3px 8px;font-weight:600}
  .card h2{font-size:15px;font-weight:700;margin:8px 0 4px;line-height:1.45}
  .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
  .content{font-size:13.5px;line-height:1.7;color:var(--text);white-space:normal;word-break:break-word}
  .content pre{white-space:pre-wrap;font-family:inherit}
  .content img{max-width:100%;border-radius:8px;margin:6px 0}
  .content a{color:var(--primary)}
  .empty,.err{border:1px dashed var(--line);border-radius:14px;background:var(--card);color:var(--muted);text-align:center;padding:44px 18px;font-size:14px;margin-top:16px}
  .skel{height:86px;border-radius:14px;background:linear-gradient(90deg,var(--soft) 25%,var(--soft2) 50%,var(--soft) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  /* ── 手機板 ── */
  @media(max-width:760px){
    .wrap{padding:10px 10px 70px}
    header.top h1{font-size:16px}
    .card{border-radius:12px;padding:12px}
    .card h2{font-size:14.5px}
    a.back .txt{display:none}
    a.back{padding:8px 10px}
  }
  /* ── 桌機板：多欄 ── */
  @media(min-width:900px){
    .list.cols{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="/admin/dashboard" title="回控制台">←<span class="txt"> 回控制台</span></a>
    <h1>課程公告</h1>
    <span class="count" id="count"></span>
    <button class="btn primary" id="refresh" type="button">重新整理</button>
  </header>
  <div class="filters" id="filters"></div>
  <div class="list" id="list"><div class="skel"></div><div class="skel"></div></div>
</div>
<script id="BULLETINS_PAGE_V1">
(function(){
  'use strict';
  var list=document.getElementById('list'),countEl=document.getElementById('count'),filtersEl=document.getElementById('filters');
  var all=[],activeCourse='';
  function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':String(s));return d.innerHTML;}
  function pick(o,keys){for(var i=0;i<keys.length;i++){var v=o[keys[i]];if(v!=null&&v!==''){if(typeof v==='object'){var n=v.name||v.title||v.text;if(n!=null)return String(n);}return String(v);}}return '';}
  function ts(o){var t=pick(o,['publish_time','published_at','created_at','create_time','updated_at','updated','created','time']);if(!t)return 0;var n=Number(t);if(!isNaN(n)&&n>1e9)return n>1e12?Math.floor(n/1000):n;var d=new Date(t);return isNaN(d.getTime())?0:Math.floor(d.getTime()/1000);}
  function fmt(t){if(!t)return '';var d=new Date(t*1000);if(isNaN(d))return '';var p=function(x){return(x<10?'0':'')+x;};return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
  function setContent(el,raw){
    if(!raw){el.style.display='none';return;}
    if(window.DOMPurify&&DOMPurify.sanitize){el.innerHTML=DOMPurify.sanitize(raw,{USE_PROFILES:{html:true}});}
    else{el.textContent=raw;}
  }
  function card(it){
    var c=document.createElement('article');c.className='card';
    var r1=document.createElement('div');r1.className='row1';
    if(it.course_name){var b=document.createElement('span');b.className='badge';b.textContent=it.course_name;r1.appendChild(b);}
    if(it.pinned){var p=document.createElement('span');p.className='pin';p.textContent='置頂';r1.appendChild(p);}
    c.appendChild(r1);
    var h=document.createElement('h2');h.textContent=it.title||'(無標題)';c.appendChild(h);
    var m=document.createElement('div');m.className='meta';var meta=[];if(it.author)meta.push(it.author);if(it.time)meta.push(fmt(it.time));m.textContent=meta.join('・');c.appendChild(m);
    var ct=document.createElement('div');ct.className='content';setContent(ct,it.content);c.appendChild(ct);
    return c;
  }
  function render(){
    var items=all.slice();
    if(activeCourse)items=items.filter(function(x){return x.course_name===activeCourse;});
    items.sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)|| (b.ts||0)-(a.ts||0);});
    countEl.textContent=items.length?items.length+' 則公告':'';
    list.innerHTML='';
    list.classList.toggle('cols',!activeCourse&&items.length>3);
    if(!items.length){list.innerHTML='<div class="empty">目前沒有公告</div>';return;}
    items.forEach(function(it){list.appendChild(card(it));});
  }
  function buildFilters(){
    filtersEl.innerHTML='';
    var names=[];all.forEach(function(x){if(x.course_name&&names.indexOf(x.course_name)<0)names.push(x.course_name);});
    if(names.length<2)return;
    names.sort();
    var mk=function(label,val){var c=document.createElement('button');c.type='button';c.className='chip'+(activeCourse===val?' active':'');c.textContent=label;c.onclick=function(){activeCourse=val;buildFilters();render();};filtersEl.appendChild(c);};
    mk('全部','');names.forEach(function(n){mk(n,n);});
  }
  function load(){
    list.innerHTML='<div class="skel"></div><div class="skel"></div>';
    fetch('/admin/api/bulletins',{credentials:'same-origin',cache:'no-store'}).then(function(r){
      if(!r.ok)return r.json().catch(function(){return{};}).then(function(j){throw new Error(j.error||('HTTP '+r.status));});
      return r.json();
    }).then(function(body){
      all=(body.items||[]).map(function(x){x.ts=ts(x);return x;});
      buildFilters();render();
    }).catch(function(e){
      list.innerHTML='<div class="err">讀取公告失敗：'+esc(e.message||e)+'</div>';
    });
  }
  document.getElementById('refresh').onclick=load;
  load();
})();
</script>
</body>
</html>
