<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>課程公告</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:960px;margin:0 auto;padding:16px 14px 60px}
  header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line2)}
  header.top h1{font-size:18px;font-weight:800;flex:1}
  .count{font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:4px 10px;white-space:nowrap}
  a.back,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;cursor:pointer;min-height:38px}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primaryText)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:7px 13px;font-size:12.5px;cursor:pointer}
  .chip.active{background:var(--primary);border-color:var(--primary);color:var(--primaryText)}
  .chip.ghost{border-style:dashed}
  .list{display:flex;flex-direction:column;gap:12px;margin-top:12px}
  .card{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:16px 18px;box-shadow:0 1px 3px rgba(15,23,42,.06);min-width:0;overflow:hidden}
  .card.read{opacity:.55}
  .card.gone{animation:gone .22s ease forwards}
  @keyframes gone{to{opacity:0;transform:scale(.97)}}
  .card .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{font-size:11px;color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent);border:1px solid color-mix(in srgb,var(--primary) 35%,transparent);border-radius:999px;padding:3px 9px;font-weight:600}
  .pin{font-size:11px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:999px;padding:3px 8px;font-weight:600}
  .new{font-size:11px;color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent);border-radius:999px;padding:3px 8px;font-weight:700}
  .date{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .card h2{font-size:16px;font-weight:750;margin:10px 0 4px;line-height:1.4;overflow-wrap:anywhere}
  .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
  .content{font-size:14px;line-height:1.7;color:var(--text);overflow-wrap:anywhere;word-break:break-word;max-width:100%}
  .content *{max-width:100%;box-sizing:border-box}
  .content p{margin:8px 0}
  .content p:first-child{margin-top:0}
  .content p:last-child{margin-bottom:0}
  .content ul,.content ol{margin:8px 0;padding-left:20px}
  .content blockquote{margin:8px 0;padding:6px 10px;border-left:3px solid var(--line);color:var(--muted);background:var(--soft);border-radius:6px}
  .content pre{white-space:pre-wrap;word-break:break-word;font-family:inherit}
  .content table{display:block;overflow-x:auto;border-collapse:collapse}
  .content img{max-width:100%;border-radius:8px;margin:6px 0}
  .content a{color:var(--primary)}
  .cardfoot{display:flex;align-items:center;gap:8px;margin-top:14px}
  .cardfoot .spacer{flex:1}
  .readbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:7px 12px;font-size:12.5px;cursor:pointer;min-height:34px}
  /* BULLETIN_TRANSLATE_V1 */
  .trbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid color-mix(in srgb,var(--primary) 45%,transparent);color:var(--primary);border-radius:10px;padding:7px 12px;font-size:12.5px;cursor:pointer;min-height:34px}
  .trbtn:disabled{opacity:.55;cursor:not-allowed}
  .transbox{margin:10px 0 0;padding:10px 12px;border:1px dashed color-mix(in srgb,var(--primary) 45%,transparent);background:color-mix(in srgb,var(--primary) 6%,transparent);border-radius:10px}
  .translab{font-size:11px;font-weight:700;color:var(--primary);margin-bottom:4px}
  .transerr{margin:10px 0 0;padding:10px 12px;border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent);border-radius:10px}
  .transerrhead{font-size:12px;font-weight:800;color:var(--bad);margin-bottom:6px}
  .transerrmsg{font-size:11.5px;line-height:1.55;color:var(--text);white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .transerrrow{display:flex;gap:8px;margin-top:8px}
  .transbox>div:last-child{font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .readbtn:hover{color:var(--primary);border-color:var(--primary)}
  /* BULLETIN_AI_SUMMARY_V1：AI 摘要按鈕與摘要框 */
  .smbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok);border-radius:10px;padding:7px 12px;font-size:12.5px;cursor:pointer;min-height:34px}
  .smbtn:disabled{opacity:.55;cursor:not-allowed}
  .smbtn.on{background:color-mix(in srgb,var(--ok) 10%,transparent)}
  .smbox{margin:10px 0 0;padding:10px 12px;border:1px dashed color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 6%,transparent);border-radius:10px}
  .smbox .smlab{font-size:11px;font-weight:700;color:var(--ok);margin-bottom:4px}
  .smbox .smtext{font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .smbox .smmeta{font-size:10.5px;color:var(--muted);margin-top:6px}
  .readtag{display:inline-flex;font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:9px;padding:4px 9px}
  .delbtn{display:inline-flex;align-items:center;background:transparent;border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad);border-radius:10px;padding:7px 12px;font-size:12.5px;cursor:pointer;min-height:34px}
  .pubform{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
  .pubform input,.pubform textarea{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--text);font-family:inherit;resize:vertical}
  .pubform input:focus,.pubform textarea:focus{outline:2px solid color-mix(in srgb,var(--primary) 40%,transparent);border-color:var(--primary)}
  .pubrow{display:flex;gap:8px}
  .pubrow .spacer{flex:1}
  .empty,.err{border:1px dashed var(--line);border-radius:16px;background:var(--card);color:var(--muted);text-align:center;padding:44px 18px;font-size:14px;margin-top:16px}
  .skel{height:96px;border-radius:16px;background:linear-gradient(90deg,var(--soft) 25%,var(--soft2) 50%,var(--soft) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  /* ── 手機板 ── */
  @media(max-width:760px){
    .wrap{padding:8px 12px calc(132px + env(safe-area-inset-bottom))}
    header.top{padding:10px 0;border-bottom:none}
    header.top h1{font-size:17px}
    a.back{border-radius:999px;width:38px;padding:0}
    a.back .txt{display:none}
    .filters{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 8px;scrollbar-width:none;margin:8px 0 2px}
    .filters::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto;padding:8px 14px}
    .list{gap:10px}
    .list.cols{display:flex;flex-direction:column}
    .card{border-radius:16px;padding:14px 14px 12px}
    .card h2{font-size:15.5px}
    .content{font-size:13.8px;line-height:1.66}
    .date{font-size:11px}
  }
  /* ── 桌機板 ── */
  @media(min-width:900px){
    .wrap{max-width:1080px}
    .list.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:14px}
  }

  /* CSP_STYLE_ATTR_STAGED_V1：原 inline style 屬性改為 class（消除 style-src-attr 回報） */
  /* ── BULLETIN_PANEL_V1（fix53）：面板內閱讀公告 ──
     與作業頁同一種顯示方式：點卡片上的「📄 內容」在面板內開啟，不開新分頁、
     也不經過 /admin/tc-go 代理（代理會動到瀏覽器 cookie，是 fix38 事故的來源）。 */
  .tcinfo{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;min-height:34px;transition:all .15s ease;white-space:nowrap}
  .tcinfo:hover{border-color:var(--primary);color:var(--primary)}
  .blp-back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
  .blp-box{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.38)}
  .blp-head{position:relative;padding:16px 18px 12px;border-bottom:1px solid var(--line2)}
  .blp-title{font-size:17px;font-weight:800;line-height:1.45;overflow-wrap:anywhere;padding-right:76px}
  .blp-meta{font-size:12px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
  .blp-x{position:absolute;top:12px;right:12px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 10px;font-size:12px;cursor:pointer;min-height:32px}
  .blp-x:hover{color:var(--primary);border-color:var(--primary)}
  .blp-body{padding:16px 18px;overflow:auto;-webkit-overflow-scrolling:touch}
  .blp-content{font-size:14.5px}
  .blp-host{display:block}
  .blp-imgfail{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
  .blp-sub{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}
  .blp-subhead{font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:6px}
  .blp-item{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:8px 10px;font-size:13px;color:var(--text);cursor:pointer;line-height:1.5;font-family:inherit}
  .blp-item:hover{background:var(--soft)}
  .blp-item.on{background:var(--soft);font-weight:800}
  .blp-item .d{color:var(--muted);font-size:11.5px;margin-left:6px;white-space:nowrap;font-weight:400}
  /* BULLETIN_ATTACHMENT_V1（fix55）：公告附件列＋面板內預覽 */
  .blp-att{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
  .blp-att-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;margin-top:6px;background:var(--card);flex-wrap:wrap}
  .blp-att-ext{flex:0 0 auto;font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 6px;min-width:44px;text-align:center}
  .blp-att-name{flex:1 1 180px;min-width:0;font-size:13px;line-height:1.5;word-break:break-word;overflow-wrap:anywhere}
  .blp-att-size{flex:0 0 auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .blp-att-acts{flex:0 0 auto;display:flex;gap:6px;align-items:center}
  .blp-att-btn{display:inline-flex;align-items:center;gap:4px;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:5px 10px;font-size:12px;cursor:pointer;text-decoration:none;min-height:30px;font-family:inherit}
  .blp-att-btn:hover{border-color:var(--primary);color:var(--primary)}
  .blp-att-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  /* BULLETIN_MOBILE_V1（fix56）：PDF 頁碼／翻頁。長文件在手機上不必一路滑到底，
     捲動時頁碼會跟著更新（attSyncPdfPage），按鈕直接跳到目標頁開頭。 */
  .blp-att-pager{display:flex;align-items:center;gap:8px;margin-left:auto}
  .blp-att-pager .blp-att-btn{min-height:32px;padding:5px 12px}
  .blp-att-info{font-size:12px;color:var(--muted);min-width:86px;text-align:center;white-space:nowrap}
  .blp-pdf-page{display:flex;justify-content:center;width:100%}
  .blp-att-status{font-size:12px;color:var(--muted);margin-bottom:8px;word-break:break-word}
  .blp-att-img{max-width:100%;height:auto;display:block;margin:0 auto;border-radius:8px}
  .blp-att-pre{margin:0;padding:12px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .blp-pdf{display:flex;flex-direction:column;align-items:center;gap:10px}
  .blp-pdf canvas{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.35);border-radius:2px;max-width:100%}
  .blp-foot{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line2);background:var(--bg);flex-wrap:wrap}
  .blp-foot .spacer{flex:1}
  /* BULLETIN_MOBILE_V1（fix56）：手機版公告面板／附件預覽。
     背景（2026-09-16 回報截圖）：手機底部導覽列 #mobileNavFinalV2 是固定的浮動列，
     z-index 高達 2147482500，而面板彈層只有 9999 —— 開著面板看 PDF 時，導覽列會
     浮在內容上面把下半頁蓋掉。面板是模態，開啟期間就該蓋過它（關閉後導覽列照舊）。
     其他一併處理：動態視埠高度（iOS 網址列）、底部安全區、黏著工具列、
     手指尺寸的按鈕、以及「上一頁／下一頁」快跳。 */
  @media(max-width:640px){
    .blp-back{padding:0;align-items:flex-end;z-index:2147483001}
    .blp-box{width:100%;max-height:92vh;border-radius:16px 16px 0 0;border-bottom:0}
    .blp-head{padding:12px 12px 10px}
    .blp-title{font-size:15.5px;padding-right:66px}
    .blp-meta{font-size:11.5px;margin-top:4px}
    .blp-x{top:10px;right:10px;padding:6px 9px;min-height:34px}
    .blp-body{padding:12px 10px;overscroll-behavior:contain}
    /* 底部是系統手勢列，留安全區；兩顆按鈕各佔一半，拇指構得到。 */
    .blp-foot{gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
    .blp-foot .readbtn{flex:1;justify-content:center;min-height:42px;font-size:13px}
    /* 附件列：檔名與大小一行、動作鈕獨占下一行並加大。 */
    .blp-att-name{flex:1 1 140px;font-size:13px}
    .blp-att-acts{flex:1 1 100%;gap:8px}
    .blp-att-acts .blp-att-btn{flex:1;justify-content:center;min-height:42px;font-size:13px}
    /* 檢視器工具列黏在頂端：捲到第 8 頁也還看得到「返回公告」與「下載」。 */
    .blp-att-bar{position:-webkit-sticky;position:sticky;top:0;z-index:6;
      margin:-12px -10px 10px;padding:8px 10px;
      background:var(--card);border-bottom:1px solid var(--line2)}
    .blp-att-bar .blp-att-name{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
    .blp-att-bar .blp-att-btn{min-height:40px;padding:8px 12px;font-size:12.5px}
    .blp-att-pager{flex:1 1 100%;margin-left:0;justify-content:center}
    .blp-att-pager .blp-att-btn{min-height:38px}
    .blp-pdf{gap:8px}
    .blp-pdf-page{scroll-margin-top:62px}
    .blp-att-pre{font-size:11.5px;max-height:64vh}
  }
  /* 動態視埠：iOS 的 100vh 比實際可見範圍高，彈層底部會被切掉。 */
  @supports(height:100dvh){
    @media(max-width:640px){ .blp-box{max-height:96dvh} }
  }
  .hidden-init{display:none}
</style>
<style id="SAFE_AREA_TOP_V1">
  /* 手機鏡頭／瀏海安全區：viewport-fit=cover 讓頁面延伸到系統列底下，
     用透明邊框把頂欄內容推回安全區（無劉海裝置 env()=0，外觀完全不變）。 */
  header.top{
    border-top:env(safe-area-inset-top,0px) solid transparent;
    border-left:env(safe-area-inset-left,0px) solid transparent;
    border-right:env(safe-area-inset-right,0px) solid transparent;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="/admin/dashboard" title="回控制台">←<span class="txt"> 回控制台</span></a>
    <h1>課程公告</h1>
    <span class="count" id="count"></span>
    <button class="btn hidden-init" id="publishBtn" type="button">＋ 發佈</button>
    <button class="btn primary" id="refresh" type="button">重新整理</button>
  </header>
  <div class="pubform hidden-init" id="pubForm">
    <input id="pubTitle" placeholder="公告標題" maxlength="80">
    <textarea id="pubContent" rows="4" placeholder="公告內容"></textarea>
    <div class="pubrow"><span class="spacer"></span><button class="btn" id="pubCancel" type="button">取消</button><button class="btn primary" id="pubSubmit" type="button">發佈</button></div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="list" id="list"><div class="skel"></div><div class="skel"></div></div>
</div>
<!-- BULLETIN_PANEL_V1（fix53）：公告卡片改為面板內閱讀（原本是開新分頁走 /admin/tc-go 代理）。 -->
<script id="BULLETINS_PAGE_V5">
(function(){
  'use strict';
  var list=document.getElementById('list'),countEl=document.getElementById('count'),filtersEl=document.getElementById('filters');
  var all=[],activeCourse='',showRead=false,isAdmin=false;
  var NEW_SECS=7*86400;
  var publishBtn=document.getElementById('publishBtn'),pubForm=document.getElementById('pubForm');
  function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':String(s));return d.innerHTML;}
  function pick(o,keys){for(var i=0;i<keys.length;i++){var v=o[keys[i]];if(v!=null&&v!==''){if(typeof v==='object'){var n=v.name||v.title||v.text;if(n!=null)return String(n);}return String(v);}}return '';}
  function ts(o){var t=pick(o,['publish_time','published_at','created_at','create_time','updated_at','updated','created','time']);if(!t)return 0;var n=Number(t);if(!isNaN(n)&&n>1e9)return n>1e12?Math.floor(n/1000):n;var d=new Date(t);return isNaN(d.getTime())?0:Math.floor(d.getTime()/1000);}
  function p2(x){return(x<10?'0':'')+x;}
  function fmtDate(t){if(!t)return '';var d=new Date(t*1000);if(isNaN(d))return '';return d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate());}
  function rel(t){if(!t)return '';var now=Math.floor(Date.now()/1000),d=now-t;
    if(d<60)return '剛剛';if(d<3600)return Math.floor(d/60)+' 分鐘前';if(d<86400)return Math.floor(d/3600)+' 小時前';
    if(d<86400*2)return '昨天';if(d<86400*7)return Math.floor(d/86400)+' 天前';return fmtDate(t);}
  function isNew(it){return !!it.ts&&(Math.floor(Date.now()/1000)-it.ts)<=NEW_SECS;}
  function cleanRaw(raw){
    if(!raw)return '';
    var t=String(raw).replace(/\r/g,'');
    t=t.replace(/[ \t]+\n/g,'\n').replace(/\n[ ]+/g,'\n').replace(/\n{3,}/g,'\n\n');
    return t.replace(/^[ \n]+/,'').replace(/[ \n]+$/,'');
  }
  // BULLETIN_TRANSLATE_V3
  // 公告內容是 iClass 的 HTML 片段。要送去翻譯、或在沒有 DOMPurify 時呈現，
  // 都必須先轉成純文字，否則畫面會出現字面的 <p>…</p>。
  // 這裡刻意不用 innerHTML / DOMParser：本頁 CSP 有 require-trusted-types-for，
  // 那些都是 Trusted Types sink，純字串處理才穩。
  var ENTITIES={lt:'<',gt:'>',amp:'&',quot:'"',apos:"'",nbsp:' ',ndash:'\u2013',mdash:'\u2014',hellip:'\u2026',middot:'\u00b7',lsquo:'\u2018',rsquo:'\u2019',ldquo:'\u201c',rdquo:'\u201d'};
  function decodeEntities(s){
    if(String(s).indexOf('&')<0)return String(s);
    return String(s).replace(/&(#[xX]?[0-9a-fA-F]+|[a-zA-Z]+);/g,function(m,e){
      if(e.charAt(0)==='#'){
        var hex=(e.charAt(1)==='x'||e.charAt(1)==='X');
        var cp=hex?parseInt(e.slice(2),16):parseInt(e.slice(1),10);
        if(!isFinite(cp)||cp<=0||cp>0x10FFFF)return m;
        try{return String.fromCodePoint(cp);}catch(err){return m;}
      }
      var k=e.toLowerCase();
      return Object.prototype.hasOwnProperty.call(ENTITIES,k)?ENTITIES[k]:m;
    });
  }
  var TAG_RE=/<\/?[a-zA-Z][^>]*>/g;
  function stripTags(s){
    var t=String(s);
    t=t.replace(/<!--[\s\S]*?-->/g,'');
    t=t.replace(/<(script|style)\b[^>]*>[\s\S]*?<\/\1\s*>/gi,'');
    t=t.replace(/<\s*br\s*\/?\s*>/gi,'\n');
    t=t.replace(/<\s*\/?\s*(p|div|li|tr|ul|ol|table|section|article|blockquote|pre|h[1-6]|hr)\b[^>]*>/gi,'\n');
    return t.replace(TAG_RE,'');
  }
  function htmlToPlainText(raw){
    if(raw==null)return '';
    var s=String(raw);
    if(s.indexOf('<')<0&&s.indexOf('&')<0)return cleanRaw(s);
    s=decodeEntities(stripTags(s));
    // 解碼後可能又冒出標籤（&lt;p&gt; 這種二次編碼），再清一輪。
    if(TAG_RE.test(s)){TAG_RE.lastIndex=0;s=stripTags(s);}
    TAG_RE.lastIndex=0;
    return cleanRaw(s.replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/[ \t]*\n[ \t]*/g,'\n'));
  }
  function isBlank(n){
    if(n.nodeType===3)return !n.textContent.trim();
    if(n.nodeType===1){var t=n.tagName;if(t==='IMG'||t==='TABLE'||t==='IFRAME'||t==='VIDEO')return false;return !n.textContent.trim()&&!n.querySelector('img,table,iframe,video');}
    return true;
  }
  function setContent(el,raw){
    var cleaned=cleanRaw(raw);
    if(!cleaned){el.style.display='none';return;}
    if(window.DOMPurify&&DOMPurify.sanitize){el.innerHTML=DOMPurify.sanitize(cleaned,{USE_PROFILES:{html:true}});}
    else{
      // 沒有 DOMPurify 時不能直接把原始 HTML 塞進 textContent，
      // 否則使用者會看到字面的 <p>…</p>。
      el.textContent=htmlToPlainText(cleaned);
      el.style.whiteSpace='pre-wrap';
    }
    while(el.firstChild&&isBlank(el.firstChild))el.removeChild(el.firstChild);
    while(el.lastChild&&isBlank(el.lastChild))el.removeChild(el.lastChild);
    if(!el.childNodes.length)el.style.display='none';
  }
  function markRead(key,cb){
    fetch('/admin/api/bulletins/read',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key})})
      .then(function(r){return r.json().catch(function(){return{};});})
      .then(cb).catch(function(){cb({});});
  }
  // BULLETIN_TRANSLATE_V8：背景 job 輪詢。每個 HTTP 請求都是毫秒級，
  // 反向代理不會再因為「久等」而丟出沒有內容的 502。
  var POLL_MS=600, POLL_MAX=220;   // 約 2 分鐘上限
  function pollTranslate(jobId,total,btn,cardEl,footEl,onDone){
    var tries=0;
    (function tick(){
      tries++;
      if(tries>POLL_MAX){
        btn.disabled=false;btn.textContent='重試翻譯';
        showTranslateError(cardEl,footEl,{error:'翻譯逾時（前端等待超過上限）',status:0,code:'TRANSLATE_POLL_TIMEOUT',trace_id:jobId});
        return;
      }
      getJson('/admin/api/bulletins/translate/status?job='+encodeURIComponent(jobId),function(r){
        if(r.error&&r.state==null){
          btn.disabled=false;btn.textContent='重試翻譯';
          showTranslateError(cardEl,footEl,r);return;
        }
        if(r.state==='running'){
          var n=r.finished||0,t=r.total||total||1;
          btn.textContent='翻譯中… '+n+'/'+t;
          setTimeout(tick,POLL_MS);return;
        }
        btn.disabled=false;
        if(r.state==='failed'||!r.ok){
          btn.textContent='重試翻譯';
          showTranslateError(cardEl,footEl,r);return;
        }
        onDone(r);
      });
    })();
  }
  // BULLETIN_AI_SUMMARY_V1：與翻譯相同的「背景 job + 輪詢」模式，但走 AI 密鑰。
  function pollSummary(jobId,btn,cardEl,footEl,onDone){
    var tries=0;
    (function tick(){
      tries++;
      if(tries>POLL_MAX){
        btn.disabled=false;btn.textContent='重試摘要';
        showSummaryError(cardEl,footEl,{error:'摘要逾時（前端等待超過上限）',status:0,code:'SUMMARY_POLL_TIMEOUT'});
        return;
      }
      getJson('/admin/api/ai/chat/status?job='+encodeURIComponent(jobId),function(r){
        if(r.error&&r.state==null){
          btn.disabled=false;btn.textContent='重試摘要';
          showSummaryError(cardEl,footEl,r);return;
        }
        if(r.state==='running'){setTimeout(tick,POLL_MS);return;}
        btn.disabled=false;
        if(r.state==='failed'||!r.ok){
          btn.textContent='重試摘要';
          showSummaryError(cardEl,footEl,r);return;
        }
        onDone(r);
      });
    })();
  }
  function showSummaryError(cardEl,footEl,r){
    var old=cardEl.querySelector('.smbox');if(old)old.remove();
    var box=document.createElement('div');box.className='smbox';
    var lab=document.createElement('div');lab.className='smlab';lab.textContent='摘要失敗';
    box.appendChild(lab);
    var tx=document.createElement('div');tx.className='smtext';
    tx.textContent=(r.error||'未知錯誤')+(r.code?('（'+r.code+'）'):'');
    box.appendChild(tx);
    cardEl.insertBefore(box,footEl);
  }
  // BULLETIN_TRANSLATE_V6：翻譯失敗時把完整錯誤碼顯示在卡片裡，並可一鍵複製。
  function buildDiagnosticText(r){
    var lines=[];
    lines.push('【公告翻譯失敗診斷】');
    lines.push('時間：'+new Date().toISOString());
    lines.push('訊息：'+(r.error||'(無)'));
    lines.push('HTTP 狀態：'+(r.status||'(無回應)'));
    if(r.code)lines.push('錯誤碼：'+r.code);
    if(r.trace_id)lines.push('trace_id：'+r.trace_id+'（可在 /admin/logs 搜尋）');
    if(r.diagnostics&&r.diagnostics.length){
      lines.push('分段明細：');
      r.diagnostics.forEach(function(d){
        lines.push('  第 '+d.chunk+'/'+d.total+' 段｜'+d.bytes+' bytes｜'+(d.ok?'成功':'失敗')+
          '｜上游狀態 '+(d.status==null?'無':d.status)+'｜重試 '+d.attempts+' 次｜'+d.ms+' ms');
        if(d.error)lines.push('    原因：'+d.error);
        if(d.detail)lines.push('    上游回應：'+d.detail);
      });
    }
    if(r.raw){
      lines.push('原始回應（非 JSON）：');
      lines.push('  '+r.raw.replace(/\n/g,'\n  '));
    }
    lines.push('判讀：'+interpret(r));
    lines.push('頁面：'+location.href);
    lines.push('UA：'+navigator.userAgent);
    return lines.join('\n');
  }
  // BULLETIN_TRANSLATE_V7：把常見情境直接寫成人話，省去來回猜測。
  function interpret(r){
    var raw=String(r.raw||'');
    var cfEdge=/cloudflare|bad gateway|cf-ray/i.test(raw);
    if(r.code==='TRANSLATE_PANIC')return '本服務內部 panic（已攔截）。請到 /admin/logs 以 trace_id 搜尋 panic 詳情。';
    if(r.code==='TRANSLATE_TIMEOUT')return '本服務連得到但上游 Google 超過時間預算未回應（可能被限流）。';
    if(r.code==='TRANSLATE_UPSTREAM_FAILED')return '本服務有回應，是 Google 端失敗；看上面每段的「上游狀態」。';
    if((r.status===502||r.status===504)&&cfEdge)
      return '502/504 由 Cloudflare 邊緣產生，代表本服務在處理這個請求時「沒有吐出任何回應」'+
             '（程序被重啟／OOM、或 cloudflared 與 origin 之間斷線）。'+
             '請先按下方「自我檢測」，再到 /admin/logs 看有沒有「公告翻譯開始」這一行：'+
             '有 → 卡在上游或程序中斷；沒有 → 請求根本沒進到本服務。';
    if(r.status===0)return '請求沒有送達（網路中斷或被瀏覽器阻擋）。';
    return '未分類，請把本診斷全文回報。';
  }
  function runSelfTest(target){
    target.textContent='檢測中…';
    fetch('/admin/api/bulletins/translate/selftest',{credentials:'same-origin',cache:'no-store'})
      .then(function(r){return r.text().then(function(raw){
        var j=null;try{j=JSON.parse(raw);}catch(e){}
        if(r.status===401||r.status===403){target.textContent='自我檢測需要管理員權限。';return;}
        if(!j){target.textContent='自我檢測回應非 JSON（HTTP '+r.status+'）：'+raw.slice(0,300);return;}
        var out=['自我檢測：'+(j.ok?'✅ 有可用引擎':'❌ 全部不可用')];
        (j.engines||[]).forEach(function(e){
          out.push('  '+(e.ok?'✅':'❌')+' '+e.label+
            '｜'+e.elapsed_ms+' ms'+
            (e.status!=null?'｜HTTP '+e.status:'')+
            (e.cooling_before?'｜檢測前處於冷卻':'')+
            (e.ok?('｜樣本：'+e.sample):('｜'+(e.error||''))));
          if(!e.ok&&e.detail)out.push('      '+e.detail);
        });
        if(j.hint)out.push(j.hint);
        target.textContent=out.join('\n');
      });})
      .catch(function(e){target.textContent='自我檢測失敗：'+((e&&e.message)||e);});
  }
  function showTranslateError(cardEl,footEl,r){
    var old=cardEl.querySelector('.transerr');if(old)old.remove();
    var box=document.createElement('div');box.className='transerr';
    var head=document.createElement('div');head.className='transerrhead';
    head.textContent='翻譯失敗 · HTTP '+(r.status||'無回應')+(r.trace_id?(' · trace '+r.trace_id):'');
    box.appendChild(head);
    var msg=document.createElement('div');msg.className='transerrmsg';
    msg.textContent=buildDiagnosticText(r);
    box.appendChild(msg);
    var row=document.createElement('div');row.className='transerrrow';
    var copy=document.createElement('button');copy.type='button';copy.className='readbtn';copy.textContent='複製診斷';
    copy.onclick=function(){
      var t=buildDiagnosticText(r);
      function done(){copy.textContent='已複製 ✓';setTimeout(function(){copy.textContent='複製診斷';},1600);}
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(done,function(){fallback(t,done);});
      }else{fallback(t,done);}
    };
    function fallback(t,done){
      var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);
      ta.select();try{document.execCommand('copy');done();}catch(e){}
      document.body.removeChild(ta);
    }
    var selftest=document.createElement('button');selftest.type='button';selftest.className='readbtn';selftest.textContent='自我檢測';
    var stOut=document.createElement('div');stOut.className='transerrmsg';stOut.style.marginTop='6px';
    selftest.onclick=function(){runSelfTest(stOut);};
    var close=document.createElement('button');close.type='button';close.className='readbtn';close.textContent='關閉';
    close.onclick=function(){box.remove();};
    row.appendChild(copy);row.appendChild(selftest);row.appendChild(close);
    box.appendChild(row);box.appendChild(stOut);
    cardEl.insertBefore(box,footEl);
  }
  // ===== BULLETIN_PANEL_V1（fix53）：公告改成作業頁那樣的「面板內開啟」 =====
  // 舊版是 `window.open('/admin/tc-go?kind=bulletin','_blank')`：開新分頁、走面板代理
  // （代理會動到瀏覽器 cookie，fix38 事故的來源），而且代理只能帶到「公告列表」，
  // 看不到是哪一則。
  //
  // 現在跟作業頁（HOMEWORK_DETAIL_V1，fix41 方案 B）同一種顯示方式：
  //   卡片上「📄 內容」→ 面板內彈窗（標題／課程／日期／作者＋完整內容）
  //   同一門課的其他公告放在下方清單，可直接切換，不必關掉再點一次
  //   彈窗底部「✓ 已閱讀」= 舊版行為（標記已讀後卡片淡出）
  //   拿不到 iClass 網址時按鈕直接隱藏（不給一顆按了會壞的按鈕）
  var panel={open:false,key:null,course:''};
  // iClass 公告沒有穩定的單則深連結，因此不提供「在 iClass 開啟」（與舊版一致）。
  // 這裡的常數是為了讓「以後有深連結時只需要改這一行」。
  var BULLETIN_DEEP_LINK='';
  function panelById(k){for(var i=0;i<all.length;i++){if(all[i].key===k)return all[i];}return null;}
  function panelSame(course){
    if(!course)return [];
    return all.filter(function(x){return x.course_name===course;}).sort(function(a,b){return (b.ts||0)-(a.ts||0);});
  }
  function isImgPlaceholder(src){
    src=String(src||'');
    return !src||src.indexOf('data:')===0||src.indexOf('cid:')===0||/^about:|^javascript:/i.test(src);
  }
  function closePanel(){
    var b=document.getElementById('blPanel');if(!b)return;
    attCloseView();
    b.remove();
    panel.open=false;panel.key=null;panel.course='';
    document.body.style.overflow='';
    document.removeEventListener('keydown',panelEsc);
  }
  function panelEsc(ev){
    if(ev.key!=='Escape')return;
    // BULLETIN_ATTACHMENT_V1（fix55）：正在看附件時，Esc 先回到公告內容。
    if(attView){attCloseView();renderPanel();return;}
    closePanel();
  }
  function togglePanelRead(){
    var it=panelById(panel.key);if(!it)return;
    if(it.read){renderPanel();return;}   // 已讀（含 admin 公告）→ 沒有「取消已讀」的端點，維持原狀
    var btn=document.getElementById('blpRead');
    if(btn){btn.disabled=true;}
    markRead(it.key,function(){it.read=true;render();renderPanel();});
  }
  function renderPanel(){
    var it=panelById(panel.key);
    if(!it){closePanel();return;}
    var title=document.getElementById('blpTitle'),meta=document.getElementById('blpMeta'),
        body=document.getElementById('blpBody'),host=document.getElementById('blpHost'),
        sub=document.getElementById('blpSub'),read=document.getElementById('blpRead');
    if(!title||!body||!host)return;
    title.textContent=it.title||'(無標題)';
    // BULLETIN_ATTACHMENT_V1（fix55）：正在預覽附件時，同一個面板換成檢視器。
    if(attView){
      host.innerHTML='';
      body.scrollTop=0;
      renderAttViewer(it,host,sub,read);
      return;
    }
    var m=[];
    if(it.course_name)m.push(it.course_name);
    if(it.author)m.push(it.author);
    m.push(it.ts?fmtDate(it.ts):'');
    meta.textContent=m.filter(Boolean).join(' ・ ');
    // PANEL_HOST_V1：只清「內容容器」——清整個 body 會把下方的
    // 「同一門課的其他公告」清單（blpSub）一起清掉，切換公告後清單就消失了。
    host.innerHTML='';
    body.scrollTop=0;
    var ct=document.createElement('div');ct.className='content blp-content';
    // 與卡片同一套消毒流程（DOMPurify；沒有時退成純文字）——單一來源，不另寫一份。
    setContent(ct,it.content);
    host.appendChild(ct);
    // 圖片在面板內拿不到（需要 iClass 的 session 與相對路徑）：與作業頁一樣
    // 移除破圖，改留一行說明，避免一片破圖。說明是「有圖真的載不到」才出現，
    // 圖片正常載入時不會多一行贅字。
    var broken=0,note=null;
    var addBroken=function(n){
      broken+=n;
      if(!note){
        note=document.createElement('div');note.className='blp-imgfail';
        host.appendChild(note);
      }
      note.textContent='此公告含圖片，面板內無法顯示（'+broken+' 張）——需要圖片時請到 iClass 課程公告頁查看。';
    };
    Array.prototype.forEach.call(ct.querySelectorAll('img'),function(im){
      if(isImgPlaceholder(im.getAttribute('src'))){im.remove();addBroken(1);return;}
      im.referrerPolicy='no-referrer';
      im.addEventListener('error',function(){if(im.parentNode){im.parentNode.removeChild(im);}addBroken(1);});
    });
    // 同一門課的其他公告：面板內就近切換，不必關掉再點一次。
    var same=panelSame(it.course_name).filter(function(x){return x.key!==it.key;});
    // 附件（有的公告才有）：列出名稱／大小，可預覽或下載。
    var atts=it.attachments||[];
    if(atts.length){
      host.appendChild(attSection(atts));
    }
    sub.innerHTML='';
    if(same.length){
      var head=document.createElement('div');head.className='blp-subhead';
      head.textContent='同一門課的其他公告（'+same.length+'）';
      sub.appendChild(head);
      same.slice(0,30).forEach(function(x){
        var b=document.createElement('button');b.type='button';
        b.className='blp-item'+(x.read?'':' unread');
        var t=document.createElement('span');t.textContent=x.title||'(無標題)';
        var d=document.createElement('span');d.className='d';d.textContent=rel(x.ts);
        b.appendChild(t);b.appendChild(d);
        b.onclick=function(){panel.key=x.key;renderPanel();};
        sub.appendChild(b);
      });
    }
    if(read){
      if(it.read){read.textContent='已閱讀 ✓';read.disabled=true;}
      else{read.textContent='✓ 已閱讀';read.disabled=false;}
    }
  }
  function openPanel(it){
    if(!it)return;
    panel.open=true;panel.key=it.key;panel.course=it.course_name||'';
    var old=document.getElementById('blPanel');
    if(old)old.remove();
    var back=document.createElement('div');back.className='blp-back';back.id='blPanel';
    back.addEventListener('click',function(ev){if(ev.target===back)closePanel();});
    var box=document.createElement('div');box.className='blp-box';
    var head=document.createElement('div');head.className='blp-head';
    var t=document.createElement('div');t.className='blp-title';t.id='blpTitle';
    var m=document.createElement('div');m.className='blp-meta';m.id='blpMeta';
    var x=document.createElement('button');x.type='button';x.className='blp-x';x.textContent='✕ 關閉';
    x.title='關閉（Esc）';x.onclick=closePanel;
    head.appendChild(t);head.appendChild(m);head.appendChild(x);
    var body=document.createElement('div');body.className='blp-body';body.id='blpBody';
    var host=document.createElement('div');host.id='blpHost';host.className='blp-host';
    var sub=document.createElement('div');sub.className='blp-sub';sub.id='blpSub';
    body.appendChild(host);body.appendChild(sub);
    // BULLETIN_MOBILE_V1（fix56）：頁碼跟著捲動更新。監聽器綁在面板自己的捲動
    // 容器上——面板關閉時整個節點一起消失，不必（也不會漏）事後移除。
    body.addEventListener('scroll', attOnBodyScroll, {passive:true});
    var dl=document.createElement('div');dl.className='blp-foot';
    var sp=document.createElement('span');sp.className='spacer';
    var rd=document.createElement('button');rd.type='button';rd.className='readbtn';rd.id='blpRead';
    rd.onclick=togglePanelRead;
    var cl=document.createElement('button');cl.type='button';cl.className='readbtn';cl.textContent='關閉';cl.onclick=closePanel;
    dl.appendChild(sp);dl.appendChild(rd);dl.appendChild(cl);
    // 有深連結時才放（目前 BULLETIN_DEEP_LINK 為空 → 按鈕不會出現）。
    // 用 <a target=_blank rel=noopener> 而不是 window.open：面板本身不需要
    // 任何開新視窗的程式碼，也就沒有「不小心又繞回代理」的空間。
    if(BULLETIN_DEEP_LINK){
      var go=document.createElement('a');
      go.className='readbtn';go.id='blpGo';
      go.href=BULLETIN_DEEP_LINK;go.target='_blank';go.rel='noopener';
      go.textContent='在 iClass 開啟 ↗';
      dl.appendChild(go);
    }
    box.appendChild(head);box.appendChild(body);box.appendChild(dl);
    back.appendChild(box);document.body.appendChild(back);
    document.body.style.overflow='hidden';
    document.addEventListener('keydown',panelEsc);
    renderPanel();
  }
  // ===== BULLETIN_ATTACHMENT_V1（fix55）：公告附件 =====
  // 公告若有附件（iClass 的 `uploads`），在面板內直接列出名稱／大小，並可
  //   預覽：PDF（PDF.js，與教材頁同一支按需載入器）、圖片、純文字／CSV
  //   下載：走同一個代理端點（disposition=attachment）
  // 位元組一律由面板伺服器用「已保存的 iClass session」代抓——瀏覽器不碰 iClass。
  var PREVIEW_IMAGE_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'svg', 'avif'];
  var PREVIEW_TEXT_EXTS = ['txt', 'log', 'md', 'json', 'xml', 'yaml', 'yml', 'ini', 'conf',
                           'csv', 'tsv', 'html', 'htm', 'css', 'js', 'sh', 'py', 'rs', 'java', 'c', 'cpp'];
  var PREVIEW_BYTES_MAX = 32 * 1024 * 1024;
  var PDF_RENDER_CONCURRENCY = 2;
  // BULLETIN_MOBILE_V1（fix56）：手機的裝置像素比常是 3，一頁 A4 畫布就要 ~8 MB，
  // 十幾頁的 PDF 會把行動裝置的分頁記憶體吃爆（iOS 直接重新載入整頁）。
  // 窄螢幕上限 2 倍——肉眼幾乎看不出差別，記憶體少一半以上。
  var PDF_RATIO_MAX_MOBILE = 2;
  // 窄螢幕先畫前面幾頁就好，其餘「捲到附近才畫」：長 PDF 不必一次畫完（桌機不變）。
  var PDF_EAGER_PAGES_MOBILE = 3;
  var PDF_LAZY_MARGIN = '700px 0px';
  // 是不是手機（面板的 640px 斷點）。用函式而非常數：轉向或改視窗大小要跟著變。
  function attNarrow(){
    return !!(window.matchMedia && window.matchMedia('(max-width:640px)').matches);
  }
  var attView = null;     // 目前正在預覽的附件（null＝顯示公告內容）
  var attToken = 0;       // 世代：離開預覽時 +1，舊的非同步工作即停手
  var attPdfTasks = [];
  var attPdfDoc = null;
  var attPdfWrap = null;      // 目前的 .blp-pdf 容器（重畫時整塊換掉）
  var attPdfSlots = [];       // 每頁一個插槽（頁碼／翻頁／延遲渲染都看這個）
  var attPdfWidth = 0;        // 目前畫的目標寬度（轉向後寬度差太多就重畫）
  var attPdfObserver = null;  // 延遲渲染用（捲到附近才畫那一頁）
  var attPdfCur = 1;          // 目前看到第幾頁（給頁碼與翻頁用）

  function attExt(name){
    var m = /\.([A-Za-z0-9]+)$/.exec(String(name || ''));
    return m ? m[1].toLowerCase() : '';
  }
  // 附件端點：cookie 帶面板 session；name 只當顯示與副檔名推斷用。
  function attUrl(a, inline){
    var u = '/admin/api/bulletins/attachment?upload_id=' + encodeURIComponent(a.id) +
            '&name=' + encodeURIComponent(a.name || '');

  }
  function attKind(a){
    var e = attExt(a.name);
    if (e === 'pdf') return 'pdf';
    if (PREVIEW_IMAGE_EXTS.indexOf(e) >= 0) return 'image';
    if (PREVIEW_TEXT_EXTS.indexOf(e) >= 0) return 'text';
    return 'other';
  }
  function attStopPdf(){
    attPdfTasks.forEach(function(t){ try { t.cancel(); } catch(_) {} });
    attPdfTasks = [];
    if (attPdfObserver){ try { attPdfObserver.disconnect(); } catch(_) {} attPdfObserver = null; }
    attPdfSlots = [];
    attPdfWrap = null;
    attPdfWidth = 0;
    attPdfCur = 1;
    var pg = document.getElementById('blpAttPager');
    if (pg) pg.style.display = 'none';
    if (attPdfDoc){ try { attPdfDoc.destroy(); } catch(_) {} attPdfDoc = null; }
  }
  // 離開預覽：停掉渲染、釋放文件與畫布（與教材頁 PREVIEW_CANCEL_V1 同一套理由）。
  function attCloseView(){
    attToken++;
    attStopPdf();
    attView = null;
  }
  // 用 XHR 抓位元組：可以顯示進度，且與教材頁的取檔路徑語意一致。
  function attFetchBytes(a, onProgress){
    return new Promise(function(resolve, reject){
      var xhr = new XMLHttpRequest();
      xhr.open('GET', attUrl(a, true), true);
      xhr.responseType = 'arraybuffer';
      xhr.onprogress = function(ev){
        if (onProgress && ev && ev.lengthComputable) onProgress(ev.loaded, ev.total);

        if (xhr.status >= 200 && xhr.status < 300 && xhr.response){

          var msg = '';
          try { msg = (JSON.parse(xhr.responseText || '{}').error) || ''; } catch(_) {}
          reject(new Error(msg || ('HTTP ' + xhr.status)));
        }

      xhr.onerror = function(){ reject(new Error('網路連線中斷')); };
      xhr.onabort = function(){ reject(new Error('已取消')); };

  function attSizeLabel(n){
    n = Number(n || 0);
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }
  // 逐頁渲染 PDF：先畫第一頁（使用者立刻看到內容），其餘 2 路並行背景補齊。
  // BULLETIN_MOBILE_V1（fix56）：真正畫圖的部份拆成 attLayoutPdf —— 轉向或改視窗
  // 大小時，用同一支以新寬度重畫（檔案不用重抓），兩邊不會各寫一套。
  async function attRenderPdf(bytes, mine, host){
    if (window.__tronEnsureFileLib) await window.__tronEnsureFileLib('pdf');
    if (mine !== attToken) return;
    if (!window.pdfjsLib) throw new Error('PDF 檢視器未載入');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = '/admin/static/js/pdf.worker.min.js?v=pdfjs1';
    // PDF.js 會把 ArrayBuffer 轉移（detach）給 worker，因此傳副本。
    var doc = await window.pdfjsLib.getDocument({ data: bytes.slice(), isEvalSupported: false }).promise;
    if (mine !== attToken){ try { doc.destroy(); } catch(_) {} return; }
    if (attPdfDoc){ try { attPdfDoc.destroy(); } catch(_) {} }
    attPdfDoc = doc;
    await attLayoutPdf(doc, host, mine);
  }
  // 以「目前的容器寬度」把每一頁畫成畫布。
  //   · 首頁先畫（立刻看到內容）→ 其餘照原樣 2 路背景補齊
  //   · 窄螢幕：先畫前 PDF_EAGER_PAGES_MOBILE 頁，剩下的捲到附近才畫
  //   · 每頁一個插槽並先給佔位高度，捲軸與頁碼不會因為還沒畫而亂跳
  async function attLayoutPdf(doc, host, mine){
    if (attPdfObserver){ try { attPdfObserver.disconnect(); } catch(_) {} attPdfObserver = null; }
    // 只換掉上一次的 PDF 區塊：host 裡還有工具列（返回公告／下載）與狀態列。
    var oldWrap = host.querySelector('.blp-pdf');
    if (oldWrap) oldWrap.remove();
    var wrap = document.createElement('div'); wrap.className = 'blp-pdf';
    host.appendChild(wrap);
    var narrow = attNarrow();
    // 手機把寬度讓給內容（面板左右只留 10px），桌機沿用原本的 24px 內縮。
    var targetWidth = Math.max(narrow ? 240 : 280, (host.clientWidth || 640) - (narrow ? 0 : 24));
    var ratio = window.devicePixelRatio || 1;
    if (narrow) ratio = Math.min(ratio, PDF_RATIO_MAX_MOBILE);
    // 每頁一個 display:flex 的插槽：canvas 置中，捲動與頁碼可以定到「某一頁」。
    var slots = [];
    for (var i = 0; i < doc.numPages; i++){
      var slot = document.createElement('div'); slot.className = 'blp-pdf-page';
      wrap.appendChild(slot); slots.push(slot);
    }
    attPdfWrap = wrap; attPdfSlots = slots; attPdfWidth = targetWidth;
    var painted = [];
    var paint = async function(pageNo){
      var slot = slots[pageNo - 1];
      if (mine !== attToken || painted[pageNo - 1] || !slot) return;
      painted[pageNo - 1] = true;   // 同步先占位：同一頁不會被並行的兩路各畫一次
      var page = await doc.getPage(pageNo);
      if (mine !== attToken) return;
      var base = page.getViewport({ scale: 1 });
      var vp = page.getViewport({ scale: targetWidth / base.width });
      var canvas = document.createElement('canvas');
      canvas.width = Math.floor(vp.width * ratio);
      canvas.height = Math.floor(vp.height * ratio);
      canvas.style.width = Math.floor(vp.width) + 'px';
      canvas.style.height = 'auto';
      slot.style.minHeight = Math.floor(vp.height) + 'px';
      slot.appendChild(canvas);
      var task = page.render({
        canvasContext: canvas.getContext('2d'), viewport: vp,
        transform: ratio !== 1 ? [ratio, 0, 0, ratio, 0, 0] : null
      });
      attPdfTasks.push(task);
      try { await task.promise; } finally {
        attPdfTasks = attPdfTasks.filter(function(t){ return t !== task; });
      }
    };
    await paint(1);
    if (mine !== attToken) return;
    // BULLETIN_MOBILE_V1（fix56）：還沒畫的頁面也要佔位 —— 先用第一頁量到的比例給
    // 其他插槽估計高度（畫到那一頁時會被實際值覆蓋）。少了這一步，背景補頁會讓
    // 整份文件的長度一直變長，捲軸位置與頁碼都會跟著跳。
    var estSlotHeight = parseFloat(slots[0] && slots[0].style.minHeight) || 0;
    if (estSlotHeight > 0){
      for (var e = 1; e < slots.length; e++){
        if (!slots[e].style.minHeight) slots[e].style.minHeight = Math.floor(estSlotHeight) + 'px';
      }
    }
    var eagerEnd = doc.numPages;
    if (narrow && PDF_EAGER_PAGES_MOBILE > 0) eagerEnd = Math.min(doc.numPages, PDF_EAGER_PAGES_MOBILE);
    if (eagerEnd > 1){
      var cursor = 2;
      var fill = async function(){
        while (mine === attToken && cursor <= eagerEnd){
          var pageNo = cursor++;
          try { await paint(pageNo); } catch(_) { if (mine !== attToken) return; }
        }
      };
      var workers = [];
      var count = Math.min(PDF_RENDER_CONCURRENCY, eagerEnd - 1);
      for (var w = 0; w < count; w++) workers.push(fill());
      Promise.all(workers).catch(function(){});
    }
    // 還沒畫的頁面：捲到附近才畫（沒有 IntersectionObserver 就照舊全部畫完）。
    if (eagerEnd < doc.numPages){
      if (window.IntersectionObserver){
        var body = document.getElementById('blpBody');
        attPdfObserver = new window.IntersectionObserver(function(entries){
          entries.forEach(function(en){
            if (!en.isIntersecting || mine !== attToken) return;
            var idx = slots.indexOf(en.target);
            if (idx < 0) return;
            attPdfObserver.unobserve(en.target);
            paint(idx + 1).catch(function(){});
          });
        }, { root: body || null, rootMargin: PDF_LAZY_MARGIN });
        for (var k = eagerEnd; k < doc.numPages; k++) attPdfObserver.observe(slots[k]);
      } else {
        var rest = eagerEnd + 1;
        var fillRest = async function(){
          while (mine === attToken && rest <= doc.numPages){
            var pageNo = rest++;
            try { await paint(pageNo); } catch(_) { if (mine !== attToken) return; }
          }
        };
        var rw = [], rc = Math.min(PDF_RENDER_CONCURRENCY, doc.numPages - eagerEnd);
        for (var r = 0; r < rc; r++) rw.push(fillRest());
        Promise.all(rw).catch(function(){});
      }
    }
    attPdfCur = 1;
    var pager = document.getElementById('blpAttPager');
    if (pager) pager.style.display = '';
    attSyncPdfPage();
  }
  // 捲動時更新「第 n / N 頁」：長 PDF 在手機上最需要的資訊（還有多長、現在在哪）。
  function attSyncPdfPage(){
    if (!attPdfSlots.length) return;
    var info = document.getElementById('blpAttPage');
    var body = document.getElementById('blpBody');
    if (!info || !body) return;
    // 黏著工具列（手機）會蓋住頂端約 56px，判定線往下挪才不會慢一頁。
    var line = body.getBoundingClientRect().top + 60;
    var cur = 1;
    for (var i = 0; i < attPdfSlots.length; i++){
      var el = attPdfSlots[i];
      if (!el) continue;
      if (el.getBoundingClientRect().top <= line) cur = i + 1;
    }
    attPdfCur = cur;
    info.textContent = '第 ' + cur + ' / ' + attPdfSlots.length + ' 頁';
  }
  var attScrollTick = false;
  function attOnBodyScroll(){
    if (attScrollTick) return;   // 一格動畫最多更新一次（捲動事件非常密集）
    attScrollTick = true;
    var run = function(){ attScrollTick = false; attSyncPdfPage(); };
    if (window.requestAnimationFrame) window.requestAnimationFrame(run); else setTimeout(run, 60);
  }
  // 上一頁／下一頁：直接捲到目標頁開頭（面板底部被系統手勢區佔住時特別好用）。
  function attStepPdf(delta){
    if (!attPdfSlots.length) return;
    attSyncPdfPage();
    var target = attPdfCur + delta;
    if (target < 1) target = 1;
    if (target > attPdfSlots.length) target = attPdfSlots.length;
    // 已經在第一頁／最後一頁：不做事（連按不要每次都白捲一次）。
    if (target === attPdfCur) return;
    var el = attPdfSlots[target - 1];
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' });
    attPdfCur = target;
  }
  // 轉向／改視窗大小：頁面寬度跟著變（手機橫放最明顯），用新寬度重畫同一份文件。
  // 只有「寬度差超過 48px」才動 —— iOS 網址列伸縮造成的小幅變動不重畫。
  var attReflowTimer = null;
  function attReflowPdf(){
    if (!attPdfDoc || !attPdfWrap) return;
    if (attReflowTimer) clearTimeout(attReflowTimer);
    attReflowTimer = setTimeout(function(){
      attReflowTimer = null;
      var host = document.getElementById('blpHost');
      if (!attPdfDoc || !attPdfWrap || !host) return;
      var want = Math.max(attNarrow() ? 240 : 280,
                          (host.clientWidth || 640) - (attNarrow() ? 0 : 24));
      if (Math.abs(want - attPdfWidth) < 48) return;
      attRepaintPdf(host);
    }, 260);
  }
  // 重畫（不重新下載檔案）：世代 +1 讓進行中的渲染全部作廢，再以目前寬度畫一次。
  function attRepaintPdf(host){
    var doc = attPdfDoc;
    if (!doc || !host) return;
    var mine = ++attToken;
    attPdfTasks.forEach(function(t){ try { t.cancel(); } catch(_) {} });
    attPdfTasks = [];
    attLayoutPdf(doc, host, mine).catch(function(){});
  }
  // 轉向／改視窗大小都走同一支（沒有 PDF 在畫時直接返回，不會做白工）。
  window.addEventListener('resize', attReflowPdf);
  window.addEventListener('orientationchange', attReflowPdf);
  // 在面板內預覽單一附件。
  async function attOpenView(a){
    if (!a) return;
    attCloseView();
    attView = a;
    var mine = attToken;
    var kind = attKind(a);
    renderPanel();                       // 由 renderPanel 依 attView 畫出檢視器
    var host = document.getElementById('blpHost');
    var status = document.getElementById('blpAttStatus');
    if (!host) return;
    if (status) status.textContent = '';
    try {
      if (kind === 'image'){
        var img = document.createElement('img');
        img.className = 'blp-att-img';
        img.alt = a.name || '';
        img.src = attUrl(a, true);
        if (status) status.textContent = '按 Esc 或「← 返回公告」回到公告內容';
        host.appendChild(img);
        return;
      }
      if (kind === 'text'){
        if (status) status.textContent = '正在載入附件…';
        var res = await fetch(attUrl(a, true), { credentials: 'same-origin' });
        if (mine !== attToken) return;
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var text = await res.text();
        if (mine !== attToken) return;
        // 一律以純文字顯示（HTML／JS 也只看原始碼，不會被執行）。
        var pre = document.createElement('pre');
        pre.className = 'blp-att-pre';
        pre.textContent = text;
        host.appendChild(pre);
        if (status) status.textContent = '';
        return;
      }
      if (kind === 'pdf'){
        var bytes = await attFetchBytes(a, function(loaded, total){
          if (mine !== attToken || !status) return;
          var pct = total ? Math.floor(loaded * 100 / total) : 0;

        if (bytes.length > PREVIEW_BYTES_MAX) throw new Error('檔案過大，請按「下載」查看');

        if (status && mine === attToken) status.textContent = '';
        return;
      }
      // 其他格式：面板內無法解析，給明確說明＋下載（不開新分頁，維持面板內操作）。
      if (status) status.textContent = '這種格式（.' + (attExt(a.name) || '?') + '）無法在面板內預覽，請按「下載」用本機程式開啟。';
    } catch(err) {
      if (mine !== attToken) return;
      if (status) status.textContent = '無法預覽附件：' + ((err && err.message) || err);
    }
  }

  // 附件列表（公告內文下方）：名稱／大小＋預覽／下載。沒有附件時整段不出現。
  function attSection(atts){
    var box=document.createElement('div');box.className='blp-att';
    var head=document.createElement('div');head.className='blp-subhead';
    head.textContent='附件（'+atts.length+'）';
    box.appendChild(head);
    atts.forEach(function(a){
      var row=document.createElement('div');row.className='blp-att-row';
      var ext=document.createElement('span');ext.className='blp-att-ext';
      ext.textContent=(attExt(a.name)||'FILE').toUpperCase().slice(0,5);
      var name=document.createElement('span');name.className='blp-att-name';
      name.textContent=a.name||('附件-'+a.id);
      var size=document.createElement('span');size.className='blp-att-size';
      size.textContent=a.size_label||attSizeLabel(a.size);
      var acts=document.createElement('span');acts.className='blp-att-acts';
      // 面板內解析不了的格式就不給「預覽」按鈕（不給按了沒用的東西）。
      if(attKind(a)!=='other'){
        var pv=document.createElement('button');pv.type='button';pv.className='blp-att-btn';
        pv.textContent='👁 預覽';pv.onclick=function(){attOpenView(a);};
        acts.appendChild(pv);
      }
      var dl=document.createElement('a');dl.className='blp-att-btn';dl.textContent='⬇ 下載';
      dl.href=attUrl(a,false);dl.setAttribute('download',a.name||'');dl.rel='noopener';
      acts.appendChild(dl);
      row.appendChild(ext);row.appendChild(name);row.appendChild(size);row.appendChild(acts);
      box.appendChild(row);
    });
    return box;
  }
  // 附件檢視器：面板內換頁顯示（工具列：返回公告／檔名／下載），同課清單先收起。
  function renderAttViewer(it, host, sub, read){
    var a=attView;
    if(!a){renderPanel();return;}
    sub.innerHTML='';
    var bar=document.createElement('div');bar.className='blp-att-bar';
    var back=document.createElement('button');back.type='button';back.className='blp-att-btn';
    back.textContent='← 返回公告';back.onclick=function(){attCloseView();renderPanel();};
    var name=document.createElement('span');name.className='blp-att-name';name.textContent=a.name||'';
    var dl=document.createElement('a');dl.className='blp-att-btn';dl.textContent='⬇ 下載';
    dl.href=attUrl(a,false);dl.setAttribute('download',a.name||'');dl.rel='noopener';
    bar.appendChild(back);bar.appendChild(name);bar.appendChild(dl);
    // PDF 才給頁碼與翻頁（其他格式沒有「頁」的概念）；頁數要等文件載入才知道，
    // 因此先建好、預設隱藏，attLayoutPdf 載入完成後再顯示。
    if(attKind(a)==='pdf'){
      var pager=document.createElement('span');pager.className='blp-att-pager';pager.id='blpAttPager';
      pager.style.display='none';
      var prev=document.createElement('button');prev.type='button';prev.className='blp-att-btn';
      prev.textContent='↑ 上一頁';prev.onclick=function(){attStepPdf(-1);};
      var info=document.createElement('span');info.className='blp-att-info';info.id='blpAttPage';
      info.textContent='第 1 頁';
      var next=document.createElement('button');next.type='button';next.className='blp-att-btn';
      next.textContent='↓ 下一頁';next.onclick=function(){attStepPdf(1);};
      pager.appendChild(prev);pager.appendChild(info);pager.appendChild(next);
      bar.appendChild(pager);
    }
    host.appendChild(bar);
    var st=document.createElement('div');st.className='blp-att-status';st.id='blpAttStatus';
    st.textContent='正在載入附件…';
    host.appendChild(st);
    // 檢視附件時先把「已閱讀」停用：避免誤按造成畫面重畫、把檢視器蓋掉。
    if(read){read.disabled=true;}
  }
  function card(it){
    var c=document.createElement('article');c.className='card'+(it.read?' read':'');
    var r1=document.createElement('div');r1.className='row1';
    if(it.course_name){var b=document.createElement('span');b.className='badge';b.textContent=it.course_name;r1.appendChild(b);}
    if(it.pinned){var p=document.createElement('span');p.className='pin';p.textContent='置頂';r1.appendChild(p);}
    if(!it.read&&isNew(it)){var nw=document.createElement('span');nw.className='new';nw.textContent='NEW';r1.appendChild(nw);}
    var dt=document.createElement('span');dt.className='date';dt.textContent=fmtDate(it.ts);r1.appendChild(dt);
    c.appendChild(r1);
    var h=document.createElement('h2');h.textContent=it.title||'(無標題)';c.appendChild(h);
    var m=document.createElement('div');m.className='meta';var meta=[];if(it.author)meta.push(it.author);meta.push(rel(it.ts));m.textContent=meta.join('・');c.appendChild(m);
    var ct=document.createElement('div');ct.className='content';setContent(ct,it.content);c.appendChild(ct);
    var foot=document.createElement('div');foot.className='cardfoot';
    var sp=document.createElement('span');sp.className='spacer';foot.appendChild(sp);
    // BULLETIN_AI_SUMMARY_V1：一則公告一個「摘要」按鈕，點擊後把標題＋正文濃縮。
    var sm=document.createElement('button');sm.type='button';sm.className='smbtn';sm.textContent='摘要';
    sm.onclick=function(){
      var box=c.querySelector('.smbox');
      if(box){box.remove();sm.classList.remove('on');sm.textContent='摘要';return;}
      sm.disabled=true;sm.textContent='摘要中…';
      // 用純文字（標題＋正文）送給 AI；保持精簡、去掉過長的空白。
      var src=(htmlToPlainText(it.title||'')+'\n'+htmlToPlainText(it.content||'')).trim();
      if(!src){sm.disabled=false;sm.textContent='摘要';return;}
      postJson('/admin/api/ai/summarize',{text:src},function(r){
        if(r.error){sm.disabled=false;sm.textContent='重試摘要';showSummaryError(c,foot,r);return;}
        if(r.job_id){pollSummary(r.job_id,sm,c,foot,renderSummary);return;}
        sm.disabled=false;renderSummary(r);
      });
      function renderSummary(r){
        sm.disabled=false;sm.classList.add('on');sm.textContent='收起摘要';
        var d=document.createElement('div');d.className='smbox';
        var lab=document.createElement('div');lab.className='smlab';
        lab.textContent='⚡ 重點摘要'+(r.model?(' · '+r.model):'');
        d.appendChild(lab);
        var tx=document.createElement('div');tx.className='smtext';
        tx.textContent=r.text||'（沒有產生內容）';
        d.appendChild(tx);
        if(r.key_name){
          var meta=document.createElement('div');meta.className='smmeta';
          meta.textContent='由「'+r.key_name+'」生成';
          d.appendChild(meta);
        }
        c.insertBefore(d,foot);
        // 摘要框出現後滾到可見位置。
        if(d.scrollIntoView)d.scrollIntoView({block:'nearest'});
      }
    };
    foot.appendChild(sm);
    // BULLETIN_PANEL_V1（fix53）：改成作業頁那樣的「面板內開啟」。
    // 舊版是 window.open('/admin/tc-go?kind=bulletin','_blank')——開新分頁、走面板代理
    // （代理會動到瀏覽器 cookie，fix38 事故的來源），而且只能到列表、看不到是哪一則。
    var ic=document.createElement('button');ic.type='button';ic.className='tcinfo';
    ic.textContent='📄 內容';ic.title='在面板內看這則公告的完整內容（不開新分頁、不需登入 iClass）';
    ic.onclick=function(){openPanel(it);};
    foot.appendChild(ic);
    // BULLETIN_TRANSLATE_V1
    var tr=document.createElement('button');tr.type='button';tr.className='trbtn';tr.textContent='翻譯';
    tr.onclick=function(){
      var box=c.querySelector('.transbox');
      if(box){box.remove();tr.textContent='翻譯';return;}
      tr.disabled=true;tr.textContent='翻譯中…';
      var src=(htmlToPlainText(it.title||'')+'\n'+htmlToPlainText(it.content||'')).trim();
      // BULLETIN_TRANSLATE_ZH_V1: 所有公告一律翻譯成繁體中文。
      // BULLETIN_TRANSLATE_V8：後端改為背景 job，這裡送出後改用輪詢取進度／結果。
      postJson('/admin/api/bulletins/translate',{text:src,tl:'zh-TW'},function(r){
        if(r.error){tr.disabled=false;tr.textContent='重試翻譯';showTranslateError(c,foot,r);return;}
        if(r.job_id&&r.translated==null){pollTranslate(r.job_id,r.total||r.chunks||1,tr,c,foot,renderTranslation);return;}
        tr.disabled=false;renderTranslation(r);
      });
      function renderTranslation(r){
        tr.disabled=false;tr.textContent='收起翻譯';
        var d=document.createElement('div');d.className='transbox';
        var lab=document.createElement('div');lab.className='translab';
        var eng=r.engine?('·'+r.engine):'';
        var cached=r.cached?'·快取':'';
        lab.textContent=(r.tl==='en'?'翻譯（英文':'翻譯（繁體中文')+eng+cached+'）';
        // BULLETIN_TRANSLATE_V4：分段翻譯時若有片段失敗，明確告知（該段保留原文）。
        if(r.partial&&r.note){
          var warn=document.createElement('div');
          warn.style.cssText='font-size:11px;font-weight:600;color:var(--warn);margin-bottom:4px';
          warn.textContent='⚠ '+r.note;
          d.appendChild(lab);d.appendChild(warn);
        }else{
          d.appendChild(lab);
        }
        var tx=document.createElement('div');tx.textContent=htmlToPlainText(r.translated||'');d.appendChild(tx);
        c.insertBefore(d,foot);
      }
    };
    foot.appendChild(tr);
    if(isAdmin&&it.source==='admin'){
      var del=document.createElement('button');del.type='button';del.className='delbtn';del.textContent='刪除';
      del.onclick=function(){if(!confirm('確定刪除這則管理員公告？'))return;del.disabled=true;delApi(it.id,function(){all=all.filter(function(x){return x.key!==it.key;});render();});};
      foot.appendChild(del);
    }
    if(!it.read){
      var btn=document.createElement('button');btn.type='button';btn.className='readbtn';btn.textContent='✓ 已閱讀';
      btn.onclick=function(){btn.disabled=true;markRead(it.key,function(){it.read=true;c.classList.add('gone');setTimeout(render,220);});};
      foot.appendChild(btn);
    }else{
      var tag=document.createElement('span');tag.className='readtag';tag.textContent='已閱讀';foot.appendChild(tag);
    }
    c.appendChild(foot);
    return c;
  }
  function render(){
    var items=all.slice();
    if(activeCourse)items=items.filter(function(x){return x.course_name===activeCourse;});
    items.sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)||(b.ts||0)-(a.ts||0);});
    var visible=showRead?items:items.filter(function(x){return !x.read;});
    var unread=all.filter(function(x){return !x.read;}).length;
    countEl.textContent=unread?(unread+' 則未讀'):'全部已讀';
    var sr=document.getElementById('showReadChip');if(sr)sr.textContent='顯示已閱讀（'+(all.length-unread)+'）';
    list.innerHTML='';
    list.classList.toggle('cols',!activeCourse&&visible.length>3);
    if(!visible.length){list.innerHTML='<div class="empty">'+(showRead?'沒有已閱讀的公告':'目前沒有未讀公告')+'</div>';return;}
    visible.forEach(function(it){list.appendChild(card(it));});
  }
  function buildFilters(){
    filtersEl.innerHTML='';
    var sr=document.createElement('button');sr.type='button';sr.id='showReadChip';sr.className='chip ghost'+(showRead?' active':'');sr.onclick=function(){showRead=!showRead;buildFilters();render();};filtersEl.appendChild(sr);
    var names=[];all.forEach(function(x){if(x.course_name&&names.indexOf(x.course_name)<0)names.push(x.course_name);});
    if(names.length<2){render();return;}
    names.sort();
    var mk=function(label,val){var c=document.createElement('button');c.type='button';c.className='chip'+(activeCourse===val?' active':'');c.textContent=label;c.onclick=function(){activeCourse=val;buildFilters();render();};filtersEl.appendChild(c);};
    mk('全部','');names.forEach(function(n){mk(n,n);});
    render();
  }
  function load(){
    list.innerHTML='<div class="skel"></div><div class="skel"></div>';
    fetch('/admin/api/bulletins',{credentials:'same-origin',cache:'no-store'}).then(function(r){
      if(!r.ok)return r.json().catch(function(){return{};}).then(function(j){throw new Error(j.error||('HTTP '+r.status));});
      return r.json();
    }).then(function(body){
      isAdmin=!!body.is_admin;
      if(publishBtn)publishBtn.style.display=isAdmin?'inline-flex':'none';
      all=(body.items||[]).map(function(x){x.ts=x.ts||ts(x);return x;});
      buildFilters();
    }).catch(function(e){
      list.innerHTML='<div class="err">讀取公告失敗：'+esc(e.message||e)+'</div>';
    });
  }
  // BULLETIN_TRANSLATE_V6
  // 舊版 `r.json().catch(()=>({}))` 會把非 JSON 的回應整個吞掉，
  // 於是像 Cloudflare Tunnel 回的 502 HTML 只剩下「HTTP 502」四個字，
  // 完全看不到錯誤碼。改成永遠保留原始狀態碼與回應內文。
  function getJson(path,cb){
    var st=0,done=false;
    function once(o){if(!done){done=true;cb(o);}}
    fetch(path,{credentials:'same-origin',cache:'no-store'})
      .then(function(r){
        st=r.status;
        return r.text().then(function(raw){
          var j=null;try{j=JSON.parse(raw);}catch(e){}
          if(!r.ok){
            once({error:(j&&j.error)||('HTTP '+r.status),status:r.status,code:(j&&j.code)||'',
                  trace_id:(j&&j.trace_id)||'',diagnostics:(j&&j.diagnostics)||null,
                  raw:j?'':String(raw||'').slice(0,600)});
            return;
          }
          once(j||{});
        });
      })
      .catch(function(e){once({error:(e&&e.message)||'網路錯誤（請求未送達或被中斷）',status:st});});
  }
  function postJson(path,data,cb){
    var st=0,done=false;
    function once(o){if(!done){done=true;cb(o);}}
    fetch(path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(data||{})})
      .then(function(r){
        st=r.status;
        return r.text().then(function(raw){
          var j=null;try{j=JSON.parse(raw);}catch(e){}
          if(!r.ok){
            once({
              error:(j&&j.error)||('HTTP '+r.status),
              status:r.status,
              code:(j&&j.code)||'',
              trace_id:(j&&j.trace_id)||'',
              diagnostics:(j&&j.diagnostics)||null,
              raw:j?'':String(raw||'').slice(0,600)
            });
            return;
          }
          once(j||{});
        });
      })
      .catch(function(e){once({error:(e&&e.message)||'網路錯誤（請求未送達或被中斷）',status:st});});
  }
  function delApi(id,cb){postJson('/admin/api/bulletins/admin/delete',{id:id},cb);}
  if(publishBtn)publishBtn.onclick=function(){pubForm.style.display=pubForm.style.display==='flex'?'none':'flex';};
  var pubCancel=document.getElementById('pubCancel'),pubSubmit=document.getElementById('pubSubmit');
  if(pubCancel)pubCancel.onclick=function(){pubForm.style.display='none';};
  if(pubSubmit)pubSubmit.onclick=function(){
    var t=document.getElementById('pubTitle').value.trim();
    var c=document.getElementById('pubContent').value.trim();
    if(!t){alert('請輸入公告標題');return;}
    pubSubmit.disabled=true;
    postJson('/admin/api/bulletins/admin',{title:t,content:c},function(r){
      pubSubmit.disabled=false;
      if(r.error){alert('發佈失敗：'+r.error);return;}
      document.getElementById('pubTitle').value='';document.getElementById('pubContent').value='';
      pubForm.style.display='none';load();
    });
  };
  document.getElementById('refresh').onclick=load;
  load();
})();
</script>
<style id="MOBILE_HIDE_BACK_V1">@media(max-width:820px){header.top a.back,header.top #refresh{display:none!important}}</style>
