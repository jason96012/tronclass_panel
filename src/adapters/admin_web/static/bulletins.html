<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>課程公告</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:960px;margin:0 auto;padding:16px 14px 60px}
  header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line2)}
  header.top h1{font-size:18px;font-weight:800;flex:1}
  .count{font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:4px 10px;white-space:nowrap}
  a.back,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;cursor:pointer;min-height:38px}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primaryText)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:7px 13px;font-size:12.5px;cursor:pointer}
  .chip.active{background:var(--primary);border-color:var(--primary);color:var(--primaryText)}
  .chip.ghost{border-style:dashed}
  .list{display:flex;flex-direction:column;gap:12px;margin-top:12px}
  .card{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:16px 18px;box-shadow:0 1px 3px rgba(15,23,42,.06);min-width:0;overflow:hidden}
  .card.read{opacity:.55}
  .card.gone{animation:gone .22s ease forwards}
  @keyframes gone{to{opacity:0;transform:scale(.97)}}
  .card .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{font-size:11px;color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent);border:1px solid color-mix(in srgb,var(--primary) 35%,transparent);border-radius:999px;padding:3px 9px;font-weight:600}
  .pin{font-size:11px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:999px;padding:3px 8px;font-weight:600}
  .new{font-size:11px;color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent);border-radius:999px;padding:3px 8px;font-weight:700}
  .date{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .card h2{font-size:16px;font-weight:750;margin:10px 0 4px;line-height:1.4;overflow-wrap:anywhere}
  .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
  .content{font-size:14px;line-height:1.7;color:var(--text);overflow-wrap:anywhere;word-break:break-word;max-width:100%}
  .content *{max-width:100%;box-sizing:border-box}
  .content p{margin:8px 0}
  .content p:first-child{margin-top:0}
  .content p:last-child{margin-bottom:0}
  .content ul,.content ol{margin:8px 0;padding-left:20px}
  .content blockquote{margin:8px 0;padding:6px 10px;border-left:3px solid var(--line);color:var(--muted);background:var(--soft);border-radius:6px}
  .content pre{white-space:pre-wrap;word-break:break-word;font-family:inherit}
  .content table{display:block;overflow-x:auto;border-collapse:collapse}
  .content img{max-width:100%;border-radius:8px;margin:6px 0}
  .content a{color:var(--primary)}
  .cardfoot{display:flex;align-items:center;gap:8px;margin-top:14px}
  .cardfoot .spacer{flex:1}
  .readbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:7px 12px;font-size:12.5px;cursor:pointer;min-height:34px}
  /* BULLETIN_TRANSLATE_V1 */
  .trbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid color-mix(in srgb,var(--primary) 45%,transparent);color:var(--primary);border-radius:10px;padding:7px 12px;font-size:12.5px;cursor:pointer;min-height:34px}
  .trbtn:disabled{opacity:.55;cursor:not-allowed}
  .transbox{margin:10px 0 0;padding:10px 12px;border:1px dashed color-mix(in srgb,var(--primary) 45%,transparent);background:color-mix(in srgb,var(--primary) 6%,transparent);border-radius:10px}
  .translab{font-size:11px;font-weight:700;color:var(--primary);margin-bottom:4px}
  .transerr{margin:10px 0 0;padding:10px 12px;border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent);border-radius:10px}
  .transerrhead{font-size:12px;font-weight:800;color:var(--bad);margin-bottom:6px}
  .transerrmsg{font-size:11.5px;line-height:1.55;color:var(--text);white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .transerrrow{display:flex;gap:8px;margin-top:8px}
  .transbox>div:last-child{font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .readbtn:hover{color:var(--primary);border-color:var(--primary)}
  /* BULLETIN_AI_SUMMARY_V1：AI 摘要按鈕與摘要框 */
  .smbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok);border-radius:10px;padding:7px 12px;font-size:12.5px;cursor:pointer;min-height:34px}
  .smbtn:disabled{opacity:.55;cursor:not-allowed}
  .smbtn.on{background:color-mix(in srgb,var(--ok) 10%,transparent)}
  .smbox{margin:10px 0 0;padding:10px 12px;border:1px dashed color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 6%,transparent);border-radius:10px}
  .smbox .smlab{font-size:11px;font-weight:700;color:var(--ok);margin-bottom:4px}
  .smbox .smtext{font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .smbox .smmeta{font-size:10.5px;color:var(--muted);margin-top:6px}
  .readtag{display:inline-flex;font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:9px;padding:4px 9px}
  .delbtn{display:inline-flex;align-items:center;background:transparent;border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad);border-radius:10px;padding:7px 12px;font-size:12.5px;cursor:pointer;min-height:34px}
  .pubform{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
  .pubform input,.pubform textarea{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--text);font-family:inherit;resize:vertical}
  .pubform input:focus,.pubform textarea:focus{outline:2px solid color-mix(in srgb,var(--primary) 40%,transparent);border-color:var(--primary)}
  .pubrow{display:flex;gap:8px}
  .pubrow .spacer{flex:1}
  .empty,.err{border:1px dashed var(--line);border-radius:16px;background:var(--card);color:var(--muted);text-align:center;padding:44px 18px;font-size:14px;margin-top:16px}
  .skel{height:96px;border-radius:16px;background:linear-gradient(90deg,var(--soft) 25%,var(--soft2) 50%,var(--soft) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  /* ── 手機板 ── */
  @media(max-width:760px){
    .wrap{padding:8px 12px calc(70px + env(safe-area-inset-bottom))}
    header.top{padding:10px 0;border-bottom:none}
    header.top h1{font-size:17px}
    a.back{border-radius:999px;width:38px;padding:0}
    a.back .txt{display:none}
    .filters{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 8px;scrollbar-width:none;margin:8px 0 2px}
    .filters::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto;padding:8px 14px}
    .list{gap:10px}
    .list.cols{display:flex;flex-direction:column}
    .card{border-radius:16px;padding:14px 14px 12px}
    .card h2{font-size:15.5px}
    .content{font-size:13.8px;line-height:1.66}
    .date{font-size:11px}
  }
  /* ── 桌機板 ── */
  @media(min-width:900px){
    .wrap{max-width:1080px}
    .list.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:14px}
  }

  /* CSP_STYLE_ATTR_STAGED_V1：原 inline style 屬性改為 class（消除 style-src-attr 回報） */
  /* ── BULLETIN_PANEL_V1（fix53）：面板內閱讀公告 ──
     與作業頁同一種顯示方式：點卡片上的「📄 內容」在面板內開啟，不開新分頁、
     也不經過 /admin/tc-go 代理（代理會動到瀏覽器 cookie，是 fix38 事故的來源）。 */
  .tcinfo{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;min-height:34px;transition:all .15s ease;white-space:nowrap}
  .tcinfo:hover{border-color:var(--primary);color:var(--primary)}
  .blp-back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
  .blp-box{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.38)}
  .blp-head{position:relative;padding:16px 18px 12px;border-bottom:1px solid var(--line2)}
  .blp-title{font-size:17px;font-weight:800;line-height:1.45;overflow-wrap:anywhere;padding-right:76px}
  .blp-meta{font-size:12px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
  .blp-x{position:absolute;top:12px;right:12px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 10px;font-size:12px;cursor:pointer;min-height:32px}
  .blp-x:hover{color:var(--primary);border-color:var(--primary)}
  .blp-body{padding:16px 18px;overflow:auto;-webkit-overflow-scrolling:touch}
  .blp-content{font-size:14.5px}
  .blp-host{display:block}
  .blp-imgfail{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
  .blp-sub{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}
  .blp-subhead{font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:6px}
  .blp-item{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:8px 10px;font-size:13px;color:var(--text);cursor:pointer;line-height:1.5;font-family:inherit}
  .blp-item:hover{background:var(--soft)}
  .blp-item.on{background:var(--soft);font-weight:800}
  .blp-item .d{color:var(--muted);font-size:11.5px;margin-left:6px;white-space:nowrap;font-weight:400}
  .blp-foot{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line2);background:var(--bg);flex-wrap:wrap}
  .blp-foot .spacer{flex:1}
  @media(max-width:640px){
    .blp-back{padding:0;align-items:flex-end}
    .blp-box{width:100%;max-height:92vh;border-radius:16px 16px 0 0}
    .blp-foot{gap:6px}
  }
  .hidden-init{display:none}
</style>
<style id="SAFE_AREA_TOP_V1">
  /* 手機鏡頭／瀏海安全區：viewport-fit=cover 讓頁面延伸到系統列底下，
     用透明邊框把頂欄內容推回安全區（無劉海裝置 env()=0，外觀完全不變）。 */
  header.top{
    border-top:env(safe-area-inset-top,0px) solid transparent;
    border-left:env(safe-area-inset-left,0px) solid transparent;
    border-right:env(safe-area-inset-right,0px) solid transparent;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="/admin/dashboard" title="回控制台">←<span class="txt"> 回控制台</span></a>
    <h1>課程公告</h1>
    <span class="count" id="count"></span>
    <button class="btn hidden-init" id="publishBtn" type="button">＋ 發佈</button>
    <button class="btn primary" id="refresh" type="button">重新整理</button>
  </header>
  <div class="pubform hidden-init" id="pubForm">
    <input id="pubTitle" placeholder="公告標題" maxlength="80">
    <textarea id="pubContent" rows="4" placeholder="公告內容"></textarea>
    <div class="pubrow"><span class="spacer"></span><button class="btn" id="pubCancel" type="button">取消</button><button class="btn primary" id="pubSubmit" type="button">發佈</button></div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="list" id="list"><div class="skel"></div><div class="skel"></div></div>
</div>
<!-- BULLETIN_PANEL_V1（fix53）：公告卡片改為面板內閱讀（原本是開新分頁走 /admin/tc-go 代理）。 -->
<script id="BULLETINS_PAGE_V5">
(function(){
  'use strict';
  var list=document.getElementById('list'),countEl=document.getElementById('count'),filtersEl=document.getElementById('filters');
  var all=[],activeCourse='',showRead=false,isAdmin=false;
  var NEW_SECS=7*86400;
  var publishBtn=document.getElementById('publishBtn'),pubForm=document.getElementById('pubForm');
  function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':String(s));return d.innerHTML;}
  function pick(o,keys){for(var i=0;i<keys.length;i++){var v=o[keys[i]];if(v!=null&&v!==''){if(typeof v==='object'){var n=v.name||v.title||v.text;if(n!=null)return String(n);}return String(v);}}return '';}
  function ts(o){var t=pick(o,['publish_time','published_at','created_at','create_time','updated_at','updated','created','time']);if(!t)return 0;var n=Number(t);if(!isNaN(n)&&n>1e9)return n>1e12?Math.floor(n/1000):n;var d=new Date(t);return isNaN(d.getTime())?0:Math.floor(d.getTime()/1000);}
  function p2(x){return(x<10?'0':'')+x;}
  function fmtDate(t){if(!t)return '';var d=new Date(t*1000);if(isNaN(d))return '';return d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate());}
  function rel(t){if(!t)return '';var now=Math.floor(Date.now()/1000),d=now-t;
    if(d<60)return '剛剛';if(d<3600)return Math.floor(d/60)+' 分鐘前';if(d<86400)return Math.floor(d/3600)+' 小時前';
    if(d<86400*2)return '昨天';if(d<86400*7)return Math.floor(d/86400)+' 天前';return fmtDate(t);}
  function isNew(it){return !!it.ts&&(Math.floor(Date.now()/1000)-it.ts)<=NEW_SECS;}
  function cleanRaw(raw){
    if(!raw)return '';
    var t=String(raw).replace(/\r/g,'');
    t=t.replace(/[ \t]+\n/g,'\n').replace(/\n[ ]+/g,'\n').replace(/\n{3,}/g,'\n\n');
    return t.replace(/^[ \n]+/,'').replace(/[ \n]+$/,'');
  }
  // BULLETIN_TRANSLATE_V3
  // 公告內容是 iClass 的 HTML 片段。要送去翻譯、或在沒有 DOMPurify 時呈現，
  // 都必須先轉成純文字，否則畫面會出現字面的 <p>…</p>。
  // 這裡刻意不用 innerHTML / DOMParser：本頁 CSP 有 require-trusted-types-for，
  // 那些都是 Trusted Types sink，純字串處理才穩。
  var ENTITIES={lt:'<',gt:'>',amp:'&',quot:'"',apos:"'",nbsp:' ',ndash:'\u2013',mdash:'\u2014',hellip:'\u2026',middot:'\u00b7',lsquo:'\u2018',rsquo:'\u2019',ldquo:'\u201c',rdquo:'\u201d'};
  function decodeEntities(s){
    if(String(s).indexOf('&')<0)return String(s);
    return String(s).replace(/&(#[xX]?[0-9a-fA-F]+|[a-zA-Z]+);/g,function(m,e){
      if(e.charAt(0)==='#'){
        var hex=(e.charAt(1)==='x'||e.charAt(1)==='X');
        var cp=hex?parseInt(e.slice(2),16):parseInt(e.slice(1),10);
        if(!isFinite(cp)||cp<=0||cp>0x10FFFF)return m;
        try{return String.fromCodePoint(cp);}catch(err){return m;}
      }
      var k=e.toLowerCase();
      return Object.prototype.hasOwnProperty.call(ENTITIES,k)?ENTITIES[k]:m;
    });
  }
  var TAG_RE=/<\/?[a-zA-Z][^>]*>/g;
  function stripTags(s){
    var t=String(s);
    t=t.replace(/<!--[\s\S]*?-->/g,'');
    t=t.replace(/<(script|style)\b[^>]*>[\s\S]*?<\/\1\s*>/gi,'');
    t=t.replace(/<\s*br\s*\/?\s*>/gi,'\n');
    t=t.replace(/<\s*\/?\s*(p|div|li|tr|ul|ol|table|section|article|blockquote|pre|h[1-6]|hr)\b[^>]*>/gi,'\n');
    return t.replace(TAG_RE,'');
  }
  function htmlToPlainText(raw){
    if(raw==null)return '';
    var s=String(raw);
    if(s.indexOf('<')<0&&s.indexOf('&')<0)return cleanRaw(s);
    s=decodeEntities(stripTags(s));
    // 解碼後可能又冒出標籤（&lt;p&gt; 這種二次編碼），再清一輪。
    if(TAG_RE.test(s)){TAG_RE.lastIndex=0;s=stripTags(s);}
    TAG_RE.lastIndex=0;
    return cleanRaw(s.replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/[ \t]*\n[ \t]*/g,'\n'));
  }
  function isBlank(n){
    if(n.nodeType===3)return !n.textContent.trim();
    if(n.nodeType===1){var t=n.tagName;if(t==='IMG'||t==='TABLE'||t==='IFRAME'||t==='VIDEO')return false;return !n.textContent.trim()&&!n.querySelector('img,table,iframe,video');}
    return true;
  }
  function setContent(el,raw){
    var cleaned=cleanRaw(raw);
    if(!cleaned){el.style.display='none';return;}
    if(window.DOMPurify&&DOMPurify.sanitize){el.innerHTML=DOMPurify.sanitize(cleaned,{USE_PROFILES:{html:true}});}
    else{
      // 沒有 DOMPurify 時不能直接把原始 HTML 塞進 textContent，
      // 否則使用者會看到字面的 <p>…</p>。
      el.textContent=htmlToPlainText(cleaned);
      el.style.whiteSpace='pre-wrap';
    }
    while(el.firstChild&&isBlank(el.firstChild))el.removeChild(el.firstChild);
    while(el.lastChild&&isBlank(el.lastChild))el.removeChild(el.lastChild);
    if(!el.childNodes.length)el.style.display='none';
  }
  function markRead(key,cb){
    fetch('/admin/api/bulletins/read',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key})})
      .then(function(r){return r.json().catch(function(){return{};});})
      .then(cb).catch(function(){cb({});});
  }
  // BULLETIN_TRANSLATE_V8：背景 job 輪詢。每個 HTTP 請求都是毫秒級，
  // 反向代理不會再因為「久等」而丟出沒有內容的 502。
  var POLL_MS=600, POLL_MAX=220;   // 約 2 分鐘上限
  function pollTranslate(jobId,total,btn,cardEl,footEl,onDone){
    var tries=0;
    (function tick(){
      tries++;
      if(tries>POLL_MAX){
        btn.disabled=false;btn.textContent='重試翻譯';
        showTranslateError(cardEl,footEl,{error:'翻譯逾時（前端等待超過上限）',status:0,code:'TRANSLATE_POLL_TIMEOUT',trace_id:jobId});
        return;
      }
      getJson('/admin/api/bulletins/translate/status?job='+encodeURIComponent(jobId),function(r){
        if(r.error&&r.state==null){
          btn.disabled=false;btn.textContent='重試翻譯';
          showTranslateError(cardEl,footEl,r);return;
        }
        if(r.state==='running'){
          var n=r.finished||0,t=r.total||total||1;
          btn.textContent='翻譯中… '+n+'/'+t;
          setTimeout(tick,POLL_MS);return;
        }
        btn.disabled=false;
        if(r.state==='failed'||!r.ok){
          btn.textContent='重試翻譯';
          showTranslateError(cardEl,footEl,r);return;
        }
        onDone(r);
      });
    })();
  }
  // BULLETIN_AI_SUMMARY_V1：與翻譯相同的「背景 job + 輪詢」模式，但走 AI 密鑰。
  function pollSummary(jobId,btn,cardEl,footEl,onDone){
    var tries=0;
    (function tick(){
      tries++;
      if(tries>POLL_MAX){
        btn.disabled=false;btn.textContent='重試摘要';
        showSummaryError(cardEl,footEl,{error:'摘要逾時（前端等待超過上限）',status:0,code:'SUMMARY_POLL_TIMEOUT'});
        return;
      }
      getJson('/admin/api/ai/chat/status?job='+encodeURIComponent(jobId),function(r){
        if(r.error&&r.state==null){
          btn.disabled=false;btn.textContent='重試摘要';
          showSummaryError(cardEl,footEl,r);return;
        }
        if(r.state==='running'){setTimeout(tick,POLL_MS);return;}
        btn.disabled=false;
        if(r.state==='failed'||!r.ok){
          btn.textContent='重試摘要';
          showSummaryError(cardEl,footEl,r);return;
        }
        onDone(r);
      });
    })();

  function showSummaryError(cardEl,footEl,r){

  // BULLETIN_TRANSLATE_V6：翻譯失敗時把完整錯誤碼顯示在卡片裡，並可一鍵複製。
  function buildDiagnosticText(r){
    var lines=[];
    lines.push('【公告翻譯失敗診斷】');
    lines.push('時間：'+new Date().toISOString());
    lines.push('訊息：'+(r.error||'(無)'));
    lines.push('HTTP 狀態：'+(r.status||'(無回應)'));
    if(r.code)lines.push('錯誤碼：'+r.code);
    if(r.trace_id)lines.push('trace_id：'+r.trace_id+'（可在 /admin/logs 搜尋）');
    if(r.diagnostics&&r.diagnostics.length){
      lines.push('分段明細：');
      r.diagnostics.forEach(function(d){
        lines.push('  第 '+d.chunk+'/'+d.total+' 段｜'+d.bytes+' bytes｜'+(d.ok?'成功':'失敗')+
          '｜上游狀態 '+(d.status==null?'無':d.status)+'｜重試 '+d.attempts+' 次｜'+d.ms+' ms');
        if(d.error)lines.push('    原因：'+d.error);
        if(d.detail)lines.push('    上游回應：'+d.detail);
      });
    }
    if(r.raw){
      lines.push('原始回應（非 JSON）：');
      lines.push('  '+r.raw.replace(/\n/g,'\n  '));
    }
    lines.push('判讀：'+interpret(r));
    lines.push('頁面：'+location.href);
    lines.push('UA：'+navigator.userAgent);
    return lines.join('\n');
  }
  // BULLETIN_TRANSLATE_V7：把常見情境直接寫成人話，省去來回猜測。
  function interpret(r){
    var raw=String(r.raw||'');
    var cfEdge=/cloudflare|bad gateway|cf-ray/i.test(raw);
    if(r.code==='TRANSLATE_PANIC')return '本服務內部 panic（已攔截）。請到 /admin/logs 以 trace_id 搜尋 panic 詳情。';
    if(r.code==='TRANSLATE_TIMEOUT')return '本服務連得到但上游 Google 超過時間預算未回應（可能被限流）。';
    if(r.code==='TRANSLATE_UPSTREAM_FAILED')return '本服務有回應，是 Google 端失敗；看上面每段的「上游狀態」。';
    if((r.status===502||r.status===504)&&cfEdge)
      return '502/504 由 Cloudflare 邊緣產生，代表本服務在處理這個請求時「沒有吐出任何回應」'+
             '（程序被重啟／OOM、或 cloudflared 與 origin 之間斷線）。'+
             '請先按下方「自我檢測」，再到 /admin/logs 看有沒有「公告翻譯開始」這一行：'+
             '有 → 卡在上游或程序中斷；沒有 → 請求根本沒進到本服務。';
    if(r.status===0)return '請求沒有送達（網路中斷或被瀏覽器阻擋）。';
    return '未分類，請把本診斷全文回報。';
  }
  function runSelfTest(target){
    target.textContent='檢測中…';
    fetch('/admin/api/bulletins/translate/selftest',{credentials:'same-origin',cache:'no-store'})
      .then(function(r){return r.text().then(function(raw){
        var j=null;try{j=JSON.parse(raw);}catch(e){}
        if(r.status===401||r.status===403){target.textContent='自我檢測需要管理員權限。';return;}
        if(!j){target.textContent='自我檢測回應非 JSON（HTTP '+r.status+'）：'+raw.slice(0,300);return;}
        var out=['自我檢測：'+(j.ok?'✅ 有可用引擎':'❌ 全部不可用')];
        (j.engines||[]).forEach(function(e){
          out.push('  '+(e.ok?'✅':'❌')+' '+e.label+
            '｜'+e.elapsed_ms+' ms'+
            (e.status!=null?'｜HTTP '+e.status:'')+
            (e.cooling_before?'｜檢測前處於冷卻':'')+
            (e.ok?('｜樣本：'+e.sample):('｜'+(e.error||''))));
          if(!e.ok&&e.detail)out.push('      '+e.detail);
        });
        if(j.hint)out.push(j.hint);
        target.textContent=out.join('\n');
      });})
      .catch(function(e){target.textContent='自我檢測失敗：'+((e&&e.message)||e);});
  }
  function showTranslateError(cardEl,footEl,r){
    var old=cardEl.querySelector('.transerr');if(old)old.remove();
    var box=document.createElement('div');box.className='transerr';
    var head=document.createElement('div');head.className='transerrhead';
    head.textContent='翻譯失敗 · HTTP '+(r.status||'無回應')+(r.trace_id?(' · trace '+r.trace_id):'');

      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(done,function(){fallback(t,done);});
      }else{fallback(t,done);}

      var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);

  function render(){

    items.sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)||(b.ts||0)-(a.ts||0);});
    var visible=showRead?items:items.filter(function(x){return !x.read;});
    var unread=all.filter(function(x){return !x.read;}).length;
    countEl.textContent=unread?(unread+' 則未讀'):'全部已讀';
    var sr=document.getElementById('showReadChip');if(sr)sr.textContent='顯示已閱讀（'+(all.length-unread)+'）';
    list.innerHTML='';
    list.classList.toggle('cols',!activeCourse&&visible.length>3);
    if(!visible.length){list.innerHTML='<div class="empty">'+(showRead?'沒有已閱讀的公告':'目前沒有未讀公告')+'</div>';return;}
    visible.forEach(function(it){list.appendChild(card(it));});
  }
  function buildFilters(){
    filtersEl.innerHTML='';
    var sr=document.createElement('button');sr.type='button';sr.id='showReadChip';sr.className='chip ghost'+(showRead?' active':'');sr.onclick=function(){showRead=!showRead;buildFilters();render();};filtersEl.appendChild(sr);
    var names=[];all.forEach(function(x){if(x.course_name&&names.indexOf(x.course_name)<0)names.push(x.course_name);});
    if(names.length<2){render();return;}
    names.sort();
    var mk=function(label,val){var c=document.createElement('button');c.type='button';c.className='chip'+(activeCourse===val?' active':'');c.textContent=label;c.onclick=function(){activeCourse=val;buildFilters();render();};filtersEl.appendChild(c);};
    mk('全部','');names.forEach(function(n){mk(n,n);});
    render();
  }
  function load(){
    list.innerHTML='<div class="skel"></div><div class="skel"></div>';
    fetch('/admin/api/bulletins',{credentials:'same-origin',cache:'no-store'}).then(function(r){
      if(!r.ok)return r.json().catch(function(){return{};}).then(function(j){throw new Error(j.error||('HTTP '+r.status));});
      return r.json();
    }).then(function(body){
      isAdmin=!!body.is_admin;
      if(publishBtn)publishBtn.style.display=isAdmin?'inline-flex':'none';
      all=(body.items||[]).map(function(x){x.ts=x.ts||ts(x);return x;});
      buildFilters();
    }).catch(function(e){
      list.innerHTML='<div class="err">讀取公告失敗：'+esc(e.message||e)+'</div>';
    });
  }
  // BULLETIN_TRANSLATE_V6
  // 舊版 `r.json().catch(()=>({}))` 會把非 JSON 的回應整個吞掉，
  // 於是像 Cloudflare Tunnel 回的 502 HTML 只剩下「HTTP 502」四個字，
  // 完全看不到錯誤碼。改成永遠保留原始狀態碼與回應內文。
  function getJson(path,cb){
    var st=0,done=false;
    function once(o){if(!done){done=true;cb(o);}}
    fetch(path,{credentials:'same-origin',cache:'no-store'})
      .then(function(r){
        st=r.status;
        return r.text().then(function(raw){
          var j=null;try{j=JSON.parse(raw);}catch(e){}
          if(!r.ok){
            once({error:(j&&j.error)||('HTTP '+r.status),status:r.status,code:(j&&j.code)||'',
                  trace_id:(j&&j.trace_id)||'',diagnostics:(j&&j.diagnostics)||null,
                  raw:j?'':String(raw||'').slice(0,600)});
            return;
          }
          once(j||{});
        });
      })
      .catch(function(e){once({error:(e&&e.message)||'網路錯誤（請求未送達或被中斷）',status:st});});
  }
  function postJson(path,data,cb){
    var st=0,done=false;
    function once(o){if(!done){done=true;cb(o);}}
    fetch(path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(data||{})})
      .then(function(r){
        st=r.status;
        return r.text().then(function(raw){
          var j=null;try{j=JSON.parse(raw);}catch(e){}
          if(!r.ok){
            once({
              error:(j&&j.error)||('HTTP '+r.status),
              status:r.status,
              code:(j&&j.code)||'',
              trace_id:(j&&j.trace_id)||'',
              diagnostics:(j&&j.diagnostics)||null,
              raw:j?'':String(raw||'').slice(0,600)
            });
            return;
          }
          once(j||{});
        });
      })
      .catch(function(e){once({error:(e&&e.message)||'網路錯誤（請求未送達或被中斷）',status:st});});
  }
  function delApi(id,cb){postJson('/admin/api/bulletins/admin/delete',{id:id},cb);}
  if(publishBtn)publishBtn.onclick=function(){pubForm.style.display=pubForm.style.display==='flex'?'none':'flex';};
  var pubCancel=document.getElementById('pubCancel'),pubSubmit=document.getElementById('pubSubmit');
  if(pubCancel)pubCancel.onclick=function(){pubForm.style.display='none';};
  if(pubSubmit)pubSubmit.onclick=function(){
    var t=document.getElementById('pubTitle').value.trim();
    var c=document.getElementById('pubContent').value.trim();
    if(!t){alert('請輸入公告標題');return;}
    pubSubmit.disabled=true;
    postJson('/admin/api/bulletins/admin',{title:t,content:c},function(r){
      pubSubmit.disabled=false;
      if(r.error){alert('發佈失敗：'+r.error);return;}
      document.getElementById('pubTitle').value='';document.getElementById('pubContent').value='';
      pubForm.style.display='none';load();
    });
  };
  document.getElementById('refresh').onclick=load;
  load();
})();
</script>
