<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tronclass QR Scanner</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fb;
      --text: #172033;
      --muted: #667085;
      --panel: #ffffff;
      --border: #d7dce5;
      --accent: #2563eb;
      --ok: #15803d;
      --error: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10141f;
        --text: #eef2ff;
        --muted: #aab4c8;
        --panel: #171d2b;
        --border: #30394f;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      line-height: 1.2;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }
    .panel {
      margin-top: 18px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }
    video, canvas {
      display: block;
      width: 100%;
      max-height: 62vh;
      border-radius: 8px;
      background: #000;
    }
    canvas { display: none; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 0 14px;
      background: var(--accent);
      color: white;
      font-size: 15px;
      font-weight: 650;
    }
    button.secondary {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
    }
    textarea {
      width: 100%;
      min-height: 96px;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font: inherit;
      color: var(--text);
      background: transparent;
      resize: vertical;
    }
    /* QR_ZOOM_V1（fix78）：放大拉桿一律顯示。
       以前只有鏡頭回報支援 zoom 才顯示那一塊（setZoomUiVisible），iPhone 等多數裝置
       等於沒有拉桿可用；現在改成「鏡頭變焦優先、沒支援就用數位裁切」，人人都有拉桿。 */
    .stage {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
    }
    #preview {
      transform-origin: center center;
      transition: transform .12s ease-out;
    }
    #scanHint {
      margin-top: 10px;
      font-size: 15px;
      font-weight: 650;
      color: var(--muted);
      line-height: 1.45;
    }
    #scanHint.ok { color: var(--ok); }
    #scanHint.warn { color: #b45309; }
    #scanHint.error { color: var(--error); }
    .zoom-controls {
      display: block;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .zoom-controls label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }
    input[type="range"] {
      width: 100%;
      margin-top: 10px;
      min-height: 44px;
    }
    .zoom-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }
    .zoom-row button.zbtn {
      min-width: 58px;
      min-height: 48px;
      font-size: 22px;
      line-height: 1;
    }
    .zoom-mode {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: right;
      max-width: 46%;
    }
    .zoom-hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .cam-info {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      line-height: 1.5;
    }
    #status {
      margin-top: 12px;
      font-weight: 650;
    }
    #status.ok { color: var(--ok); }
    #status.error { color: var(--error); }
    /* ROLLCALL_INPUT_COUNTDOWN_V1：等待掃描倒數 */
    /* CLASS_COUNT_HEADER_V1：上方這一欄＝「目前班上已點人數」（大字）＋班上到課比例條；
       原本的倒數縮成右下角一行小字（到期一樣停止相機、鎖住畫面）。 */
    .countdown { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; padding:12px 14px; border:1px solid var(--border); border-radius:8px; background:var(--panel); }
    .countdown .label { color:var(--muted); font-size:14px; }
    .countdown .time { font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:1px; color:var(--text); }
    .countdown.pass .time { color:var(--ok); }
    .countdown .sub { margin-top:2px; font-size:12px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }
    .countdown.warn .sub { color:#b45309; font-weight:700; }
    .countdown.danger .sub, .countdown.expired .sub { color:var(--error); font-weight:700; }
    .countdown.expired { border-color:rgba(185,28,28,.35); background:rgba(185,28,28,.08); }
    .countdown .bar { position:relative; height:6px; margin-top:8px; border-radius:99px; background:var(--border); overflow:hidden; }
    .countdown .bar > i { position:absolute; inset:0 auto 0 0; width:0%; background:var(--ok); transition:width .4s ease; }
    .countdown.pass .bar > i { background:#2563eb; }
    .cd-right { text-align:right; white-space:nowrap; }
    @keyframes cdPulse { 0%,100% { opacity:1; } 50% { opacity:.45; } }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .metric {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
    }
    .metric strong {
      display: block;
      font-size: 22px;
      color: var(--text);
    }
    .metric span {
      color: var(--muted);
      font-size: 13px;
    }
    .lists {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }
    .list h3 {
      margin: 0 0 8px;
      font-size: 15px;
    }
    .list ul {
      min-height: 48px;
      margin: 0;
      padding: 10px 10px 10px 28px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .list.done h3 { color: var(--ok); }
    .list.pending h3 { color: var(--error); }
    @media (max-width: 560px) {
      .summary { grid-template-columns: 1fr; }
      .lists { grid-template-columns: 1fr; }
    }
  </style>
<style id="SAFE_AREA_TOP_V1">
  /* 手機鏡頭／瀏海安全區：viewport-fit=cover 讓頁面延伸到系統列底下，
     把 body 頂部墊高到安全區，標題與狀態列不再被鏡頭蓋住
     （無劉海裝置 env()=0，外觀完全不變）。 */
  body{padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
  <main>
    <h1>Tronclass QR Scanner</h1>
    <p>掃描課堂 QR Code 後會自動回傳給本機，並套用到同一個 rollcall 的所有等待帳號。</p>

    <section class="panel">
      <div class="stage">
        <video id="preview" playsinline muted></video>
        <canvas id="canvas"></canvas>
      </div>
      <div id="scanHint">尚未開始掃描</div>
      <div class="actions">
        <button id="start" type="button">開啟相機</button>
        <button id="stop" type="button" class="secondary">停止</button>
      </div>
      <div id="zoomControls" class="zoom-controls">
        <label for="zoom">
          <span>放大（坐遠也能掃）</span>
          <span id="zoomValue">2.0x</span>
        </label>
        <input id="zoom" type="range" min="1" max="8" step="0.5" value="2">
        <div class="zoom-row">
          <button id="zoomOut" type="button" class="secondary zbtn" aria-label="縮小">−</button>
          <button id="zoomIn" type="button" class="zbtn" aria-label="放大">＋</button>
          <button id="zoomReset" type="button" class="secondary">回到 1x</button>
          <span id="zoomMode" class="zoom-mode">數位放大 2.0x</span>
        </div>
        <div class="zoom-hint">往右拉＝放大。畫面裡看到的就是實際送去解碼的範圍，把 QR 放進畫面中央即可。</div>
      </div>
      <div id="camInfo" class="cam-info"></div>
      <div id="status">尚未掃描</div>
      <!-- CLASS_COUNT_HEADER_V1：頁面上方這一欄＝目前班上已點人數（大字）＋倒數小字 -->
      <div id="countdown" class="countdown" style="display:none">
        <div style="flex:1">
          <div class="label" id="countdownLabel">班上已點人數</div>
          <div class="bar"><i id="countdownBar"></i></div>
        </div>
        <div class="cd-right">
          <div class="time" id="countdownTime">--</div>
          <div class="sub" id="countdownSub">讀取中…</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <p>簽到狀態會自動更新。已完成代表該帳號已回報 QR 簽到成功；未完成代表仍在等待有效 QR Code。</p>
      <div class="summary">
        <div class="metric"><strong id="totalCount">0</strong><span>總帳號</span></div>
        <div class="metric"><strong id="doneCount">0</strong><span>已點到</span></div>
        <div class="metric"><strong id="pendingCount">0</strong><span>未點到</span></div>
      </div>
      <div class="lists">
        <div class="list done">
          <h3>已點到</h3>
          <ul id="doneList"><li>尚無</li></ul>
        </div>
        <div class="list pending">
          <h3>還沒點到</h3>
          <ul id="pendingList"><li>尚無</li></ul>
        </div>
      </div>
    </section>

    <section class="panel">
      <p>如果相機無法開啟，可以貼上掃描到的 URL 或 p 參數。</p>
      <textarea id="manual" placeholder="https://elearn2.fju.edu.tw/scanner-jumper?p=..."></textarea>
      <div class="actions">
        <button id="submitManual" type="button">送出</button>
      </div>
    </section>
  </main>

  <!-- QR_DECODER_LOCAL_V1（fix78）：改用本機的 jsQR（伺服器自己就有 /scanner/jsqr.js，
       與 CDN 那份 sha256 完全相同）。校園網路擋外網或 CDN 掛掉時仍然掃得動。 -->
  <script src="/scanner/jsqr.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const provider = params.get("provider") || "";
    const rollcallId = Number(params.get("rollcall_id") || "0");
    const token = params.get("token") || "";
    const accountId = params.get("account_id") || "";
    const statusEl = document.getElementById("status");
    const scanHintEl = document.getElementById("scanHint");
    const camInfoEl = document.getElementById("camInfo");
    const video = document.getElementById("preview");
    const canvas = document.getElementById("canvas");
    const context = canvas.getContext("2d", { willReadFrequently: true });
    const zoomControls = document.getElementById("zoomControls");
    const zoomSlider = document.getElementById("zoom");
    const zoomValue = document.getElementById("zoomValue");
    const zoomModeEl = document.getElementById("zoomMode");
    const totalCountEl = document.getElementById("totalCount");
    const doneCountEl = document.getElementById("doneCount");
    const pendingCountEl = document.getElementById("pendingCount");
    const doneListEl = document.getElementById("doneList");
    const pendingListEl = document.getElementById("pendingList");

    const RESUBMIT_SAME_QR_MS = 3000;
    let stream = null;
    let videoTrack = null;
    let scanning = false;
    let submitInFlight = false;
    let lastSubmittedData = "";
    let lastSubmittedAt = 0;
    let successfulSubmits = 0;

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || "";
    }

    /* ─────────── QR_ZOOM_V1（fix78）：放大拉桿 ───────────────────────────────
       目的：坐得遠也掃得到。放大分兩段——
         ① 鏡頭變焦（硬體）：相機支援 zoom 能力時優先使用，畫質最好（真正的光學／感光變焦）。
         ② 數位變焦（裁切）：一律可用。只把畫面中央 1/倍率 的區域送進解碼器，
            QR 在解碼輸入裡佔的比例變大，也讓預覽「所見即所解」。
       拉桿＝想要的總倍率；實際＝鏡頭倍率 × 數位倍率，兩者相乘等於拉桿值。
       位置會記在 localStorage，下一堂課不用重調。                              */
    const ZOOM_MIN = 1;
    const ZOOM_MAX = 8;
    const ZOOM_STEP = 0.5;
    const ZOOM_DEFAULT = 2;
    const ZOOM_KEY = "tronclassScannerZoom";
    /* 每幀最多解一次；預覽照常用 requestAnimationFrame 更新。 */
    const DECODE_INTERVAL_MS = 150;
    /* 送出（POST /scanner/submit）最多等幾毫秒，逾時就放棄那一次並解鎖。 */
    const SUBMIT_TIMEOUT_MS = 8000;
    /* 連續多久沒解到碼就提示使用者（秒）。 */
    const NO_QR_HINT_SECS = 2.5;

    let targetZoom = ZOOM_DEFAULT;
    let hwZoomRange = null;   // 鏡頭支援的 {min,max}；不支援＝null
    let hwZoomApplied = 1;    // 目前套用的鏡頭倍率
    let digitalZoom = ZOOM_DEFAULT; // 目前套用的數位裁切倍率

    function nowMs() {
      try {
        if (typeof performance !== "undefined" && performance && performance.now) return performance.now();
      } catch (err) { /* 沙箱環境沒有 performance */ }
      return Date.now();
    }
    function readStoredZoom() {
      try {
        const v = window.localStorage && window.localStorage.getItem(ZOOM_KEY);
        const n = Number(v);
        if (isFinite(n) && n > 0) return n;
      } catch (err) { /* 無 localStorage（無痕模式等）就用預設值 */ }
      return ZOOM_DEFAULT;
    }
    function storeZoom(value) {
      try {
        if (window.localStorage) window.localStorage.setItem(ZOOM_KEY, String(value));
      } catch (err) { /* 存不了不影響功能 */ }
    }
    function clampZoom(value) {
      const n = Number(value);
      if (!isFinite(n) || n <= 0) return ZOOM_DEFAULT;
      return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(n / ZOOM_STEP) * ZOOM_STEP));
    }

    /* 掃描狀態列：這是「有沒有解到 QR」唯一的即時回饋。
       以前解不到碼時整頁完全沒有反應，使用者無法分辨「沒對到」與「有對到但送不出去」。 */
    function setScanHint(text, kind) {
      if (!scanHintEl) return;
      if (scanHintEl.textContent === text) return;
      scanHintEl.textContent = text;
      scanHintEl.className = kind || "";
    }

    function validScannerParams() {
      return Boolean(provider && rollcallId && token && accountId);
    }

    /* CLASS_COUNT_HEADER_V1：頁面上方那一欄＝「目前班上已點人數」（大字＋班上比例條），
       原本的倒數縮成右下角一行小字（到期一樣停止相機、鎖住畫面）。
       人數來源＝/scanner/status 的 class_progress（後端每 10 秒讀一次學校的班上進度；
       讀不到就顯示「讀取中…」，完全不影響掃描與送出）。 */
    const countdownEl = document.getElementById("countdown");
    const countdownTimeEl = document.getElementById("countdownTime");
    const countdownBarEl = document.getElementById("countdownBar");
    const countdownLabelEl = document.getElementById("countdownLabel");
    const countdownSubEl = document.getElementById("countdownSub");
    let cdDeadlineMs = null, cdExpiredNotified = false;
    let cdClassProgress = null, cdAutoPercent = 15;
    function fmtSecs(total) {
      total = Math.max(0, Math.floor(total));
      const m = Math.floor(total / 60), s = total % 60;
      return m > 0 ? `${m}:${String(s).padStart(2, "0")}` : `${s} 秒`;
    }
    /* 班上已點人數：後端讀得到就照實顯示，讀不到只顯示「讀取中…」（不亂猜）。 */
    function renderClassCount() {
      const progress = cdClassProgress;
      if (!progress || !progress.total) {
        countdownTimeEl.textContent = "--";
        countdownLabelEl.textContent = "班上已點人數（讀取中…）";
        countdownBarEl.style.width = "0%";
        countdownEl.classList.remove("pass");
        return;
      }
      const pct = Math.max(0, Math.min(100, progress.completed / progress.total * 100));
      const passed = progress.completed * 100 > progress.total * cdAutoPercent;
      countdownTimeEl.textContent = progress.completed + " / " + progress.total;
      countdownLabelEl.textContent = "班上已點人數（" + Math.round(pct) + "%）"
        + (passed ? "・已過 " + cdAutoPercent + "%" : "");
      countdownBarEl.style.width = pct.toFixed(1) + "%";
      countdownEl.classList.toggle("pass", passed);
    }
    function syncClassProgress(body) {
      if (body && typeof body.auto_submit_percent === "number" && body.auto_submit_percent > 0) {
        cdAutoPercent = body.auto_submit_percent;
      }
      cdClassProgress = (body && body.class_progress) || null;
      renderClassCount();
    }
    function syncCountdown(expiresInSecs) {
      if (typeof expiresInSecs !== "number" || !isFinite(expiresInSecs)) return;
      cdDeadlineMs = Date.now() + expiresInSecs * 1000;
      countdownEl.style.display = "";
      tickCountdown();
    }
    function tickCountdown() {
      renderClassCount();
      if (cdDeadlineMs == null) return;
      const remain = Math.max(0, (cdDeadlineMs - Date.now()) / 1000);
      countdownSubEl.textContent = remain > 0 ? ("剩餘掃描時間 " + fmtSecs(remain)) : "掃描時間已結束";
      countdownEl.className = "countdown" + (countdownEl.classList.contains("pass") ? " pass" : "")
        + (remain <= 0 ? " expired" : remain <= 10 ? " danger" : remain <= 30 ? " warn" : "");
      if (remain <= 0 && !cdExpiredNotified) {
        cdExpiredNotified = true;
        stopCamera();
        document.getElementById("start").disabled = true;
        document.getElementById("submitManual").disabled = true;
        setStatus("等待掃描已逾時", "error");
      }
    }
    setInterval(tickCountdown, 1000);

    function renderList(el, items) {
      el.innerHTML = "";
      if (!items || items.length === 0) {
        const li = document.createElement("li");
        li.textContent = "尚無";
        el.appendChild(li);
        return;
      }
      for (const item of items) {
        const li = document.createElement("li");
        li.textContent = item;
        el.appendChild(li);
      }
    }

    async function refreshAttendanceStatus() {
      if (!validScannerParams()) return;
      try {
        const query = new URLSearchParams({
          provider,
          rollcall_id: String(rollcallId),
          account_id: accountId,
          token
        });
        const res = await fetch(`/scanner/status?${query.toString()}`, { cache: "no-store" });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || "狀態讀取失敗");
        totalCountEl.textContent = String(body.total_count || 0);
        doneCountEl.textContent = String(body.completed_count || 0);
        pendingCountEl.textContent = String(body.pending_count || 0);
        renderList(doneListEl, body.completed_accounts || []);
        renderList(pendingListEl, body.pending_accounts || []);
        syncClassProgress(body);
        syncCountdown(body.expires_in_secs);
      } catch (err) {
        const msg = (err && err.message) || "狀態讀取失敗";
        /* ROLLCALL_INPUT_COUNTDOWN_V1：後端回報已到期／找不到流程時，直接把倒數切到逾時狀態 */
        if (/expired|逾時|過期|到期|找不到等待中/i.test(msg) && cdDeadlineMs != null) { cdDeadlineMs = Date.now(); tickCountdown(); }
        // 狀態輪詢失敗不停止掃描，只在狀態列提示。
        if (!scanning) return;
        setStatus(msg, "error");
      }
    }

    /* QR_SUBMIT_TIMEOUT_V1（fix78）：送出一定要有逾時。
       以前 fetch 沒有逾時，手機切換網路／休眠時 promise 可能不結束 → submitInFlight
       永遠是 true → 之後每一次掃到的碼都被丢掉，而且畫面一句話都不說。 */
    async function submitQr(qrData) {
      const now = Date.now();
      if (!qrData) return;
      if (!validScannerParams()) {
        setScanHint("掃描連結缺少必要參數，無法回傳（請重新開啟點名頁產生的連結）", "error");
        return;
      }
      if (submitInFlight) {
        setScanHint("上一次回傳還在進行中，請稍等…", "warn");
        return;
      }
      if (qrData === lastSubmittedData && now - lastSubmittedAt < RESUBMIT_SAME_QR_MS) {
        setScanHint("同一個 QR 剛送過（3 秒內不重複），等課堂換下一個碼", "");
        return;
      }

      submitInFlight = true;
      lastSubmittedData = qrData;
      lastSubmittedAt = now;
      setStatus("正在回傳 QR Code...", "");

      const controller = (typeof AbortController !== "undefined") ? new AbortController() : null;
      const timer = controller
        ? setTimeout(() => { try { controller.abort(); } catch (err) {} }, SUBMIT_TIMEOUT_MS)
        : null;
      try {
        const init = {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            provider,
            rollcall_id: rollcallId,
            account_id: accountId,
            token,
            qr_data: qrData
          })
        };
        if (controller) init.signal = controller.signal;
        const res = await fetch("/scanner/submit", init);
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(body.error || `回傳失敗（HTTP ${res.status}）`);
        }
        successfulSubmits += 1;
        /* 送出結果只寫在狀態列，不要蓋掉掃描列的「已解出 QR」（兩行各司其職：
           掃描列＝有沒有解到碼，狀態列＝送出結果）。 */
        setStatus(
          `已送出第 ${successfulSubmits} 次，${body.delivered_count || 0} 個帳號收到 QR Code。持續掃描中...`,
          "ok"
        );
        refreshAttendanceStatus();
      } catch (err) {
        const aborted = err && (err.name === "AbortError" || err.name === "TimeoutError");
        setStatus(
          aborted
            ? `回傳卡住超過 ${Math.round(SUBMIT_TIMEOUT_MS / 1000)} 秒，已放棄這一次（仍會持續掃描）`
            : ((err && err.message) || "回傳失敗，仍會持續掃描。"),
          "error"
        );
      } finally {
        if (timer) clearTimeout(timer);
        submitInFlight = false;   // ← 一定會解鎖，不會再永久卡住
      }
    }

    /* QR_ZOOM_V1：解碼迴圈。
       - 只解「畫面中央 1/digitalZoom」那一塊（＝拉桿放大後看到的那一塊），
         QR 在解碼輸入裡佔的比例變大 → 坐得遠也解得動。
       - 最多每 DECODE_INTERVAL_MS 解一次、同一時間只有一個解碼在跑，
         預覽不會被解碼卡住（以前每一幀都解整張 1920×1080，手機上像當掉）。
       - 一秒一次走完整模式（含反相 QR），平常走快速模式。 */
    let lastDecodeAt = 0;
    let lastThoroughAt = 0;
    let decoding = false;
    let lastSeenAt = 0;
    let seenCount = 0;

    async function decodeOnce() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return null;

      const cw = Math.max(64, Math.round(vw / digitalZoom));
      const ch = Math.max(64, Math.round(vh / digitalZoom));
      const sx = Math.max(0, Math.round((vw - cw) / 2));
      const sy = Math.max(0, Math.round((vh - ch) / 2));

      canvas.width = cw;
      canvas.height = ch;
      context.drawImage(video, sx, sy, cw, ch, 0, 0, cw, ch);

      if (barcodeDetector) {
        try {
          const codes = await barcodeDetector.detect(canvas);
          if (codes && codes.length && codes[0].rawValue) return codes[0].rawValue;
        } catch (err) {
          /* 單次失敗不影響下一幀；下面還有 jsQR 這條路。 */
        }
      }
      if (window.jsQR) {
        const thorough = nowMs() - lastThoroughAt > 1000;
        if (thorough) lastThoroughAt = nowMs();
        const imageData = context.getImageData(0, 0, cw, ch);
        const opts = thorough ? undefined : { inversionAttempts: "dontInvert" };
        const code = window.jsQR(imageData.data, imageData.width, imageData.height, opts);
        if (code && code.data) return code.data;
      }
      return null;
    }

    async function tick() {
      if (!scanning) return;
      requestAnimationFrame(tick);
      const at = nowMs();
      if (decoding || at - lastDecodeAt < DECODE_INTERVAL_MS) return;
      if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
      decoding = true;
      lastDecodeAt = at;
      try {
        const data = await decodeOnce();
        if (data) {
          lastSeenAt = nowMs();
          seenCount += 1;
          setScanHint(`✅ 已解出 QR（第 ${seenCount} 次，${data.length} 字元）`, "ok");
          submitQr(data);
        } else if (!lastSeenAt || (nowMs() - lastSeenAt) / 1000 > NO_QR_HINT_SECS) {
          setScanHint(
            targetZoom <= ZOOM_MIN + 0.001
              ? "還沒看到 QR：往右拉「放大」拉桿，或靠近一點"
              : `還沒看到 QR（目前 ${targetZoom.toFixed(1)}x）：把 QR 放進畫面正中央，太遠就再往右拉`,
            "warn"
          );
        }
        updateCamInfo();
      } finally {
        decoding = false;
      }
    }

    /* QR_ZOOM_V1：偵測鏡頭變焦能力（不支援就純數位裁切，拉桿一樣可用）。 */
    async function detectHwZoom(track) {
      hwZoomRange = null;
      hwZoomApplied = 1;
      try {
        if (!track || !track.getCapabilities) return;
        const caps = track.getCapabilities();
        if (!caps || typeof caps.zoom === "undefined") return;
        const min = Number(caps.zoom.min ?? 1);
        const max = Number(caps.zoom.max ?? min);
        if (isFinite(min) && isFinite(max) && max > min) hwZoomRange = { min, max };
      } catch (err) {
        hwZoomRange = null;
      }
    }

    /* QR_ZOOM_V1：套用拉桿值 —— 鏡頭變焦優先，不足的倍率用數位裁切補。
       預覽同步做 CSS scale，所以「畫面上看到的範圍」＝「實際送去解碼的範圍」。 */
    async function applyZoom() {
      hwZoomApplied = 1;
      if (videoTrack && hwZoomRange) {
        const hw = Math.min(hwZoomRange.max, Math.max(hwZoomRange.min, targetZoom));
        try {
          await videoTrack.applyConstraints({ advanced: [{ zoom: hw }] });
          hwZoomApplied = hw;
        } catch (err) {
          hwZoomRange = null;   // 這個鏡頭其實不給調 → 退回純數位
          hwZoomApplied = 1;
        }
      }
      digitalZoom = Math.max(1, targetZoom / (hwZoomApplied || 1));
      if (video && video.style) {
        video.style.transform = digitalZoom > 1.001 ? `scale(${digitalZoom.toFixed(3)})` : "";
      }
      if (zoomSlider) zoomSlider.value = String(targetZoom);
      if (zoomValue) zoomValue.textContent = targetZoom.toFixed(1) + "x";
      if (zoomModeEl) {
        zoomModeEl.textContent = hwZoomRange
          ? `鏡頭 ${hwZoomApplied.toFixed(1)}x × 數位 ${digitalZoom.toFixed(1)}x`
          : `數位放大 ${digitalZoom.toFixed(1)}x（此鏡頭不支援變焦）`;
      }
      storeZoom(targetZoom);
      updateCamInfo();
    }

    /* QR_ZOOM_V1：顯示相機解析度／解碼區大小／用哪個解碼器。
       使用者才知道自己離得夠不夠近、拉桿還要不要往右。 */
    function updateCamInfo() {
      if (!camInfoEl) return;
      const vw = video ? video.videoWidth : 0;
      const vh = video ? video.videoHeight : 0;
      if (!vw || !vh) {
        camInfoEl.textContent = "";
        return;
      }
      const cw = Math.max(1, Math.round(vw / digitalZoom));
      const ch = Math.max(1, Math.round(vh / digitalZoom));
      camInfoEl.textContent = `相機 ${vw}×${vh}・解碼區 ${cw}×${ch}・${decoderName}`;
    }

    function setZoomValue(next) {
      targetZoom = clampZoom(next);
      applyZoom();
    }

    /* QR_ZOOM_V1：解碼器選擇 —— 原生 BarcodeDetector（Android Chrome 內建，對小碼與模糊的
       容忍度比純 JS 實作好）優先；沒有就退回本機 jsQR。 */
    let barcodeDetector = null;
    let decoderName = "jsQR";
    async function initDecoder() {
      barcodeDetector = null;
      try {
        if (typeof BarcodeDetector !== "undefined" && BarcodeDetector.getSupportedFormats) {
          const formats = await BarcodeDetector.getSupportedFormats();
          if (formats && formats.indexOf("qr_code") >= 0) {
            barcodeDetector = new BarcodeDetector({ formats: ["qr_code"] });
            decoderName = "內建解碼器";
          }
        }
      } catch (err) {
        barcodeDetector = null;
      }
      if (!barcodeDetector) {
        decoderName = (typeof window !== "undefined" && window.jsQR) ? "jsQR" : "解碼器未載入";
      }
      return decoderName;
    }

    async function startCamera() {
      if (!validScannerParams()) {
        setStatus("掃描連結缺少必要參數", "error");
        setScanHint("這個連結沒有帶到必要的參數，請重新開啟點名頁產生的掃碼連結", "error");
        return;
      }
      await initDecoder();
      if (!barcodeDetector && !window.jsQR) {
        setStatus("QR 解碼器尚未載入", "error");
        setScanHint("解碼器沒有載入：請重新整理頁面；若一直失敗請回報（伺服器 /scanner/jsqr.js 讀不到）", "error");
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment",
            /* QR_ZOOM_V1：要求更高的解析度 —— 這是「坐遠」最關鍵的一項，
               感光元件實際拍到的像素變多，裁切後 QR 才有足夠的像素被解出來。 */
            width: { ideal: 3840 },
            height: { ideal: 2160 }
          },
          audio: false
        });
        videoTrack = stream.getVideoTracks()[0] || null;
        video.srcObject = stream;
        await video.play();
        /* 遠距離時有沒有對到焦，影響比解析度還大；支援就要求連續自動對焦。 */
        try {
          if (videoTrack && videoTrack.applyConstraints) {
            await videoTrack.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
          }
        } catch (err) { /* 不支援就維持相機預設 */ }
        await detectHwZoom(videoTrack);
        targetZoom = clampZoom(readStoredZoom());
        await applyZoom();
        scanning = true;
        setStatus("正在掃描並持續回傳 QR Code...", "");
        setScanHint("開始找 QR：把 QR 放進畫面，太遠就往右拉「放大」拉桿", "");
        requestAnimationFrame(tick);
      } catch (err) {
        setStatus("無法開啟相機，請確認瀏覽器權限或使用 HTTPS。", "error");
        setScanHint("相機打不開：請確認已允許相機權限（或用瀏覽器開啟，不要在 App 內建瀏覽器）", "error");
      }
    }

    function stopCamera() {
      scanning = false;
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      videoTrack = null;
      video.srcObject = null;
      if (video && video.style) video.style.transform = "";
      setStatus("已停止掃描", "");
      setScanHint("已停止掃描（可按「開啟相機」重新開始）", "");
    }

    document.getElementById("start").addEventListener("click", startCamera);
    document.getElementById("stop").addEventListener("click", stopCamera);
    document.getElementById("submitManual").addEventListener("click", () => {
      const value = document.getElementById("manual").value.trim();
      if (!value) {
        setStatus("請先貼上 QR Code 內容", "error");
        return;
      }
      setScanHint("手動送出：直接把你貼上的內容交給系統（不經過相機解碼）", "");
      submitQr(value);
    });

    /* QR_ZOOM_V1：拉桿與加減鈕（手機上一根手指就能操作），位置會記住。 */
    zoomSlider.addEventListener("input", () => setZoomValue(Number(zoomSlider.value)));
    document.getElementById("zoomIn").addEventListener("click", () => setZoomValue(targetZoom + ZOOM_STEP));
    document.getElementById("zoomOut").addEventListener("click", () => setZoomValue(targetZoom - ZOOM_STEP));
    document.getElementById("zoomReset").addEventListener("click", () => setZoomValue(ZOOM_MIN));
    targetZoom = clampZoom(readStoredZoom());
    if (zoomSlider) zoomSlider.value = String(targetZoom);
    if (zoomValue) zoomValue.textContent = targetZoom.toFixed(1) + "x";

    refreshAttendanceStatus();
    setInterval(refreshAttendanceStatus, 1500);
    startCamera();
  </script>

</body>
</html>
