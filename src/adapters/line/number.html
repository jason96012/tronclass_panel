<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tronclass Number Rollcall</title>
  <style>
    :root { color-scheme: light dark; --bg:#f7f8fb; --text:#172033; --muted:#667085; --panel:#fff; --border:#d7dce5; --accent:#2563eb; --ok:#15803d; --error:#b91c1c; }
    @media (prefers-color-scheme: dark) { :root { --bg:#10141f; --text:#eef2ff; --muted:#aab4c8; --panel:#171d2b; --border:#30394f; --accent:#60a5fa; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    main { width:min(760px,100%); margin:0 auto; padding:20px; }
    h1 { margin:0 0 6px; font-size:24px; line-height:1.2; }
    p { margin:0; color:var(--muted); line-height:1.55; }
    .panel { margin-top:18px; padding:16px; border:1px solid var(--border); border-radius:8px; background:var(--panel); }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
    button { min-height:44px; border:0; border-radius:8px; padding:0 14px; background:var(--accent); color:white; font-size:15px; font-weight:650; }
    button.secondary { border:1px solid var(--border); background:transparent; color:var(--text); }
    input[type="text"] { width:100%; min-height:52px; margin-top:10px; border:1px solid var(--border); border-radius:8px; padding:10px 12px; font:inherit; font-size:24px; letter-spacing:4px; color:var(--text); background:transparent; }
    #status { margin-top:12px; font-weight:650; }
    #status.ok { color:var(--ok); }
    #status.error { color:var(--error); }
    .error-box { margin-top:12px; padding:12px; border:1px solid rgba(185,28,28,.35); border-radius:8px; background:rgba(185,28,28,.08); color:var(--error); font-weight:650; }
    .summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:10px; }
    .metric { padding:12px; border:1px solid var(--border); border-radius:8px; text-align:center; }
    .metric strong { display:block; font-size:24px; color:var(--text); }
    .metric span { color:var(--muted); font-size:13px; }
    .lists { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
    .list h3 { margin:0 0 8px; font-size:15px; }
    .list ul { min-height:48px; margin:0; padding:10px 10px 10px 28px; border:1px solid var(--border); border-radius:8px; }
    .list.done h3 { color:var(--ok); }
    .list.pending h3 { color:var(--error); }
    @media (max-width:560px) { .summary,.lists { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Tronclass Number Rollcall</h1>
    <p>輸入 4 位數字點名碼，或選擇自動讀取。送出後會套用到同一個 rollcall 的所有等待帳號。</p>

    <section class="panel">
      <p>手動輸入 4 位數字碼：</p>
      <input id="code" type="text" inputmode="numeric" maxlength="4" pattern="\d{4}" placeholder="1234" autocomplete="one-time-code">
      <div class="actions">
        <button id="submitCode" type="button">送出數字碼</button>
        <button id="autoLookup" type="button" class="secondary">自動讀取代碼</button>
      </div>
      <div id="status">尚未送出</div>
      <div id="lastError" class="error-box" style="display:none"></div>
    </section>

    <section class="panel">
      <p>簽到狀態會自動更新。已完成代表該帳號已回報數字點名成功；未完成代表仍在等待有效代碼。</p>
      <div class="summary">
        <div class="metric"><strong id="totalCount">0</strong><span>總帳號</span></div>
        <div class="metric"><strong id="doneCount">0</strong><span>已點到</span></div>
        <div class="metric"><strong id="pendingCount">0</strong><span>未點到</span></div>
      </div>
      <div class="lists">
        <div class="list done"><h3>已點到</h3><ul id="doneList"><li>尚無</li></ul></div>
        <div class="list pending"><h3>還沒點到</h3><ul id="pendingList"><li>尚無</li></ul></div>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const provider = params.get("provider") || "";
    const rollcallId = Number(params.get("rollcall_id") || "0");
    const token = params.get("token") || "";
    const accountId = params.get("account_id") || "";
    const statusEl = document.getElementById("status");
    const codeInput = document.getElementById("code");
    const totalCountEl = document.getElementById("totalCount");
    const doneCountEl = document.getElementById("doneCount");
    const pendingCountEl = document.getElementById("pendingCount");
    const doneListEl = document.getElementById("doneList");
    const pendingListEl = document.getElementById("pendingList");
    const lastErrorEl = document.getElementById("lastError");

    function validParams() { return Boolean(provider && rollcallId && token && accountId); }
    function setStatus(text, kind) { statusEl.textContent = text; statusEl.className = kind || ""; }
    function renderList(el, items) {
      el.innerHTML = "";
      if (!items || items.length === 0) { const li=document.createElement("li"); li.textContent="尚無"; el.appendChild(li); return; }
      for (const item of items) { const li=document.createElement("li"); li.textContent=item; el.appendChild(li); }
    }

    async function refreshStatus() {
      if (!validParams()) { setStatus("連結缺少必要參數", "error"); return; }
      try {
        const query = new URLSearchParams({ provider, rollcall_id:String(rollcallId), account_id:accountId, token });
        const res = await fetch(`/number/status?${query.toString()}`, { cache: "no-store" });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || "狀態讀取失敗");
        totalCountEl.textContent = String(body.total_count || 0);
        doneCountEl.textContent = String(body.completed_count || 0);
        pendingCountEl.textContent = String(body.pending_count || 0);
        renderList(doneListEl, body.completed_accounts || []);
        renderList(pendingListEl, body.pending_accounts || []);
        if (body.last_error) {
          lastErrorEl.style.display = "block";
          lastErrorEl.textContent = `上次送出失敗：${body.last_error}`;
        } else {
          lastErrorEl.style.display = "none";
          lastErrorEl.textContent = "";
        }
      } catch (err) {
        setStatus((err && err.message) || "狀態讀取失敗", "error");
      }
    }

    async function submitNumber(payload) {
      if (!validParams()) { setStatus("連結缺少必要參數", "error"); return; }
      setStatus("正在送出...", "");
      try {
        const res = await fetch("/number/submit", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ provider, rollcall_id:rollcallId, account_id:accountId, token, ...payload })
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || "送出失敗");
        setStatus(`已送出給 ${body.delivered_count || 0} 個帳號等待流程。`, "ok");
        refreshStatus();
      } catch (err) {
        setStatus((err && err.message) || "送出失敗", "error");
      }
    }

    document.getElementById("submitCode").addEventListener("click", () => {
      const code = codeInput.value.trim();
      if (!/^\d{4}$/.test(code)) { setStatus("請輸入 4 位數字", "error"); return; }
      submitNumber({ code });
    });
    document.getElementById("autoLookup").addEventListener("click", () => submitNumber({ auto_lookup: true }));
    codeInput.addEventListener("keydown", (ev) => { if (ev.key === "Enter") document.getElementById("submitCode").click(); });

    refreshStatus();
    setInterval(refreshStatus, 1500);
  </script>

</body>
</html>
