<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tronclass Number Rollcall</title>
  <style>
    :root { color-scheme: light dark; --bg:#f7f8fb; --text:#172033; --muted:#667085; --panel:#fff; --border:#d7dce5; --accent:#2563eb; --ok:#15803d; --error:#b91c1c; }
    @media (prefers-color-scheme: dark) { :root { --bg:#10141f; --text:#eef2ff; --muted:#aab4c8; --panel:#171d2b; --border:#30394f; --accent:#60a5fa; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    main { width:min(760px,100%); margin:0 auto; padding:20px; }
    h1 { margin:0 0 6px; font-size:24px; line-height:1.2; }
    p { margin:0; color:var(--muted); line-height:1.55; }
    .panel { margin-top:18px; padding:16px; border:1px solid var(--border); border-radius:8px; background:var(--panel); }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
    button { min-height:44px; border:0; border-radius:8px; padding:0 14px; background:var(--accent); color:white; font-size:15px; font-weight:650; }
    button.secondary { border:1px solid var(--border); background:transparent; color:var(--text); }
    input[type="text"] { width:100%; min-height:52px; margin-top:10px; border:1px solid var(--border); border-radius:8px; padding:10px 12px; font:inherit; font-size:24px; letter-spacing:4px; color:var(--text); background:transparent; }
    #status { margin-top:12px; font-weight:650; }
    #status.ok { color:var(--ok); }
    #status.error { color:var(--error); }
    .error-box { margin-top:12px; padding:12px; border:1px solid rgba(185,28,28,.35); border-radius:8px; background:rgba(185,28,28,.08); color:var(--error); font-weight:650; }
    /* ROLLCALL_INPUT_COUNTDOWN_V1：等待輸入倒數 */
    /* CLASS_COUNT_HEADER_V1：上方這一欄＝「目前班上已點人數」（大字）＋班上到課比例條；
       原本的倒數縮成右下角一行小字（快到期／逾時一樣變色，逾時照樣鎖住輸入）。 */
    .countdown { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; padding:12px 14px; border:1px solid var(--border); border-radius:8px; background:var(--panel); }
    .countdown .label { color:var(--muted); font-size:14px; }
    .countdown .time { font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:1px; color:var(--text); }
    .countdown.pass .time { color:var(--ok); }
    .countdown .sub { margin-top:2px; font-size:12px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }
    .countdown.warn .sub { color:#b45309; font-weight:700; }
    .countdown.danger .sub, .countdown.expired .sub { color:var(--error); font-weight:700; }
    .countdown.expired { border-color:rgba(185,28,28,.35); background:rgba(185,28,28,.08); }
    .countdown .bar { position:relative; height:6px; margin-top:8px; border-radius:99px; background:var(--border); overflow:hidden; }
    .countdown .bar > i { position:absolute; inset:0 auto 0 0; width:0%; background:var(--ok); transition:width .4s ease; }
    .countdown.pass .bar > i { background:#2563eb; }
    .cd-right { text-align:right; white-space:nowrap; }
    @keyframes cdPulse { 0%,100% { opacity:1; } 50% { opacity:.45; } }
    .summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:10px; }
    .metric { padding:12px; border:1px solid var(--border); border-radius:8px; text-align:center; }
    .metric strong { display:block; font-size:24px; color:var(--text); }
    .metric span { color:var(--muted); font-size:13px; }
    .lists { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
    .list h3 { margin:0 0 8px; font-size:15px; }
    .list ul { min-height:48px; margin:0; padding:10px 10px 10px 28px; border:1px solid var(--border); border-radius:8px; }
    .list.done h3 { color:var(--ok); }
    .list.pending h3 { color:var(--error); }
    @media (max-width:560px) { .summary,.lists { grid-template-columns:1fr; } }
    /* NUMBER_PAGE_UX_V1：四格大數字輸入＋數字鍵盤＋結果狀態 */
    .code-boxes { display:flex; gap:10px; justify-content:center; margin-top:12px; cursor:text; }
    .code-boxes .box { flex:1; max-width:72px; aspect-ratio:3/4; display:grid; place-items:center; border:2px solid var(--border); border-radius:14px; font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; background:var(--panel); color:var(--text); transition:border-color .15s, transform .08s; }
    .code-boxes .box.filled { border-color:var(--accent); }
    .code-boxes .box.active { border-color:var(--accent); box-shadow:0 0 0 4px rgba(37,99,235,.15); }
    .code-boxes .box.bad { border-color:var(--error); animation:shake .3s; }
    .code-boxes .box.ok { border-color:var(--ok); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
    #code { position:absolute; opacity:0; pointer-events:none; height:0; width:0; margin:0; padding:0; border:0; }
    .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
    .keypad button { min-height:56px; font-size:24px; font-weight:700; border-radius:14px; background:var(--panel); color:var(--text); border:1px solid var(--border); -webkit-tap-highlight-color:transparent; }
    .keypad button:active { transform:scale(.97); background:rgba(37,99,235,.12); }
    .keypad button.fn { font-size:15px; font-weight:650; color:var(--muted); }
    .keypad button.go { background:var(--accent); color:#fff; border-color:var(--accent); }
    .keypad button:disabled { opacity:.45; }
    @media (min-width:761px) { .keypad { max-width:320px; margin-left:auto; margin-right:auto; } }
    .auto-hint { margin-top:10px; font-size:13px; color:var(--muted); text-align:center; }
    .result { display:none; margin-top:12px; padding:14px; border-radius:12px; font-weight:700; text-align:center; }
    .result.show { display:block; }
    .result.sending { background:rgba(37,99,235,.10); color:var(--accent); }
    .result.waiting { background:rgba(180,83,9,.10); color:#b45309; }
    .result.done { background:rgba(21,128,61,.12); color:var(--ok); font-size:18px; }
    .result.fail { background:rgba(185,28,28,.08); color:var(--error); }
    .result small { display:block; margin-top:4px; font-weight:500; opacity:.85; }
    .spinner { display:inline-block; width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .pending-note { margin-top:8px; font-size:13px; color:var(--muted); }
    .list li.you { font-weight:800; }
    .list li.you::after { content:"（這個帳號）"; font-weight:500; color:var(--muted); font-size:12px; }
    @media (prefers-reduced-motion: reduce) { .code-boxes .box.bad { animation:none; } .spinner { animation-duration:1.5s; } }
  </style>
<style id="SAFE_AREA_TOP_V1">
  /* 手機鏡頭／瀏海安全區：viewport-fit=cover 讓頁面延伸到系統列底下，
     把 body 頂部墊高到安全區，標題與倒數列不再被鏡頭蓋住
     （無劉海裝置 env()=0，外觀完全不變）。 */
  body{padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
  <main>
    <h1>Tronclass Number Rollcall</h1>
    <p>輸入 4 位數字點名碼，或選擇自動讀取。送出後會套用到同一個 rollcall 的所有等待帳號。</p>
    <!-- CLASS_COUNT_HEADER_V1：頁面上方這一欄＝目前班上已點人數（大字）＋倒數小字 -->
    <div id="countdown" class="countdown" style="display:none">
      <div style="flex:1">
        <div class="label" id="countdownLabel">班上已點人數</div>
        <div class="bar"><i id="countdownBar"></i></div>
      </div>
      <div class="cd-right">
        <div class="time" id="countdownTime">--</div>
        <div class="sub" id="countdownSub">讀取中…</div>
      </div>
    </div>

    <section class="panel">
      <p>輸入老師公布的 4 位數字碼，輸入完第 4 位會自動送出：</p>
      <!-- NUMBER_PAGE_UX_V1：隱藏 input 保留貼上／實體鍵盤／iOS 驗證碼自動填入；四格顯示；下方數字鍵盤 -->
      <div id="codeBoxes" class="code-boxes" role="group" aria-label="4 位數字碼">
        <div class="box" data-i="0"></div><div class="box" data-i="1"></div><div class="box" data-i="2"></div><div class="box" data-i="3"></div>
      </div>
      <input id="code" type="text" inputmode="numeric" maxlength="4" pattern="\d{4}" autocomplete="one-time-code" aria-label="數字碼">
      <div class="keypad" id="keypad">
        <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
        <button type="button" class="fn" data-k="clear">清除</button><button type="button" data-k="0">0</button><button type="button" class="fn" data-k="back" aria-label="退格">⌫</button>
      </div>
      <div id="result" class="result" role="status" aria-live="polite"></div>
      <div class="actions">
        <button id="submitCode" type="button">送出數字碼</button>
        <button id="autoLookup" type="button" class="secondary">不知道代碼？自動讀取</button>
      </div>
      <div class="auto-hint">「自動讀取」會直接向 Tronclass 查詢這次點名的代碼，適用於老師已開始點名但你看不到黑板的情況。</div>
      <div id="status">尚未送出</div>
      <div id="lastError" class="error-box" style="display:none"></div>
    </section>

    <section class="panel">
      <p>簽到狀態會自動更新。已完成代表該帳號已回報數字點名成功；未完成代表仍在等待有效代碼。</p>
      <div class="summary">
        <div class="metric"><strong id="totalCount">0</strong><span>總帳號</span></div>
        <div class="metric"><strong id="doneCount">0</strong><span>已點到</span></div>
        <div class="metric"><strong id="pendingCount">0</strong><span>未點到</span></div>
      </div>
      <div class="lists">
        <div class="list done"><h3>已點到</h3><ul id="doneList"><li>尚無</li></ul></div>
        <div class="list pending"><h3>還沒點到</h3><ul id="pendingList"><li>尚無</li></ul></div>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const provider = params.get("provider") || "";
    const rollcallId = Number(params.get("rollcall_id") || "0");
    const token = params.get("token") || "";
    const accountId = params.get("account_id") || "";
    const statusEl = document.getElementById("status");
    const codeInput = document.getElementById("code");
    const totalCountEl = document.getElementById("totalCount");
    const doneCountEl = document.getElementById("doneCount");
    const pendingCountEl = document.getElementById("pendingCount");
    const doneListEl = document.getElementById("doneList");
    const pendingListEl = document.getElementById("pendingList");
    const lastErrorEl = document.getElementById("lastError");

    function validParams() { return Boolean(provider && rollcallId && token && accountId); }
    function setStatus(text, kind) { statusEl.textContent = text; statusEl.className = kind || ""; }

    /* CLASS_COUNT_HEADER_V1：頁面上方那一欄＝「目前班上已點人數」（大字＋班上比例條），
       原本的倒數縮成右下角一行小字（快到期／逾時一樣變色，逾時照樣鎖住輸入）。
       人數來源＝/number/status 的 class_progress（後端每 10 秒讀一次學校的班上進度；
       讀不到就顯示「讀取中…」，完全不影響輸入與送出）。 */
    const countdownEl = document.getElementById("countdown");
    const countdownTimeEl = document.getElementById("countdownTime");
    const countdownBarEl = document.getElementById("countdownBar");
    const countdownLabelEl = document.getElementById("countdownLabel");
    const countdownSubEl = document.getElementById("countdownSub");
    let cdDeadlineMs = null, cdExpiredNotified = false;
    let cdClassProgress = null, cdAutoPercent = 15;
    function fmtSecs(total) {
      total = Math.max(0, Math.floor(total));
      const m = Math.floor(total / 60), s = total % 60;
      return m > 0 ? `${m}:${String(s).padStart(2, "0")}` : `${s} 秒`;
    }
    /* 班上已點人數：後端讀得到就照實顯示，讀不到只顯示「讀取中…」（不亂猜）。 */
    function renderClassCount() {
      const progress = cdClassProgress;
      if (!progress || !progress.total) {
        countdownTimeEl.textContent = "--";
        countdownLabelEl.textContent = "班上已點人數（讀取中…）";
        countdownBarEl.style.width = "0%";
        countdownEl.classList.remove("pass");
        return;
      }
      const pct = Math.max(0, Math.min(100, progress.completed / progress.total * 100));
      const passed = progress.completed * 100 > progress.total * cdAutoPercent;
      countdownTimeEl.textContent = progress.completed + " / " + progress.total;
      countdownLabelEl.textContent = "班上已點人數（" + Math.round(pct) + "%）"
        + (passed ? "・已過 " + cdAutoPercent + "%，系統會自動送出" : "");
      countdownBarEl.style.width = pct.toFixed(1) + "%";
      countdownEl.classList.toggle("pass", passed);
    }
    function syncClassProgress(body) {
      if (body && typeof body.auto_submit_percent === "number" && body.auto_submit_percent > 0) {
        cdAutoPercent = body.auto_submit_percent;
      }
      cdClassProgress = (body && body.class_progress) || null;
      renderClassCount();
    }
    function syncCountdown(expiresInSecs) {
      if (typeof expiresInSecs !== "number" || !isFinite(expiresInSecs)) return;
      cdDeadlineMs = Date.now() + expiresInSecs * 1000;
      countdownEl.style.display = "";
      tickCountdown();
    }
    function tickCountdown() {
      renderClassCount();
      if (cdDeadlineMs == null) return;
      const remain = Math.max(0, (cdDeadlineMs - Date.now()) / 1000);
      countdownSubEl.textContent = remain > 0 ? ("剩餘輸入時間 " + fmtSecs(remain)) : "輸入時間已結束";
      countdownEl.className = "countdown" + (countdownEl.classList.contains("pass") ? " pass" : "")
        + (remain <= 0 ? " expired" : remain <= 10 ? " danger" : remain <= 30 ? " warn" : "");
      if (remain <= 0 && !cdExpiredNotified) {
        cdExpiredNotified = true;
        codeInput.disabled = true;
        document.getElementById("submitCode").disabled = true;
        document.getElementById("autoLookup").disabled = true;
        document.querySelectorAll("#keypad button").forEach(b => { b.disabled = true; });
        setStatus("等待輸入已逾時", "error");
      }
    }
    setInterval(tickCountdown, 1000);
    function renderList(el, items) {
      el.innerHTML = "";
      if (!items || items.length === 0) { const li=document.createElement("li"); li.textContent="尚無"; el.appendChild(li); return; }
      for (const item of items) { const li=document.createElement("li"); li.textContent=item; if (item === accountId) li.className = "you"; el.appendChild(li); }
    }

    /* NUMBER_PAGE_UX_V1 ─────────────────────────────────────────────────────
       四格顯示 + 數字鍵盤 + 自動送出；狀態機：idle → sending → waiting → done | fail */
    const boxes = Array.from(document.querySelectorAll("#codeBoxes .box"));
    const resultEl = document.getElementById("result");
    const submitBtn = document.getElementById("submitCode");
    const autoBtn = document.getElementById("autoLookup");
    let phase = "idle", lastSubmitted = null, submittedAt = 0, wasDoneCount = null;
    function vibrate(pattern) { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (_) {} }
    function digits() { return (codeInput.value || "").replace(/\D/g, "").slice(0, 4); }
    function paintBoxes(extraClass) {
      const v = digits();
      boxes.forEach((b, i) => {
        b.textContent = v[i] || "";
        b.className = "box" + (v[i] ? " filled" : "") + (i === v.length && !codeInput.disabled ? " active" : "") + (extraClass ? " " + extraClass : "");
      });
    }
    function setCode(v, opts) {
      codeInput.value = v.replace(/\D/g, "").slice(0, 4);
      paintBoxes();
      if (codeInput.value.length === 4 && !(opts && opts.noAuto)) autoSubmit();
    }
    function setResult(kind, text, sub) {
      phase = kind === "" ? "idle" : kind;
      if (!kind) { resultEl.className = "result"; resultEl.textContent = ""; return; }
      resultEl.className = "result show " + kind;
      resultEl.replaceChildren();
      if (kind === "sending" || kind === "waiting") { const sp = document.createElement("span"); sp.className = "spinner"; resultEl.appendChild(sp); }
      resultEl.appendChild(document.createTextNode(text));
      if (sub) { const sm = document.createElement("small"); sm.textContent = sub; resultEl.appendChild(sm); }
    }
    function lockInput(locked) {
      if (cdExpiredNotified) locked = true; // 逾時後不再解鎖
      codeInput.disabled = locked; submitBtn.disabled = locked; autoBtn.disabled = locked;
      document.querySelectorAll("#keypad button").forEach(b => { b.disabled = locked; });
      paintBoxes();
    }
    let autoTimer = null;
    function autoSubmit() {
      clearTimeout(autoTimer);
      // 給使用者 350ms 反悔（看到第 4 格填上再送），避免誤觸
      autoTimer = setTimeout(() => { if (digits().length === 4 && phase !== "sending") submitBtn.click(); }, 350);
    }
    document.getElementById("keypad").addEventListener("click", (ev) => {
      const b = ev.target.closest("button[data-k]"); if (!b || b.disabled) return;
      const k = b.dataset.k; vibrate(8);
      if (k === "clear") { clearTimeout(autoTimer); setCode("", { noAuto: true }); return; }
      if (k === "back") { clearTimeout(autoTimer); setCode(digits().slice(0, -1), { noAuto: true }); return; }
      if (digits().length >= 4) return;
      setCode(digits() + k);
    });
    document.getElementById("codeBoxes").addEventListener("click", () => { try { codeInput.focus({ preventScroll: true }); } catch (_) { codeInput.focus(); } paintBoxes(); });
    codeInput.addEventListener("input", () => setCode(codeInput.value));
    codeInput.addEventListener("paste", (ev) => {
      const txt = (ev.clipboardData || window.clipboardData).getData("text") || "";
      const m = txt.match(/\d{4}/); if (m) { ev.preventDefault(); setCode(m[0]); }
    });
    document.addEventListener("keydown", (ev) => {
      if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
      if (document.activeElement === codeInput) return; // 原生 input 自己處理
      if (/^\d$/.test(ev.key)) { if (digits().length < 4 && !codeInput.disabled) { setCode(digits() + ev.key); ev.preventDefault(); } }
      else if (ev.key === "Backspace") { clearTimeout(autoTimer); setCode(digits().slice(0, -1), { noAuto: true }); ev.preventDefault(); }
      else if (ev.key === "Escape") { clearTimeout(autoTimer); setCode("", { noAuto: true }); }
    });
    paintBoxes();
    /* 進度：送出後依 /number/status 的 completed/pending 決定 waiting → done；
       last_error 出現 → fail（可重新輸入）。 */
    function reconcileResult(body) {
      if (phase === "sending") return; // 送出中以 submitNumber 的結果為準
      const done = Number(body.completed_count || 0), total = Number(body.total_count || 0), pending = Number(body.pending_count || 0);
      const meDone = Array.isArray(body.completed_accounts) && body.completed_accounts.includes(accountId);
      // 其他裝置／重新整理後：後端記得已送出的代碼
      if (phase === "idle" && body.submitted_code && !lastSubmitted) {
        lastSubmitted = body.submitted_code;
        if (body.submitted_code !== "auto") setCode(body.submitted_code, { noAuto: true });
      }
      if (body.last_error && lastSubmitted) {
        const firstTime = phase !== "fail";
        setResult("fail", "簽到失敗：" + body.last_error, "直接輸入新的 4 位數字即可（不用刪除），或改用「自動讀取」。");
        lockInput(false);
        if (firstTime) {
          // NUMBER_INPUT_RETRY_V1：清空舊碼並聚焦，輸錯後可直接打新數字。
          setCode("", { noAuto: true });
          try { codeInput.focus({ preventScroll: true }); } catch (_) { codeInput.focus(); }
          paintBoxes("bad"); vibrate([40, 60, 40]);
        }
        return;
      }
      if (total > 0 && pending === 0) {
        setResult("done", meDone ? "簽到成功" : "全部完成", total > 1 ? ("已完成 " + done + " / " + total + " 個帳號") : "");
        lockInput(true); paintBoxes("ok");
        if (wasDoneCount !== done) { vibrate([30, 40, 30]); wasDoneCount = done; }
        return;
      }
      if (lastSubmitted || body.submitted_code) {
        const label = (lastSubmitted || body.submitted_code) === "auto" ? "已要求自動讀取代碼" : ("已送出 " + (lastSubmitted || body.submitted_code));
        const elapsed = submittedAt ? Math.round((Date.now() - submittedAt) / 1000) : 0;
        setResult("waiting", label + "，等待 Tronclass 回應…", total > 0 ? ("已完成 " + done + " / " + total + (elapsed > 20 ? "，若超過 30 秒仍未完成可再送一次" : "")) : "");
        lockInput(false);
      }
    }

    async function refreshStatus() {
      if (!validParams()) { setStatus("連結缺少必要參數", "error"); return; }
      try {
        const query = new URLSearchParams({ provider, rollcall_id:String(rollcallId), account_id:accountId, token });
        const res = await fetch(`/number/status?${query.toString()}`, { cache: "no-store" });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || "狀態讀取失敗");
        totalCountEl.textContent = String(body.total_count || 0);
        doneCountEl.textContent = String(body.completed_count || 0);
        pendingCountEl.textContent = String(body.pending_count || 0);
        renderList(doneListEl, body.completed_accounts || []);
        renderList(pendingListEl, body.pending_accounts || []);
        syncClassProgress(body);
        syncCountdown(body.expires_in_secs);
        reconcileResult(body);
        if (body.last_error) {
          lastErrorEl.style.display = "block";
          lastErrorEl.textContent = `上次送出失敗：${body.last_error}`;
        } else {
          lastErrorEl.style.display = "none";
          lastErrorEl.textContent = "";
        }
      } catch (err) {
        const msg = (err && err.message) || "狀態讀取失敗";
        /* ROLLCALL_INPUT_COUNTDOWN_V1：後端回報已到期／已結束時，直接把倒數切到逾時狀態 */
        if (/expired|逾時|過期|到期|找不到等待中/i.test(msg) && cdDeadlineMs != null) { cdDeadlineMs = Date.now(); tickCountdown(); }
        setStatus(msg, "error");
      }
    }

    async function submitNumber(payload) {
      if (!validParams()) { setStatus("連結缺少必要參數", "error"); return; }
      if (phase === "sending") return;
      setStatus("正在送出...", "");
      setResult("sending", payload.auto_lookup ? "正在要求自動讀取代碼…" : ("正在送出 " + payload.code + "…"));
      lockInput(true);
      try {
        const res = await fetch("/number/submit", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ provider, rollcall_id:rollcallId, account_id:accountId, token, ...payload })
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || "送出失敗");
        lastSubmitted = payload.auto_lookup ? "auto" : payload.code; submittedAt = Date.now(); wasDoneCount = null;
        setStatus(`已送出給 ${body.delivered_count || 0} 個帳號等待流程。`, "ok");
        setResult("waiting", (payload.auto_lookup ? "已要求自動讀取代碼" : ("已送出 " + payload.code)) + "，等待 Tronclass 回應…");
        lockInput(false);
        vibrate(15);
        refreshStatus();
      } catch (err) {
        const msg = (err && err.message) || "送出失敗";
        const expired = /expired|逾時|過期|到期/i.test(msg);
        setStatus(msg, "error");
        setResult("fail", msg, expired ? "" : "可以重新輸入再送一次。");
        lockInput(expired);
        if (!expired) {
          // NUMBER_INPUT_RETRY_V1：清空舊碼並聚焦，輸錯後可直接打新數字。
          setCode("", { noAuto: true });
          try { codeInput.focus({ preventScroll: true }); } catch (_) { codeInput.focus(); }
        }
        paintBoxes("bad"); vibrate([40, 60, 40]);
      }
    }

    submitBtn.addEventListener("click", () => {
      const code = digits();
      if (!/^\d{4}$/.test(code)) { setStatus("請輸入 4 位數字", "error"); paintBoxes("bad"); vibrate(30); return; }
      submitNumber({ code });
    });
    autoBtn.addEventListener("click", () => submitNumber({ auto_lookup: true }));
    codeInput.addEventListener("keydown", (ev) => { if (ev.key === "Enter") submitBtn.click(); });

    refreshStatus();
    setInterval(refreshStatus, 1500);
  </script>
